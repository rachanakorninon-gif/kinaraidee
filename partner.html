<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8a00"><title>สมัครร้านพาร์ตเนอร์ • กินอะไรดี</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#fffaf0;color:#2f241c}.app{max-width:620px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #eee1cf;border-radius:24px;padding:20px;margin-top:14px}h1{margin:0 0 6px}.sub{color:#6b5b4e;line-height:1.6}.field{margin-top:14px}.field label{display:block;font-weight:850;margin-bottom:7px}.field input,.field textarea{width:100%;padding:14px;border:1px solid #dfd2c2;border-radius:14px;font:inherit;background:#fff}.field textarea{min-height:96px;resize:vertical}.primary,.secondary{width:100%;border-radius:16px;padding:15px;border:0;font-size:17px;font-weight:900;margin-top:14px}.primary{background:#ff8500;color:#fff}.secondary{background:#fff;border:1px solid #dfd2c2;color:#4f3c2e}.notice{margin-top:14px;padding:13px;border-radius:14px;background:#fff8dd;display:none}.ok{background:#eaf9f7;color:#087d77}.small{font-size:13px;color:#777;line-height:1.5}.consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px;border:1px solid #eadfce;border-radius:14px;background:#fffdf8}.consent input{margin-top:4px}.consent a{color:#9a4b00;font-weight:800}</style></head><body><main class="app"><h1>🏪 สมัครร้านพาร์ตเนอร์</h1><p class="sub">ร้านอาหารสามารถฝากข้อมูลไว้กับ “กินอะไรดี” เพื่อให้ทีมติดต่อกลับและพิจารณาเพิ่มร้านเข้าสู่ระบบแนะนำร้านตามเมนูที่ผู้ใช้กำลังหา</p><div class="card"><div class="field"><label>ชื่อร้าน *</label><input id="restaurantName" maxlength="160" placeholder="เช่น ร้านครัวอร่อย"></div><div class="field"><label>ชื่อผู้ติดต่อ *</label><input id="contactName" maxlength="120" placeholder="ชื่อเจ้าของร้านหรือผู้ดูแล"></div><div class="field"><label>เบอร์โทร *</label><input id="phone" maxlength="40" inputmode="tel" placeholder="08x-xxx-xxxx"></div><div class="field"><label>LINE ID</label><input id="lineId" maxlength="120" placeholder="ถ้ามี"></div><div class="field"><label>อีเมล</label><input id="email" type="email" maxlength="180" placeholder="ถ้ามี"></div><div class="field"><label>ที่อยู่ร้าน</label><textarea id="address" maxlength="500" placeholder="ที่อยู่หรือย่านที่ร้านตั้งอยู่"></textarea></div><div class="field"><label>เมนูเด่นของร้าน</label><textarea id="menus" maxlength="1000" placeholder="เช่น กะเพราไก่ไข่ดาว, ข้าวมันไก่, ต้มยำกุ้ง"></textarea></div><div class="field"><label>ข้อมูลเพิ่มเติม</label><textarea id="notes" maxlength="1000" placeholder="เวลาเปิดร้าน, ช่องทางเดลิเวอรี หรือรายละเอียดอื่น ๆ"></textarea></div><label class="consent"><input id="consent" type="checkbox"><span>ฉันยินยอมให้ “กินอะไรดี” ใช้ข้อมูลที่ส่งเพื่อพิจารณาความร่วมมือและติดต่อกลับ ตาม <a href="privacy.html" target="_blank" rel="noopener">นโยบายความเป็นส่วนตัว</a></span></label><button id="submitBtn" class="primary">ส่งข้อมูลร้าน</button><button class="secondary" onclick="location.href='./'">← กลับหน้าหลัก</button><div id="msg" class="notice"></div><p class="small">การส่งแบบฟอร์มนี้ยังไม่ถือว่าได้รับอนุมัติเป็นพาร์ตเนอร์ ทีมงานจะตรวจสอบข้อมูลและติดต่อกลับก่อนเปิดใช้งานร้านในระบบ</p></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://cuspfvfzprlgtvtdyilh.supabase.co','sb_publishable_PGmPJ6_8tNIWm7zfF6qEng_0emmWchx');const $=id=>document.getElementById(id);function showMsg(t,ok=false){const m=$('msg');m.textContent=t;m.style.display='block';m.classList.toggle('ok',ok)}$('submitBtn').onclick=async()=>{const restaurant_name=$('restaurantName').value.trim(),contact_name=$('contactName').value.trim(),phone=$('phone').value.trim();if(!restaurant_name||!contact_name||!phone)return showMsg('กรุณากรอกชื่อร้าน ชื่อผู้ติดต่อ และเบอร์โทรให้ครบ');if(!$('consent').checked)return showMsg('กรุณายอมรับการใช้ข้อมูลเพื่อให้ทีมติดต่อกลับ');const b=$('submitBtn');b.disabled=true;b.textContent='กำลังส่งข้อมูล…';const row={restaurant_name,contact_name,phone,line_id:$('lineId').value.trim()||null,email:$('email').value.trim()||null,address:$('address').value.trim()||null,menu_examples:$('menus').value.trim()||null,notes:$('notes').value.trim()||null,status:'new'};const{error}=await sb.from('partner_applications').insert(row);b.disabled=false;b.textContent='ส่งข้อมูลร้าน';if(error)return showMsg('ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');showMsg('✅ ส่งข้อมูลร้านเรียบร้อยแล้ว ทีมงานจะตรวจสอบและติดต่อกลับ',true);['restaurantName','contactName','phone','lineId','email','address','menus','notes'].forEach(id=>$(id).value='');$('consent').checked=false};</script></body></html>
