<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8a00"><title>จัดการร้านพาร์ตเนอร์ • กินอะไรดี</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#fffaf0;color:#30251d}.app{max-width:760px;margin:auto;padding:20px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #eee0cc;border-radius:22px;padding:16px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:13px;color:#6b5b4e;font-weight:800}input,textarea,select{width:100%;padding:12px;border:1px solid #dccfbd;border-radius:12px;font:inherit;margin-top:5px}textarea{min-height:82px;resize:vertical}button,a.btn{display:inline-block;border:0;background:#ff8500;color:white;padding:12px 16px;border-radius:13px;font-weight:900;text-decoration:none}.secondary{background:#fff!important;color:#5a4636!important;border:1px solid #dfd2c2!important}.muted{color:#777;font-size:14px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eee;font-size:12px;font-weight:900}.active{background:#e9f9ef;color:#137a3f}.inactive{background:#fff1ef;color:#a72b20}.actions{display:flex;gap:8px;align-items:center;margin-top:12px}.hidden{display:none!important}.notice{background:#fff8dd;border-radius:12px;padding:10px;margin-top:10px}.auditItem{padding:12px 0;border-bottom:1px solid #eee}.auditItem:last-child{border-bottom:0}.auditChange{margin-top:5px;font-size:14px;line-height:1.5}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.actions{align-items:stretch;flex-direction:column}.actions button,.actions a{width:100%;text-align:center}}</style></head><body><main class="app"><div class="top"><div><h1>🏪 จัดการร้านพาร์ตเนอร์</h1><div class="muted">Owner Only • ตั้งค่าร้าน เมนู ลิงก์ และค่าคอมมิชชัน</div></div><a class="btn secondary" href="admin.html">← Dashboard</a></div><div id="login" class="card hidden"><h2>ต้องเข้าสู่ระบบ Owner ก่อน</h2><p class="muted">หน้านี้ใช้ session เดียวกับ Owner Dashboard หากยังไม่ล็อกอินให้กลับไปหน้า Dashboard ก่อน</p><a class="btn" href="admin.html">ไป Owner Dashboard</a></div><div id="msg" class="notice hidden"></div><div id="list"></div><section class="card"><h2>🧾 ประวัติการแก้ไขร้าน</h2><div class="muted">แสดง 100 รายการล่าสุด</div><div id="audit"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const SB='https://cuspfvfzprlgtvtdyilh.supabase.co',KEY='sb_publishable_PGmPJ6_8tNIWm7zfF6qEng_0emmWchx',API=SB+'/functions/v1/partner-api',supabase=createClient(SB,KEY);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function ownerApi(action,payload={}){const{data:{session}}=await supabase.auth.getSession();if(!session)throw Error('no_session');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...payload})}),d=await r.json();if(!r.ok)throw Error(d.error||'request_failed');return d}function showMsg(t){$('msg').textContent=t;$('msg').classList.remove('hidden');setTimeout(()=>$('msg').classList.add('hidden'),2600)}function card(p){return `<section class="card" data-card="${esc(p.id)}"><div class="top"><div><b style="font-size:20px">${esc(p.name)}</b><div class="muted">${esc(p.slug)}</div></div><span class="pill ${p.status==='active'?'active':'inactive'}">${p.status==='active'?'ACTIVE':'INACTIVE'}</span></div><div class="grid" style="margin-top:12px"><div><label>ชื่อร้าน<input data-k="name" value="${esc(p.name)}"></label></div><div><label>สถานะ<select data-k="status"><option value="inactive" ${p.status==='inactive'?'selected':''}>Inactive</option><option value="active" ${p.status==='active'?'selected':''}>Active</option></select></label></div><div class="full"><label>ที่อยู่<textarea data-k="address">${esc(p.address||'')}</textarea></label></div><div class="full"><label>เมนูที่รองรับ <span class="muted">คั่นด้วย , หรือขึ้นบรรทัดใหม่</span><textarea data-k="menu_keywords">${esc((p.menu_keywords||[]).join(', '))}</textarea></label></div><div class="full"><label>ลิงก์ร้าน / สั่งอาหาร<input data-k="destination_url" value="${esc(p.destination_url||'')}" placeholder="https://..."></label></div><div><label>รูปแบบค่าคอมฯ<select data-k="commission_type"><option value="per_click" ${p.commission_type==='per_click'?'selected':''}>บาทต่อคลิก</option><option value="fixed_order" ${p.commission_type==='fixed_order'?'selected':''}>บาทต่อออเดอร์</option><option value="percent" ${p.commission_type==='percent'?'selected':''}>เปอร์เซ็นต์</option></select></label></div><div><label>อัตราค่าคอมฯ<input data-k="commission_rate" inputmode="decimal" value="${Number(p.commission_rate||0)}"></label></div><div class="full"><label>หมายเหตุค่าคอมฯ<textarea data-k="commission_note">${esc(p.commission_note||'')}</textarea></label></div></div><div class="actions"><button data-save="${esc(p.id)}">💾 บันทึกการตั้งค่า</button><span class="muted">อัปเดตล่าสุด ${p.updated_at?new Date(p.updated_at).toLocaleString('th-TH'):'-'}</span></div></section>`}function auditHtml(rows,partners){if(!rows.length)return '<div class="muted" style="padding-top:12px">ยังไม่มีประวัติการแก้ไข</div>';const names=new Map((partners||[]).map(p=>[p.id,p.name]));return rows.map(x=>{const o=x.old_data||{},n=x.new_data||{},changes=[];['name','status','address','destination_url','commission_type','commission_rate'].forEach(k=>{if(JSON.stringify(o[k]??null)!==JSON.stringify(n[k]??null))changes.push(`${k}: ${esc(o[k]??'-')} → ${esc(n[k]??'-')}`)});if(JSON.stringify(o.menu_keywords||[])!==JSON.stringify(n.menu_keywords||[]))changes.push(`menu_keywords: ${esc((o.menu_keywords||[]).join(', ')||'-')} → ${esc((n.menu_keywords||[]).join(', ')||'-')}`);return `<div class="auditItem"><b>${esc(names.get(x.partner_id)||n.name||o.name||'ร้านพาร์ตเนอร์')}</b><div class="muted">${new Date(x.created_at).toLocaleString('th-TH')}</div><div class="auditChange">${changes.length?changes.join('<br>'):'มีการบันทึกข้อมูล'}</div></div>`}).join('')}async function load(){const{data:{session}}=await supabase.auth.getSession();if(!session){$('login').classList.remove('hidden');return}try{const [d,a]=await Promise.all([ownerApi('list_partner_admin'),ownerApi('list_partner_audit')]);$('login').classList.add('hidden');$('list').innerHTML=(d.partners||[]).length?(d.partners||[]).map(card).join(''):'<div class="card muted">ยังไม่มีร้านพาร์ตเนอร์</div>';$('audit').innerHTML=auditHtml(a.audit||[],d.partners||[]);document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save))}catch(e){$('login').classList.remove('hidden');$('login').querySelector('.muted').textContent='ไม่สามารถยืนยันสิทธิ์ Owner ได้ กรุณาเข้าสู่ระบบจาก Dashboard ใหม่'}}async function save(id){const box=document.querySelector(`[data-card="${CSS.escape(id)}"]`);if(!box)return;const val=k=>box.querySelector(`[data-k="${k}"]`).value;const btn=box.querySelector('[data-save]');btn.disabled=true;try{await ownerApi('update_partner_admin',{id,name:val('name'),status:val('status'),address:val('address'),menu_keywords:val('menu_keywords'),destination_url:val('destination_url'),commission_type:val('commission_type'),commission_rate:Number(val('commission_rate')||0),commission_note:val('commission_note')});showMsg('บันทึกร้านเรียบร้อยแล้ว');await load()}catch(e){showMsg('บันทึกไม่สำเร็จ: '+(e.message||e))}finally{btn.disabled=false}}load();</script></body></html>
