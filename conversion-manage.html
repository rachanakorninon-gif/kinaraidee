<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8a00"><title>จัดการออเดอร์พาร์ตเนอร์ • กินอะไรดี</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#fffaf0;color:#30251d}.app{max-width:820px;margin:auto;padding:20px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:1px solid #eee0cc;border-radius:22px;padding:16px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:13px;color:#6b5b4e;font-weight:800}input,select{width:100%;padding:12px;border:1px solid #dccfbd;border-radius:12px;font:inherit;margin-top:5px}button,a.btn{display:inline-block;border:0;background:#ff8500;color:white;padding:12px 16px;border-radius:13px;font-weight:900;text-decoration:none}.secondary{background:#fff!important;color:#5a4636!important;border:1px solid #dfd2c2!important}.muted{color:#777;font-size:14px}.notice{background:#fff8dd;border-radius:12px;padding:10px;margin-top:10px}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.pill{display:inline-block;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:900}.pending{background:#fff8dd;color:#8a6500}.confirmed{background:#e9f9ef;color:#137a3f}.cancelled{background:#fff1ef;color:#a72b20}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions button{padding:8px 10px;font-size:13px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary .card{margin-top:0}.big{font-size:28px;font-weight:950;color:#f47c00}@media(max-width:620px){.grid,.summary{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.row{flex-direction:column}}</style></head><body><main class="app"><div class="top"><div><h1>🧾 ออเดอร์ / รายได้จริง</h1><div class="muted">Owner Only • เพิ่มออเดอร์ ยืนยัน หรือยกเลิก</div></div><a class="btn secondary" href="admin.html">← Dashboard</a></div><div id="login" class="card hidden"><h2>ต้องเข้าสู่ระบบ Owner ก่อน</h2><p class="muted">หน้านี้ใช้ session เดียวกับ Owner Dashboard</p><a class="btn" href="admin.html">ไป Owner Dashboard</a></div><div id="msg" class="notice hidden"></div><section class="card"><h2>➕ เพิ่มออเดอร์ใหม่</h2><div class="grid"><div><label>ร้านพาร์ตเนอร์<select id="restaurant"></select></label></div><div><label>ยอดออเดอร์ (บาท)<input id="amount" type="number" min="0" step="0.01" inputmode="decimal"></label></div><div><label>เลขอ้างอิงออเดอร์<input id="ref" placeholder="เช่น ORDER-1234"></label></div><div><label>วัน/เวลาออเดอร์<input id="occurred" type="datetime-local"></label></div></div><button id="addBtn" style="margin-top:12px">บันทึกออเดอร์เป็น Pending</button><p class="muted">ค่าคอมมิชชันจะคำนวณอัตโนมัติตามเงื่อนไขของร้าน</p></section><div class="summary"><div class="card"><div class="muted">Pending</div><div id="pendingCount" class="big">0</div></div><div class="card"><div class="muted">Confirmed</div><div id="confirmedCount" class="big">0</div></div><div class="card"><div class="muted">รายได้ยืนยัน</div><div id="confirmedRevenue" class="big">฿0.00</div></div></div><section class="card"><h2>รายการออเดอร์</h2><div id="list"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const SB='https://cuspfvfzprlgtvtdyilh.supabase.co',KEY='sb_publishable_PGmPJ6_8tNIWm7zfF6qEng_0emmWchx',API=SB+'/functions/v1/partner-api',supabase=createClient(SB,KEY);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function ownerApi(action,payload={}){const{data:{session}}=await supabase.auth.getSession();if(!session)throw Error('no_session');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...payload})}),d=await r.json();if(!r.ok)throw Error(d.error||'request_failed');return d}function showMsg(t){$('msg').textContent=t;$('msg').classList.remove('hidden');setTimeout(()=>$('msg').classList.add('hidden'),2800)}function statusText(s){return s==='pending'?'รอยืนยัน':s==='confirmed'?'ยืนยันแล้ว':'ยกเลิก'}function render(rows){$('pendingCount').textContent=rows.filter(x=>x.status==='pending').length;$('confirmedCount').textContent=rows.filter(x=>x.status==='confirmed').length;$('confirmedRevenue').textContent='฿'+rows.filter(x=>x.status==='confirmed').reduce((a,x)=>a+Number(x.commission_amount||0),0).toFixed(2);$('list').innerHTML=rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.restaurant_name)}</b><div class="muted">ออเดอร์ ฿${Number(x.order_amount||0).toFixed(2)} • ค่าคอมฯ ฿${Number(x.commission_amount||0).toFixed(2)}</div><div class="muted">${esc(x.source_ref||'ไม่มีเลขอ้างอิง')} • ${new Date(x.occurred_at).toLocaleString('th-TH')}</div></div><div><span class="pill ${x.status}">${statusText(x.status)}</span>${x.status==='pending'?`<div class="actions"><button data-s="confirmed" data-id="${x.id}">✅ ยืนยัน</button><button data-s="cancelled" data-id="${x.id}" style="background:#b42318">✕ ยกเลิก</button></div>`:''}${x.status!=='pending'?`<div class="actions"><button class="secondary" data-s="pending" data-id="${x.id}">↩ กลับเป็น Pending</button></div>`:''}</div></div>`).join(''):'<div class="muted">ยังไม่มีออเดอร์</div>';document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>changeStatus(b.dataset.id,b.dataset.s))}async function load(){const{data:{session}}=await supabase.auth.getSession();if(!session){$('login').classList.remove('hidden');return}try{const d=await ownerApi('list_conversions_admin');$('login').classList.add('hidden');$('restaurant').innerHTML=(d.partners||[]).map(p=>`<option value="${p.id}">${esc(p.name)} • ${p.commission_type} ${Number(p.commission_rate||0)}</option>`).join('');render(d.conversions||[])}catch(e){$('login').classList.remove('hidden')}}async function add(){const restaurant_id=$('restaurant').value,order_amount=Number($('amount').value||0),source_ref=$('ref').value.trim(),occurred_at=$('occurred').value?new Date($('occurred').value).toISOString():new Date().toISOString();if(!restaurant_id)return showMsg('กรุณาเลือกร้าน');$('addBtn').disabled=true;try{await ownerApi('create_conversion_admin',{restaurant_id,order_amount,source_ref,occurred_at});$('amount').value='';$('ref').value='';showMsg('เพิ่มออเดอร์เรียบร้อยแล้ว');await load()}catch(e){showMsg('เพิ่มออเดอร์ไม่สำเร็จ: '+(e.message||e))}finally{$('addBtn').disabled=false}}async function changeStatus(id,status){try{await ownerApi('update_conversion_status',{id,status});showMsg('อัปเดตสถานะเรียบร้อย');await load()}catch(e){showMsg('อัปเดตไม่สำเร็จ: '+(e.message||e))}}$('addBtn').onclick=add;load();</script></body></html>
