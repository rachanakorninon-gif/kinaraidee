<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8a00"><title>สมาชิก | กินอะไรดี</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#fffaf0;color:#2f241c}.app{max-width:560px;margin:auto;min-height:100vh;padding:24px 18px}.top{display:flex;align-items:center;gap:14px}.back{border:0;background:#fff;width:46px;height:46px;border-radius:15px;font-size:25px}.brand{font-size:30px;font-weight:950}.orange{color:#ff7a00}.card{background:#fff;border:1px solid #eee1cf;border-radius:28px;padding:22px;margin-top:22px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.tab{padding:13px;border:1px solid #e5dac9;background:#fff;border-radius:14px;font-weight:900}.tab.on{background:#fff1dc;border:2px solid #ff8a00;color:#a94d00}label{display:block;font-weight:800;margin:14px 0 6px}input{width:100%;padding:15px;border:1px solid #ddd1c0;border-radius:14px;font-size:16px}.primary{width:100%;border:0;border-radius:17px;padding:16px;background:#ff8500;color:#fff;font-size:18px;font-weight:900;margin-top:20px}.secondary{width:100%;border:1px solid #e5dac9;border-radius:17px;padding:14px;background:#fff;font-weight:850;margin-top:10px}.forgot{display:none;border:0;background:transparent;color:#a94d00;font-weight:850;margin:10px 0 0 auto;padding:4px 0;text-decoration:underline}.msg{margin-top:16px;padding:13px;border-radius:14px;display:none}.ok{display:block;background:#eaf9f5;color:#087a70}.err{display:block;background:#fff0ed;color:#a72b20}.muted{color:#75685d;font-size:14px;line-height:1.55}.user{font-weight:900;color:#087a70;word-break:break-all}.profileBox{margin-top:18px;padding-top:18px;border-top:1px solid #eee1cf}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.stat{background:#fff8ee;border:1px solid #f0dfc8;border-radius:18px;padding:16px;text-align:center}.stat b{display:block;font-size:28px;color:#ff7a00}.small{font-size:13px;color:#75685d}</style></head><body><main class="app"><div class="top"><button class="back" onclick="location.href='./'">‹</button><div class="brand">กิน<span class="orange">อะไรดี?</span></div></div><div class="card"><h1>👤 สมาชิก</h1><p class="muted">สมัครสมาชิกเพื่อเก็บประวัติและใช้งานบัญชีของคุณ</p><div id="signedOut"><div class="tabs"><button id="signupTab" class="tab on" onclick="mode('signup')">สมัครสมาชิก</button><button id="loginTab" class="tab" onclick="mode('login')">เข้าสู่ระบบ</button></div><label>อีเมล</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"><label>รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="อย่างน้อย 8 ตัวอักษร"><button id="forgotBtn" class="forgot" onclick="forgotPassword()">ลืมรหัสผ่าน?</button><button id="submit" class="primary" onclick="submitAuth()">สมัครสมาชิก</button><button class="secondary" onclick="location.href='feedback.html'">💬 แสดงความคิดเห็น / แจ้งปัญหา</button></div><div id="signedIn" style="display:none"><p>เข้าสู่ระบบแล้ว</p><div id="who" class="user"></div><div class="profileBox"><label>ชื่อที่แสดง</label><input id="displayName" type="text" maxlength="40" placeholder="เช่น รชณกร"><button class="secondary" onclick="saveProfile()">💾 บันทึกชื่อ</button><div class="stats"><div class="stat"><b id="pickedTotal">0</b><span>เลือกกิน</span></div><div class="stat"><b id="likedTotal">0</b><span>ชอบ</span></div></div><div class="small">สถิตินี้นับจากประวัติที่บันทึกในบัญชีของคุณ</div></div><button class="secondary" onclick="location.href='./'">🍽️ กลับไปเลือกเมนู</button><button class="secondary" onclick="location.href='feedback.html'">💬 แสดงความคิดเห็น / แจ้งปัญหา</button><button class="secondary" onclick="logout()">ออกจากระบบ</button></div><div id="msg" class="msg"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://cuspfvfzprlgtvtdyilh.supabase.co','sb_publishable_PGmPJ6_8tNIWm7zfF6qEng_0emmWchx');let authMode='signup';function mode(m){authMode=m;signupTab.classList.toggle('on',m==='signup');loginTab.classList.toggle('on',m==='login');submit.textContent=m==='signup'?'สมัครสมาชิก':'เข้าสู่ระบบ';forgotBtn.style.display=m==='login'?'block':'none';setMsg('')}function setMsg(t,ok=false){msg.textContent=t;msg.className='msg'+(t?(ok?' ok':' err'):'')}async function forgotPassword(){const e=email.value.trim();if(!e)return setMsg('กรอกอีเมลของคุณก่อน แล้วกดลืมรหัสผ่านอีกครั้ง');forgotBtn.disabled=true;setMsg('กำลังส่งอีเมลตั้งรหัสผ่านใหม่...',true);const redirectTo=new URL('reset-password.html',location.href).href;const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo});forgotBtn.disabled=false;if(error)return setMsg('ส่งอีเมลตั้งรหัสผ่านใหม่ไม่สำเร็จ กรุณาลองอีกครั้งในภายหลัง');setMsg('ส่งอีเมลแล้วครับ กรุณาเปิดอีเมลและกดลิงก์ตั้งรหัสผ่านใหม่',true)}async function submitAuth(){const e=email.value.trim(),p=password.value;if(!e||!p)return setMsg('กรอกอีเมลและรหัสผ่านก่อนครับ');if(p.length<8)return setMsg('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');submit.disabled=true;setMsg('กำลังดำเนินการ...',true);let r;if(authMode==='signup')r=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});else r=await sb.auth.signInWithPassword({email:e,password:p});submit.disabled=false;if(r.error)return setMsg(authMode==='login'?'อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือไม่สามารถเข้าสู่ระบบได้ในขณะนี้':'สมัครสมาชิกไม่สำเร็จ กรุณาตรวจข้อมูลแล้วลองอีกครั้ง');if(authMode==='signup'&&!r.data.session)setMsg('สมัครแล้วครับ กรุณาเปิดอีเมลเพื่อยืนยันบัญชี',true);else{setMsg('สำเร็จครับ',true);render()}}async function saveProfile(){const {data}=await sb.auth.getUser();const u=data.user;if(!u)return setMsg('กรุณาเข้าสู่ระบบก่อน');const name=displayName.value.trim();const {error}=await sb.from('member_profiles').upsert({user_id:u.id,display_name:name||null,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)return setMsg('บันทึกชื่อไม่สำเร็จ กรุณาลองอีกครั้ง');setMsg('บันทึกชื่อแล้วครับ',true)}async function loadProfile(u){const {data}=await sb.from('member_profiles').select('display_name').eq('user_id',u.id).maybeSingle();displayName.value=data?.display_name||''}async function loadStats(u){const [{count:picked},{count:liked}]=await Promise.all([sb.from('member_food_history').select('*',{count:'exact',head:true}).eq('user_id',u.id).eq('action','picked'),sb.from('member_food_history').select('*',{count:'exact',head:true}).eq('user_id',u.id).eq('action','liked')]);pickedTotal.textContent=picked||0;likedTotal.textContent=liked||0}async function logout(){await sb.auth.signOut();setMsg('ออกจากระบบแล้ว',true);render()}async function render(){const {data}=await sb.auth.getUser();const u=data.user;signedOut.style.display=u?'none':'block';signedIn.style.display=u?'block':'none';who.textContent=u?u.email:'';if(u){await Promise.all([loadProfile(u),loadStats(u)])}}sb.auth.onAuthStateChange(()=>render());render();</script></body></html>
