<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8a00"><title>กินอะไรดี • Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#fffaf0;color:#30251d}.app{max-width:720px;margin:auto;padding:22px 16px 60px}h1{margin:0}.sub{color:#777}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.card{background:#fff;border:1px solid #eee0cc;border-radius:22px;padding:18px}.big{font-size:38px;font-weight:950;color:#f47c00}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.pill{background:#eaf9f7;color:#087d77;padding:6px 10px;border-radius:99px;font-weight:800}button{border:0;background:#ff8500;color:#fff;padding:13px 18px;border-radius:14px;font-weight:900;font-size:16px}.muted{color:#777;font-size:14px}section{margin-top:16px}h2{font-size:20px}.empty{color:#888;padding:12px 0}@media(max-width:430px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><main class="app"><h1>📊 Dashboard กินอะไรดี</h1><p class="sub">สถิติร้านพาร์ตเนอร์ • 30 วันล่าสุด</p><button onclick="load()">↻ รีเฟรชข้อมูล</button><div class="cards"><div class="card"><div class="muted">คลิกร้านทั้งหมด</div><div id="clicks" class="big">—</div></div><div class="card"><div class="muted">ร้าน Active</div><div id="partners" class="big">—</div></div></div><section class="card"><h2>🏪 ร้านที่ถูกกดมากที่สุด</h2><div id="restaurants"></div></section><section class="card"><h2>🍽️ เมนูที่คนสนใจ</h2><div id="foods"></div></section><section class="card"><h2>🕘 คลิกล่าสุด</h2><div id="recent"></div></section><p class="muted">Dashboard รุ่นทดสอบสำหรับเจ้าของแอป ยังไม่ใช่รายงานรายได้จริง</p></main><script>const API='https://cuspfvfzprlgtvtdyilh.supabase.co/functions/v1/partner-api';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function ranks(a){return a.length?a.map((x,i)=>`<div class="row"><span>${i+1}. ${esc(x.name)}</span><b>${x.count} คลิก</b></div>`).join(''):'<div class="empty">ยังไม่มีข้อมูล</div>'}async function load(){try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'dashboard_summary',days:30})}),d=await r.json();if(!r.ok)throw Error();clicks.textContent=d.totalClicks;partners.textContent=d.activePartners;restaurants.innerHTML=ranks(d.topRestaurants||[]);foods.innerHTML=ranks(d.topFoods||[]);recent.innerHTML=(d.recent||[]).length?(d.recent||[]).map(x=>`<div class="row"><span><b>${esc(x.food)}</b><br><span class="muted">${esc(x.restaurant)}</span></span><span class="pill">${new Date(x.clicked_at).toLocaleString('th-TH')}</span></div>`).join(''):'<div class="empty">ยังไม่มีข้อมูล</div>'}catch(e){document.getElementById('recent').innerHTML='<div class="empty">โหลดข้อมูลไม่สำเร็จ กรุณาลองใหม่</div>'}}load()</script></body></html>
