name: NF-07 Physical Fixture Regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nf07-fixture-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v15 fixture is exact historical Service Worker
        shell: bash
        run: |
          set -euo pipefail
          test -s qa-sw-v15.js
          git cat-file -e 46b494cc9430ee39c2322f9e0ae8b66149c0d3bf^{commit}
          git show 46b494cc9430ee39c2322f9e0ae8b66149c0d3bf:sw.js > /tmp/historical-sw-v15.js
          cmp -s /tmp/historical-sw-v15.js qa-sw-v15.js || {
            echo 'qa-sw-v15.js must remain byte-for-byte identical to historical sw.js at commit 46b494cc9430ee39c2322f9e0ae8b66149c0d3bf'
            diff -u /tmp/historical-sw-v15.js qa-sw-v15.js || true
            exit 1
          }
          grep -Fq "const CACHE='kinaraidee-beta-v15';" qa-sw-v15.js
          printf 'fixture sha256: '
          sha256sum qa-sw-v15.js
          test "$(sha256sum qa-sw-v15.js | awk '{print $1}')" = '39eadd35eba67436ee41db17a119f0739dc5c7d9dda58dd951a13766572bf72c'
          node --check qa-sw-v15.js

      - name: Syntax-check inline NF-07 probe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('qa-nf07-old-cache.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',text,flags=re.S)
          if len(scripts)!=1:
              raise SystemExit(f'Expected exactly one inline script, found {len(scripts)}')
          Path('/tmp/qa-nf07-inline.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/qa-nf07-inline.js

      - name: Verify QA probe, fixture provenance and recorded physical boundary
        shell: bash
        run: |
          set -euo pipefail
          evidence='PWA-UPGRADE-PHYSICAL-EVIDENCE.md'
          test -s qa-nf07-old-cache.html
          test -s "$evidence"

          grep -Fq "const LEGACY_CACHE='kinaraidee-beta-v15';" qa-nf07-old-cache.html
          grep -Fq "const CURRENT_CACHE='kinaraidee-beta-v16';" qa-nf07-old-cache.html
          grep -Fq "const FIXTURE_SHA256='39eadd35eba67436ee41db17a119f0739dc5c7d9dda58dd951a13766572bf72c';" qa-nf07-old-cache.html
          grep -Fq "navigator.serviceWorker.register(FIXTURE_SW,{scope:'./',updateViaCache:'none'})" qa-nf07-old-cache.html
          grep -Fq "navigator.serviceWorker.register(CURRENT_SW,{scope:'./',updateViaCache:'none'})" qa-nf07-old-cache.html
          grep -Fq "kinaraidee_nf07_persistence_marker_v1" qa-nf07-old-cache.html
          grep -Fq "PASS (state verifier)" qa-nf07-old-cache.html
          grep -Fq 'ยังไม่ใช่ NF-07 PASS' qa-nf07-old-cache.html

          grep -Fq 'Status: **SCOPED PHYSICAL PASS — NF-07 v15 → v16**' "$evidence"
          grep -Fq 'Historical commit: `46b494cc9430ee39c2322f9e0ae8b66149c0d3bf`' "$evidence"
          grep -Fq 'Historical cache marker: `kinaraidee-beta-v15`' "$evidence"
          grep -Fq 'Expected SHA-256: `39eadd35eba67436ee41db17a119f0739dc5c7d9dda58dd951a13766572bf72c`' "$evidence"
          grep -Fq 'Device: OPPO Reno13 5G (CPH2689)' "$evidence"
          grep -Fq 'OS: Android 16 / ColorOS 16.0.5' "$evidence"
          grep -Fq 'Browser: Chrome 152.0.7977.64' "$evidence"
          grep -Fq 'Actual reopen count before current behavior appeared: **1**' "$evidence"
          grep -Fq 'No manual site/app-data clear occurred' "$evidence"
          grep -Fq 'legacy `kinaraidee-beta-v15` cache: absent' "$evidence"
          grep -Fq 'site-data persistence marker: survived' "$evidence"
          grep -Fq 'Home + Surprise usability check' "$evidence"
          grep -Fq 'QA fixtures, source review and synthetic Service Worker tests remain setup/implementation evidence only and cannot create physical PASS by themselves.' "$evidence"
          grep -Fq 'It does not establish the remaining device matrix' "$evidence"
          grep -Fq 'Public Beta completion' "$evidence"
          grep -Fq 'Commercial GO.' "$evidence"

          echo 'NF-07 historical fixture provenance and the recorded scoped physical v15→v16 acceptance boundary are preserved.'
