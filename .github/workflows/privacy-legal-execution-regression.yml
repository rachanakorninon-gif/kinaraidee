name: Privacy Legal Execution Regression

on:
  pull_request:
    paths:
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - 'RELEASE-CHECKLIST.md'
      - '.github/workflows/privacy-legal-execution-regression.yml'
  push:
    branches: ['main']
    paths:
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - 'RELEASE-CHECKLIST.md'
      - '.github/workflows/privacy-legal-execution-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify Privacy Legal approval remains separate from execution evidence
        shell: bash
        run: |
          set -euo pipefail
          decision='PRODUCTION-PRIVACY-LEGAL-DECISION.md'
          checklist='RELEASE-CHECKLIST.md'

          test -s "$decision"
          test -s "$checklist"
          grep -Eq '^Status: \*\*(NOT APPROVED|APPROVED)\*\*$' "$decision"
          grep -Fq 'They do not prove Production Privacy Policy publication' "$decision"
          grep -Fq 'corresponding Production documents are actually published or otherwise traceable as required' "$decision"

          execution_open_items=(
            '- [ ] Privacy Policy ฉบับ Production เผยแพร่จริง'
            '- [ ] Terms of Service เผยแพร่จริง'
            '- [ ] ช่องทางติดต่อเจ้าของบริการจริง'
            '- [ ] กำหนด retention/deletion ของข้อมูลและขั้นตอนคำขอของผู้ใช้'
          )

          for item in "${execution_open_items[@]}"; do
            grep -Fq -- "$item" "$checklist" || {
              echo "Privacy/Legal execution-evidence gate must remain open until separate observed evidence exists: $item"
              exit 1
            }
          done

          echo 'Privacy/Legal decision approval remains separate from publication/contact/retention execution evidence.'

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Privacy / Legal execution regression'
            echo
            echo '- A reviewed Privacy/Legal decision does not itself prove Production Privacy Policy or Terms publication, a live controller/contact channel, or retention/deletion execution.'
            echo '- Those Commercial checklist gates remain open in both NOT APPROVED and APPROVED decision states until separate observed evidence exists.'
            echo '- This guard does not publish policies, approve legal/PDPA status, execute data-rights or retention actions, or establish Public Beta/Commercial PASS.'
          } >> "$GITHUB_STEP_SUMMARY"
