name: Current Main Deployment Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/current-main-deployment-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find exact Pages and Live Smoke runs for current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 19626daf77778c6e51ba37193f09b24a7225c139
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          for spec in 'pages.yml pages' 'live-smoke.yml smoke'; do
            set -- $spec
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/$1/runs?branch=main&per_page=30" > "$tmp/$2.json"
          done
          TARGET_SHA="$TARGET_SHA" PAGES_FILE="$tmp/pages.json" SMOKE_FILE="$tmp/smoke.json" node <<'NODE'
          const fs=require('fs'), sha=process.env.TARGET_SHA;
          const pages=JSON.parse(fs.readFileSync(process.env.PAGES_FILE,'utf8')).workflow_runs||[];
          const smoke=JSON.parse(fs.readFileSync(process.env.SMOKE_FILE,'utf8')).workflow_runs||[];
          const p=pages.find(r=>r.head_sha===sha);
          const s=smoke.find(r=>r.head_sha===sha);
          console.log('Pages exact:',p&&{id:p.id,status:p.status,conclusion:p.conclusion,head_sha:p.head_sha,html_url:p.html_url});
          console.log('Live Smoke exact:',s&&{id:s.id,status:s.status,conclusion:s.conclusion,head_sha:s.head_sha,html_url:s.html_url});
          if(!p||!s) process.exit(2);
          if(p.status!=='completed'||p.conclusion!=='success'||s.status!=='completed'||s.conclusion!=='success') process.exit(3);
          NODE
      - name: Evidence boundary
        if: always()
        run: echo 'Read-only workflow metadata diagnostic; no deployment or production mutation.'
