name: Temporary Fix 640 Matrix Lineage

on:
  push:
    branches:
      - docs/reconcile-635-deployment-20260914

permissions:
  contents: write

jobs:
  fix-and-self-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-635-deployment-20260914
          fetch-depth: 0
      - name: Patch canonical matrix declaration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('BETA-DEVICE-MATRIX.md')
          text = p.read_text(encoding='utf-8')
          old = '- Current browser/PWA runtime candidate: Issue #635 / `91cdf79d221c68ca54e5f874aebe421846264821` — `kinaraidee-beta-v16`; deployment status is **PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE**; Runtime merge/deployed SHA is `ff975076a643d123081da8ab3e3baf399fdc5f6d`.'
          new = '- Current browser/PWA runtime candidate: PR #636 / `91cdf79d221c68ca54e5f874aebe421846264821` (Issue #635) — `kinaraidee-beta-v16`; deployment status is **PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE**; Runtime merge/deployed SHA is `ff975076a643d123081da8ab3e3baf399fdc5f6d`.'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one current matrix declaration, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git grep -F 'Current browser/PWA runtime candidate: PR #636 / `91cdf79d221c68ca54e5f874aebe421846264821` (Issue #635)' BETA-DEVICE-MATRIX.md
          git rm .github/workflows/tmp-fix-640-matrix-lineage.yml .tmp-fix-640-matrix-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BETA-DEVICE-MATRIX.md
          git diff --cached --check
          git commit -m 'docs(release): align #635 matrix lineage declaration'
          git push origin HEAD:docs/reconcile-635-deployment-20260914
