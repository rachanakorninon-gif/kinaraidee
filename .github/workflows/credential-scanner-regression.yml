name: Credential Scanner Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify QA scanners keep workflow-safe sentinels
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "pattern='(sb_''secret_|service_''role|SUPABASE_''SERVICE_ROLE|PRIVATE_''KEY-----)'" .github/workflows/beta-check.yml
          grep -Fq "pattern='(service_''role|sb_''secret_|SUPABASE_''SERVICE_ROLE|PRIVATE_''KEY-----)'" .github/workflows/qa.yml
          grep -Fq "safe_env='Deno" .github/workflows/beta-check.yml
          grep -Fq "safe_env='Deno" .github/workflows/qa.yml

      - name: Exercise beta and QA credential detector contract
        shell: bash
        run: |
          set -euo pipefail
          pattern='(sb_''secret_|service_''role|SUPABASE_''SERVICE_ROLE|PRIVATE_''KEY-----)'
          safe_env='Deno\.env\.get\(['"'"'\"]SUPABASE_''SERVICE_ROLE_KEY['"'"'\"]\)'
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          # Build fixtures at runtime so no credential-shaped payload is committed.
          printf '%s\n' "const leaked = 'sb_""secret_$(printf 'A%.0s' {1..24})';" > "$tmp"
          matches="$(grep -nE "$pattern" "$tmp" || true)"
          test -n "$matches" || { echo 'Detector missed synthetic secret fixture.'; exit 1; }

          printf '%s\n' "const leaked = 'service_""role_$(printf 'B%.0s' {1..24})';" > "$tmp"
          matches="$(grep -nE "$pattern" "$tmp" || true)"
          test -n "$matches" || { echo 'Detector missed synthetic role fixture.'; exit 1; }

          printf '%s\n' "const key = Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')" > "$tmp"
          matches="$(grep -nE "$pattern" "$tmp" || true)"
          unsafe="$(printf '%s\n' "$matches" | grep -vE "$safe_env" || true)"
          test -z "$unsafe" || { echo 'Safe server-side environment reference was not allowlisted.'; exit 1; }

          printf '%s\n' 'harmless-placeholder-without-private-credentials' > "$tmp"
          if grep -qE "$pattern" "$tmp"; then
            echo 'Detector produced a false positive on harmless fixture.'
            exit 1
          fi
          echo 'Credential scanner regression contract passed.'
