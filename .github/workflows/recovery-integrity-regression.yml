name: Recovery Integrity Regression

on:
  pull_request:
    paths:
      - 'supabase/recovery-integrity-check.sql'
      - '.github/workflows/recovery-integrity-regression.yml'
  push:
    branches: ['main']
    paths:
      - 'supabase/recovery-integrity-check.sql'
      - '.github/workflows/recovery-integrity-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-integrity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify recovery check stays read-only and privacy-safe
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/recovery-integrity-check.sql'
          test -s "$file"
          grep -Fq 'critical_tables_found' "$file"
          grep -Fq 'critical_tables_with_rls' "$file"
          grep -Fq 'group_vote_cascade_present' "$file"
          grep -Fq 'orphan_group_votes' "$file"
          if grep -Eqi '(^|[^a-z_])(insert|update|delete|truncate|alter|drop|create|grant|revoke)[[:space:]]' "$file"; then
            echo 'Mutation or DDL detected in recovery integrity contract.'
            exit 1
          fi
          if grep -Eqi '(email|phone|host_token|voter_id|room_id)[[:space:]]*(,|from|as)' "$file"; then
            echo 'Potential identifier-bearing output detected.'
            exit 1
          fi

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Recovery integrity regression'
            echo
            echo '- Guards the repository post-restore verification query as read-only and aggregate-only.'
            echo '- Static contract success does not prove backup availability, restore success, measured RPO/RTO, or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
