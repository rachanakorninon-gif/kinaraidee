name: Partner API Live Rejection Probe

on:
  pull_request:
    paths:
      - '.github/workflows/partner-api-live-probe.yml'
      - 'supabase/functions/partner-api/index.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/partner-api-live-probe.yml'
      - 'supabase/functions/partner-api/index.ts'
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      alert_self_test:
        description: 'Controlled alert-delivery self-test; skips live API requests and intentionally fails the probe step'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  rejection-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify rejection-only live Partner API contract
        shell: bash
        env:
          ALERT_SELF_TEST: ${{ inputs.alert_self_test || false }}
        run: |
          set -euo pipefail
          if [ "$ALERT_SELF_TEST" = 'true' ]; then
            echo 'Controlled alert-delivery self-test requested. No live Partner API request will be sent.'
            exit 1
          fi

          url='https://cuspfvfzprlgtvtdyilh.supabase.co/functions/v1/partner-api'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl_common=(--silent --show-error --connect-timeout 10 --max-time 30)

          code="$(curl "${curl_common[@]}" --dump-header "$tmp/get.h" --output "$tmp/get.b" --write-out '%{http_code}' "$url")"
          test "$code" = '405' || { echo "GET expected 405, got $code"; exit 1; }
          grep -qi '^cache-control: no-store' "$tmp/get.h"
          grep -qi '^x-content-type-options: nosniff' "$tmp/get.h"
          python - "$tmp/get.b" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: body=json.load(f)
          assert body == {'error':'method_not_allowed'}, body
          PY

          code="$(printf '{' | curl "${curl_common[@]}" --dump-header "$tmp/bad.h" --output "$tmp/bad.b" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data-binary @- "$url")"
          test "$code" = '400' || { echo "Malformed JSON expected 400, got $code"; exit 1; }
          python - "$tmp/bad.b" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: body=json.load(f)
          assert body == {'error':'invalid_json'}, body
          PY

          python - <<'PY' | curl "${curl_common[@]}" --dump-header "$tmp/large.h" --output "$tmp/large.b" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data-binary @- "$url" > "$tmp/large.code"
          import sys
          sys.stdout.write('x' * 33000)
          PY
          code="$(cat "$tmp/large.code")"
          test "$code" = '413' || { echo "Oversized body expected 413, got $code"; exit 1; }
          python - "$tmp/large.b" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: body=json.load(f)
          assert body == {'error':'request_too_large'}, body
          PY

          echo 'Partner API rejection-only live probe passed.'

      - name: Open or update Partner API probe failure issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_SELF_TEST: ${{ inputs.alert_self_test || false }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$ALERT_SELF_TEST" = 'true' ]; then
            alert_title='Partner API alert delivery self-test'
            alert_intro='Controlled Partner API alert-delivery self-test reached the GitHub Issue path. No live Partner API request was sent by the failing probe step.'
            alert_scope='controlled alert-path verification only; not a production failure'
          else
            alert_title='Partner API live probe failure'
            alert_intro='Automated Partner API rejection-only monitor failed.'
            alert_scope='non-mutating rejection contracts only'
          fi

          export ALERT_TITLE="$alert_title"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title == env.ALERT_TITLE) | .number' | head -n1)"
          body=$(cat <<EOF
          $alert_intro

          - Workflow run: $run_url
          - Repository SHA: $GITHUB_SHA
          - Trigger: $GITHUB_EVENT_NAME
          - Scope: $alert_scope

          This alert does not establish root cause, user impact, data loss, security incident, retention failure, monitoring SLA, partner/commercial readiness, conversion or revenue status.
          EOF
          )

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Updated existing alert issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$alert_title" --body "$body"
            echo "Opened alert issue: $alert_title"
          fi

      - name: Record evidence boundary
        if: always()
        shell: bash
        env:
          ALERT_SELF_TEST: ${{ inputs.alert_self_test || false }}
        run: |
          {
            echo '## Partner API live rejection probe'
            echo
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- Repository SHA: \`${GITHUB_SHA}\`"
            echo "- Controlled alert self-test: \`${ALERT_SELF_TEST}\`"
            echo '- Executes only non-mutating rejection paths against the public Partner API endpoint.'
            echo '- Expected contract: GET 405/method_not_allowed, malformed JSON 400/invalid_json, body over 32 KiB 413/request_too_large, with no-store/nosniff on the GET rejection response.'
            echo '- Each live request is bounded by explicit connection and total-transfer timeouts.'
            echo '- Scheduled every 6 hours at minute 41 UTC and can also be dispatched manually.'
            echo '- Partner API Regression separately guards this workflow against JSON application-action payloads and expected 2xx assertions.'
            echo '- Self-test boundary: when alert_self_test=true, the live API step exits before any API request and exercises only the GitHub Issue alert path.'
            echo '- Failure path: production probe failures open/update `Partner API live probe failure`; controlled self-tests use `Partner API alert delivery self-test` to avoid false incident evidence.'
            echo '- Alert-delivery verification requires an inspected controlled or real failure run plus the resulting issue/comment evidence.'
            echo '- Success is scoped to rejection behavior only; it is not complete abuse control, retention approval, partner readiness, revenue evidence or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
