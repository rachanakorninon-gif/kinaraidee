name: Auth Multi-provider Foundation Regression

on:
  pull_request:
    paths:
      - 'AUTH-MULTI-PROVIDER-ROLLOUT.md'
      - 'LINE-AUTH-CONTROLLED-EVIDENCE.md'
      - 'prototype/auth-multi-provider/**'
      - '.github/workflows/auth-multi-provider-foundation-regression.yml'
  push:
    branches: [main]
    paths:
      - 'AUTH-MULTI-PROVIDER-ROLLOUT.md'
      - 'LINE-AUTH-CONTROLLED-EVIDENCE.md'
      - 'prototype/auth-multi-provider/**'
      - '.github/workflows/auth-multi-provider-foundation-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: node --check prototype/auth-multi-provider/member-auth-multi-provider.js

      - name: Preserve staged rollout and security boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('prototype/auth-multi-provider/member-auth-multi-provider.js','utf8');
          const doc=fs.readFileSync('AUTH-MULTI-PROVIDER-ROLLOUT.md','utf8');
          const evidence=fs.readFileSync('LINE-AUTH-CONTROLLED-EVIDENCE.md','utf8');
          const member=fs.readFileSync('member.html','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};

          must(js.includes("Object.freeze({line:false,phone:false,facebook:false})"),'new providers must default disabled');
          must(js.includes("const LINE_PROVIDER='custom:line'"),'LINE must use the reviewed custom provider identifier');
          must(js.includes("signInWithOAuth({provider,options:{redirectTo}})"),'social auth must use Supabase OAuth redirect flow');
          must(js.includes("signInWithOtp({phone})"),'phone flow must use Supabase phone OTP');
          must(js.includes("verifyOtp({phone:pendingPhone,token,type:'sms'})"),'phone flow must verify SMS OTP through Supabase Auth');
          must(!js.includes('console.'),'auth client must not log auth/provider/OTP data');
          must(!js.includes('provider_token')&&!js.includes('provider_refresh_token'),'app must not persist provider tokens');
          must(!js.includes('localStorage.setItem')&&!js.includes('sessionStorage.setItem'),'foundation must not add browser persistence for OTP/provider identity data');
          must(js.includes("/^0\\d{9}$/")&&js.includes("/^\\+66\\d{9}$/"),'Thai phone normalization must be format-bounded');

          must(!member.includes('member-auth-multi-provider.js'),'prototype must remain unwired from the production member page');
          must(!member.includes('custom:line'),'production member page must not directly enable LINE before remaining gates close');
          must(!sw.includes('member-auth-multi-provider.js'),'prototype must remain outside the production Service Worker cache');

          must(doc.includes('PRODUCTION PROVIDERS NOT ENABLED'),'rollout status must preserve disabled Production boundary');
          must(doc.includes('live attribution acceptance'),'rollout must preserve acquisition/referral live acceptance gate');
          must(doc.includes('No provider is considered production-ready merely because provider configuration, server-side claim infrastructure or UI/client code exists.'),'provider setup or deployed claim infrastructure must not imply Production readiness');
          must(doc.includes('must not auto-merge two existing application accounts'),'account merge safety boundary missing');
          must(doc.includes('SMS spend/abuse controls'),'phone OTP cost/abuse boundary missing');
          must(doc.includes('intentionally **not** wired into `member.html`, `data/`, the Service Worker cache or the deployed Pages runtime'),'non-deployed prototype boundary missing');
          must(doc.includes('https://access.line.me/oauth2/v2.1/authorize'),'reviewed LINE authorization endpoint missing');
          must(doc.includes('https://api.line.me/oauth2/v2.1/token'),'reviewed LINE token endpoint missing');
          must(doc.includes('https://api.line.me/oauth2/v2.1/userinfo'),'reviewed LINE userinfo endpoint missing');

          must(evidence.includes('Status: **CONTROLLED CONFIGURATION VERIFIED / PRODUCTION BUTTON DISABLED**'),'LINE evidence must not imply Production enablement');
          must(evidence.includes('Manual OAuth2'),'LINE evidence must record the successful provider mode');
          must(evidence.includes('Returning LINE login PASS'),'returning-user controlled evidence missing');
          must(evidence.includes('referral/acquisition attribution parity for a LINE-created account'),'remaining attribution blocker must stay explicit');
          must(evidence.includes('physical cross-account profile/history/favorite/referral isolation acceptance'),'remaining isolation blocker must stay explicit');
          must(!evidence.match(/client secret\s*[:=]\s*[A-Za-z0-9_-]{16,}/i),'evidence must not contain a client secret value');
          NODE

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Multi-provider Auth foundation'
            echo
            echo '- LINE / Phone / Facebook remain disabled in the deployed member UI.'
            echo '- Controlled LINE Manual OAuth2 setup and login evidence is documented separately without user identifiers or secrets.'
            echo '- LINE authorization, cancel/return, new login, returning login and user-initiated logout have scoped controlled evidence only.'
            echo '- Server-side attribution claim infrastructure is deployed, but live attribution acceptance, physical cross-account isolation, network/failure UX, accessibility and broader device coverage remain open before Production enablement.'
            echo '- Prototype client integration remains outside member.html and the Service Worker cache.'
            echo '- Existing email/password Auth remains the current Production path.'
          } >> "$GITHUB_STEP_SUMMARY"
