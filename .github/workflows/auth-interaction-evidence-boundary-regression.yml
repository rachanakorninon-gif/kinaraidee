name: Auth Interaction Evidence Boundary Regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-interaction-evidence-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve current Auth interaction evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s CURRENT-RELEASE.md || { echo 'Missing CURRENT-RELEASE.md'; exit 1; }
          test -s RELEASE-CHECKLIST.md || { echo 'Missing RELEASE-CHECKLIST.md'; exit 1; }
          test -s BETA-READY.md || { echo 'Missing BETA-READY.md'; exit 1; }
          test -s AUTH-INTERACTION-PHYSICAL-EVIDENCE.md || { echo 'Missing AUTH-INTERACTION-PHYSICAL-EVIDENCE.md'; exit 1; }

          grep -Fq 'Status: **PARTIAL PASS — RECOVERY REQUEST/MAIL-SEND/VERIFY-LINK + PASSWORD UPDATE + SIGN-IN + NEW SIGNUP + EMAIL CONFIRMATION VERIFIED / LEAKED-PASSWORD REJECTION NOT VERIFIED**' AUTH-INTERACTION-PHYSICAL-EVIDENCE.md || {
            echo 'Auth physical evidence must preserve the corroborated scoped partial-PASS boundary'; exit 1;
          }
          grep -Fq 'The umbrella current PR #373 Auth acceptance remains **PARTIAL / OPEN** only because weak/leaked-password rejection remains a separate server-side security blocker' AUTH-INTERACTION-PHYSICAL-EVIDENCE.md || {
            echo 'Auth physical evidence must keep umbrella PR #373 acceptance partial/open without reopening verified signup/confirmation'; exit 1;
          }
          grep -Fq 'new-account signup request reaching confirmation-required state: PASS' AUTH-INTERACTION-PHYSICAL-EVIDENCE.md || {
            echo 'Auth physical evidence must preserve tested new-signup PASS'; exit 1;
          }
          grep -Fq 'confirmation-link completion and resulting signed-in Member state: PASS' AUTH-INTERACTION-PHYSICAL-EVIDENCE.md || {
            echo 'Auth physical evidence must preserve tested confirmation-link PASS'; exit 1;
          }
          grep -Fq 'recovery request / recovery mail-send / verification-link path: PASS for the tested QA sequence' AUTH-INTERACTION-PHYSICAL-EVIDENCE.md || {
            echo 'Auth physical evidence must preserve tested recovery-path PASS without generalizing mail delivery'; exit 1;
          }

          grep -Fq 'Current PR #373 Auth account-flow interaction is **PASS for the scoped OPPO Reno13 5G / Android 16 / Chrome 152.0.7977.64 session**' CURRENT-RELEASE.md || {
            echo 'CURRENT-RELEASE.md must preserve scoped physical account-flow PASS'; exit 1;
          }
          grep -Fq 'The umbrella Auth/Security acceptance remains **PARTIAL / OPEN** because weak/leaked-password rejection is still NOT VERIFIED / blocked server-side' CURRENT-RELEASE.md || {
            echo 'CURRENT-RELEASE.md must keep leaked-password/server-side Auth gate open'; exit 1;
          }
          grep -Fq 'That deployment PASS does not itself prove Auth interaction acceptance; the separate traced OPPO physical session now supplies scoped account-flow evidence' CURRENT-RELEASE.md || {
            echo 'CURRENT-RELEASE.md must distinguish deployment evidence from physical Auth evidence'; exit 1;
          }

          grep -Fq '[x] Member signup/login/password-reset interaction ผ่านบนอุปกรณ์จริงตาม scope' RELEASE-CHECKLIST.md || {
            echo 'Release checklist must preserve scoped real-device Auth account-flow PASS'; exit 1;
          }
          grep -Fq '[ ] Weak/leaked-password rejection ผ่านบน production Auth service; current server-side protection ยัง **BLOCKED BY VERIFIED FREE PLAN / CONFIGURATION — NOT PASS**' RELEASE-CHECKLIST.md || {
            echo 'Release checklist must keep leaked-password rejection open'; exit 1;
          }
          grep -Fq '[x] current PR #373 account-flow interaction acceptance มี scoped physical OPPO Android Chrome evidence' RELEASE-CHECKLIST.md || {
            echo 'Deployment/release checklist must record physical account-flow evidence separately'; exit 1;
          }
          grep -Fq '[ ] current PR #373 weak/leaked-password rejection acceptance' RELEASE-CHECKLIST.md || {
            echo 'Deployment/release checklist must preserve remaining leaked-password acceptance'; exit 1;
          }

          grep -Fq 'current Auth acceptance เป็น **PARTIAL / OPEN**' BETA-READY.md || {
            echo 'BETA-READY.md must record scoped Auth partial PASS while preserving the open umbrella gate'; exit 1;
          }
          grep -Fq 'new-account signup → confirmation-mail delivery → confirmation-link → signed-in Member flow มี scoped PASS/corroboration' BETA-READY.md || {
            echo 'BETA-READY.md must preserve verified new-account signup/confirmation scope'; exit 1;
          }
          grep -Fq 'weak/leaked-password rejection ยัง NOT VERIFIED / OPEN' BETA-READY.md || {
            echo 'BETA-READY.md must preserve remaining leaked-password sub-gate'; exit 1;
          }
          grep -Fq 'Automated/static/deployment evidence ไม่แทน real-device, assistive-technology หรือ commercial acceptance' BETA-READY.md || {
            echo 'BETA-READY.md must preserve automated/deployment evidence boundary'; exit 1;
          }

          echo 'Scoped Auth recovery/password-update/sign-in/new-signup/email-confirmation evidence is preserved; leaked-password and umbrella Auth/Security acceptance stay open.'
