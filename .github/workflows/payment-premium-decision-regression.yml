name: Payment Premium Decision Regression

on:
  pull_request:
    paths:
      - 'PAYMENT-PREMIUM-DECISION.md'
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - 'CURRENT-RELEASE.md'
      - 'RELEASE-CHECKLIST.md'
      - '.github/workflows/payment-premium-decision-regression.yml'
  push:
    branches: ['main']
    paths:
      - 'PAYMENT-PREMIUM-DECISION.md'
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - 'CURRENT-RELEASE.md'
      - 'RELEASE-CHECKLIST.md'
      - '.github/workflows/payment-premium-decision-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Payment Premium decision state
        shell: bash
        run: |
          set -euo pipefail
          file='PAYMENT-PREMIUM-DECISION.md'
          privacy='PRODUCTION-PRIVACY-LEGAL-DECISION.md'
          test -s "$file"
          test -s "$privacy"
          grep -Eq '^Status: \*\*(NOT APPROVED|APPROVED)\*\*$' "$file"
          required_fields=(
            'Payment provider:' 'Merchant/business account:' 'Supported currency/market:'
            'Premium price/billing cadence:' 'Free vs Premium entitlement definition:'
            'Provider-supported sandbox/test environment:' 'Server-side entitlement/webhook verification design:'
            'Renewal/cancel/payment-failure behavior:' 'Refund/dispute/chargeback process:'
            'Transaction audit/reconciliation owner:' 'Privacy/Terms/payment disclosure reference:'
            'Commercial owner/approver:' 'Approved at:'
          )
          for marker in "${required_fields[@]}"; do grep -Fq -- "$marker" "$file" || { echo "Missing payment decision field: $marker"; exit 1; }; done
          if grep -q '^Status: \*\*NOT APPROVED\*\*$' "$file"; then
            for marker in "${required_fields[@]}"; do grep -F "$marker" "$file" | grep -Fq '**UNSET**' || { echo "NOT APPROVED field must remain UNSET: $marker"; exit 1; }; done
          else
            if grep -q '\*\*UNSET\*\*' "$file"; then echo 'APPROVED payment decision still contains UNSET fields.'; exit 1; fi
            grep -q '^Status: \*\*APPROVED\*\*$' "$privacy" || { echo 'Payment cannot be APPROVED before Production Privacy/Legal is APPROVED.'; exit 1; }
            approved_at=$(sed -n 's/^- Approved at: //p' "$file")
            python - "$approved_at" <<'PY'
          import datetime as dt
          import sys
          value = sys.argv[1].strip().replace('**', '')
          try:
              parsed = dt.datetime.fromisoformat(value.replace('Z', '+00:00'))
          except ValueError:
              raise SystemExit('Approved at must be a valid ISO-8601 timestamp.')
          if parsed.tzinfo is None:
              parsed = parsed.replace(tzinfo=dt.timezone.utc)
          now = dt.datetime.now(dt.timezone.utc)
          if parsed > now + dt.timedelta(minutes=5):
              raise SystemExit('Approved at must not be materially in the future.')
          PY
          fi
          grep -Fq 'does not itself prove subscribe/renew/cancel/payment-failure execution' "$file"
          grep -Fq 'They do not prove a merchant account exists' "$file"

      - name: Verify Commercial checklist respects payment decision boundary
        shell: bash
        run: |
          set -euo pipefail
          decision='PAYMENT-PREMIUM-DECISION.md'
          checklist='RELEASE-CHECKLIST.md'
          test -s "$checklist"
          open_items=(
            '- [ ] เลือก payment provider / merchant account จริง'
            '- [ ] กำหนดราคา Premium จริงและเงื่อนไข Free/Premium ชัดเจน'
            '- [ ] ทดสอบ subscribe / renew / cancel / payment failure ใน sandbox หรือ environment ที่ provider รองรับ'
            '- [ ] กำหนด entitlement ระหว่าง Free และ Premium'
            '- [ ] webhook/payment status handling ป้องกันการให้สิทธิ์จาก client อย่างเดียว'
            '- [ ] มี transaction ID / audit trail / reconciliation ที่ตรวจสอบได้'
            '- [ ] refund/cancel policy สอดคล้องกับ flow ที่ระบบรองรับ'
          )
          if grep -q '^Status: \*\*NOT APPROVED\*\*$' "$decision"; then
            for item in "${open_items[@]}"; do grep -Fq -- "$item" "$checklist" || { echo "Payment checklist gate must remain open: $item"; exit 1; }; done
          fi
          grep -Fq -- '- [ ] ห้ามเปิดรับเงินจริงหาก payment gate ข้อใดที่จำเป็นยังไม่ผ่าน' "$checklist"

      - name: Verify canonical release summary respects payment evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          decision='PAYMENT-PREMIUM-DECISION.md'
          release='CURRENT-RELEASE.md'
          test -s "$release"

          grep -Fq 'Payment/Premium provider and real subscription lifecycle evidence' "$release" || {
            echo 'CURRENT-RELEASE.md is missing the Payment/Premium Commercial blocker.'
            exit 1
          }
          grep -Fq 'No user-count, conversion, revenue, payment success, partner readiness, legal approval, full device-matrix PASS, full Public Beta PASS or Commercial GO is inferred from this document.' "$release" || {
            echo 'CURRENT-RELEASE.md is missing the payment/commercial evidence boundary.'
            exit 1
          }

          if grep -q '^Status: \*\*NOT APPROVED\*\*$' "$decision"; then
            if grep -Eq 'Payment/Premium[^\n]*(APPROVED|READY|PASS)' "$release"; then
              echo 'Canonical release summary appears to promote Payment/Premium while decision is NOT APPROVED.'
              exit 1
            fi
          fi

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Payment / Premium decision regression'
            echo
            echo '- NOT APPROVED requires policy-sensitive payment fields to remain UNSET and Commercial payment checklist gates to remain open.'
            echo '- CURRENT-RELEASE.md must keep Payment/Premium as a Commercial blocker until provider-backed lifecycle evidence exists.'
            echo '- APPROVED additionally requires Production Privacy/Legal approval and a valid approval timestamp.'
            echo '- APPROVED only establishes a reviewed decision record; provider-backed transaction and entitlement evidence remains separate.'
            echo '- Static CI success is not merchant onboarding, payment execution, conversion, revenue, Public Beta PASS, or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
