name: Device UX Regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-device-ux-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check browser helpers
        run: |
          set -euo pipefail
          node --check data/nearby-restaurants.js
          node --check data/history-ui.js
          node --check data/member-sync.js
          node --check data/home-surprise.js
          node --check data/choice-rules.js

      - name: Verify Location status is persistent and actionable
        shell: bash
        run: |
          set -euo pipefail
          file='data/nearby-restaurants.js'
          grep -Fq "nearbyLocationStatus" "$file"
          grep -Fq "setPartnerStatus" "$file"
          grep -Fq "setLocationStatus" "$file"
          grep -Fq "error.code===1" "$file"
          grep -Fq "error.code===2" "$file"
          grep -Fq "error.code===3" "$file"
          grep -Fq "timeout:15000" "$file"
          grep -Fq "maximumAge:0" "$file"
          ! grep -Eq "maximumAge:[1-9][0-9]*" "$file"
          grep -Fq "role=\"status\" aria-live=\"polite\"" "$file"
          grep -Fq "Google Maps แทนได้ครับ" "$file"
          echo 'Location UX contract preserved with fresh geolocation request'

      - name: Verify core icon controls have accessible names
        shell: bash
        run: |
          set -euo pipefail
          file='index.html'
          grep -Fq 'onclick="show('\''mealStep'\'')" aria-label="กลับไปเลือกมื้ออาหาร">‹</button>' "$file"
          grep -Fq 'onclick="changePeople(-1)" aria-label="ลดจำนวนคน">−</button>' "$file"
          grep -Fq 'onclick="changePeople(1)" aria-label="เพิ่มจำนวนคน">+</button>' "$file"
          grep -Fq 'id="peopleNum" role="status" aria-live="polite" aria-atomic="true"' "$file"
          grep -Fq 'onclick="show('\''peopleStep'\'')" aria-label="กลับไปเลือกจำนวนคน">‹</button>' "$file"
          grep -Fq 'onclick="show('\''budgetStep'\'')" aria-label="กลับไปเลือกงบประมาณ">‹</button>' "$file"
          grep -Fq 'onclick="show('\''typeStep'\'')" aria-label="กลับไปเลือกความชอบ">‹</button>' "$file"
          grep -Fq 'onclick="shareFood()" aria-label="แชร์เมนูนี้">↗</button>' "$file"
          test "$(grep -o 'aria-label="กลับหน้าหลัก">‹</button>' "$file" | wc -l | tr -d ' ')" -eq 2
          echo 'Core icon-only control accessible-name contract preserved'

      - name: Verify selected visual state is exposed programmatically
        shell: bash
        run: |
          set -euo pipefail
          file='data/home-surprise.js'
          grep -Fq "const selector='#mealChips .option,#peopleChips .pill,#budgetChips .budget,#typeChips .chip';" "$file"
          grep -Fq "setAttribute('aria-pressed',control.classList.contains('on')?'true':'false')" "$file"
          grep -Fq "attributeFilter:['class']" "$file"
          grep -Fq 'installSelectedStateA11y();' "$file"
          echo 'Selected-state visual/programmatic synchronization contract preserved'

      - name: Verify SPA screen focus management
        shell: bash
        run: |
          set -euo pipefail
          file='data/home-surprise.js'
          grep -Fq 'function installScreenFocusA11y(){' "$file"
          grep -Fq "home:'.heroTitle'" "$file"
          grep -Fq "mealStep:'.stepHead h1'" "$file"
          grep -Fq "peopleStep:'.topbar b'" "$file"
          grep -Fq "budgetStep:'.topbar b'" "$file"
          grep -Fq "typeStep:'.stepHead h1'" "$file"
          grep -Fq "loading:'.loading h2'" "$file"
          grep -Fq "result:'.topbar b'" "$file"
          grep -Fq "history:'.topbar b'" "$file"
          grep -Fq "target.setAttribute('tabindex','-1')" "$file"
          grep -Fq "target.setAttribute('role','heading')" "$file"
          grep -Fq "if(id==='loading')return;" "$file"
          grep -Fq "target.focus({preventScroll:true})" "$file"
          grep -Fq 'installScreenFocusA11y();' "$file"
          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('data/home-surprise.js','utf8');
          const installStart=source.indexOf('function installScreenFocusA11y(){');
          const installEnd=source.indexOf('function ensurePremiumHomeStyles(){',installStart);
          if(installStart<0||installEnd<0)throw new Error('screen-focus helper boundary missing');
          const helper=source.slice(installStart,installEnd);
          const wrapper=helper.match(/window\.show=function\(id\)\{([\s\S]*?)\n    \};/);
          if(!wrapper)throw new Error('show wrapper missing');
          const body=wrapper[1];
          const activate=body.indexOf('originalShow(id);');
          const focus=body.indexOf('focusDestination(id);');
          if(activate<0||focus<0||activate>=focus)throw new Error('destination focus must run after screen activation');
          if(!helper.includes("if(!screen||!screen.classList.contains('active'))return;"))throw new Error('active-screen focus guard missing');
          if(!helper.includes("if(!screen.classList.contains('active'))return;"))throw new Error('scheduled stale-screen focus guard missing');
          console.log('SPA screen focus ordering and stale-screen guards preserved');
          NODE
          echo 'SPA screen focus accessibility contract preserved'

      - name: Verify Home V3 bottom navigation stays above decorated content
        shell: bash
        run: |
          set -euo pipefail
          file='data/home-surprise.js'
          grep -Fq '#home .homeHero.home-v3>*{position:relative;z-index:1}' "$file"
          grep -Fq '.nav{z-index:20}' "$file"
          echo 'Home V3 navigation stacking contract preserved'

      - name: Verify soup preference classification boundaries
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const source=fs.readFileSync('data/choice-rules.js','utf8')+'\n;globalThis.__rules=KINARAIDEE_CHOICE_RULES;';
          const context={console};
          vm.createContext(context);
          vm.runInContext(source,context);
          const rules=context.__rules;
          if(!rules)throw new Error('Choice rules were not exposed to regression fixture');
          const hasSoup=(name,tags='',category='')=>rules.derive([name,'',100,'','กลางวัน',tags,category]).includes('ซุป');
          const checks=[
            ['ผัดพริกแกงหมู',false,'ข้าว,เผ็ด','อาหารตามสั่ง'],
            ['ข้าวแกงกะหรี่ญี่ปุ่น',false,'ข้าว,หนัก','ญี่ปุ่น'],
            ['ตำแตงไข่ต้ม',false,'เผ็ด,โปรตีน,เบา','อีสาน'],
            ['ยำไข่ต้ม',false,'เผ็ด,โปรตีน,เบา','ยำ'],
            ['สลัดไข่ต้ม',false,'โปรตีน,เบา','สลัด'],
            ['ไข่ต้มข้าวสวย',false,'ข้าว,โปรตีน,เบา','อาหารจานเดียว'],
            ['แกงเขียวหวานไก่',true,'เผ็ด','กับข้าว'],
            ['ต้มยำกุ้ง',true,'เผ็ด','กับข้าว'],
            ['ต้มจืดเต้าหู้หมูสับ',true,'โปรตีน,เบา','กับข้าว'],
            ['ข้าวต้มไข่',true,'ข้าว,โปรตีน,เบา','อาหารเช้า']
          ];
          for(const [name,expected,tags,category] of checks){
            const actual=hasSoup(name,tags,category);
            if(actual!==expected)throw new Error(`${name}: expected soup=${expected}, got ${actual}`);
          }
          console.log('Soup preference classification boundary preserved');
          NODE

      - name: Verify Favorite and History differentiation
        shell: bash
        run: |
          set -euo pipefail
          history='data/history-ui.js'
          nearby='data/nearby-restaurants.js'
          grep -Fq "เมนูโปรด / ประวัติ" "$history"
          grep -Fq "❤️ เมนูโปรด" "$history"
          grep -Fq "👍 เลือกกิน" "$history"
          grep -Fq "kinaraideeHistory" "$history"
          grep -Fq "loadScript('data/history-ui.js')" "$nearby"
          echo 'Favorite/History differentiation contract preserved'

      - name: Verify current app-shell inclusion
        shell: bash
        run: |
          set -euo pipefail
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test "$marker" = 'kinaraidee-beta-v16' || { echo "Expected v16 candidate, got: $marker"; exit 1; }
          grep -Fq "'./data/history-ui.js'" sw.js
          grep -Fq "'./data/nearby-restaurants.js'" sw.js
          grep -Fq "'./data/member-sync.js'" sw.js
          grep -Fq "'./data/home-surprise.js'" sw.js
          grep -Fq 'cache.addAll(SHELL)' sw.js
          echo "$marker app-shell contract preserved"

      - name: Verify real-device evidence remains scoped
        shell: bash
        run: |
          set -euo pipefail
          matrix='BETA-DEVICE-MATRIX.md'
          grep -Fq 'Current browser/PWA runtime candidate:' "$matrix"
          grep -Fq 'kinaraidee-beta-v16' "$matrix"
          grep -Eq 'Verified (v16|current) deployment evidence:' "$matrix"
          grep -Fq 'TC-06 เมนูโปรด | PASS (v16 restart)' "$matrix"
          grep -Fq 'Issue #177 closed completed' "$matrix"
          grep -Fq 'Historical v15 restart FAIL remains recorded' "$matrix"
          grep -Fq 'PASS (v16)' "$matrix"
          grep -Fq 'Issue #171 closed completed' "$matrix"
          grep -Fq 'Exact coordinates are intentionally not retained' "$matrix"
          grep -Fq 'ยังต้องมี iPhone Safari เครื่องที่ 2' "$matrix"
          grep -Fq 'ห้ามกรอก PASS จากการคาดเดา' "$matrix"
          echo 'Real-device evidence boundary preserved'
