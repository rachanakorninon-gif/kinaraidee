name: Issue 644 runtime candidate one shot

on:
  push:
    branches: ['fix/644-result-menu-focus']
    paths:
      - '.github/workflows/issue-644-runtime-candidate-one-shot.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/644-result-menu-focus
          fetch-depth: 0
      - name: Declare exact Result-focus runtime candidate
        run: |
          set -euo pipefail
          candidate="$(git log -1 --format=%H -- data/toast-accessibility.js)"
          export candidate
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('CURRENT-RUNTIME.md')
          lines=p.read_text(encoding='utf-8').splitlines()
          candidate=os.environ['candidate']
          change=(
            '- Runtime change: Issue #644 TalkBack Result-context remediation. The existing SPA focus-management path '
            'still performs the only programmatic focus move, but the Result destination now remaps its deterministic '
            'focus target from the generic top-bar label to the already-rendered `#foodName` heading. The menu target '
            'remains `tabindex="-1"`, is not a live region, Loading remains transient, and no speech API or duplicate '
            'announcement path is added. Existing bottom-nav current-state behavior remains unchanged; cache generation '
            'remains `kinaraidee-beta-v16`.'
          )
          for i,line in enumerate(lines):
            if line.startswith('- Current browser/PWA runtime candidate:'):
              lines[i]=f'- Current browser/PWA runtime candidate: `{candidate}`'
            elif line.startswith('- Runtime change:'):
              lines[i]=change
            elif line.startswith('- Deployment status:'):
              lines[i]='- Deployment status: **PENDING FOR CURRENT RUNTIME DEPLOYMENT**'
            elif line.startswith('- Runtime merge/deployed SHA:'):
              lines[i]='- Runtime merge/deployed SHA: **PENDING**'
            elif line.startswith('- Current runtime deployment evidence:'):
              lines[i]=(f'- Current runtime deployment evidence: **PENDING** for Issue #644 candidate `{candidate}`. '
                        'The last verified deployed browser/PWA trace remains Issue #635 candidate '
                        '`91cdf79d221c68ca54e5f874aebe421846264821` through deployed descendant '
                        '`ff975076a643d123081da8ab3e3baf399fdc5f6d`; its prior deployment evidence remains historical and is not reused as current PASS.')
          heading=lines.index('## Evidence boundary')
          for j in range(heading+1,len(lines)):
            if lines[j].strip():
              lines[j]=(f'The current browser/PWA runtime candidate `{candidate}` is **PENDING FOR CURRENT RUNTIME DEPLOYMENT**. '
                        'Source/static/CI evidence for the Result menu focus-target remediation does not establish deployment or TalkBack/VoiceOver/keyboard Physical PASS. '
                        'The last verified deployed runtime remains Issue #635 through `ff975076a643d123081da8ab3e3baf399fdc5f6d`; existing physical evidence retains only its recorded scope.')
              break
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          grep -Fq "Current browser/PWA runtime candidate: \`$candidate\`" CURRENT-RUNTIME.md
          grep -Fq 'PENDING FOR CURRENT RUNTIME DEPLOYMENT' CURRENT-RUNTIME.md
          grep -Fq 'does not establish deployment or TalkBack/VoiceOver/keyboard Physical PASS' CURRENT-RUNTIME.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT-RUNTIME.md
          git commit -m 'docs(runtime): declare Issue 644 Result-focus candidate'
          git push origin HEAD:fix/644-result-menu-focus
