name: Deploy Kinaraidee to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'index.html'
      - '404.html'
      - 'privacy.html'
      - 'feedback.html'
      - 'partner.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  predeploy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required release files
        shell: bash
        run: |
          set -euo pipefail
          required=(index.html 404.html privacy.html feedback.html partner.html manifest.webmanifest icon.svg sw.js robots.txt sitemap.xml data/foods-expanded.js data/choice-rules.js data/nearby-restaurants.js data/group-mode.js data/group-sync.js data/group-remote.js data/member-sync.js data/pwa-install.js data/home-surprise.js)
          for file in "${required[@]}"; do test -s "$file" || { echo "Missing or empty: $file"; exit 1; }; done
      - name: Validate manifest and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
          node --check sw.js
          for file in data/*.js; do node --check "$file"; done
      - name: Verify member history sync contract before deploy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const parsedAt=Date.parse(r.created_at);" data/member-sync.js
          grep -Fq "const liked=r.action==='liked';" data/member-sync.js
          grep -Fq "const accepted=r.action==='picked';" data/member-sync.js
          grep -Fq "at:Number.isFinite(parsedAt)?parsedAt:Date.now()" data/member-sync.js
          grep -Fq "new Date(h.at).toLocaleString('th-TH')" index.html
          if grep -Fq "date:new Date(r.created_at).toLocaleString('th-TH')" data/member-sync.js && ! grep -Fq "at:Number.isFinite(parsedAt)?parsedAt:Date.now()" data/member-sync.js; then
            echo 'Cloud history exposes display date but not the local timestamp field required by the renderer.'
            exit 1
          fi
      - name: Verify latest release wiring and PWA v13
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data/home-surprise.js' index.html
          grep -q 'data/nearby-restaurants.js' index.html
          grep -q 'serviceWorker' index.html
          grep -q 'kinaraidee-beta-v13' sw.js
          grep -q 'cache.addAll(SHELL)' sw.js
          grep -q "'./data/home-surprise.js'" sw.js
          grep -q "'./data/pwa-install.js'" sw.js
          grep -q 'box.replaceChildren()' data/nearby-restaurants.js
          grep -q "name.textContent=String(r.name" data/nearby-restaurants.js
          grep -q 'aria-busy' data/home-surprise.js
          grep -q 'pageshow' data/home-surprise.js
          grep -q 'online' data/home-surprise.js
          grep -q "PRIVACY_NOTICE_VERSION='2026-08-21'" partner.html
          grep -q 'privacy_notice_version:PRIVACY_NOTICE_VERSION' partner.html
          grep -q 'privacy_acknowledged_at:new Date().toISOString()' partner.html
          if grep -q 'Promise.allSettled' sw.js; then echo 'Non-atomic shell install detected'; exit 1; fi
      - name: Block deploy on release evidence marker drift
        shell: bash
        run: |
          set -euo pipefail
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test -n "$marker" || { echo 'Unable to derive canonical release marker from sw.js'; exit 1; }
          test "$(printf '%s\n' "$marker" | wc -l)" -eq 1 || { echo 'Multiple canonical markers found in sw.js'; exit 1; }
          strict=('.github/workflows/qa.yml' '.github/workflows/beta-check.yml' '.github/workflows/pages.yml' '.github/workflows/live-smoke.yml' 'README.md')
          evidence=('LIVE-DEPLOYMENT-VERIFICATION.md' 'BETA-RUN-LOG.md' 'BETA-DEVICE-MATRIX.md' 'RELEASE-CHECKLIST.md')
          for file in "${strict[@]}"; do
            test -s "$file" || { echo "Missing release-tracking file: $file"; exit 1; }
            grep -Fq "$marker" "$file" || { echo "Release marker drift: $file does not reference $marker"; exit 1; }
            while IFS= read -r found; do [ -z "$found" ] && continue; if [ "$found" != "$marker" ]; then echo "Stale active release marker in $file: $found (expected only $marker)"; exit 1; fi; done < <(grep -oE 'kinaraidee-beta-v[0-9]+' "$file" | sort -u || true)
          done
          for file in "${evidence[@]}"; do test -s "$file" || { echo "Missing release-evidence file: $file"; exit 1; }; grep -Fq "$marker" "$file" || { echo "Release evidence drift: $file does not reference current $marker"; exit 1; }; done
      - name: Prevent private secrets before Pages deploy
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(sb[_]secret_|service[_]role|SUPABASE[_]SERVICE[_]ROLE|PRIVATE[_]KEY-----)' .; then echo 'Potential private secret found; deployment blocked.'; exit 1; fi

  deploy:
    needs: predeploy-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build clean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html privacy.html feedback.html partner.html _site/
          cp manifest.webmanifest icon.svg sw.js robots.txt sitemap.xml _site/
          cp -R data _site/data
          find _site -maxdepth 2 -type f | sort
          test ! -e _site/.git
          test ! -e _site/.github
          test ! -e _site/supabase
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
