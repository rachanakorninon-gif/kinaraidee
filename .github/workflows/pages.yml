name: Deploy Kinaraidee to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'index.html'
      - '404.html'
      - 'privacy.html'
      - 'feedback.html'
      - 'partner.html'
      - 'member.html'
      - 'reset-password.html'
      - 'campaign-3000-premium.html'
      - 'premium-research-preview.html'
      - 'deployment-check.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'data/**'
      - 'CURRENT-RUNTIME.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  predeploy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check required release files
        shell: bash
        run: |
          set -euo pipefail
          required=(index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html campaign-3000-premium.html premium-research-preview.html deployment-check.html manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml data/foods-expanded.js data/choice-rules.js data/nearby-restaurants.js data/group-mode.js data/group-sync.js data/group-remote.js data/member-sync.js data/pwa-install.js data/home-surprise.js CURRENT-RUNTIME.md)
          for file in "${required[@]}"; do test -s "$file" || { echo "Missing or empty: $file"; exit 1; }; done
      - name: Validate manifest and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
          node --check sw.js
          for file in data/*.js; do node --check "$file"; done
      - name: Verify member history sync contract before deploy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const parsedAt=Date.parse(r.created_at);" data/member-sync.js
          grep -Fq "const liked=r.action==='liked';" data/member-sync.js
          grep -Fq "const accepted=r.action==='picked';" data/member-sync.js
          grep -Fq "at:Number.isFinite(parsedAt)?parsedAt:Date.now()" data/member-sync.js
          grep -Fq "new Date(h.at).toLocaleString('th-TH')" index.html
      - name: Verify member auth pages before deploy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'minlength="8"' member.html
          grep -Fq 'p.length<8' member.html
          grep -Fq 'minlength="8"' reset-password.html
          grep -Fq 'p.length<8' reset-password.html
          grep -Fq "location.href='member.html'" reset-password.html
          if grep -q 'error\.message' member.html reset-password.html; then
            echo 'Raw Supabase error.message must not be exposed in public member auth pages.'
            exit 1
          fi
          if grep -q "location.href='admin.html'" reset-password.html; then
            echo 'Member password reset must not redirect to the private owner dashboard.'
            exit 1
          fi
      - name: Verify campaign prelaunch boundary before deploy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PRE-LAUNCH' campaign-3000-premium.html
          grep -Fq '0 / 3,000' campaign-3000-premium.html
          grep -Fq 'ยังไม่เริ่มนับสิทธิ์' campaign-3000-premium.html
          grep -Fq 'ยังไม่ถือเป็นสิทธิ์ลุ้นรางวัล' campaign-3000-premium.html
          grep -Fq 'ไม่ได้รับการสนับสนุน รับรอง หรือดำเนินการโดย Apple Inc.' campaign-3000-premium.html
          if grep -Eq '([1-9][0-9]*) / 3,000' campaign-3000-premium.html; then
            echo 'Prelaunch campaign must not publish a non-zero eligible-member count.'
            exit 1
          fi
      - name: Verify Premium research preview boundary before deploy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content="noindex,nofollow,noarchive"' premium-research-preview.html
          grep -Fq 'RESEARCH PROTOTYPE' premium-research-preview.html
          grep -Fq 'ไม่มีการสมัคร Premium' premium-research-preview.html
          grep -Fq 'ไม่มีการชำระเงิน' premium-research-preview.html
          grep -Fq 'ไม่เก็บคำตอบ' premium-research-preview.html
          grep -Fq 'id="revealCampaign"' premium-research-preview.html
          grep -Fq 'id="campaignBox" class="campaign" aria-hidden="true"' premium-research-preview.html
          grep -Fq '0 / 3,000 · ยังไม่เริ่มนับสิทธิ์' premium-research-preview.html
          grep -Fq 'ไม่ได้รับการสนับสนุน รับรอง หรือดำเนินการโดย Apple Inc.' premium-research-preview.html
          if grep -Eqi '<form|fetch\(|XMLHttpRequest|localStorage|sessionStorage' premium-research-preview.html; then
            echo 'Premium research preview must remain no-submit/no-storage and must not collect participant responses.'
            exit 1
          fi
      - name: Verify completed live-group result bridge before deploy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "function useRemoteVotes(votes,setup)" data/group-mode.js
          grep -Fq "window.KINARAIDEE_GROUP_MODE={showRemoteResult:useRemoteVotes}" data/group-mode.js
          grep -Fq "await load('data/group-sync.js')" data/group-mode.js
          grep -Fq "await load('data/group-remote.js')" data/group-mode.js
          grep -Fq "window.KINARAIDEE_GROUP_MODE?.showRemoteResult" data/group-remote.js
          grep -Fq "remoteShowResult.onclick=showOnlineResult" data/group-remote.js
          grep -Fq "renderGroupResult();return true" data/group-mode.js
      - name: Verify human-readable deployment probe
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '2026-08-23-group-result-bridge' deployment-check.html
          grep -Fq 'surprise-a11y-v1' deployment-check.html
          grep -Fq 'surprise-a11y-v2' deployment-check.html
          grep -Fq 'focus-motion-v14' deployment-check.html
          grep -Fq 'pages-actions-source-v1' deployment-check.html
          grep -Fq 'showRemoteResult:useRemoteVotes' deployment-check.html
          grep -Fq 'remoteShowResult.onclick=showOnlineResult' deployment-check.html
          grep -Fq 'homeSurpriseStatus' deployment-check.html
          grep -Fq "aria-live','assertive" deployment-check.html
          grep -Fq 'dynamic-pwa-marker-v1' deployment-check.html
          grep -Fq 'bounded-fetch-v1' deployment-check.html
      - name: Verify latest release wiring and accessibility runtime
        shell: bash
        run: |
          set -euo pipefail
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test -n "$marker" || { echo 'Unable to derive PWA marker'; exit 1; }
          grep -Fq "PWA cache marker: \`$marker\`" CURRENT-RUNTIME.md
          grep -q 'data/home-surprise.js' index.html
          grep -q 'data/nearby-restaurants.js' index.html
          grep -q 'serviceWorker' index.html
          grep -q 'cache.addAll(SHELL)' sw.js
          grep -q "'./data/home-surprise.js'" sw.js
          grep -q "'./data/pwa-install.js'" sw.js
          grep -q 'box.replaceChildren()' data/nearby-restaurants.js
          grep -q "name.textContent=String(r.name" data/nearby-restaurants.js
          grep -Fq 'homeSurpriseStatus' data/home-surprise.js
          grep -Fq "status.setAttribute('role','status')" data/home-surprise.js
          grep -Fq "status.setAttribute('aria-live','assertive')" data/home-surprise.js
          grep -Fq "b.setAttribute('aria-disabled',on?'true':'false')" data/home-surprise.js
          grep -Fq "b.setAttribute('aria-busy',on?'true':'false')" data/home-surprise.js
          grep -Fq 'kinaraideeAccessibilityStyles' data/home-surprise.js
          grep -Fq 'prefers-reduced-motion' data/home-surprise.js
          grep -Fq 'button:focus-visible' feedback.html
          grep -Fq 'button:focus-visible' partner.html
          grep -q "PRIVACY_NOTICE_VERSION='2026-08-21'" partner.html
          grep -q 'privacy_notice_version:PRIVACY_NOTICE_VERSION' partner.html
          grep -q 'privacy_acknowledged_at:new Date().toISOString()' partner.html
          if grep -q 'Promise.allSettled' sw.js; then echo 'Non-atomic shell install detected'; exit 1; fi
      - name: Block deploy on runtime declaration drift
        shell: bash
        run: |
          set -euo pipefail
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          declared="$(sed -n 's/^- PWA cache marker: `\(kinaraidee-beta-v[0-9][0-9]*\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          test -n "$marker" && test "$marker" = "$declared" || { echo "Runtime marker drift: sw=$marker declaration=$declared"; exit 1; }
          grep -Fq 'Public Beta is still **NOT COMPLETE**' CURRENT-RUNTIME.md
      - name: Block deploy when declared browser runtime candidate is stale
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          test -n "$candidate" || { echo 'Unable to parse browser/PWA runtime candidate SHA from CURRENT-RUNTIME.md'; exit 1; }
          git cat-file -e "$candidate^{commit}" || { echo "Runtime candidate SHA is not present in repository history: $candidate"; exit 1; }
          git merge-base --is-ancestor "$candidate" HEAD || { echo "Runtime candidate SHA is not an ancestor of deployment HEAD: $candidate"; exit 1; }
          changed="$(git diff --name-only "$candidate"..HEAD -- index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml data || true)"
          if [ -n "$changed" ]; then
            echo 'Deployment blocked: browser/PWA runtime files changed after the declared candidate:'
            printf '%s\n' "$changed"
            exit 1
          fi
          echo "Deployment runtime lineage matches declared candidate $candidate"
      - name: Prevent private secrets before Pages deploy
        shell: bash
        run: |
          set -euo pipefail
          pattern='(sb_''secret_|service_''role|SUPABASE_''SERVICE_ROLE|PRIVATE_''KEY-----)'
          matches="$(grep -RInE --exclude-dir=.git --exclude='*.md' "$pattern" . || true)"
          safe_env='Deno\.env\.get\(['"'"'\"]SUPABASE_''SERVICE_ROLE_KEY['"'"'\"]\)'
          unsafe="$(printf '%s\n' "$matches" | grep -vE "$safe_env" || true)"
          if [ -n "$unsafe" ]; then
            printf '%s\n' "$unsafe"
            echo 'Potential private secret found; deployment blocked.'
            exit 1
          fi

  deploy:
    needs: predeploy-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build clean Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html campaign-3000-premium.html premium-research-preview.html deployment-check.html _site/
          cp manifest.webmanifest icon.svg sw.js robots.txt sitemap.xml _site/
          cp -R data _site/data
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test -n "$marker" || { echo 'Unable to derive release marker for release-meta.json'; exit 1; }
          printf '{"sha":"%s","pwa_cache":"%s"}\n' "$GITHUB_SHA" "$marker" > _site/release-meta.json
          find _site -maxdepth 2 -type f | sort
          test -s _site/member.html
          test -s _site/reset-password.html
          test -s _site/campaign-3000-premium.html
          test -s _site/premium-research-preview.html
          test -s _site/deployment-check.html
          test -s _site/release-meta.json
          grep -Fq "$GITHUB_SHA" _site/release-meta.json
          grep -Fq "$marker" _site/release-meta.json
          test ! -e _site/.git
          test ! -e _site/.github
          test ! -e _site/supabase
          test ! -e _site/admin.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4