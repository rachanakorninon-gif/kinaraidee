name: Keyboard Focus Physical Probe Regression

on:
  push:
    branches: ["main"]
    paths:
      - "qa-keyboard-focus-state.html"
      - "REAL-PLATFORM-UX-EVIDENCE.md"
      - "CURRENT-RELEASE.md"
      - "BETA-CHECKLIST.md"
      - ".github/workflows/keyboard-focus-physical-probe-regression.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "qa-keyboard-focus-state.html"
      - "REAL-PLATFORM-UX-EVIDENCE.md"
      - "CURRENT-RELEASE.md"
      - "BETA-CHECKLIST.md"
      - ".github/workflows/keyboard-focus-physical-probe-regression.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyboard-focus-probe-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify keyboard-focus QA probe and physical-evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          probe='qa-keyboard-focus-state.html'
          evidence='REAL-PLATFORM-UX-EVIDENCE.md'
          release='CURRENT-RELEASE.md'
          beta='BETA-CHECKLIST.md'
          pages='.github/workflows/pages.yml'

          for file in "$probe" "$evidence" "$release" "$beta" "$pages"; do
            test -s "$file" || { echo "Missing $file"; exit 1; }
          done

          grep -Fq 'QA Keyboard Focus State Probe' "$probe"
          grep -Fq 'e.isTrusted!==true' "$probe"
          grep -Fq "e.key==='Tab'" "$probe"
          grep -Fq "e.key==='Enter'||e.key===' '||e.key==='Spacebar'" "$probe"
          grep -Fq "el.matches(':focus-visible')" "$probe"
          grep -Fq 'trustedFocusTransitions>=3' "$probe"
          grep -Fq 'visibleFocusObservations>=3' "$probe"
          grep -Fq 'trustedActivations>=1' "$probe"
          grep -Fq 'TRACE READY:' "$probe"
          grep -Fq 'ยังไม่ใช่ Keyboard Focus PASS โดยอัตโนมัติ' "$probe"
          grep -Fq 'no programmatic focus' "$probe"
          grep -Fq 'frame.src=`index.html?qa_keyboard_focus=1&v=${Date.now()}`' "$probe"

          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('qa-keyboard-focus-state.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',text,flags=re.S)
          if len(scripts)!=1:
              raise SystemExit(f'Expected exactly one inline script, found {len(scripts)}')
          script=scripts[0]
          if re.search(r'\.focus\s*\(',script):
              raise SystemExit('Keyboard physical probe must not programmatically focus app controls.')
          if re.search(r'Keyboard Focus PASS|Keyboard focus result:\s*PASS',script):
              raise SystemExit('QA trace probe script must not declare the canonical physical result PASS.')
          Path('/tmp/qa-keyboard-focus-inline.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/qa-keyboard-focus-inline.js

          grep -Fq -- "- 'qa-keyboard-focus-state.html'" "$pages"
          grep -Fq 'qa-keyboard-focus-state.html' "$pages"
          grep -Fq 'test -s _site/qa-keyboard-focus-state.html' "$pages"

          # The probe remains evidence-neutral: it can produce TRACE READY but never self-promotes PASS.
          grep -Fq 'Static CSS inspection or automated focus-style regression does not establish this result.' "$evidence"

          # Canonical Keyboard Focus state may be PASS only from the independent real-hardware evidence record.
          if grep -Fq 'Keyboard focus result: **PASS**' "$evidence"; then
            grep -Fq 'Keyboard device / model: Built-in Lenovo notebook keyboard / Lenovo system model 83DV' "$evidence"
            grep -Fq 'Keyboard OS / version: Windows 11 Version 25H2 / OS Build 26200.9168' "$evidence"
            grep -Fq 'Keyboard browser or installed-PWA context / version: Google Chrome 152.0.7977.82, normal browser tab' "$evidence"
            grep -Fq 'Visible Keyboard Focus canonical result is **PASS for the scoped Lenovo system model 83DV' "$release"
            grep -Fq -- '- [x] visible keyboard focus/navigation ผ่าน real interaction บน deployed pages — scoped PASS: Lenovo system model 83DV' "$beta"
          else
            grep -Fq 'Keyboard focus result: **NOT VERIFIED**' "$evidence"
            grep -Fq 'visible keyboard focus must be verified with real keyboard/focus navigation on deployed pages.' "$release"
            grep -Fq -- '- [ ] visible keyboard focus/navigation ผ่าน real interaction บน deployed pages' "$beta"
          fi

          grep -Fq 'Public Beta is still **NOT COMPLETE**.' "$release"

          echo 'Keyboard-focus QA probe remains evidence-neutral and published by Pages; canonical PASS, when present, is bound to independent traceable real-hardware evidence rather than synthetic setup.'
