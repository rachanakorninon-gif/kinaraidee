name: Feedback Form Evidence Boundary Regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback-form-evidence-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve scoped Feedback form evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          evidence='PUBLIC-FORM-PHYSICAL-EVIDENCE.md'
          release='CURRENT-RELEASE.md'
          checklist='RELEASE-CHECKLIST.md'
          beta_ready='BETA-READY.md'

          test -s "$evidence" || { echo 'Missing PUBLIC-FORM-PHYSICAL-EVIDENCE.md'; exit 1; }
          test -s "$release" || { echo 'Missing CURRENT-RELEASE.md'; exit 1; }
          test -s "$checklist" || { echo 'Missing RELEASE-CHECKLIST.md'; exit 1; }
          test -s "$beta_ready" || { echo 'Missing BETA-READY.md'; exit 1; }

          status="$(sed -n 's/^Status: \*\*\([^*]*\)\*\*$/\1/p' "$evidence" | head -n1)"
          case "$status" in
            'NOT VERIFIED'|'PASS') ;;
            *) echo "Unsupported public-form physical evidence status: $status"; exit 1 ;;
          esac

          grep -Fq 'automated smoke/static/synthetic regression test ไม่ถูกใช้แทน real-device interaction หรือ assistive-technology test ที่จำเป็น' "$checklist" || {
            echo 'Release checklist must reject automated evidence as a substitute for required real interaction'; exit 1;
          }

          if [ "$status" = 'NOT VERIFIED' ]; then
            grep -Fq 'Real Feedback and Partner application submission behavior for PR #201 remains open' "$release" || {
              echo 'CURRENT-RELEASE.md must preserve open PR #201 Feedback/Partner interaction acceptance while evidence is NOT VERIFIED'; exit 1;
            }
            grep -Fq 'real Feedback/Partner form interaction for the PR #201 changed paths' "$release" || {
              echo 'CURRENT-RELEASE.md Public Beta gate must preserve real PR #201 form interaction evidence requirement while evidence is NOT VERIFIED'; exit 1;
            }
            grep -Fq 'real Feedback/Partner form submission acceptance ยังต้องใช้หลักฐานจริง; static regression และ deployment trace ห้ามใช้แทน backend insert/device interaction PASS' "$checklist" || {
              echo 'Deployment checklist must keep real Feedback/Partner submission acceptance open while evidence is NOT VERIFIED'; exit 1;
            }
            grep -Fq 'Feedback flow ใช้งานจริงได้ตาม device/platform scope ที่กำหนด; PR #201 recovery implementation/deployment evidence ไม่แทน successful form submission' "$checklist" || {
              echo 'Product checklist must keep Feedback submission acceptance open while evidence is NOT VERIFIED'; exit 1;
            }
            echo 'Feedback form deployment/recovery evidence remains scoped; real PR #201 submission acceptance is still open'
            exit 0
          fi

          grep -Fq '## TC-11 Feedback physical acceptance' "$evidence" || {
            echo 'PASS requires a TC-11 physical acceptance block'; exit 1;
          }
          grep -Fq 'Duplicate-submit protection observed: **PASS**' "$evidence" || {
            echo 'PASS requires observed duplicate-submit protection'; exit 1;
          }
          grep -Fq 'Reproducible network/SDK failure exercised: **PASS**' "$evidence" || {
            echo 'PASS requires reproducible failure recovery evidence'; exit 1;
          }
          grep -Fq 'Submit control re-enabled after failure: **PASS**' "$evidence" || {
            echo 'PASS requires submit-control recovery'; exit 1;
          }
          grep -Fq '`aria-busy` cleared after failure: **PASS**' "$evidence" || {
            echo 'PASS requires direct aria-busy recovery evidence'; exit 1;
          }
          grep -Fq 'TC-11 Feedback and TC-12 Partner application physical acceptance are **PASS for the scoped OPPO Reno13 5G / Android 16 / Chrome 152.0.7977.64 session**' "$release" || {
            echo 'CURRENT-RELEASE.md must record the scoped Android Chrome public-form PASS'; exit 1;
          }
          grep -Fq 'real Feedback/Partner form submission acceptance มี physical Android Chrome + backend evidence ตาม `PUBLIC-FORM-PHYSICAL-EVIDENCE.md`; ข้อนี้เป็น scoped device/session PASS และไม่แทน full device matrix' "$checklist" || {
            echo 'Deployment checklist must reflect scoped real Feedback submission acceptance'; exit 1;
          }
          grep -Fq 'Feedback flow ใช้งานจริงได้ตาม device/platform scope ที่กำหนด; PR #201 recovery implementation/deployment evidence ไม่แทน successful form submission — scoped OPPO Reno13 5G / Android 16 / Chrome 152 physical acceptance is recorded separately' "$checklist" || {
            echo 'Product checklist must reflect scoped Feedback physical acceptance'; exit 1;
          }
          grep -Fq 'TC-11/TC-12 Feedback/Partner physical acceptance มี scoped PASS แล้วบน OPPO Reno13 5G / Android 16 / Chrome 152.0.7977.64 ตาม `PUBLIC-FORM-PHYSICAL-EVIDENCE.md`; ยังต้องมี broader device-matrix coverage ตามเกณฑ์ Public Beta และห้ามขยายผล scoped PASS เป็น full-matrix PASS' "$beta_ready" || {
            echo 'BETA-READY.md must reflect scoped public-form PASS and preserve the remaining device-matrix boundary'; exit 1;
          }
          if grep -Fq 'Real Feedback and Partner application submission behavior for PR #201 remains open' "$release"; then
            echo 'Scoped physical PASS cannot coexist with stale public-form-open release marker.'
            exit 1
          fi
          grep -Fq 'does not satisfy the remaining Android/iPhone device-matrix minimum' "$release" || {
            echo 'Scoped Feedback PASS must not imply full device-matrix completion'; exit 1;
          }

          echo 'Feedback form physical PASS is traceable and scoped; automated/static, full-matrix, Public Beta and Commercial boundaries remain intact'