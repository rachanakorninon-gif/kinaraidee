name: Auth Captcha Release Summary Regression

on:
  pull_request:
    paths:
      - 'AUTH-CAPTCHA-DECISION.md'
      - 'CURRENT-RELEASE.md'
      - 'RELEASE-CHECKLIST.md'
      - 'SECURITY.md'
      - '.github/workflows/auth-captcha-release-summary-regression.yml'
  push:
    branches: [main]
    paths:
      - 'AUTH-CAPTCHA-DECISION.md'
      - 'CURRENT-RELEASE.md'
      - 'RELEASE-CHECKLIST.md'
      - 'SECURITY.md'
      - '.github/workflows/auth-captcha-release-summary-regression.yml'

permissions:
  contents: read

jobs:
  captcha-release-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Auth Captcha release-summary boundary
        shell: bash
        run: |
          set -euo pipefail
          decision='AUTH-CAPTCHA-DECISION.md'
          release='CURRENT-RELEASE.md'
          checklist='RELEASE-CHECKLIST.md'
          security='SECURITY.md'

          for file in "$decision" "$release" "$checklist" "$security"; do
            test -f "$file"
          done

          status="$(sed -n 's/^Status: \*\*\([^*]*\)\*\*$/\1/p' "$decision")"
          case "$status" in
            'NOT APPROVED'|'APPROVED') ;;
            *) echo "Unexpected Captcha decision status: $status"; exit 1 ;;
          esac

          # Captcha decision/configuration evidence is independent from already observed
          # auth account-flow evidence and from real-device/accessibility/Beta/Commercial gates.
          grep -Fq 'Auth Captcha decision/configuration evidence ไม่แทน client integration, real-device/accessibility หรือ auth-flow regression evidence' "$security"
          grep -Fq 'Public Beta is still **NOT COMPLETE**' "$release"
          grep -Fq 'Commercial launch remains **NO-GO**' "$release"
          grep -Fq -- '- [x] Member signup/login/password-reset interaction ผ่านบนอุปกรณ์จริงตาม scope' "$checklist"
          grep -Fq -- '- [ ] Weak/leaked-password rejection ผ่านบน production Auth service;' "$checklist"
          grep -Fq -- '- [ ] Blocker = 0 และ Critical = 0' "$checklist"

          if [ "$status" = 'NOT APPROVED' ]; then
            if ! grep -q '\*\*UNSET\*\*' "$decision"; then
              echo 'NOT APPROVED Captcha decision unexpectedly has no UNSET fields.'
              exit 1
            fi
            if grep -Eqi 'Captcha[^\n]{0,80}(PASS|READY)|Auth Captcha[^\n]{0,80}(PASS|READY|APPROVED)' "$release"; then
              echo 'Release summary appears to promote Auth Captcha while canonical decision is NOT APPROVED.'
              exit 1
            fi
          else
            if grep -q '\*\*UNSET\*\*' "$decision"; then
              echo 'APPROVED Captcha decision still contains UNSET fields.'
              exit 1
            fi
          fi

          # Even APPROVED only authorizes implementation/controlled validation.
          grep -Fq 'Approval only authorizes implementation and controlled validation.' "$decision"
          grep -Fq 'It does not prove Captcha works on real devices and does not establish Public Beta completion or Commercial GO.' "$decision"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Auth Captcha release-summary regression'
            echo
            echo '- Canonical Captcha status is validated independently from release summary wording and already-observed account-flow evidence.'
            echo '- NOT APPROVED cannot be promoted into release readiness while decision fields remain unresolved.'
            echo '- Scoped physical Auth account-flow PASS does not imply Captcha or leaked-password PASS.'
            echo '- APPROVED authorizes implementation/controlled validation only; Captcha real-device evidence remains separate.'
            echo '- Public Beta NOT COMPLETE and Commercial NO-GO remain independent gates.'
          } >> "$GITHUB_STEP_SUMMARY"
