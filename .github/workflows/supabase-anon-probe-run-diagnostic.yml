name: Supabase Anon Probe Run Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/supabase-anon-probe-run-diagnostic.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List recent main anonymous-access probe runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/supabase-anon-access-probe.yml/runs?branch=main&per_page=10" \
            | jq -c '.workflow_runs[] | {id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url}'

      - name: Evidence boundary
        run: |
          echo 'Read-only GitHub Actions metadata diagnostic only.'
          echo 'This PR must be closed without merge after evidence capture.'
