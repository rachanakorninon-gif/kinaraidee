name: Issue 585 runtime declaration one-shot

on:
  push:
    branches: ["fix/a11y-toast-live-region-585-v3"]
    paths:
      - '.github/workflows/issue-585-runtime-declare-one-shot.yml'

permissions:
  contents: write

jobs:
  declare:
    if: github.event.head_commit.message == 'chore: declare Issue #585 runtime candidate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/a11y-toast-live-region-585-v3
          fetch-depth: 0
      - name: Declare source candidate and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          source='f9b5f137375e9d30d1053d9cad814d636cb88821'
          last='2896748584a1058e9ba1bbc939f49f3b6faf4baf'
          p=Path('CURRENT-RUNTIME.md')
          text=p.read_text()

          def sub1(pattern,repl,label,flags=re.M):
              global text
              text,n=re.subn(pattern,repl,text,count=1,flags=flags)
              if n!=1:
                  raise SystemExit(f'{label}: expected one replacement, got {n}')

          sub1(r'^- Current browser/PWA runtime candidate: .*$',f'- Current browser/PWA runtime candidate: `{source}`','candidate')
          sub1(r'^- Runtime change: .*$', '- Runtime change: Issue #585 toast accessibility remediation on top of the verified Issue #584 focus-management runtime. Ordinary `#toast` feedback is exposed as a polite atomic status live region, and a dedicated controller clears then republishes toast text on a fresh frame so identical validation/confirmation messages can be announced again without moving keyboard focus. The existing Surprise busy live region remains separate, and the visible toast duration remains 2200 ms. The cache generation remains v16.','runtime change')
          sub1(r'^- Deployment status: .*$', '- Deployment status: **PENDING FOR CURRENT RUNTIME DEPLOYMENT**','status')
          sub1(r'^- Runtime merge/deployed SHA: .*$', '- Runtime merge/deployed SHA: **PENDING**','merge sha')
          sub1(r'^- Last verified deployed browser/PWA descendant: .*$', f'- Last verified deployed browser/PWA descendant: `{last}`.','last deployed')
          sub1(r'^- Current runtime deployment evidence: .*$', f'- Current runtime deployment evidence is pending. Issue #585 source candidate `{source}` must not be treated as Deployment PASS or Physical PASS until an exact merged-main descendant is deployed and corresponding live checks succeed.','deployment evidence')
          sub1(r'^- The previous Issue #583 deployment remains historical verified evidence and is not reused as current Issue #584 Physical PASS\.$', '- The immediately prior Issue #584 deployment remains the last verified browser/PWA deployment trace and is not reused as current Issue #585 Deployment PASS or Physical PASS.','prior deployment line')
          sub1(r'^- Current deployment PASS is scoped to the browser/PWA static deployment trace and live source markers only\.$', '- The last verified deployment PASS remains scoped to the prior Issue #584 browser/PWA static deployment trace and live source markers only.','scoped deployment')

          boundary=(
              f'The current browser/PWA runtime candidate `{source}` is **not yet verified deployed**. It adds polite atomic semantics and repeat-announcement handling for ordinary toast validation/confirmation feedback while keeping the Surprise busy live region separate and preserving the existing 2200 ms visual toast duration. '
              f'The last verified deployed browser/PWA descendant remains `{last}` from the Issue #584 focus-management runtime. This pending runtime does not prove VoiceOver/TalkBack/keyboard Physical PASS, another-device PASS, full accessibility conformance, Public Beta completion, Privacy/Legal approval, Payment/Premium readiness, or Commercial GO. It cannot become Deployment PASS until it is merged and an exact descendant Pages deployment with corresponding live checks succeeds; source/CI evidence cannot substitute for required assistive-technology or physical-device acceptance.'
          )
          text,n=re.subn(r'## Evidence boundary\n\n.*?\n\nIssues #592', '## Evidence boundary\n\n'+boundary+'\n\nIssues #592',text,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'evidence boundary: expected one replacement, got {n}')
          text=text.replace('Public Beta remains NOT COMPLETE, and this deployed accessibility runtime does not establish Privacy/Legal approval, Payment/Premium readiness, or Commercial GO.','Public Beta remains NOT COMPLETE, and this pending toast accessibility runtime does not establish Privacy/Legal approval, Payment/Premium readiness, or Commercial GO.',1)
          p.write_text(text)
          PY

          grep -Fq 'Current browser/PWA runtime candidate: `f9b5f137375e9d30d1053d9cad814d636cb88821`' CURRENT-RUNTIME.md
          grep -Fq 'Deployment status: **PENDING FOR CURRENT RUNTIME DEPLOYMENT**' CURRENT-RUNTIME.md
          grep -Fq 'Runtime merge/deployed SHA: **PENDING**' CURRENT-RUNTIME.md
          grep -Fq 'Last verified deployed browser/PWA descendant: `2896748584a1058e9ba1bbc939f49f3b6faf4baf`.' CURRENT-RUNTIME.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-585-runtime-declare-one-shot.yml
          git add CURRENT-RUNTIME.md
          git commit -m 'docs(runtime): declare Issue #585 toast candidate pending deployment'
          git push origin HEAD:fix/a11y-toast-live-region-585-v3
