name: Runtime Lineage Regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runtime-lineage-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current declared candidate is clean
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          test -n "$candidate" || { echo 'Unable to parse runtime candidate'; exit 1; }
          git cat-file -e "$candidate^{commit}"
          git merge-base --is-ancestor "$candidate" HEAD
          changed="$(git diff --name-only "$candidate"..HEAD -- index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml data || true)"
          test -z "$changed" || { echo 'Current branch already has undeclared browser/PWA runtime drift:'; printf '%s\n' "$changed"; exit 1; }

      - name: Verify Beta device matrix declares current runtime trace
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          deployed="$(sed -n 's/^- Runtime merge\/deployed SHA: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          cache="$(sed -n 's/^- PWA cache marker: `\([^`]*\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          test -n "$candidate" || { echo 'Unable to parse runtime candidate'; exit 1; }
          test -n "$deployed" || { echo 'Unable to parse deployed runtime SHA'; exit 1; }
          test -n "$cache" || { echo 'Unable to parse PWA cache marker'; exit 1; }
          grep -Fq "Current browser/PWA runtime candidate: PR #" BETA-DEVICE-MATRIX.md || { echo 'BETA-DEVICE-MATRIX.md is missing the current runtime declaration'; exit 1; }
          grep -Fq "$candidate" BETA-DEVICE-MATRIX.md || { echo "BETA-DEVICE-MATRIX.md does not reference current runtime candidate $candidate"; exit 1; }
          grep -Fq "$deployed" BETA-DEVICE-MATRIX.md || { echo "BETA-DEVICE-MATRIX.md does not reference current deployed runtime SHA $deployed"; exit 1; }
          grep -Fq "$cache" BETA-DEVICE-MATRIX.md || { echo "BETA-DEVICE-MATRIX.md does not reference current PWA cache marker $cache"; exit 1; }

      - name: Verify docs-only descendant does not trip runtime guard
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          original="$(git rev-parse HEAD)"
          git config user.name 'runtime-lineage-regression'
          git config user.email 'runtime-lineage-regression@users.noreply.github.com'
          printf '\n<!-- runtime-lineage-regression docs-only fixture -->\n' >> README.md
          git add README.md
          git commit -m 'docs-only regression fixture' >/dev/null
          changed="$(git diff --name-only "$candidate"..HEAD -- index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml data || true)"
          test -z "$changed" || { echo 'Docs-only change incorrectly appears as browser/PWA runtime drift'; printf '%s\n' "$changed"; exit 1; }
          git reset --hard "$original" >/dev/null

      - name: Verify runtime change is detected
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          original="$(git rev-parse HEAD)"
          git config user.name 'runtime-lineage-regression'
          git config user.email 'runtime-lineage-regression@users.noreply.github.com'
          printf '\n// runtime-lineage-regression fixture\n' >> data/home-surprise.js
          git add data/home-surprise.js
          git commit -m 'runtime regression fixture' >/dev/null
          changed="$(git diff --name-only "$candidate"..HEAD -- index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml data || true)"
          test -n "$changed" || { echo 'Runtime drift was not detected'; exit 1; }
          printf '%s\n' "$changed" | grep -Fxq 'data/home-surprise.js' || { echo 'Expected runtime file missing from drift set'; printf '%s\n' "$changed"; exit 1; }
          git reset --hard "$original" >/dev/null

      - name: Verify member auth runtime change is detected
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          original="$(git rev-parse HEAD)"
          git config user.name 'runtime-lineage-regression'
          git config user.email 'runtime-lineage-regression@users.noreply.github.com'
          printf '\n<!-- member runtime regression fixture -->\n' >> member.html
          git add member.html
          git commit -m 'member runtime regression fixture' >/dev/null
          changed="$(git diff --name-only "$candidate"..HEAD -- index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml data || true)"
          printf '%s\n' "$changed" | grep -Fxq 'member.html' || { echo 'Expected member.html runtime drift was not detected'; printf '%s\n' "$changed"; exit 1; }
          git reset --hard "$original" >/dev/null

      - name: Verify production guards remain wired
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Validate declared browser runtime candidate lineage' .github/workflows/release-consistency.yml
          grep -Fq 'Block deploy when declared browser runtime candidate is stale' .github/workflows/pages.yml
          grep -Fq 'CURRENT-RUNTIME.md' .github/workflows/release-consistency.yml
          grep -Fq 'CURRENT-RUNTIME.md' .github/workflows/pages.yml
          grep -Fq 'member.html reset-password.html' .github/workflows/release-consistency.yml
          grep -Fq 'member.html reset-password.html' .github/workflows/pages.yml
          grep -Fq 'git diff --name-only "$candidate"..HEAD' .github/workflows/release-consistency.yml
          grep -Fq 'git diff --name-only "$candidate"..HEAD' .github/workflows/pages.yml
