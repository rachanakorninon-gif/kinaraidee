name: Group API v6 Official Run Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/group-api-v6-official-run-diagnostic.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect-official-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List recent official Group API live probe runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/group-api-live-observability-probe.yml/runs?branch=main&per_page=5" \
            | jq -c '.workflow_runs[] | {id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url}'

      - name: Evidence boundary
        run: |
          echo 'Read-only workflow-run metadata diagnostic.'
          echo 'This PR is intended to be closed without merge after the official post-PR95 run is traced.'
