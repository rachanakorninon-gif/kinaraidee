name: Issue 645 source one shot

on:
  push:
    branches: ['fix/645-android-spa-history']
    paths:
      - '.github/workflows/issue-645-source-one-shot.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/645-android-spa-history
          fetch-depth: 0
      - name: Wire SPA history and offline shell
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('data/home-surprise.js')
          s=p.read_text(encoding='utf-8')
          anchor='  function ensurePwaInstallHelper(){'
          helper='''  function ensureSpaNavigation(){\n    if(document.querySelector('script[src="data/spa-navigation.js"]'))return;\n    const s=document.createElement('script');\n    s.src='data/spa-navigation.js';\n    s.async=false;\n    document.body.appendChild(s);\n  }\n'''
          if 'function ensureSpaNavigation(){' not in s:
            if anchor not in s: raise SystemExit('home-surprise navigation anchor missing')
            s=s.replace(anchor,helper+anchor,1)
          if '    ensureSpaNavigation();\n' not in s:
            old='    installResultMenuFocusTarget();\n    ensureAcquisition();\n'
            if old not in s: raise SystemExit('home-surprise install anchor missing')
            s=s.replace(old,'    installResultMenuFocusTarget();\n    ensureSpaNavigation();\n    ensureAcquisition();\n',1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          if "'./data/spa-navigation.js'" not in s:
            old="  './data/home-surprise.js','./data/history-ui.js','./data/toast-accessibility.js'\n"
            new="  './data/home-surprise.js','./data/history-ui.js','./data/toast-accessibility.js','./data/spa-navigation.js'\n"
            if old not in s: raise SystemExit('service-worker current v16 shell anchor missing')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check data/home-surprise.js
          node --check data/spa-navigation.js
          grep -Fq "s.src='data/spa-navigation.js'" data/home-surprise.js
          grep -Fq "'./data/spa-navigation.js'" sw.js
          grep -Fq "const CACHE='kinaraidee-beta-v16';" sw.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/home-surprise.js data/spa-navigation.js sw.js
          git commit -m 'fix(pwa): wire Android Back to SPA history'
          candidate="$(git rev-parse HEAD)"
          export candidate
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('CURRENT-RUNTIME.md')
          s=p.read_text(encoding='utf-8')
          candidate=os.environ['candidate']
          s=re.sub(r'- Current browser/PWA runtime candidate: `[0-9a-f]{40}`',f'- Current browser/PWA runtime candidate: `{candidate}`',s,count=1)
          change=('- Runtime change: Issue #645 Android installed-PWA Back navigation remediation. A dedicated `data/spa-navigation.js` '
                  'adds History API entries for non-transient SPA screens, keeps `loading` out of browser history, replays `popstate` through '
                  'the existing final `show()` renderer without re-pushing, and uses `history.back()` when an explicit in-app Back target matches '
                  'the recorded prior screen. This preserves existing #584 focus and #635 current-nav wrappers, does not trap the base Home entry, '
                  'and adds the navigation controller to the v16 Service Worker app shell without changing the cache namespace.')
          s=re.sub(r'- Runtime change:.*',change,s,count=1)
          s=re.sub(r'- Current runtime deployment evidence.*',
                   f'- Current runtime deployment evidence is pending for Issue #645 candidate `{candidate}`. The last verified deployed browser/PWA trace remains Issue #635 through `ff975076a643d123081da8ab3e3baf399fdc5f6d`; Issue #644 is stacked immediately below this candidate and is not yet deployment evidence.',s,count=1)
          s=re.sub(r'The current browser/PWA runtime candidate `[0-9a-f]{40}` is \*\*PENDING FOR CURRENT RUNTIME DEPLOYMENT\*\*\.',
                   f'The current browser/PWA runtime candidate `{candidate}` is **PENDING FOR CURRENT RUNTIME DEPLOYMENT**.',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq "Current browser/PWA runtime candidate: \`$candidate\`" CURRENT-RUNTIME.md
          grep -Fq 'Current runtime deployment evidence is pending' CURRENT-RUNTIME.md
          git add CURRENT-RUNTIME.md
          git commit -m 'docs(runtime): declare Issue 645 SPA-history candidate'
          git push origin HEAD:fix/645-android-spa-history
