                    f'- Current runtime deployment evidence: Issue #585 offline-shell source candidate `{candidate}` merged through PR #627 as `{deployed}`; GitHub Pages run `{pages}`, Toast Accessibility Live Smoke run `{toast}`, Kinaraidee Live Smoke run `{live}`, Auth Password Security Live Smoke run `{auth}`, Campaign 3000 Premium Live Smoke run `{campaign}`, and Premium Research Preview Live Smoke run `{premium}` completed successfully on the exact merged/deployed SHA. The Service Worker shell includes `data/toast-accessibility.js` and the cache generation remains `kinaraidee-beta-v16`. This deployment trace does not establish screen-reader Physical PASS.',
