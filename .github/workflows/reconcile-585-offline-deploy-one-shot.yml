          # TOAST-ACCESSIBILITY-DEPLOYMENT-EVIDENCE.md
          p=Path('TOAST-ACCESSIBILITY-DEPLOYMENT-EVIDENCE.md')
          p.write_text(f'''# Toast Accessibility — Deployment Evidence

## Scope

