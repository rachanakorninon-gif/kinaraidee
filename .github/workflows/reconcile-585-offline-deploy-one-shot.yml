name: Issue 585 offline deployment reconciliation one-shot

on:
  push:
    branches: ["docs/reconcile-585-offline-deploy-20260912"]
    paths:
      - '.github/workflows/reconcile-585-offline-deploy-one-shot.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'chore: prepare Issue #585 offline deployment reconciliation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
