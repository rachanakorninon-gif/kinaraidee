          grep -Fq 'Current merged/deployed main SHA: `af329c471c0335fd6e0812a8d5f75066ffb335cd`' TOAST-ACCESSIBILITY-DEPLOYMENT-EVIDENCE.md

          rm .github/workflows/reconcile-585-offline-deploy-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
