          ref: docs/reconcile-585-offline-deploy-20260912
          fetch-depth: 0

      - name: Reconcile exact offline-shell deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          candidate='0b6352af081f51ad9df2343022d0683b109d93a4'
          deployed='af329c471c0335fd6e0812a8d5f75066ffb335cd'
          pages='34676035335'
          toast='34676056553'
          live='34676056521'
          auth='34676056466'
          campaign='34676056536'
          premium='34676056518'

          def sub1(text, pattern, repl, label, flags=re.M):
              out,n=re.subn(pattern,repl,text,count=1,flags=flags)
              if n!=1:
                  raise SystemExit(f'{label}: expected exactly one target, got {n}')
              return out

          def replace1(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected exactly one literal target, got {n}')
              return text.replace(old,new,1)

          # CURRENT-RUNTIME.md
          p=Path('CURRENT-RUNTIME.md'); text=p.read_text()
