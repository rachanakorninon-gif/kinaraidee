name: Group Monitoring Decision Regression

on:
  pull_request:
    paths:
      - 'GROUP-MONITORING-DECISION.md'
      - 'GROUP-API-HARDENING-PLAN.md'
      - '.github/workflows/group-api-live-observability-probe.yml'
      - '.github/workflows/group-api-regression.yml'
      - '.github/workflows/group-monitoring-decision-regression.yml'
  push:
    branches: [main]
    paths:
      - 'GROUP-MONITORING-DECISION.md'
      - 'GROUP-API-HARDENING-PLAN.md'
      - '.github/workflows/group-api-live-observability-probe.yml'
      - '.github/workflows/group-api-regression.yml'
      - '.github/workflows/group-monitoring-decision-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Group monitoring decision boundary
        shell: bash
        run: |
          set -euo pipefail
          file='GROUP-MONITORING-DECISION.md'
          plan='GROUP-API-HARDENING-PLAN.md'
          probe='.github/workflows/group-api-live-observability-probe.yml'
          test -s "$file"
          test -s "$plan"
          test -s "$probe"

          grep -q 'Status: \*\*NOT APPROVED\*\*\|Status: \*\*APPROVED\*\*' "$file"
          grep -Fq 'Monitoring owner:' "$file"
          grep -Fq 'Primary alert channel:' "$file"
          grep -Fq 'Backup/escalation contact:' "$file"
          grep -Fq 'Support/on-call path:' "$file"
          grep -Fq 'Probe failure threshold:' "$file"
          grep -Fq 'Escalation threshold/window:' "$file"
          grep -Fq 'Expected response target:' "$file"
          grep -Fq 'Monitoring review cadence:' "$file"
          grep -Fq 'Commercial GO' "$file"

          if grep -q 'Status: \*\*NOT APPROVED\*\*' "$file"; then
            required_unset=(
              'Monitoring owner: **UNSET**'
              'Primary alert channel: **UNSET**'
              'Backup/escalation contact: **UNSET**'
              'Support/on-call path: **UNSET**'
              'Probe failure threshold: **UNSET**'
              'Escalation threshold/window: **UNSET**'
              'Expected response target: **UNSET**'
              'Monitoring review cadence: **UNSET**'
              'Operations/Commercial approver: **UNSET**'
              'Approved at: **UNSET**'
            )
            for marker in "${required_unset[@]}"; do
              grep -Fq -- "$marker" "$file" || { echo "NOT APPROVED Group monitoring decision contains inferred/fabricated value: $marker"; exit 1; }
            done
          fi

          if grep -q 'Status: \*\*APPROVED\*\*' "$file"; then
            if grep -q '\*\*UNSET\*\*' "$file"; then
              echo 'APPROVED Group monitoring decision still contains UNSET fields.'
              exit 1
            fi
            approved_at="$(sed -n 's/^- Approved at: \*\*\(.*\)\*\*$/\1/p' "$file")"
            APPROVED_AT="$approved_at" node <<'NODE'
          const value = process.env.APPROVED_AT || '';
          const parsed = Date.parse(value);
          if (!value || Number.isNaN(parsed)) {
            console.error('APPROVED Group monitoring decision must contain a valid ISO-8601 Approved at timestamp.');
            process.exit(1);
          }
          if (parsed > Date.now() + 5 * 60 * 1000) {
            console.error('APPROVED Group monitoring decision has a future Approved at timestamp.');
            process.exit(1);
          }
          NODE
            grep -Fq 'must be a real ISO-8601 date-time' "$file"
            grep -Fq 'This approval timestamp records the decision only; it is not execution evidence.' "$file"
            grep -Fq 'After approval, monitoring still requires separate execution evidence' "$file"
          fi

          grep -Fq 'APPLICATION EVENT INGESTION + BASELINE NOT VERIFIED' "$plan"
          grep -Fq 'ระบุ owner, alert channel และ escalation/support path ที่ใช้งานจริง' "$plan"

      - name: Preserve implemented alert mechanism without promoting it to monitoring PASS
        shell: bash
        run: |
          set -euo pipefail
          probe='.github/workflows/group-api-live-observability-probe.yml'
          file='GROUP-MONITORING-DECISION.md'
          grep -Fq 'Group API live probe failure' "$probe"
          grep -Fq 'Group API alert delivery self-test' "$probe"
          grep -Fq 'alert_self_test' "$probe"
          grep -Fq 'controlled alert-delivery test' "$file"
          grep -Fq 'does not prove application structured-event ingestion' "$file"
          grep -Fq 'does not prove alert delivery' "$file"
          echo 'Group monitoring decision and alert-evidence boundaries are intact.'
