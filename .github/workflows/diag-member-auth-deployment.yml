name: Diagnostic Member Auth Deployment Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect merged-main deployment and live site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: b6300e5458f17195c72a72ffa7ed0000fee40e24
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100"
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          pages_id=''; smoke_id=''; pages_conclusion=''; smoke_conclusion=''; live_sha=''
          for i in $(seq 1 24); do
            runs="$(curl --fail --silent --show-error --location -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            readarray -t vals < <(RUNS="$runs" node <<'NODE'
          const r=JSON.parse(process.env.RUNS||'{}').workflow_runs||[];
          for(const name of ['Deploy Kinaraidee to GitHub Pages','Kinaraidee Live Smoke Test']){
            const x=r.find(v=>v.name===name);
            console.log(x ? `${x.id}|${x.status}|${x.conclusion||''}|${x.event}|${x.head_sha}` : '||||');
          }
          NODE
            )
            IFS='|' read -r pages_id pages_status pages_conclusion pages_event pages_sha <<<"${vals[0]:-||||}"
            IFS='|' read -r smoke_id smoke_status smoke_conclusion smoke_event smoke_sha <<<"${vals[1]:-||||}"
            meta="$(curl --silent --show-error --location --max-time 20 "$base/release-meta.json" || true)"
            live_sha="$(META="$meta" node -e "try{const m=JSON.parse(process.env.META||'{}');process.stdout.write(String(m.sha||''))}catch{}")"
            echo "poll=$i pages=$pages_id/$pages_status/$pages_conclusion smoke=$smoke_id/$smoke_status/$smoke_conclusion live=$live_sha"
            if [ "$pages_conclusion" = 'success' ] && [ "$smoke_conclusion" = 'success' ] && [ "$live_sha" = "$TARGET_SHA" ]; then break; fi
            sleep 10
          done
          test -n "$pages_id" && test "$pages_conclusion" = 'success' || { echo 'Exact Pages success not found'; exit 1; }
          test "$pages_sha" = "$TARGET_SHA" || { echo 'Pages SHA mismatch'; exit 1; }
          test -n "$smoke_id" && test "$smoke_conclusion" = 'success' || { echo 'Exact Live Smoke success not found'; exit 1; }
          test "$smoke_sha" = "$TARGET_SHA" || { echo 'Live Smoke SHA mismatch'; exit 1; }
          test "$live_sha" = "$TARGET_SHA" || { echo 'Public release-meta SHA mismatch'; exit 1; }

          member="$(curl --fail --silent --show-error --location "$base/member.html")"
          reset="$(curl --fail --silent --show-error --location "$base/reset-password.html")"
          grep -Fq 'minlength="8"' <<<"$member"
          grep -Fq 'p.length<8' <<<"$member"
          grep -Fq 'minlength="8"' <<<"$reset"
          grep -Fq 'p.length<8' <<<"$reset"
          grep -Fq "location.href='member.html'" <<<"$reset"
          if grep -q 'error\.message' <<<"$member$reset"; then echo 'Raw backend error exposed'; exit 1; fi
          if grep -q "location.href='admin.html'" <<<"$reset"; then echo 'Reset redirects to admin'; exit 1; fi
          admin_code="$(curl --silent --location --output /dev/null --write-out '%{http_code}' "$base/admin.html")"
          test "$admin_code" != '200' || { echo 'Private admin page is public'; exit 1; }
          echo "EVIDENCE Pages run=$pages_id Live Smoke run=$smoke_id SHA=$TARGET_SHA public_release_meta=$live_sha admin_http=$admin_code"
