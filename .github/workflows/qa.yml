name: Kinaraidee Beta QA

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required public files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html 404.html privacy.html feedback.html partner.html
            manifest.webmanifest icon.svg sw.js robots.txt sitemap.xml
            data/foods-expanded.js data/choice-rules.js
            data/nearby-restaurants.js data/group-mode.js
            data/group-sync.js data/group-remote.js data/member-sync.js
            data/pwa-install.js data/home-surprise.js CURRENT-RUNTIME.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Validate web manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"

      - name: Verify PWA manifest and local app-shell contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          const fail=(message)=>{throw new Error(message)};
          const assert=(condition,message)=>{if(!condition)fail(message)};

          assert(typeof manifest.name==='string'&&manifest.name.trim(),'manifest.name must be non-empty');
          assert(typeof manifest.short_name==='string'&&manifest.short_name.trim(),'manifest.short_name must be non-empty');
          assert(manifest.lang==='th','manifest.lang must remain th');
          assert(manifest.start_url==='./','manifest.start_url must remain ./');
          assert(manifest.scope==='./','manifest.scope must remain ./');
          assert(manifest.display==='standalone','manifest.display must remain standalone');
          assert(/^#[0-9a-f]{6}$/i.test(manifest.background_color||''),'manifest.background_color must be a 6-digit hex color');
          assert(/^#[0-9a-f]{6}$/i.test(manifest.theme_color||''),'manifest.theme_color must be a 6-digit hex color');
          assert(Array.isArray(manifest.icons)&&manifest.icons.length>0,'manifest.icons must contain at least one icon');

          const localIcons=[];
          for(const [index,icon] of manifest.icons.entries()){
            assert(icon&&typeof icon.src==='string'&&icon.src.trim(),`manifest icon ${index} needs src`);
            assert(!/^(?:https?:|data:)/i.test(icon.src),`manifest icon ${index} must be a local asset`);
            const local=icon.src.replace(/^\.\//,'');
            assert(local&&!local.startsWith('../')&&!path.isAbsolute(local),`manifest icon ${index} escapes app scope`);
            assert(fs.existsSync(local)&&fs.statSync(local).isFile(),`manifest icon missing: ${local}`);
            localIcons.push('./'+local);
            const purposes=new Set(String(icon.purpose||'').trim().split(/\s+/).filter(Boolean));
            assert(purposes.has('any'),`manifest icon ${index} must support purpose any`);
            assert(purposes.has('maskable'),`manifest icon ${index} must support purpose maskable`);
          }

          const indexHtml=fs.readFileSync('index.html','utf8');
          const linkTags=indexHtml.match(/<link\b[^>]*>/gi)||[];
          const manifestLink=linkTags.find(tag=>/\brel=["']manifest["']/i.test(tag));
          assert(manifestLink&&/\bhref=["'](?:\.\/)?manifest\.webmanifest["']/i.test(manifestLink),'index.html must link manifest.webmanifest as rel=manifest');

          const sw=fs.readFileSync('sw.js','utf8');
          const shellMatch=sw.match(/const SHELL=\[([\s\S]*?)\];/);
          assert(shellMatch,'sw.js must declare a static SHELL array');
          const shell=[...shellMatch[1].matchAll(/['"]([^'"]+)['"]/g)].map(match=>match[1]);
          assert(shell.includes('./manifest.webmanifest'),'Service Worker shell must include manifest.webmanifest');
          for(const icon of localIcons){
            assert(shell.includes(icon),`Service Worker shell must include manifest icon: ${icon}`);
          }
          for(const entry of shell){
            if(entry==='./')continue;
            assert(entry.startsWith('./'),`Service Worker shell entry must stay app-relative: ${entry}`);
            const local=entry.slice(2);
            assert(local&&!local.startsWith('../')&&!path.isAbsolute(local),`Service Worker shell entry escapes app scope: ${entry}`);
            assert(fs.existsSync(local)&&fs.statSync(local).isFile(),`Service Worker shell asset missing: ${entry}`);
          }

          console.log(`PWA manifest/app-shell contract PASS: ${manifest.icons.length} manifest icon(s), ${shell.length} shell entries`);
          NODE

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          for file in data/*.js; do
            node --check "$file"
          done

      - name: Verify key beta links and modules
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'feedback.html' index.html
          grep -q 'privacy.html' index.html
          grep -q 'partner.html' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'data/nearby-restaurants.js' index.html
          grep -q 'data/home-surprise.js' index.html
          grep -q 'serviceWorker' index.html
          grep -q 'data/group-mode.js' data/nearby-restaurants.js
          grep -q 'data/pwa-install.js' data/nearby-restaurants.js

      - name: Verify partner card rendering is text-safe
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'box.replaceChildren()' data/nearby-restaurants.js
          grep -q "name.textContent=String(r.name" data/nearby-restaurants.js
          grep -q "detail.textContent=String(r.address" data/nearby-restaurants.js
          if grep -q 'c.innerHTML=.*r.name' data/nearby-restaurants.js; then
            echo 'Partner name is rendered through innerHTML'
            exit 1
          fi

      - name: Verify surprise busy state and recovery wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q "id='homeSurpriseBtn'\|id=\"homeSurpriseBtn\"\|homeSurpriseBtn" data/home-surprise.js
          grep -q "aria-busy" data/home-surprise.js
          grep -q "กำลังเลือกให้" data/home-surprise.js
          grep -q "if(busy)return" data/home-surprise.js
          grep -q "pageshow" data/home-surprise.js
          grep -q "online" data/home-surprise.js
          grep -q "setBusy(false)" data/home-surprise.js

      - name: Verify feedback error hygiene
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Feedback submission failed" feedback.html
          grep -q "ส่งความคิดเห็นไม่สำเร็จ กรุณาลองใหม่อีกครั้ง" feedback.html
          if grep -Fq "setMsg('ส่งไม่สำเร็จ: '+error.message)" feedback.html; then
            echo 'Raw backend error is exposed to feedback users'
            exit 1
          fi

      - name: Verify public form accessibility and privacy acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'role="radiogroup"' feedback.html
          grep -q 'aria-checked="false"' feedback.html
          grep -q 'aria-pressed="true"' feedback.html
          grep -q 'aria-live="polite"' feedback.html
          grep -q 'for="message"' feedback.html
          grep -q 'for="restaurantName"' partner.html
          grep -q 'for="contactName"' partner.html
          grep -q 'for="phone"' partner.html
          grep -q 'for="email"' partner.html
          grep -q 'autocomplete="organization"' partner.html
          grep -q 'autocomplete="tel"' partner.html
          grep -q 'autocomplete="email"' partner.html
          grep -q 'aria-live="polite"' partner.html
          grep -q "setAttribute('aria-busy','true')" feedback.html
          grep -q "setAttribute('aria-busy','true')" partner.html
          grep -q "PRIVACY_NOTICE_VERSION='2026-08-21'" partner.html
          grep -q 'privacy_notice_version:PRIVACY_NOTICE_VERSION' partner.html
          grep -q 'privacy_acknowledged_at:new Date().toISOString()' partner.html

      - name: Verify privacy notice matches beta data flows
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ข้อมูลเบราว์เซอร์" privacy.html
          grep -q "รหัส session" privacy.html
          grep -q "3 ตำแหน่งทศนิยม" privacy.html
          grep -q "Supabase" privacy.html
          grep -q "ระยะเวลาการเก็บและการลบข้อมูล" privacy.html
          grep -q "คำขอเกี่ยวกับข้อมูล" privacy.html

      - name: Verify PWA shell and current update strategy
        shell: bash
        run: |
          set -euo pipefail
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test -n "$marker" || { echo 'Unable to derive PWA marker'; exit 1; }
          grep -Fq "PWA cache marker: \`$marker\`" CURRENT-RUNTIME.md
          grep -q "cache.addAll(SHELL)" sw.js
          shell_paths=(
            "'./'"
            "'./index.html'"
            "'./404.html'"
            "'./manifest.webmanifest'"
            "'./icon.svg'"
            "'./feedback.html'"
            "'./privacy.html'"
            "'./partner.html'"
            "'./robots.txt'"
            "'./sitemap.xml'"
            "'./data/foods-expanded.js'"
            "'./data/choice-rules.js'"
            "'./data/group-mode.js'"
            "'./data/group-sync.js'"
            "'./data/group-remote.js'"
            "'./data/member-sync.js'"
            "'./data/nearby-restaurants.js'"
            "'./data/pwa-install.js'"
            "'./data/home-surprise.js'"
          )
          for path in "${shell_paths[@]}"; do
            grep -Fq "$path" sw.js || { echo "Missing PWA shell entry: $path"; exit 1; }
          done
          if grep -q "Promise.allSettled" sw.js; then echo 'Non-atomic shell install detected'; exit 1; fi

      - name: Prevent PWA release marker drift
        shell: bash
        run: |
          set -euo pipefail
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test -n "$marker" || { echo 'Unable to derive release marker from sw.js'; exit 1; }
          declared="$(sed -n 's/^- PWA cache marker: `\(kinaraidee-beta-v[0-9][0-9]*\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          test "$declared" = "$marker" || { echo "PWA release marker drift: CURRENT-RUNTIME.md=$declared sw.js=$marker"; exit 1; }
          echo "Canonical PWA release marker: $marker"

      - name: Verify recovery and SEO files
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'kinaraidee' 404.html
          grep -q 'sitemap.xml' robots.txt
          grep -q '<urlset' sitemap.xml
          grep -q 'privacy.html' sitemap.xml
          grep -q 'feedback.html' sitemap.xml
          grep -q 'partner.html' sitemap.xml
          grep -q "'./404.html'" sw.js
          grep -q "'./robots.txt'" sw.js
          grep -q "'./sitemap.xml'" sw.js

      - name: Prevent secrets in public repository and workflows
        shell: bash
        run: |
          set -euo pipefail
          pattern='(service_''role|sb_''secret_|SUPABASE_''SERVICE_ROLE|PRIVATE_''KEY-----)'
          matches="$(grep -RInE --exclude-dir=.git --exclude='*.md' "$pattern" . || true)"
          safe_env='Deno\.env\.get\(['"'"'\"]SUPABASE_''SERVICE_ROLE_KEY['"'"'\"]\)'
          unsafe="$(printf '%s\n' "$matches" | grep -vE "$safe_env" || true)"
          if [ -n "$unsafe" ]; then
            printf '%s\n' "$unsafe"
            echo 'Potential secret found in public repository or workflow configuration'
            exit 1
          fi
          echo 'No known private-key patterns found'
