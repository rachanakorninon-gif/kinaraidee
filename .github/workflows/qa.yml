name: Kinaraidee Beta QA

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required public files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html 404.html privacy.html feedback.html partner.html
            manifest.webmanifest icon.svg sw.js robots.txt sitemap.xml
            data/foods-expanded.js data/choice-rules.js
            data/nearby-restaurants.js data/group-mode.js
            data/group-sync.js data/group-remote.js data/member-sync.js
            data/pwa-install.js data/home-surprise.js
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Validate web manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          for file in data/*.js; do
            node --check "$file"
          done

      - name: Verify key beta links and modules
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'feedback.html' index.html
          grep -q 'privacy.html' index.html
          grep -q 'partner.html' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'data/nearby-restaurants.js' index.html
          grep -q 'data/home-surprise.js' index.html
          grep -q 'serviceWorker' index.html
          grep -q 'data/group-mode.js' data/nearby-restaurants.js
          grep -q 'data/pwa-install.js' data/nearby-restaurants.js

      - name: Verify surprise busy state and recovery wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q "id='homeSurpriseBtn'\|id=\"homeSurpriseBtn\"\|homeSurpriseBtn" data/home-surprise.js
          grep -q "aria-busy" data/home-surprise.js
          grep -q "กำลังเลือกให้" data/home-surprise.js
          grep -q "if(busy)return" data/home-surprise.js
          grep -q "pageshow" data/home-surprise.js
          grep -q "online" data/home-surprise.js
          grep -q "setBusy(false)" data/home-surprise.js

      - name: Verify feedback error hygiene
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Feedback submission failed" feedback.html
          grep -q "ส่งความคิดเห็นไม่สำเร็จ กรุณาลองใหม่อีกครั้ง" feedback.html
          if grep -Fq "setMsg('ส่งไม่สำเร็จ: '+error.message)" feedback.html; then
            echo 'Raw backend error is exposed to feedback users'
            exit 1
          fi

      - name: Verify public form accessibility
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'role="radiogroup"' feedback.html
          grep -q 'aria-checked="false"' feedback.html
          grep -q 'aria-pressed="true"' feedback.html
          grep -q 'aria-live="polite"' feedback.html
          grep -q 'for="message"' feedback.html
          grep -q 'for="restaurantName"' partner.html
          grep -q 'for="contactName"' partner.html
          grep -q 'for="phone"' partner.html
          grep -q 'for="email"' partner.html
          grep -q 'autocomplete="organization"' partner.html
          grep -q 'autocomplete="tel"' partner.html
          grep -q 'autocomplete="email"' partner.html
          grep -q 'aria-live="polite"' partner.html
          grep -q "setAttribute('aria-busy','true')" feedback.html
          grep -q "setAttribute('aria-busy','true')" partner.html

      - name: Verify privacy notice matches beta data flows
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ข้อมูลเบราว์เซอร์" privacy.html
          grep -q "รหัส session" privacy.html
          grep -q "3 ตำแหน่งทศนิยม" privacy.html
          grep -q "Supabase" privacy.html
          grep -q "ระยะเวลาการเก็บและการลบข้อมูล" privacy.html
          grep -q "คำขอเกี่ยวกับข้อมูล" privacy.html

      - name: Verify PWA shell and v12 update strategy
        shell: bash
        run: |
          set -euo pipefail
          grep -q "kinaraidee-beta-v12" sw.js
          grep -q "cache.addAll(SHELL)" sw.js
          shell_paths=(
            "'./'"
            "'./index.html'"
            "'./404.html'"
            "'./manifest.webmanifest'"
            "'./icon.svg'"
            "'./feedback.html'"
            "'./privacy.html'"
            "'./partner.html'"
            "'./robots.txt'"
            "'./sitemap.xml'"
            "'./data/foods-expanded.js'"
            "'./data/choice-rules.js'"
            "'./data/group-mode.js'"
            "'./data/group-sync.js'"
            "'./data/group-remote.js'"
            "'./data/member-sync.js'"
            "'./data/nearby-restaurants.js'"
            "'./data/pwa-install.js'"
            "'./data/home-surprise.js'"
          )
          for path in "${shell_paths[@]}"; do
            grep -Fq "$path" sw.js || { echo "Missing PWA shell entry: $path"; exit 1; }
          done
          if grep -q "Promise.allSettled" sw.js; then echo 'Non-atomic shell install detected'; exit 1; fi

      - name: Prevent PWA release marker drift
        shell: bash
        run: |
          set -euo pipefail
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test -n "$marker" || { echo 'Unable to derive release marker from sw.js'; exit 1; }
          test "$(printf '%s\n' "$marker" | wc -l)" -eq 1
          echo "Canonical PWA release marker: $marker"
          tracked=(
            '.github/workflows/qa.yml'
            '.github/workflows/beta-check.yml'
            '.github/workflows/pages.yml'
            '.github/workflows/live-smoke.yml'
            'README.md'
          )
          for file in "${tracked[@]}"; do
            grep -Fq "$marker" "$file" || {
              echo "PWA release marker drift: $file does not reference $marker"
              exit 1
            }
          done

      - name: Verify recovery and SEO files
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'kinaraidee' 404.html
          grep -q 'sitemap.xml' robots.txt
          grep -q '<urlset' sitemap.xml
          grep -q 'privacy.html' sitemap.xml
          grep -q 'feedback.html' sitemap.xml
          grep -q 'partner.html' sitemap.xml
          grep -q "'./404.html'" sw.js
          grep -q "'./robots.txt'" sw.js
          grep -q "'./sitemap.xml'" sw.js

      - name: Prevent secrets in public repository
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.yml' '(service[_]role|sb[_]secret_|SUPABASE[_]SERVICE[_]ROLE|PRIVATE[_]KEY-----)' .; then
            echo 'Potential secret found in public repository'
            exit 1
          fi
          echo 'No known private-key patterns found'
