name: Member Referral API Boundary Regression

on:
  pull_request:
    paths:
      - 'supabase/functions/member-referral-api/**'
      - 'member.html'
      - 'supabase/referral-acquisition-v1.sql'
      - '.github/workflows/member-referral-api-regression.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/member-referral-api/**'
      - 'member.html'
      - 'supabase/referral-acquisition-v1.sql'
      - '.github/workflows/member-referral-api-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  referral-summary-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve least-privilege referral summary contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const api=fs.readFileSync('supabase/functions/member-referral-api/index.ts','utf8');
          const member=fs.readFileSync('member.html','utf8');
          const sql=fs.readFileSync('supabase/referral-acquisition-v1.sql','utf8');

          must(api.includes('@supabase/supabase-js@2.112.2'),'Supabase client version must stay pinned');
          must(api.includes("const allowedOrigin='https://rachanakorninon-gif.github.io'"),'Member referral API must restrict browser origin');
          must(!api.includes("'Access-Control-Allow-Origin':'*'"),'Member referral API must not use wildcard CORS');
          must(api.includes("'Access-Control-Allow-Headers':'authorization, x-client-info, apikey, content-type'"),'Authorization CORS header contract missing');
          must(api.includes("const token=auth.startsWith('Bearer ')?auth.slice(7):''"),'Bearer token extraction missing');
          must(api.includes('sb.auth.getUser(token)'),'API must verify the caller through Supabase Auth');
          must(api.includes("Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')"),'Raw referral access must remain server-side');
          must(api.includes(".select('code')"),'API may read only the caller referral code from the code table');
          must(api.includes(".eq('user_id',user.id)"),'Referral code lookup must scope to the verified user');
          must((api.match(/\.eq\('referrer_user_id',user\.id\)/g)||[]).length===2,'Referral aggregate queries must scope to the verified user');
          must((api.match(/\.select\('status',\{count:'exact',head:true\}\)/g)||[]).length===2,'Referral counts must use head-only aggregate queries');
          must(api.includes(".eq('status','confirmed')"),'Confirmed referral count must remain status-scoped');
          must(!api.includes('console.'),'Referral API must not log token/body/user data');
          must(!api.includes('user_metadata'),'Referral API authorization must not use user metadata');
          must(!api.includes('email'),'Referral summary server boundary must not query or emit email');
          must(!api.includes(".select('referred_user_id"),'Referral summary must not project referred user identifiers');
          must(!api.includes(".select('referrer_user_id"),'Referral summary must not project referrer identifiers');
          must(/return json\(\{\s*referral_code:String\(codeResult\.data\.code\),\s*total_referrals:Number\(totalResult\.count\)\|\|0,\s*confirmed_referrals:Number\(confirmedResult\.count\)\|\|0\s*\}\)/s.test(api),'Response must contain only referral code and aggregate counts');

          for(const table of ['member_referral_codes','member_referrals']){
            must(sql.includes(`revoke all on public.${table} from anon, authenticated`),`${table} raw rows must stay unavailable to browser roles`);
          }
          must(sql.includes("where rc.user_id=(select auth.uid())"),'Fallback RPC must remain caller-scoped until physical cutover acceptance');
          must(sql.includes('grant execute on function public.get_my_referral_summary() to authenticated'),'Fallback RPC must remain available until physical cutover acceptance');

          const edge="sb.functions.invoke('member-referral-api',{body:{}})";
          const fallback="sb.rpc('get_my_referral_summary')";
          must(member.includes(edge),'Member page must call authenticated Edge Function first');
          must(member.includes(fallback),'Member page must retain caller-scoped RPC fallback until physical acceptance');
          must(member.indexOf(edge)<member.indexOf(fallback),'Edge Function must be attempted before RPC fallback');
          must(member.includes("source='edge'"),'Member referral path must default trace source to edge');
          must(member.includes("source='fallback'"),'Member referral path must trace fallback without exposing errors');
          must(member.includes("has('qa_referral_trace')"),'QA trace switch must remain explicit and opt-in');
          must(member.includes("'Referral API: '+source.toUpperCase()"),'QA trace must expose only the source label');
          must(!member.includes('SUPABASE_SERVICE_ROLE_KEY'),'Browser must never receive service-role credentials');
          must(!member.includes('access_token'),'Browser cutover must not manually render or expose access tokens');
          NODE

      - name: Record staged evidence boundary
        shell: bash
        run: |
          {
            echo '## Member referral API cutover boundary'
            echo
            echo '- Browser attempts the authenticated Edge Function first and keeps the existing caller-scoped RPC only as a temporary fallback.'
            echo '- Caller identity remains server-verified; service-role table access stays server-side and raw referral rows stay unavailable to browser roles.'
            echo '- Optional QA trace exposes only EDGE/FALLBACK/UNAVAILABLE source state, never token/account/user payload.'
            echo '- RPC fallback must not be revoked until the changed signed-in referral interaction is physically accepted.'
            echo '- CI/deployment does not create real-device referral interaction acceptance or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
