name: Member Referral API Boundary Regression

on:
  pull_request:
    paths:
      - 'supabase/functions/member-referral-api/**'
      - 'member.html'
      - 'supabase/referral-acquisition-v1.sql'
      - 'supabase/referral-summary-edge-cutover-20260904.sql'
      - 'REFERRAL-SUMMARY-PHYSICAL-EVIDENCE.md'
      - '.github/workflows/member-referral-api-regression.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/member-referral-api/**'
      - 'member.html'
      - 'supabase/referral-acquisition-v1.sql'
      - 'supabase/referral-summary-edge-cutover-20260904.sql'
      - 'REFERRAL-SUMMARY-PHYSICAL-EVIDENCE.md'
      - '.github/workflows/member-referral-api-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  referral-summary-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preserve least-privilege referral summary contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const api=fs.readFileSync('supabase/functions/member-referral-api/index.ts','utf8');
          const member=fs.readFileSync('member.html','utf8');
          const legacySql=fs.readFileSync('supabase/referral-acquisition-v1.sql','utf8');
          const cutoverSql=fs.readFileSync('supabase/referral-summary-edge-cutover-20260904.sql','utf8');
          const physical=fs.readFileSync('REFERRAL-SUMMARY-PHYSICAL-EVIDENCE.md','utf8');

          must(api.includes('@supabase/supabase-js@2.112.2'),'Supabase client version must stay pinned');
          must(api.includes("const allowedOrigin='https://rachanakorninon-gif.github.io'"),'Member referral API must restrict browser origin');
          must(!api.includes("'Access-Control-Allow-Origin':'*'"),'Member referral API must not use wildcard CORS');
          must(api.includes("'Access-Control-Allow-Headers':'authorization, x-client-info, apikey, content-type'"),'Authorization CORS header contract missing');
          must(api.includes("const token=auth.startsWith('Bearer ')?auth.slice(7):''"),'Bearer token extraction missing');
          must(api.includes('sb.auth.getUser(token)'),'API must verify the caller through Supabase Auth');
          must(api.includes("Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')"),'Raw referral access must remain server-side');
          must(api.includes(".select('code')"),'API may read only the caller referral code from the code table');
          must(api.includes(".eq('user_id',user.id)"),'Referral code lookup must scope to the verified user');
          must((api.match(/\.eq\('referrer_user_id',user\.id\)/g)||[]).length===2,'Referral aggregate queries must scope to the verified user');
          must((api.match(/\.select\('status',\{count:'exact',head:true\}\)/g)||[]).length===2,'Referral counts must use head-only aggregate queries');
          must(api.includes(".eq('status','confirmed')"),'Confirmed referral count must remain status-scoped');
          must(!api.includes('console.'),'Referral API must not log token/body/user data');
          must(!api.includes('user_metadata'),'Referral API authorization must not use user metadata');
          must(!api.includes('email'),'Referral summary server boundary must not query or emit email');
          must(!api.includes(".select('referred_user_id"),'Referral summary must not project referred user identifiers');
          must(!api.includes(".select('referrer_user_id"),'Referral summary must not project referrer identifiers');
          must(/return json\(\{\s*referral_code:String\(codeResult\.data\.code\),\s*total_referrals:Number\(totalResult\.count\)\|\|0,\s*confirmed_referrals:Number\(confirmedResult\.count\)\|\|0\s*\}\)/s.test(api),'Response must contain only referral code and aggregate counts');

          for(const table of ['member_referral_codes','member_referrals']){
            must(legacySql.includes(`revoke all on public.${table} from anon, authenticated`),`${table} raw rows must stay unavailable to browser roles`);
          }
          must(legacySql.includes("where rc.user_id=(select auth.uid())"),'Historical RPC definition must remain caller-scoped for provenance/rollback review');
          must(cutoverSql.includes('revoke execute on function public.get_my_referral_summary() from public, anon, authenticated;'),'Post-acceptance cutover must revoke the old RPC from all browser/public execute paths');
          must(!/grant\s+execute[\s\S]*get_my_referral_summary/i.test(cutoverSql),'Cutover SQL must not re-grant the old RPC');

          const edge="sb.functions.invoke('member-referral-api',{body:{}})";
          const fallback="sb.rpc('get_my_referral_summary')";
          must(member.includes(edge),'Member page must call the authenticated Edge Function');
          must(!member.includes(fallback),'Accepted browser runtime must not retain the RPC fallback');
          must(!member.includes("source='fallback'"),'Accepted browser runtime must not retain fallback trace state');
          must(member.includes("setReferralTrace('edge')"),'Successful referral summary must trace EDGE');
          must(member.includes("setReferralTrace('unavailable')"),'Failed Edge retrieval must trace UNAVAILABLE without exposing an error body');
          must(member.includes("has('qa_referral_trace')"),'QA trace switch must remain explicit and opt-in');
          must(member.includes("'Referral API: '+source.toUpperCase()"),'QA trace must expose only the source label');
          const serverRoleEnv='SUPABASE_'+'SERVICE_ROLE_KEY';
          must(!member.includes(serverRoleEnv),'Browser must never receive service-role credentials');
          must(!member.includes('access_token'),'Browser cutover must not manually render or expose access tokens');

          must(physical.includes('Status: **PASS — PHYSICAL SIGNED-IN EDGE ACCEPTED / POST-CUTOVER SECURITY FOLLOW-UP VERIFIED**'),'Physical referral evidence must record completed ordered post-cutover security verification');
          must(physical.includes('QA source label shown: **`EDGE`**'),'Physical evidence must contain the privacy-safe EDGE label');
          must(physical.includes('Referral summary rendered without an unavailable message: **PASS**'),'Physical evidence must verify successful summary rendering');
          must(physical.includes('Total-referral field rendered as a number: **PASS**'),'Physical evidence must verify total aggregate rendering without storing the value');
          must(physical.includes('Confirmed-referral field rendered as a number: **PASS**'),'Physical evidence must verify confirmed aggregate rendering without storing the value');
          must(physical.includes('Share button enabled after load: **PASS**')&&physical.includes('Copy button enabled after load: **PASS**'),'Physical evidence must verify both controls enabled');
          must(physical.includes('No numeric aggregate values were retained.'),'Physical evidence must not retain referral aggregate values');
          must(physical.includes('PR #520 merged as `aa470986589d83dd95b4efd6e4a4d68a9f55965d`'),'Physical evidence must pin the Edge-only deployment SHA');
          must(physical.includes('GitHub Pages run `33898258213` = **success**'),'Physical evidence must retain exact post-cutover Pages evidence');
          must(physical.includes('main Live Smoke `33898314400` = **success**'),'Physical evidence must retain exact post-cutover live-smoke evidence');
          must(physical.includes('`anon_execute=false`')&&physical.includes('`authenticated_execute=false`'),'Physical evidence must retain post-cutover browser-role RPC privilege verification');
          must(physical.includes('no longer reports the former authenticated-callable SECURITY DEFINER warning'),'Physical evidence must retain post-cutover Advisor verification');
          must(physical.includes('does not prove referral conversion'),'Physical evidence must preserve downstream overclaim boundary');
          NODE

      - name: Record post-acceptance evidence boundary
        shell: bash
        run: |
          {
            echo '## Member referral API post-acceptance boundary'
            echo
            echo '- A traced signed-in physical session accepted the EDGE retrieval/render path under the canonical privacy-safe evidence contract.'
            echo '- Browser source uses the authenticated Edge Function only; the temporary RPC fallback is absent from member.html.'
            echo '- The Edge-only runtime deployed successfully on the recorded Pages + main Live Smoke trace before old RPC execute access was revoked from PUBLIC/anon/authenticated.'
            echo '- Post-cutover privilege verification is negative for browser roles, raw referral rows remain unavailable to browser roles, and the former referral-summary SECURITY DEFINER Advisor warning is absent.'
            echo '- Caller identity remains server-verified; service-role table access stays server-side.'
            echo '- Optional QA trace exposes only EDGE/UNAVAILABLE source state, never token/account/user payload.'
            echo '- Physical EDGE acceptance and completed browser/RPC cutover do not establish referral conversion, Product Event real-user acceptance, Public Beta completion or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"