name: Group API Probe Run Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-group-api-probe-runs:
    runs-on: ubuntu-latest
    steps:
      - name: List recent Group API live probe runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail --silent --show-error --location "${auth[@]}" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/group-api-live-observability-probe.yml/runs?branch=main&per_page=10" \
            | jq -c '.workflow_runs[] | {id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url}'

      - name: Evidence boundary
        run: |
          echo 'This diagnostic only reads workflow-run metadata and does not change production state.'
