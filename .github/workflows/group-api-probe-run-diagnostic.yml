name: Group API Probe Run Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect-group-api-probe-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List recent main Group API probe runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/group-api-live-observability-probe.yml/runs?branch=main&per_page=10" \
            | jq -c '.workflow_runs[] | {id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url}'

      - name: Evidence boundary
        run: |
          echo 'Read-only workflow-run metadata diagnostic only.'
          echo 'This PR is intended to be closed without merge after evidence capture.'
