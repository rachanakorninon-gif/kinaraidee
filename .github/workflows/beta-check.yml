name: Beta integrity checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required beta files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            privacy.html
            feedback.html
            partner.html
            manifest.webmanifest
            sw.js
            icon.svg
            data/foods-expanded.js
            data/choice-rules.js
            data/nearby-restaurants.js
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
      - name: Block private Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(sb_secret_|service_role)' .; then
            echo 'Private Supabase secret pattern found in repository.'
            exit 1
          fi
      - name: Validate public app wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'manifest.webmanifest' index.html
          grep -q 'sw.js' index.html
          grep -q 'data/nearby-restaurants.js' index.html
          grep -q 'feedback.html' index.html
          grep -q 'privacy.html' index.html
          grep -q 'partner.html' index.html
          grep -q 'restaurant_requests' data/nearby-restaurants.js
          grep -q 'sb_publishable_' data/nearby-restaurants.js
