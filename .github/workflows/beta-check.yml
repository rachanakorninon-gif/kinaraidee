name: Beta integrity checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required beta files
        shell: bash
        run: |
          set -euo pipefail
          required=(index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml data/foods-expanded.js data/choice-rules.js data/nearby-restaurants.js data/group-mode.js data/group-sync.js data/group-remote.js data/member-sync.js data/pwa-install.js data/home-surprise.js CURRENT-RUNTIME.md BETA-CHECKLIST.md)
          for file in "${required[@]}"; do test -s "$file" || { echo "Missing or empty: $file"; exit 1; }; done
      - name: Block private credential patterns including workflows
        shell: bash
        run: |
          set -euo pipefail
          pattern='(sb_''secret_|service_''role|SUPABASE_''SERVICE_ROLE|PRIVATE_''KEY-----)'
          matches="$(grep -RInE --exclude-dir=.git --exclude='*.md' "$pattern" . || true)"
          safe_env='Deno\.env\.get\(['"'"'\"]SUPABASE_''SERVICE_ROLE_KEY['"'"'\"]\)'
          unsafe="$(printf '%s\n' "$matches" | grep -vE "$safe_env" || true)"
          if [ -n "$unsafe" ]; then printf '%s\n' "$unsafe"; echo 'Potential private credential pattern found in repository or workflow configuration.'; exit 1; fi
      - name: Validate public app wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'manifest.webmanifest' index.html
          grep -q 'sw.js' index.html
          grep -q 'data/nearby-restaurants.js' index.html
          grep -q 'data/home-surprise.js' index.html
          grep -q 'feedback.html' index.html
          grep -q 'privacy.html' index.html
          grep -q 'partner.html' index.html
          grep -q 'restaurant_requests' data/nearby-restaurants.js
          grep -q 'sb_publishable_' data/nearby-restaurants.js
      - name: Validate partner renderer safety
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'box.replaceChildren()' data/nearby-restaurants.js
          grep -q "name.textContent=String(r.name" data/nearby-restaurants.js
          grep -q "detail.textContent=String(r.address" data/nearby-restaurants.js
      - name: Validate public form accessibility and privacy acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'role="radiogroup"' feedback.html
          grep -q 'aria-live="polite"' feedback.html
          grep -q 'for="restaurantName"' partner.html
          grep -q 'autocomplete="organization"' partner.html
          grep -q 'autocomplete="tel"' partner.html
          grep -q 'autocomplete="email"' partner.html
          grep -q 'aria-live="polite"' partner.html
          grep -q "PRIVACY_NOTICE_VERSION='2026-08-21'" partner.html
          grep -q 'privacy_notice_version:PRIVACY_NOTICE_VERSION' partner.html
          grep -q 'privacy_acknowledged_at:new Date().toISOString()' partner.html
      - name: Validate member auth error hygiene
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'minlength="8"' member.html
          grep -q 'p.length<8' member.html
          grep -q 'minlength="8"' reset-password.html
          grep -q 'p.length<8' reset-password.html
          grep -Fq "location.href='member.html'" reset-password.html
          if grep -q "location.href='admin.html'" reset-password.html; then
            echo 'Member reset flow must not redirect to private admin page.'
            exit 1
          fi
          if grep -q 'error\.message' member.html reset-password.html; then
            echo 'Raw Supabase error.message must not be exposed in member auth pages.'
            exit 1
          fi
      - name: Validate surprise and current PWA integrity
        shell: bash
        run: |
          set -euo pipefail
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test -n "$marker" || { echo 'Unable to derive PWA marker'; exit 1; }
          grep -Fq "PWA cache marker: \`$marker\`" CURRENT-RUNTIME.md
          grep -q 'aria-busy' data/home-surprise.js
          grep -q 'if(busy)return' data/home-surprise.js
          grep -q 'pageshow' data/home-surprise.js
          grep -q 'online' data/home-surprise.js
          grep -q 'cache.addAll(SHELL)' sw.js
          grep -q "'./data/home-surprise.js'" sw.js
          grep -q "'./data/pwa-install.js'" sw.js
          grep -q "'./404.html'" sw.js
          if grep -q 'Promise.allSettled' sw.js; then echo 'Non-atomic shell install detected'; exit 1; fi
      - name: Validate beta checklist against current runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          marker="$(sed -n 's/^- PWA cache marker: `\([^`]*\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([^`]*\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          deployed="$(sed -n 's/^- Runtime merge\/deployed SHA: `\([^`]*\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          last_verified="$(sed -n 's/^- Last verified deployed browser\/PWA descendant: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          status="$(sed -n 's/^- Deployment status: \*\*\(.*\)\*\*.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          test -n "$marker" && test -n "$candidate" && test -n "$status" || { echo 'Unable to parse CURRENT-RUNTIME marker/candidate/status'; exit 1; }
          grep -Fq "\`$marker\`" BETA-CHECKLIST.md || { echo 'BETA-CHECKLIST PWA marker drift'; exit 1; }
          case "$status" in
            'PENDING FOR CURRENT RUNTIME DEPLOYMENT')
              test -z "$deployed" || { echo 'Pending runtime must not claim a current deployed SHA'; exit 1; }
              test -n "$last_verified" || { echo 'Pending runtime must identify the last verified deployed descendant'; exit 1; }
              grep -Fq "\`$last_verified\`" BETA-CHECKLIST.md || { echo 'BETA-CHECKLIST last verified deployed SHA drift'; exit 1; }
              grep -Fq 'Current runtime deployment evidence is pending' CURRENT-RUNTIME.md || { echo 'Pending runtime evidence boundary missing'; exit 1; }
              grep -Fq 'Prior verified deployment evidence remains historical and is not reused as current PASS' CURRENT-RUNTIME.md || { echo 'Pending runtime prior-evidence boundary missing'; exit 1; }
              ;;
            'PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE')
              test -n "$deployed" || { echo 'PASS runtime must provide deployed SHA'; exit 1; }
              grep -Fq "\`$candidate\`" BETA-CHECKLIST.md || { echo 'BETA-CHECKLIST runtime candidate drift'; exit 1; }
              grep -Fq "\`$deployed\`" BETA-CHECKLIST.md || { echo 'BETA-CHECKLIST deployed SHA drift'; exit 1; }
              ;;
            *)
              echo "Unexpected runtime deployment status: $status"
              exit 1
              ;;
          esac
          grep -Fq 'Public Beta' BETA-CHECKLIST.md
          grep -Fq 'NO-GO' BETA-CHECKLIST.md
          grep -Fq 'Protect main' BETA-CHECKLIST.md
          grep -Fq 'actual end-to-end alert delivery verification' BETA-CHECKLIST.md
          grep -Fq 'Partner API source/deployment hardening' BETA-CHECKLIST.md || { echo 'BETA-CHECKLIST missing Partner API deployment evidence'; exit 1; }
          grep -Fq '32675596758' BETA-CHECKLIST.md || { echo 'BETA-CHECKLIST Partner API rejection-probe evidence drift'; exit 1; }
          grep -Fq 'Partner API monitoring baseline / owner / alert channel / escalation / support path' BETA-CHECKLIST.md || { echo 'BETA-CHECKLIST must keep Partner API monitoring ownership open'; exit 1; }
          grep -Fq 'Complete anonymous Partner API rate/quota/abuse-control strategy' BETA-CHECKLIST.md || { echo 'BETA-CHECKLIST must keep Partner API abuse-control gate open'; exit 1; }
      - name: Validate SEO and recovery wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'sitemap.xml' robots.txt
          grep -q '<urlset' sitemap.xml
          grep -q 'privacy.html' sitemap.xml
          grep -q 'feedback.html' sitemap.xml
          grep -q 'partner.html' sitemap.xml
          grep -q 'kinaraidee' 404.html
