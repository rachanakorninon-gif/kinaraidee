name: Commercial Trace Placeholder Regression

on:
  pull_request:
    paths:
      - 'COMMERCIAL-EXECUTION-EVIDENCE.md'
      - '.github/workflows/commercial-trace-placeholder-regression.yml'
  push:
    branches: [main]
    paths:
      - 'COMMERCIAL-EXECUTION-EVIDENCE.md'
      - '.github/workflows/commercial-trace-placeholder-regression.yml'

permissions:
  contents: read

jobs:
  guard-commercial-trace-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject ambiguous, empty, case-variant, decorated, or fabricated placeholders in VERIFIED evidence
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          execution = Path('COMMERCIAL-EXECUTION-EVIDENCE.md').read_text(encoding='utf-8')
          status_matches = re.findall(r'^Status:\s+\*\*(NOT VERIFIED|VERIFIED)\*\*', execution, re.M)
          if len(status_matches) != 1:
              sys.exit(
                  'COMMERCIAL-EXECUTION-EVIDENCE.md must declare exactly one machine-readable Status as NOT VERIFIED or VERIFIED'
              )

          if status_matches[0] != 'VERIFIED':
              print('Commercial execution is not VERIFIED; no execution trace evidence is inferred.')
              sys.exit(0)

          required_trace_fields = [
              'Commercial scope / revenue model',
              'Release candidate commit',
              'Production deployment/runtime reference',
              'Public Beta completion evidence',
              'Payment/Premium execution evidence',
              'Privacy/Legal publication evidence',
              'Partner-commercial execution evidence',
              'Production access/monitoring/recovery evidence',
              'Reviewed scope exclusions',
              'Reviewer/approver reference',
              'Evidence location(s)',
              'Verified at',
          ]

          decorated_placeholder_pattern = re.compile(
              r'^(?:NOT CAPTURED|TBD|TODO|TBC|PENDING|UNKNOWN|PLACEHOLDER|EXAMPLE|SAMPLE|MOCK|TEST|'
              r'SYNTHETIC|FABRICATED|ASSUMED|PROJECTED|N/A|NA|NOT APPLICABLE)'
              r'(?=$|[\s\W_])',
              re.I,
          )

          for field in required_trace_fields:
              matches = re.findall(
                  rf'^- {re.escape(field)}:\s+\*\*(.+?)\*\*\s*$',
                  execution,
                  re.M,
              )
              if len(matches) != 1:
                  sys.exit(
                      f'Commercial execution VERIFIED requires exactly one machine-readable trace field: {field}'
                  )
              value = matches[0].strip()
              if not value:
                  sys.exit(
                      f'Commercial execution VERIFIED cannot use an empty or whitespace-only trace for {field}'
                  )
              normalized = re.sub(r'\s+', ' ', value).strip()
              if decorated_placeholder_pattern.match(normalized):
                  sys.exit(
                      f'Commercial execution VERIFIED cannot use a placeholder, decorated placeholder, or fabricated trace for {field}: {value}'
                  )

          print('Commercial VERIFIED trace fields are unique, non-empty, case-safe, and reject decorated or fabricated markers across punctuation variants.')
          print('This regression validates evidence formatting only; it does not create execution evidence or Commercial GO.')
