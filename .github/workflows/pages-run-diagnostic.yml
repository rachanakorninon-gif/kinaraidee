name: Pages Run Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-recent-pages-runs:
    runs-on: ubuntu-latest
    steps:
      - name: List recent Pages and Live Smoke runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          for workflow in pages.yml live-smoke.yml; do
            echo "=== $workflow ==="
            curl --fail --silent --show-error --location "${auth[@]}" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/$workflow/runs?branch=main&per_page=10" \
              | jq -c '.workflow_runs[] | {id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url}'
          done

      - name: Explain evidence boundary
        run: echo 'This diagnostic only reads workflow-run metadata; it does not imply deployment success.'
