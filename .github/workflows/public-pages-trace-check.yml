name: Public Pages Trace Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-pages-trace:
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest Pages artifact is public
        shell: bash
        env:
          EXPECTED_SHA: 35fe4b7fbf201882ea2ebad8ffca2b8da668999b
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          meta=''
          probe=''
          sw=''
          for attempt in $(seq 1 24); do
            echo "Public trace attempt $attempt/24"
            if meta="$(curl --fail --silent --show-error --location --max-time 30 "$base/release-meta.json")" \
              && probe="$(curl --fail --silent --show-error --location --max-time 30 "$base/deployment-check.html")" \
              && sw="$(curl --fail --silent --show-error --location --max-time 30 "$base/sw.js")"; then
              deployed="$(META="$meta" node -e "const m=JSON.parse(process.env.META);process.stdout.write(String(m.sha||''))")"
              cache="$(META="$meta" node -e "const m=JSON.parse(process.env.META);process.stdout.write(String(m.pwa_cache||''))")"
              if [ "$deployed" = "$EXPECTED_SHA" ] \
                && [ "$cache" = 'kinaraidee-beta-v13' ] \
                && grep -Fq 'pages-actions-source-v1' <<<"$probe" \
                && grep -Fq "const CACHE='kinaraidee-beta-v13'" <<<"$sw"; then
                echo "Public Pages trace PASS: $deployed · $cache"
                exit 0
              fi
              echo "Not ready/mismatch yet: deployed=$deployed cache=$cache"
            fi
            sleep 10
          done
          echo 'Public Pages trace did not converge to the expected latest deployment.'
          exit 1

      - name: Explain evidence boundary
        run: |
          echo 'This verifies public deployment metadata/source markers only.'
          echo 'It does not replace real-device interaction or assistive-technology acceptance.'
