name: Production Access Decision Regression

on:
  pull_request:
    paths:
      - 'PRODUCTION-ACCESS-DECISION.md'
      - '.github/workflows/production-access-decision-regression.yml'
  push:
    branches: ['main']
    paths:
      - 'PRODUCTION-ACCESS-DECISION.md'
      - '.github/workflows/production-access-decision-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Production access decision state
        shell: bash
        run: |
          set -euo pipefail
          file='PRODUCTION-ACCESS-DECISION.md'
          test -s "$file"
          grep -Eq '^Status: \*\*(NOT APPROVED|APPROVED)\*\*$' "$file"
          fields=(
            'Production service owner/on-call/contact:'
            'Production deploy owner:'
            'Emergency change approver:'
            'GitHub collaborator/Actions access-review evidence reference:'
            'Supabase project access-review evidence reference:'
            'Least-privilege/offboarding review reference:'
            'Revocation/bypass-policy verification reference:'
            'Emergency-change evidence location:'
            'Decision approver:'
            'Approved at:'
          )
          for marker in "${fields[@]}"; do
            grep -Fq -- "$marker" "$file" || { echo "Missing Production access field: $marker"; exit 1; }
          done
          if grep -q '^Status: \*\*NOT APPROVED\*\*$' "$file"; then
            for marker in "${fields[@]}"; do
              grep -F "$marker" "$file" | grep -Fq '**UNSET**' || { echo "NOT APPROVED field must remain UNSET: $marker"; exit 1; }
            done
          else
            if grep -q '\*\*UNSET\*\*' "$file"; then
              echo 'APPROVED Production access decision still contains UNSET fields.'
              exit 1
            fi
            approved_at=$(sed -n 's/^- Approved at: //p' "$file")
            python - "$approved_at" <<'PY'
          import datetime as dt
          import sys
          value = sys.argv[1].strip().replace('**', '')
          try:
              parsed = dt.datetime.fromisoformat(value.replace('Z', '+00:00'))
          except ValueError:
              raise SystemExit('Approved at must be a valid ISO-8601 timestamp.')
          if parsed.tzinfo is None:
              parsed = parsed.replace(tzinfo=dt.timezone.utc)
          if parsed > dt.datetime.now(dt.timezone.utc) + dt.timedelta(minutes=5):
              raise SystemExit('Approved at must not be materially in the future.')
          PY
          fi
          grep -Fq 'does not prove a restore drill' "$file"
          grep -Fq 'do not establish a complete Production access roster' "$file"

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Production access decision regression'
            echo
            echo '- NOT APPROVED requires ownership/access-review/emergency-control fields to remain UNSET.'
            echo '- APPROVED requires real reviewable values and a valid approval timestamp.'
            echo '- Repository ruleset enforcement and owner-admin evidence do not establish the full Production/Supabase access roster.'
            echo '- Static CI success is not an access-review sign-off, rollback/recovery drill, Public Beta PASS, or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
