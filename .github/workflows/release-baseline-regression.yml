name: Kinaraidee Release Baseline Regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical reviewed baseline lineage
        shell: bash
        run: |
          set -euo pipefail

          baseline="$(sed -n 's/^- Canonical reviewed `main` baseline: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RELEASE.md | head -n1)"
          test -n "$baseline" || { echo 'Unable to parse canonical reviewed main baseline from CURRENT-RELEASE.md'; exit 1; }
          git cat-file -e "$baseline^{commit}" || { echo "Reviewed baseline is not present in repository history: $baseline"; exit 1; }
          git merge-base --is-ancestor "$baseline" HEAD || { echo "Reviewed baseline is not an ancestor of HEAD: $baseline"; exit 1; }

          if [ "$baseline" = "$(git rev-parse HEAD)" ]; then
            echo "Canonical reviewed baseline is HEAD: $baseline"
            exit 0
          fi

          echo "Canonical reviewed baseline is an ancestor of HEAD: $baseline"
          echo 'Docs/workflow-only descendants need no baseline churn; guarded browser/API/schema drift must be represented by its canonical source candidate.'

          browser_paths=(
            index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html
            manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml data
          )
          group_paths=(
            supabase/functions/group-api
            supabase/group-api-event-observability-v1.sql
            supabase/group-api-event-observability-v1-rollback.sql
          )
          partner_paths=(supabase/functions/partner-api)
          generic_schema_paths=(supabase/migrations)

          browser_changed="$(git diff --name-only "$baseline"..HEAD -- "${browser_paths[@]}" || true)"
          group_changed="$(git diff --name-only "$baseline"..HEAD -- "${group_paths[@]}" || true)"
          partner_changed="$(git diff --name-only "$baseline"..HEAD -- "${partner_paths[@]}" || true)"
          generic_schema_changed="$(git diff --name-only "$baseline"..HEAD -- "${generic_schema_paths[@]}" || true)"

          if [ -n "$group_changed" ]; then
            group_candidate="$(sed -n 's/^- Current Group API source candidate: PR #[0-9][0-9]* \/ `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RELEASE.md | head -n1)"
            test -n "$group_candidate" || { echo 'Group API drift exists but CURRENT-RELEASE.md has no parseable source candidate'; exit 1; }
            git cat-file -e "$group_candidate^{commit}" || { echo 'Declared Group API candidate commit is missing'; exit 1; }
            git merge-base --is-ancestor "$baseline" "$group_candidate" || { echo 'Group API candidate is not a descendant of the canonical reviewed baseline'; exit 1; }
            git merge-base --is-ancestor "$group_candidate" HEAD || { echo 'Group API candidate is not an ancestor of HEAD'; exit 1; }
            undeclared_group="$(git diff --name-only "$group_candidate"..HEAD -- "${group_paths[@]}" || true)"
            if [ -n "$undeclared_group" ]; then
              echo 'Group API/schema files changed after the declared Group source candidate:'
              printf '%s\n' "$undeclared_group"
              exit 1
            fi
            echo "Declared Group API candidate $group_candidate contains all guarded Group API/schema drift after baseline $baseline."
          fi

          if [ -n "$partner_changed" ]; then
            partner_candidate="$(sed -n 's/^- PR #[0-9][0-9]* merged as `\([0-9a-f]\{40\}\)`.*/\1/p' PARTNER-API-HARDENING-EVIDENCE.md | head -n1)"
            test -n "$partner_candidate" || { echo 'Partner API drift exists but deployment evidence has no parseable source candidate'; exit 1; }
            git cat-file -e "$partner_candidate^{commit}" || { echo 'Declared Partner API candidate commit is missing'; exit 1; }
            git merge-base --is-ancestor "$baseline" "$partner_candidate" || { echo 'Partner API candidate is not a descendant of the canonical reviewed baseline'; exit 1; }
            git merge-base --is-ancestor "$partner_candidate" HEAD || { echo 'Partner API candidate is not an ancestor of HEAD'; exit 1; }
            undeclared_partner="$(git diff --name-only "$partner_candidate"..HEAD -- "${partner_paths[@]}" || true)"
            if [ -n "$undeclared_partner" ]; then
              echo 'Partner API files changed after the declared Partner source candidate:'
              printf '%s\n' "$undeclared_partner"
              exit 1
            fi
            echo "Declared Partner API candidate $partner_candidate contains all guarded Partner drift after baseline $baseline."
          fi

          if [ -n "$generic_schema_changed" ]; then
            echo 'Generic migration files changed after the canonical reviewed baseline and are not covered by a source-specific candidate:'
            printf '%s\n' "$generic_schema_changed"
            echo 'Advance the appropriate reviewed schema/security evidence before treating this descendant as reviewed.'
            exit 1
          fi

          if [ -z "$browser_changed" ]; then
            echo 'All guarded non-browser changes are represented by their source-specific candidates; no browser/PWA drift remains.'
            exit 0
          fi

          status="$(sed -n 's/^- Deployment status: \*\*\(.*\)\*\*.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          test -n "$candidate" || { echo 'Unable to parse browser runtime candidate'; exit 1; }
          git cat-file -e "$candidate^{commit}" || { echo "Runtime candidate is not present in repository history: $candidate"; exit 1; }
          git merge-base --is-ancestor "$baseline" "$candidate" || { echo 'Runtime candidate is not a descendant of the reviewed baseline'; exit 1; }
          git merge-base --is-ancestor "$candidate" HEAD || { echo 'Runtime candidate is not an ancestor of HEAD'; exit 1; }

          declared_changes="$(git diff --name-only "$baseline".."$candidate" -- "${browser_paths[@]}" || true)"
          test -n "$declared_changes" || { echo 'Runtime candidate declares no browser/PWA change'; exit 1; }

          undeclared_after_candidate="$(git diff --name-only "$candidate"..HEAD -- "${browser_paths[@]}" || true)"
          if [ -n "$undeclared_after_candidate" ]; then
            echo 'Browser/PWA runtime files changed after the declared candidate:'
            printf '%s\n' "$undeclared_after_candidate"
            exit 1
          fi

          case "$status" in
            'PENDING FOR CURRENT RUNTIME DEPLOYMENT')
              grep -Fq 'Current runtime deployment evidence is pending' CURRENT-RUNTIME.md || { echo 'Pending runtime evidence boundary is missing'; exit 1; }
              echo "Declared pending browser runtime $candidate contains all browser drift after reviewed baseline $baseline."
              ;;
            'PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE')
              deployed="$(sed -n 's/^- Runtime merge\/deployed SHA: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
              test -n "$deployed" || { echo 'Verified runtime PASS must declare deployed SHA'; exit 1; }
              git cat-file -e "$deployed^{commit}" || { echo "Deployed runtime SHA is not present in repository history: $deployed"; exit 1; }
              git merge-base --is-ancestor "$candidate" "$deployed" || { echo 'Deployed runtime SHA is not a descendant of candidate'; exit 1; }
              git merge-base --is-ancestor "$deployed" HEAD || { echo 'Deployed runtime SHA is not an ancestor of HEAD'; exit 1; }
              changed_to_deployed="$(git diff --name-only "$candidate".."$deployed" -- "${browser_paths[@]}" || true)"
              test -z "$changed_to_deployed" || { echo 'Guarded browser/PWA files changed between candidate and deployed descendant'; printf '%s\n' "$changed_to_deployed"; exit 1; }
              grep -Fq 'Current deployment PASS is scoped to the browser/PWA static deployment trace and live source markers only.' CURRENT-RUNTIME.md || { echo 'Verified runtime PASS scope boundary is missing'; exit 1; }
              echo "Declared verified browser runtime $candidate is represented by deployed descendant $deployed with no guarded browser drift."
              ;;
            *)
              echo "Unexpected runtime deployment status: $status"
              exit 1
              ;;
          esac

      - name: Preserve readiness boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Public Beta is still **NOT COMPLETE**' CURRENT-RELEASE.md || { echo 'Public Beta incomplete boundary is missing'; exit 1; }
          grep -Fq 'Commercial launch remains **NO-GO**' CURRENT-RELEASE.md || { echo 'Commercial NO-GO boundary is missing'; exit 1; }
          grep -Fq 'BLOCKED BY VERIFIED FREE PLAN / CONFIGURATION — NOT PASS' CURRENT-RELEASE.md || { echo 'Supabase leaked-password gate boundary is missing'; exit 1; }
          grep -Fq 'Status: **ENFORCED FOR `main` THROUGH THE `Protect main` RULESET**' CURRENT-RELEASE.md || { echo 'Repository governance enforcement boundary is missing'; exit 1; }
          grep -Fq 'Issue #35 is closed as completed' CURRENT-RELEASE.md || { echo 'Repository governance closure evidence is missing'; exit 1; }
          echo 'Release readiness boundaries preserved.'
