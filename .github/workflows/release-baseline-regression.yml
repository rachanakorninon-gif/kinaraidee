name: Kinaraidee Release Baseline Regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical reviewed baseline lineage
        shell: bash
        run: |
          set -euo pipefail

          baseline="$(sed -n 's/^- Canonical reviewed `main` baseline: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RELEASE.md | head -n1)"
          test -n "$baseline" || { echo 'Unable to parse canonical reviewed main baseline from CURRENT-RELEASE.md'; exit 1; }
          git cat-file -e "$baseline^{commit}" || { echo "Reviewed baseline is not present in repository history: $baseline"; exit 1; }
          git merge-base --is-ancestor "$baseline" HEAD || { echo "Reviewed baseline is not an ancestor of HEAD: $baseline"; exit 1; }

          if [ "$baseline" = "$(git rev-parse HEAD)" ]; then
            echo "Canonical reviewed baseline is HEAD: $baseline"
            exit 0
          fi

          echo "Canonical reviewed baseline is an ancestor of HEAD: $baseline"
          echo 'A docs/workflow-only descendant does not require baseline churn; guarded runtime/API/schema drift is checked below.'

          browser_paths=(
            index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html
            manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml data
          )
          api_schema_paths=(
            supabase/functions/group-api supabase/functions/partner-api supabase/migrations
          )

          browser_changed="$(git diff --name-only "$baseline"..HEAD -- "${browser_paths[@]}" || true)"
          api_schema_changed="$(git diff --name-only "$baseline"..HEAD -- "${api_schema_paths[@]}" || true)"

          if [ -n "$api_schema_changed" ]; then
            echo 'API/schema files changed after the canonical reviewed baseline:'
            printf '%s\n' "$api_schema_changed"
            echo 'Advance the appropriate API/security evidence candidate before treating the descendant as reviewed.'
            exit 1
          fi

          if [ -z "$browser_changed" ]; then
            echo 'Descendants after the canonical reviewed baseline are evidence/workflow/documentation-only with respect to guarded runtime/API/schema paths.'
            exit 0
          fi

          status="$(sed -n 's/^- Deployment status: \*\*\(.*\)\*\*.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          if [ "$status" != 'PENDING FOR CURRENT RUNTIME DEPLOYMENT' ]; then
            echo 'Browser/PWA runtime changed after the reviewed baseline without a pending declared runtime candidate:'
            printf '%s\n' "$browser_changed"
            exit 1
          fi

          candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          test -n "$candidate" || { echo 'Unable to parse pending browser runtime candidate'; exit 1; }
          git cat-file -e "$candidate^{commit}" || { echo "Pending runtime candidate is not present in repository history: $candidate"; exit 1; }
          git merge-base --is-ancestor "$baseline" "$candidate" || { echo 'Pending runtime candidate is not a descendant of the reviewed baseline'; exit 1; }
          git merge-base --is-ancestor "$candidate" HEAD || { echo 'Pending runtime candidate is not an ancestor of HEAD'; exit 1; }

          declared_changes="$(git diff --name-only "$baseline".."$candidate" -- "${browser_paths[@]}" || true)"
          test -n "$declared_changes" || { echo 'Pending runtime candidate declares no browser/PWA change'; exit 1; }

          undeclared_after_candidate="$(git diff --name-only "$candidate"..HEAD -- "${browser_paths[@]}" || true)"
          if [ -n "$undeclared_after_candidate" ]; then
            echo 'Browser/PWA runtime files changed after the declared pending candidate:'
            printf '%s\n' "$undeclared_after_candidate"
            exit 1
          fi

          grep -Fq 'Current runtime deployment evidence is pending' CURRENT-RUNTIME.md || { echo 'Pending runtime evidence boundary is missing'; exit 1; }
          echo "Declared pending browser runtime $candidate contains all runtime drift after reviewed baseline $baseline; API/schema paths remain clean."

      - name: Preserve readiness boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Public Beta is still **NOT COMPLETE**' CURRENT-RELEASE.md || { echo 'Public Beta incomplete boundary is missing'; exit 1; }
          grep -Fq 'Commercial launch remains **NO-GO**' CURRENT-RELEASE.md || { echo 'Commercial NO-GO boundary is missing'; exit 1; }
          grep -Fq 'BLOCKED BY VERIFIED FREE PLAN / CONFIGURATION — NOT PASS' CURRENT-RELEASE.md || { echo 'Supabase leaked-password gate boundary is missing'; exit 1; }
          grep -Fq 'Status: **ENFORCED FOR `main` THROUGH THE `Protect main` RULESET**' CURRENT-RELEASE.md || { echo 'Repository governance enforcement boundary is missing'; exit 1; }
          grep -Fq 'Issue #35 is closed as completed' CURRENT-RELEASE.md || { echo 'Repository governance closure evidence is missing'; exit 1; }
          echo 'Release readiness boundaries preserved.'
