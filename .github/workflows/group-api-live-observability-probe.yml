name: Group API Live Observability Probe

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/group-api-live-observability-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-live-group-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify non-mutating live rejection contracts
        shell: bash
        run: |
          set -euo pipefail
          url='https://cuspfvfzprlgtvtdyilh.supabase.co/functions/v1/group-api'
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          expect(){
            expected_status="$1"
            expected_error="$2"
            shift 2
            : > "$body"
            status="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' "$@")"
            test "$status" = "$expected_status" || { echo "Unexpected status: $status (expected $expected_status)"; cat "$body"; exit 1; }
            grep -Fq "\"error\":\"$expected_error\"" "$body" || { echo "Unexpected response body"; cat "$body"; exit 1; }
          }

          # Unsupported GET: no request body or identifiers.
          expect 405 method_not_allowed "$url"

          # Malformed room identifiers must be rejected before UUID-column DB queries.
          expect 400 invalid_room_id -H 'Content-Type: application/json' --data '{"action":"get_room","roomId":"not-a-uuid"}' "$url"
          expect 400 invalid_vote -H 'Content-Type: application/json' --data '{"action":"submit_vote","roomId":"not-a-uuid","voterId":"probe","tags":[]}' "$url"

          # Host-only actions reject malformed identifier/token shapes without a DB lookup.
          expect 403 forbidden -H 'Content-Type: application/json' --data '{"action":"get_votes","roomId":"not-a-uuid","hostToken":"bad"}' "$url"
          expect 403 forbidden -H 'Content-Type: application/json' --data '{"action":"close_room","roomId":"not-a-uuid","hostToken":"bad"}' "$url"

          # Overlong voter identifiers are rejected instead of being silently truncated.
          long_voter="$(printf 'x%.0s' $(seq 1 121))"
          payload="$(printf '{\"action\":\"submit_vote\",\"roomId\":\"00000000-0000-4000-8000-000000000000\",\"voterId\":\"%s\",\"tags\":[]}' "$long_voter")"
          expect 400 invalid_vote -H 'Content-Type: application/json' --data "$payload" "$url"

          echo 'Live Group API rejection contracts passed without creating/updating/closing any room or vote data.'

      - name: Explain evidence boundary
        run: |
          echo 'This verifies deployed public rejection behavior only and deliberately performs no successful write action.'
          echo 'Supabase log inspection is still required to distinguish platform invocation logging from application structured-event ingestion.'
          echo 'This does not prove rate limiting/quota controls, monitoring thresholds, retention cleanup, load/security testing, real-device behavior, or Production readiness.'
