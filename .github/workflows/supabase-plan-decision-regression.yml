name: Supabase Plan Decision Regression

on:
  pull_request:
    paths:
      - 'SUPABASE-PLAN-DECISION.md'
      - 'SUPABASE-AUTH-SECURITY-EVIDENCE.md'
      - 'SECURITY.md'
      - 'CURRENT-RELEASE.md'
      - '.github/workflows/supabase-plan-decision-regression.yml'
  push:
    branches: [main]
    paths:
      - 'SUPABASE-PLAN-DECISION.md'
      - 'SUPABASE-AUTH-SECURITY-EVIDENCE.md'
      - 'SECURITY.md'
      - 'CURRENT-RELEASE.md'
      - '.github/workflows/supabase-plan-decision-regression.yml'

permissions:
  contents: read

jobs:
  supabase-plan-decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Supabase plan decision boundary
        shell: bash
        run: |
          set -euo pipefail
          decision='SUPABASE-PLAN-DECISION.md'
          auth='SUPABASE-AUTH-SECURITY-EVIDENCE.md'
          security='SECURITY.md'
          release='CURRENT-RELEASE.md'

          test -f "$decision"
          test -f "$auth"
          test -f "$security"
          test -f "$release"

          status="$(sed -n 's/^Status: \*\*\([^*]*\)\*\*$/\1/p' "$decision")"
          case "$status" in
            'NOT APPROVED'|'APPROVED') ;;
            *) echo "Unexpected Supabase plan decision status: $status"; exit 1 ;;
          esac

          fields=(
            'Decision owner:'
            'Security reviewer/approver:'
            'Billing owner/approver:'
            'Current plan evidence:'
            'Target plan:'
            'Approved monthly/annual cost boundary:'
            'Required capability:'
            'Upgrade execution owner:'
            'Rollback/downgrade consideration:'
            'Post-change verification plan:'
            'Evidence location:'
            'Approved at:'
          )

          if [ "$status" = 'NOT APPROVED' ]; then
            for marker in "${fields[@]}"; do
              grep -F "$marker" "$decision" | grep -Fq '**UNSET**' || { echo "NOT APPROVED field must remain UNSET: $marker"; exit 1; }
            done

            grep -Fq 'Organization plan observed in the Supabase dashboard: `Free`' "$auth" || {
              echo 'While the plan decision is NOT APPROVED, Auth evidence must retain the observed Free-plan baseline.'
              exit 1
            }
            if ! grep -Fq 'Current leaked-password status: **BLOCKED BY PLAN/CONFIGURATION — NOT PASS**.' "$auth" && \
               ! grep -Fq 'Current leaked-password status: **BLOCKED BY VERIFIED FREE PLAN / CONFIGURATION — NOT PASS**.' "$auth"; then
              echo 'While the plan decision is NOT APPROVED, Auth evidence must retain leaked-password protection as NOT PASS under the current Free-plan/configuration boundary.'
              exit 1
            fi
            grep -Fq 'This document does not authorize a paid-plan upgrade.' "$auth" || {
              echo 'While the plan decision is NOT APPROVED, Auth evidence must not authorize a paid-plan upgrade.'
              exit 1
            }
          else
            if grep -q '\*\*UNSET\*\*' "$decision"; then
              echo 'APPROVED Supabase plan decision still contains UNSET fields.'
              exit 1
            fi
            grep -Fq 'leaked-password protection' "$decision" || {
              echo 'APPROVED plan decision must identify leaked-password protection when it remains the stated blocker.'
              exit 1
            }

            # APPROVED authorizes a later plan/configuration change. It must not require
            # the pre-upgrade Free/NOT-PASS observation to remain forever, because the
            # actual upgrade and fresh advisor verification are separate execution evidence.
            grep -Fq 'Security PASS for leaked-password protection still requires the setting to be enabled and a fresh Security Advisor result showing the WARN removed.' "$decision" || {
              echo 'APPROVED decision must preserve the post-change verification requirement.'
              exit 1
            }
          fi

          grep -Fq 'Supabase Auth leaked-password protection ถูกเปิดและ Security Advisor ถูกตรวจซ้ำ' "$security" || {
            echo 'SECURITY.md must retain leaked-password protection as a Production Security gate.'
            exit 1
          }
          grep -Fq 'Supabase leaked-password protection gate (#11)' "$release" || {
            echo 'CURRENT-RELEASE.md must retain the leaked-password blocker until separate post-change security evidence advances it.'
            exit 1
          }
          grep -Fq '**APPROVED** would authorize the plan/configuration change only; it would not by itself establish Security PASS.' "$decision" || {
            echo 'Decision record must preserve approval-vs-Security-PASS boundary.'
            exit 1
          }
          grep -Fq 'No paid-plan purchase' "$decision" || {
            echo 'Decision record must preserve the no-purchase evidence boundary.'
            exit 1
          }

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Supabase plan decision regression'
            echo
            echo '- NOT APPROVED keeps plan, billing, ownership and execution fields UNSET and preserves the current Free/NOT-PASS observation.'
            echo '- APPROVED may authorize a later plan/configuration change; it does not require stale pre-upgrade evidence to remain unchanged.'
            echo '- Leaked-password Security PASS still requires actual enablement plus a fresh Security Advisor result.'
            echo '- The guard does not purchase a plan, mutate Supabase, create users, or establish Public Beta/Commercial PASS.'
          } >> "$GITHUB_STEP_SUMMARY"
