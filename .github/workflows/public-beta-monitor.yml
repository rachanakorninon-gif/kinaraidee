name: Kinaraidee Public Beta Monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current release metadata
        uses: actions/checkout@v4

      - name: Check public beta availability and release metadata
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          expected_marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          expected_runtime="$(sed -nE 's/^- Current browser\/PWA runtime candidate: `([0-9a-f]{40})`.*/\1/p' CURRENT-RELEASE.md | head -n1)"
          test -n "$expected_marker" || { echo 'Unable to derive expected Service Worker marker'; exit 1; }
          test -n "$expected_runtime" || { echo 'Unable to derive current runtime candidate from CURRENT-RELEASE.md'; exit 1; }

          paths=(
            '/'
            '/index.html'
            '/404.html'
            '/privacy.html'
            '/feedback.html'
            '/partner.html'
            '/deployment-check.html'
            '/manifest.webmanifest'
            '/sw.js'
            '/release-meta.json'
            '/data/home-surprise.js'
            '/data/pwa-install.js'
            '/data/nearby-restaurants.js'
          )

          for path in "${paths[@]}"; do
            url="$base$path"
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 5 --max-time 25 "$url" >/dev/null
          done

          live_html="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "$base/")"
          live_manifest="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "$base/manifest.webmanifest")"
          live_probe="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "$base/deployment-check.html")"
          live_surprise="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "$base/data/home-surprise.js")"
          live_pwa="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "$base/data/pwa-install.js")"
          live_sw="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "$base/sw.js")"
          release_meta="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "$base/release-meta.json")"
          live_marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" <<<"$live_sw")"
          deployed_sha="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));if(!/^[0-9a-f]{40}$/.test(String(m.sha||'')))process.exit(2);process.stdout.write(String(m.sha));" <<<"$release_meta")"
          meta_marker="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(String(m.pwa_cache||''));" <<<"$release_meta")"

          grep -Fq 'กินอะไรดี' <<<"$live_html" || { echo 'Live homepage is missing the Kinaraidee app identity'; exit 1; }
          grep -Fq 'manifest.webmanifest' <<<"$live_html" || { echo 'Live homepage is missing manifest wiring'; exit 1; }
          grep -Fq 'serviceWorker' <<<"$live_html" || { echo 'Live homepage is missing Service Worker registration'; exit 1; }
          grep -Fq 'data/home-surprise.js' <<<"$live_html" || { echo 'Live homepage is missing Surprise flow wiring'; exit 1; }
          grep -Fq 'data/nearby-restaurants.js' <<<"$live_html" || { echo 'Live homepage is missing nearby restaurant wiring'; exit 1; }
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));if(!m.name||!m.start_url||!m.display)process.exit(2);" <<<"$live_manifest" || { echo 'Live manifest is invalid or missing required PWA fields'; exit 1; }

          grep -Fq 'surprise-a11y-v1' <<<"$live_probe" || { echo 'Live deployment probe is missing the Surprise accessibility release marker'; exit 1; }
          grep -Fq 'homeSurpriseStatus' <<<"$live_surprise" || { echo 'Live Surprise asset is missing the screen-reader status region'; exit 1; }
          grep -Fq "status.setAttribute('role','status')" <<<"$live_surprise" || { echo 'Live Surprise asset is missing role=status'; exit 1; }
          grep -Fq "status.setAttribute('aria-live','assertive')" <<<"$live_surprise" || { echo 'Live Surprise asset is missing assertive live-region wiring'; exit 1; }
          grep -Fq "b.setAttribute('aria-busy',on?'true':'false')" <<<"$live_surprise" || { echo 'Live Surprise asset is missing aria-busy state wiring'; exit 1; }
          grep -Fq "b.setAttribute('aria-disabled',on?'true':'false')" <<<"$live_surprise" || { echo 'Live Surprise asset is missing aria-disabled state wiring'; exit 1; }
          grep -Fq 'กำลังเลือกเมนูอาหารให้ กรุณารอสักครู่' <<<"$live_surprise" || { echo 'Live Surprise asset is missing the busy announcement text'; exit 1; }

          grep -Fq 'function ensurePwaInstallHelper()' <<<"$live_surprise" || { echo 'Live Surprise bootstrap is missing the PWA helper bridge'; exit 1; }
          grep -Fq 'script[src="data/pwa-install.js"]' <<<"$live_surprise" || { echo 'Live Surprise bootstrap is missing PWA helper duplicate-load protection'; exit 1; }
          grep -Fq "s.src='data/pwa-install.js'" <<<"$live_surprise" || { echo 'Live Surprise bootstrap is not loading data/pwa-install.js'; exit 1; }
          grep -Fq 'ensurePwaInstallHelper();' <<<"$live_surprise" || { echo 'Live Surprise bootstrap is not invoking the PWA helper bridge'; exit 1; }
          grep -Fq "const IOS_HINT_KEY='kinaraideeIosInstallHintDismissedAt'" <<<"$live_pwa" || { echo 'Live PWA helper is missing iOS hint suppression state'; exit 1; }
          grep -Fq "loadScript('data/home-surprise.js')" <<<"$live_pwa" || { echo 'Live PWA helper is missing its Surprise-flow compatibility bridge'; exit 1; }

          test "$live_marker" = "$expected_marker" || { echo "Live marker $live_marker does not match repository marker $expected_marker"; exit 1; }
          test "$meta_marker" = "$live_marker" || { echo "release-meta marker $meta_marker does not match live Service Worker marker $live_marker"; exit 1; }
          test -n "$deployed_sha" || { echo 'release-meta.json does not contain a valid deployed SHA'; exit 1; }
          grep -q 'cache.addAll(SHELL)' <<<"$live_sw"
          if grep -q 'Promise.allSettled' <<<"$live_sw"; then
            echo 'Live service worker is using a non-atomic shell install strategy.'
            exit 1
          fi

          echo "DEPLOYED_SHA=$deployed_sha" >> "$GITHUB_ENV"
          echo "LIVE_MARKER=$live_marker" >> "$GITHUB_ENV"
          echo "EXPECTED_RUNTIME_SHA=$expected_runtime" >> "$GITHUB_ENV"

      - name: Verify deployed SHA belongs to current main history and contains runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOYED_SHA:-}" || { echo 'Missing deployed SHA from release metadata check'; exit 1; }
          test -n "${EXPECTED_RUNTIME_SHA:-}" || { echo 'Missing expected runtime candidate SHA'; exit 1; }
          git fetch --no-tags --depth=200 origin main
          for sha in "$DEPLOYED_SHA" "$EXPECTED_RUNTIME_SHA"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha" || {
                echo "Unable to fetch SHA $sha from repository"
                exit 1
              }
            fi
          done
          git merge-base --is-ancestor "$DEPLOYED_SHA" "origin/main" || {
            echo "Deployed SHA $DEPLOYED_SHA is not an ancestor of current main"
            exit 1
          }
          git merge-base --is-ancestor "$EXPECTED_RUNTIME_SHA" "$DEPLOYED_SHA" || {
            echo "Deployed SHA $DEPLOYED_SHA does not contain current runtime candidate $EXPECTED_RUNTIME_SHA"
            exit 1
          }
          echo "Deployed SHA $DEPLOYED_SHA is traceable to current main and contains runtime candidate $EXPECTED_RUNTIME_SHA"

      - name: Check live Group API non-mutating rejection health
        shell: bash
        run: |
          set -euo pipefail
          url='https://cuspfvfzprlgtvtdyilh.supabase.co/functions/v1/group-api'
          body="$(mktemp)"
          oversized="$(mktemp)"
          trap 'rm -f "$body" "$oversized"' EXIT

          expect(){
            expected_status="$1"
            expected_error="$2"
            shift 2
            : > "$body"
            status="$(curl --silent --show-error --location --retry 2 --retry-delay 3 --max-time 25 --output "$body" --write-out '%{http_code}' "$@")"
            test "$status" = "$expected_status" || { echo "Unexpected Group API status: $status (expected $expected_status)"; cat "$body"; exit 1; }
            grep -Fq "\"error\":\"$expected_error\"" "$body" || { echo 'Unexpected Group API response body'; cat "$body"; exit 1; }
          }

          # All probes below are rejection-only and deliberately create/update no room or vote data.
          expect 405 method_not_allowed "$url"
          expect 400 invalid_room_id -H 'Content-Type: application/json' --data '{"action":"get_room","roomId":"not-a-uuid"}' "$url"

          printf '{"action":"unknown","padding":"' > "$oversized"
          head -c 9000 /dev/zero | tr '\0' 'x' >> "$oversized"
          printf '"}' >> "$oversized"
          test "$(wc -c < "$oversized")" -gt 8192
          expect 413 request_too_large --http1.1 -H 'Content-Type: application/json' -H 'Transfer-Encoding: chunked' --data-binary "@$oversized" "$url"

          echo 'GROUP_API_SYNTHETIC_SCOPE=rejection-only GET/malformed-room/chunked-oversize checks passed' >> "$GITHUB_ENV"

      - name: Verify development-only paths remain private
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          private_paths=(
            '/README.md'
            '/SECURITY.md'
            '/RELEASE-CHECKLIST.md'
            '/.github/workflows/pages.yml'
            '/supabase/config.toml'
          )

          for path in "${private_paths[@]}"; do
            code="$(curl --silent --location --output /dev/null --write-out '%{http_code}' --max-time 25 "$base$path")"
            echo "$path -> HTTP $code"
            if [ "$code" = '200' ]; then
              echo "Development-only path is unexpectedly public: $path"
              exit 1
            fi
          done

      - name: Record monitor scope
        if: always()
        shell: bash
        run: |
          {
            echo '## Public Beta synthetic monitor'
            echo
            echo "- Repository commit: \`${GITHUB_SHA}\`"
            echo "- Expected runtime candidate: \`${EXPECTED_RUNTIME_SHA:-unavailable}\`"
            echo "- Deployed SHA from release-meta: \`${DEPLOYED_SHA:-unavailable}\`"
            echo "- Live Service Worker marker: \`${LIVE_MARKER:-unavailable}\`"
            echo "- Group API synthetic scope: ${GROUP_API_SYNTHETIC_SCOPE:-not completed}"
            echo '- Target: https://rachanakorninon-gif.github.io/kinaraidee/ + deployed public Group API rejection surface'
            echo '- Scope: HTTP availability, homepage core wiring, manifest validity, Surprise accessibility source markers, active PWA install-helper bridge, release-meta/SW consistency, deployed-SHA ancestry + runtime-candidate lineage, atomic Service Worker install, non-mutating Group API rejection health, development-only path exposure'
            echo '- The Group API checks are rejection-only and intentionally perform no successful create/vote/update/close operation.'
            echo '- This workflow is synthetic monitoring only; it does not replace real-device TC/NF, TalkBack/VoiceOver behavior, application structured-event ingestion, retention/cleanup, abuse-control baselines, payment, partner, privacy/legal, or production security evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
