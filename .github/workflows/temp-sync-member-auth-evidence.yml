name: Temporary Sync Member Auth Evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.pull_request.head.ref == 'release/member-auth-deployment-evidence-pass' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch canonical evidence documents and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          candidate='e5c19d048ae556153ebe66bdb4598ab0d168da97'
          deployed='b6300e5458f17195c72a72ffa7ed0000fee40e24'
          pages='32737240239'
          smoke='32737301309'
          diag='32738157335'
          cache='kinaraidee-beta-v14'

          def replace_line(text, pattern, replacement, label, count=1):
              out,n=re.subn(pattern,replacement,text,count=count,flags=re.M)
              if n != count:
                  raise SystemExit(f'{label}: expected {count} replacement(s), got {n}')
              return out

          # CURRENT-RELEASE.md
          p=Path('CURRENT-RELEASE.md'); t=p.read_text()
          t=replace_line(t,r'^- Latest reviewed `main` descendant:.*$',f'- Latest reviewed `main` descendant: `{deployed}` (PR #164 merged member-auth deployment lineage).','current release latest main')
          t=replace_line(t,r'^- Compare from prior reviewed descendant.*$', '- Current browser/PWA deployment evidence was refreshed after PR #164; prior compare/evidence notes below remain historical context.', 'current release compare')
          t=replace_line(t,r'^- Current browser/PWA runtime candidate:.*$',f'- Current browser/PWA runtime candidate: `{candidate}` (PR #164 member-auth runtime lineage).','current release candidate')
          t=replace_line(t,r'^- Runtime merge/deployed SHA:.*$',f'- Runtime merge/deployed SHA: `{deployed}` (PR #164 merged).','current release deployed')
          if f'Pages workflow run `{pages}`' not in t:
              marker='Verified v14 evidence:\n\n'
              block=(f'- Current member-auth runtime: PR #164 merged as `{deployed}`; the Service Worker remains `{cache}` because the cached shell did not change.\n'
                     f'- Pages workflow run `{pages}` completed success for exact deployed SHA `{deployed}`.\n'
                     f'- Corresponding Live Smoke run `{smoke}` completed success on the same SHA.\n'
                     f'- Read-only diagnostic run `{diag}` confirmed exact Pages/Live Smoke metadata, public `release-meta.json` SHA/cache, deployed `member.html` / `reset-password.html` hardening, and public `admin.html` HTTP 404; temporary PR #165 closed without merge.\n'
                     f'- Live public `release-meta.json` matched `{deployed}` and `{cache}`.\n'
                     '- Prior PR #134/v14 focus and reduced-motion deployment evidence remains historical support for unchanged runtime portions and is not reused as proof of the member-auth deployment by itself.\n\n')
              if marker not in t: raise SystemExit('current release verified evidence marker missing')
              t=t.replace(marker,marker+block,1)
          t=re.sub(r'^- The latest reviewed descendant .*$',f'- The current deployed browser/PWA lineage is `{deployed}`; older reviewed descendants below remain historical evidence only.',t,count=1,flags=re.M)
          if 'PR #164 changed the browser/PWA runtime' not in t:
              anchor='PR #134 changed browser/PWA runtime behavior by adding visible keyboard focus and reduced-motion accessibility hardening on the main app and public Feedback/Partner forms. Therefore historical PR #79 / v13 deployment evidence is no longer the current runtime deployment evidence.\n'
              add=('\nPR #164 changed the browser/PWA runtime by hardening public member/reset error handling and password length, correcting reset return to `member.html`, and adding both auth pages to the clean Pages artifact, runtime-lineage guard and Live Smoke scope. The merged deployment trace is recorded below.\n')
              if anchor not in t: raise SystemExit('current release PR134 anchor missing')
              t=t.replace(anchor,anchor+add,1)
          gov=('## Repository governance\n\nStatus: **ENFORCED FOR `main` THROUGH THE `Protect main` RULESET**. Repository evidence records that PR #159 passed the required checks and merged, while PR #160 had a failing `release-consistency` check and GitHub blocked the merge under the repository rule; Issue #35 is closed as completed.\n\nThis governance PASS is scoped to merge-rule enforcement. It does not replace runtime deployment, Supabase Auth, device, privacy/legal, payment or Commercial readiness evidence.\n')
          t,n=re.subn(r'## Repository governance\n\n.*?(?=\n## Public Beta gate impact)',gov,t,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'governance section replacement count {n}')
          t=re.sub(r'^- actual `main` branch protection / required-check enforcement \(#35\);$', '- repository governance must remain enforced; Issue #35 is closed after verified required-check blocking evidence;', t, count=1, flags=re.M)
          t=replace_line(t,r'^- Current browser/PWA runtime candidate =.*$',f'- Current browser/PWA runtime candidate = PR #164 member-auth lineage `{candidate}`; deployed merge SHA = `{deployed}`.','supersession runtime')
          t=re.sub(r'^- Reviewed descendant `ca339234[^\n]*$',f'- Merged PR #164 / `{deployed}` supersedes the earlier browser/PWA deployment candidate; later evidence-only descendants do not create a newer runtime unless browser/PWA assets change.',t,count=1,flags=re.M)
          p.write_text(t)

          # RELEASE-CHECKLIST.md
          p=Path('RELEASE-CHECKLIST.md'); t=p.read_text()
          t=replace_line(t,r'^- Current browser/PWA runtime candidate:.*$',f'- Current browser/PWA runtime candidate: `{candidate}` (PR #164 member-auth runtime lineage)','checklist candidate')
          t=replace_line(t,r'^- Runtime merge/deployed SHA:.*$',f'- Runtime merge/deployed SHA: `{deployed}` (PR #164 merged)','checklist deployed')
          t=replace_line(t,r'^- PR #134 adds visible keyboard focus.*$', '- PR #164 hardens public member/reset auth pages and Pages deployment scope; prior PR #134 visible-focus/reduced-motion hardening remains present in the unchanged v14 shell/runtime.', 'checklist runtime summary')
          t=replace_line(t,r'^- Verified browser/PWA deployment evidence:.*$',f'- Verified browser/PWA deployment evidence: Pages run `{pages}` = success and Live Smoke run `{smoke}` = success for deployed SHA `{deployed}`; read-only diagnostic run `{diag}` confirmed the exact run metadata and public auth-page state.','checklist verified deployment')
          t=replace_line(t,r'^- Live public `release-meta.json` matched deployed SHA.*$',f'- Live public `release-meta.json` matched deployed SHA `{deployed}` and live Service Worker marker `{cache}`; deployed member/reset pages passed the error-hygiene/8-character/reset-return contract and public `admin.html` returned 404.','checklist live metadata')
          t=replace_line(t,r'^- \[x\] GitHub Pages deployment ของ `.*$',f'- [x] GitHub Pages deployment ของ `{deployed}` สำเร็จและ trace กลับไปยัง commit ได้ — run `{pages}`','checklist pages evidence')
          t=replace_line(t,r'^- \[x\] Public `release-meta.json` ถูกตรวจและมี deployed SHA.*$',f'- [x] Public `release-meta.json` ถูกตรวจและมี deployed SHA `{deployed}` กับ live Service Worker marker `{cache}`','checklist metadata evidence')
          t=replace_line(t,r'^- \[x\] Corresponding Live Smoke ของ runtime SHA เดียวกันสำเร็จ.*$',f'- [x] Corresponding Live Smoke ของ runtime SHA เดียวกันสำเร็จ — run `{smoke}`','checklist smoke evidence')
          t=replace_line(t,r'^- \[x\] Read-only diagnostic run `.*$',f'- [x] Read-only diagnostic run `{diag}` ยืนยัน exact Pages/Live Smoke run metadata, public member/reset auth contract และ `admin.html` = 404 ของ deployment ปัจจุบัน','checklist diag evidence')
          t=replace_line(t,r'^- \[x\] Live Smoke ตรวจ public assets, current live markers,.*$', '- [x] Live Smoke ตรวจ public assets, current live markers, v14 focus/reduced-motion source contracts, accessibility/group/PWA contracts, member/reset auth deployment contract, development-file exclusion และ traceable automated evidenceสำเร็จ', 'checklist smoke scope')
          if 'Member signup/login/password-reset interaction' not in t:
              anchor='- [ ] Member cloud history / favorite persistence มี evidence ครบตาม device matrix ที่กำหนด ไม่อาศัย Android session เดียว\n'
              line='- [ ] Member signup/login/password-reset interaction ผ่านบนอุปกรณ์จริงตาม scope; automated deployed-source checks ไม่แทนการสมัคร/เข้าสู่ระบบ/รับอีเมล reset และตั้งรหัสผ่านจริง\n'
              if anchor not in t: raise SystemExit('checklist member history anchor missing')
              t=t.replace(anchor,line+anchor,1)
          p.write_text(t)

          # LIVE-DEPLOYMENT-VERIFICATION.md
          p=Path('LIVE-DEPLOYMENT-VERIFICATION.md'); t=p.read_text()
          t=replace_line(t,r'^- Canonical runtime candidate SHA:.*$',f'- Canonical runtime candidate SHA: `{candidate}` (PR #164 member-auth runtime lineage)','live candidate')
          t=replace_line(t,r'^- Runtime merge/deployed SHA:.*$',f'- Runtime merge/deployed SHA: `{deployed}` (PR #164 merged)','live deployed')
          t=replace_line(t,r'^- PR #134 adds visible keyboard focus.*$', '- PR #164 hardens the public member/reset flow and deployment contract; prior PR #134 focus/reduced-motion hardening remains present in the current v14 runtime.', 'live summary')
          t=replace_line(t,r'^- This runtime has matching successful Pages deployment.*$',f'- This runtime has matching successful Pages run `{pages}`, Live Smoke run `{smoke}`, and read-only diagnostic run `{diag}`.','live matching')
          if f'Pages workflow run `{pages}`' not in t:
              marker='Confirmed evidence:\n\n'
              block=(f'- PR #164 merged as `{deployed}` and is the current deployed browser/PWA lineage.\n'
                     f'- Pages workflow run `{pages}` completed **success** for exact deployed SHA `{deployed}`.\n'
                     f'- Corresponding Live Smoke run `{smoke}` completed **success** on the same SHA.\n'
                     f'- Read-only diagnostic run `{diag}` confirmed the exact Pages/Live Smoke records and public-site state; temporary PR #165 closed without merge.\n'
                     f'- Live public `release-meta.json` matched `{deployed}` with `{cache}`.\n'
                     '- Live verification confirmed public member/reset pages use the 8-character minimum, do not expose raw backend `error.message`, reset returns to `member.html`, and `admin.html` is not published (HTTP 404).\n\n')
              if marker not in t: raise SystemExit('live confirmed marker missing')
              t=t.replace(marker,marker+block,1)
          t=t.replace('- PR #134 merged as `e30aa999f6277b221bf8dae85aa3b23521ad6f06`.', '- Historical PR #134 merged as `e30aa999f6277b221bf8dae85aa3b23521ad6f06`.',1)
          t,n=re.subn(r'Subsequent main SHA `19626daf.*?browser runtime candidate remains PR #134 / `db539c75\.\.\.` with v14 assets\.',f'Historical documentation-only and evidence-only descendants remain preserved below. They are superseded for the current browser/PWA deployment trace by PR #164 / `{deployed}` with Pages `{pages}`, Live Smoke `{smoke}` and diagnostic `{diag}`; the Service Worker cache remains `{cache}`.',t,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'live historical paragraph replacement count {n}')
          if '- [x] public member/reset auth pages' not in t:
              anchor='- [x] Pages run ID and Live Smoke run ID are recorded\n'
              line='- [x] public member/reset auth pages are deployed with the 8-character/error-hygiene/reset-return contract, while owner/admin pages remain excluded\n'
              if anchor not in t: raise SystemExit('live checklist anchor missing')
              t=t.replace(anchor,anchor+line,1)
          if f'- Current Pages run: `{pages}`' not in t:
              marker='## Evidence record\n\n'
              block=(f'- Current Pages run: `{pages}` — success on `{deployed}`\n'
                     f'- Current Live Smoke run: `{smoke}` — success on `{deployed}`\n'
                     f'- Current read-only diagnostic run: `{diag}` — success; PR #165 closed without merge\n')
              if marker not in t: raise SystemExit('live evidence record marker missing')
              t=t.replace(marker,marker+block,1)
          p.write_text(t)

          # Ensure CURRENT-RUNTIME already contains the exact verified trace.
          runtime=Path('CURRENT-RUNTIME.md').read_text()
          for needle in [candidate,deployed,pages,smoke,diag,'PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE']:
              if needle not in runtime: raise SystemExit(f'CURRENT-RUNTIME missing {needle}')
          PY
          git rm .github/workflows/temp-sync-member-auth-evidence.yml
          git config user.name 'kinaraidee-evidence-sync'
          git config user.email 'kinaraidee-evidence-sync@users.noreply.github.com'
          git add CURRENT-RELEASE.md RELEASE-CHECKLIST.md LIVE-DEPLOYMENT-VERIFICATION.md CURRENT-RUNTIME.md
          if git diff --cached --quiet; then
            echo 'No evidence changes to commit.'
            exit 0
          fi
          git commit -m 'Sync verified member auth deployment evidence'
          git push origin HEAD:${GITHUB_HEAD_REF}
