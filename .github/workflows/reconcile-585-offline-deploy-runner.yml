name: Issue 585 offline deployment reconciliation

on:
  push:
    branches:
      - docs/reconcile-585-offline-deploy-20260912
    paths:
      - .github/workflows/reconcile-585-offline-deploy-runner.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-585-offline-deploy-20260912
          fetch-depth: 0
      - run: python .github/scripts/reconcile-585-offline-deploy.py
      - run: |
          rm .github/scripts/reconcile-585-offline-deploy.py
          rm .github/workflows/reconcile-585-offline-deploy-runner.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(release): reconcile Issue 585 offline deployment"
          git push origin HEAD:docs/reconcile-585-offline-deploy-20260912
