name: Kinaraidee Group API Regression

on:
  push:
    branches: ["main"]
    paths:
      - 'supabase/functions/group-api/**'
      - '.github/workflows/group-api-regression.yml'
      - '.github/workflows/group-api-live-observability-probe.yml'
  pull_request:
    paths:
      - 'supabase/functions/group-api/**'
      - '.github/workflows/group-api-regression.yml'
      - '.github/workflows/group-api-live-observability-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Group API security invariants
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/functions/group-api/index.ts'
          privileged_name='SUPABASE_''SERVICE_ROLE_KEY'
          test -s "$file"
          grep -q "Access-Control-Allow-Methods':'POST, OPTIONS'" "$file"
          grep -q "req.method!=='POST'" "$file"
          grep -Fq "const maxRequestBytes=8192" "$file"
          grep -Fq "contentLength>maxRequestBytes" "$file"
          grep -Fq "const readBodyLimited=" "$file"
          grep -Fq "req.body.getReader()" "$file"
          grep -Fq "totalBytes+=value.byteLength" "$file"
          grep -Fq "totalBytes>maxRequestBytes" "$file"
          grep -Fq "await reader.cancel()" "$file"
          grep -Fq "bodyResult=await readBodyLimited(req)" "$file"
          grep -Fq "b=JSON.parse(rawBody)" "$file"
          grep -q "'Cache-Control':'no-store'" "$file"
          grep -q "'X-Content-Type-Options':'nosniff'" "$file"
          grep -q "$privileged_name" "$file"
          grep -q "const allowedMeals=" "$file"
          grep -q "const allowedBudgets=" "$file"
          grep -q "const allowedTags=" "$file"
          grep -Fq "const uuidPattern=" "$file"
          grep -Fq "const hostTokenPattern=" "$file"
          grep -Fq "const validRoomId=" "$file"
          grep -q "size<2||size>6" "$file"
          grep -Fq "voterId.length>120" "$file"
          grep -q "tags.length>3" "$file"
          grep -q "room_full" "$file"
          grep -q "host_token!==hostToken" "$file"
          grep -q "room.status!=='open'" "$file"
          grep -q "new Date(room.expires_at)<=new Date()" "$file"
          grep -q "onConflict:'room_id,voter_id'" "$file"
          test "$(grep -Fc "!validRoomId(roomId)" "$file")" -ge 4
          test "$(grep -Fc "!hostTokenPattern.test(hostToken)" "$file")" -ge 2
          if grep -Fq "req.json()" "$file"; then echo 'Direct req.json() parsing would bypass the bounded body reader.'; exit 1; fi
          if grep -Fq "req.text()" "$file"; then echo 'Direct req.text() buffering would bypass bounded streaming.'; exit 1; fi
          if grep -qE "${privileged_name}[[:space:]]*=[[:space:]]*['\"]" "$file"; then echo 'Possible hard-coded privileged Supabase credential assignment detected.'; exit 1; fi
          echo 'Group API source contract checks passed.'

      - name: Verify privacy-safe observability contract
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/functions/group-api/index.ts'
          grep -Fq "const logEvent=" "$file"
          grep -Fq "component:'group-api'" "$file"
          grep -Fq "create_room_succeeded" "$file"
          grep -Fq "submit_vote_succeeded" "$file"
          grep -Fq "submit_vote_rejected" "$file"
          grep -Fq "get_votes_succeeded" "$file"
          grep -Fq "close_room_succeeded" "$file"
          grep -Fq "request_rejected" "$file"
          grep -Fq "invalid_room_id" "$file"
          if grep -E "logEvent\([^\n]*(roomId|hostToken|host_token|voterId|voter_id|tags|req\.headers|req\.json|req\.text|rawBody|contentLength|bodyResult\.text)" "$file"; then echo 'Privacy-sensitive value referenced in Group API event logging.'; exit 1; fi
          if grep -E "console\.(log|info|warn|error)\([^\n]*(roomId|hostToken|host_token|voterId|voter_id|tags|rawBody|bodyResult\.text)" "$file"; then echo 'Direct sensitive identifier/request-body logging detected.'; exit 1; fi
          echo 'Privacy-safe observability contract checks passed.'

      - name: Verify scheduled live probe remains rejection-only and alertable
        shell: bash
        run: |
          set -euo pipefail
          probe='.github/workflows/group-api-live-observability-probe.yml'
          test -s "$probe"
          grep -Fq "cron: '23 */6 * * *'" "$probe"
          grep -Fq 'alert_self_test:' "$probe"
          grep -Fq 'Controlled alert-delivery self-test; skips live API requests' "$probe"
          grep -Fq "if [ \"$ALERT_SELF_TEST\" = 'true' ]; then" "$probe"
          grep -Fq 'No live Group API request will be sent' "$probe"
          grep -Fq 'issues: write' "$probe"
          grep -Fq 'curl_common=(--silent --show-error --location --connect-timeout 10 --max-time 30)' "$probe"
          grep -Fq 'curl "${curl_common[@]}"' "$probe"
          grep -Fq 'Network boundary: every live request has a 10-second connection timeout and 30-second total-transfer timeout' "$probe"
          grep -Fq 'expect 405 method_not_allowed' "$probe"
          grep -Fq 'expect 400 invalid_room_id' "$probe"
          grep -Fq 'expect 403 forbidden' "$probe"
          grep -Fq 'expect 413 request_too_large' "$probe"
          grep -Fq 'Transfer-Encoding: chunked' "$probe"
          grep -Fq 'deliberately performs no successful create/vote/update/close action' "$probe"
          grep -Fq 'if: failure()' "$probe"
          grep -Fq 'GH_TOKEN:' "$probe"
          grep -Fq 'github.token' "$probe"
          grep -Fq "alert_title='Group API live probe failure'" "$probe"
          grep -Fq "alert_title='Group API alert delivery self-test'" "$probe"
          grep -Fq 'gh issue list' "$probe"
          grep -Fq 'gh issue comment' "$probe"
          grep -Fq 'gh issue create' "$probe"
          grep -Fq '/actions/runs/${GITHUB_RUN_ID}' "$probe"
          grep -Fq 'Self-test boundary: when alert_self_test=true' "$probe"
          grep -Fq 'Alert-delivery verification requires an inspected controlled or real failure run plus the resulting issue/comment evidence' "$probe"
          if grep -Eq '^[[:space:]]*expect[[:space:]]+2[0-9][0-9][[:space:]]' "$probe"; then echo 'Scheduled live probe contains an expected 2xx request and may mutate production data.'; exit 1; fi
          echo 'Scheduled Group API live probe remains rejection-only, time-bounded and carries an isolated controlled alert-delivery self-test.'

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Group API source regression gate'
            echo
            echo '- Checks Group API source security, bounded-body and privacy-safe observability invariants.'
            echo '- Guards the six-hour rejection-only live probe and explicit connection/transfer timeouts.'
            echo '- Requires an isolated workflow_dispatch alert self-test that exits before any live Group API request and uses a distinct self-test issue title.'
            echo '- A self-test implementation is not alert-delivery PASS; verification still requires an inspected self-test run and resulting issue/comment.'
            echo '- This is static source/workflow-contract evidence only and does not prove retention, complete abuse control, monitoring SLA, real-device behavior or Commercial readiness.'
          } >> "$GITHUB_STEP_SUMMARY"
