name: Surprise Accessibility Regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-surprise-announcement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Surprise accessibility announcement contract
        shell: bash
        run: |
          set -euo pipefail
          node --check data/home-surprise.js
          grep -Fq "const READY_LABEL='ไม่รู้เลย ให้ระบบเลือกเมนูอาหารให้ทันที';" data/home-surprise.js
          grep -Fq "const BUSY_MESSAGE='กำลังเลือกเมนูอาหารให้ กรุณารอสักครู่';" data/home-surprise.js
          grep -Fq "status.setAttribute('role','status')" data/home-surprise.js
          grep -Fq "status.setAttribute('aria-live','assertive')" data/home-surprise.js
          grep -Fq "status.setAttribute('aria-atomic','true')" data/home-surprise.js
          grep -Fq "document.body.appendChild(status)" data/home-surprise.js
          grep -Fq "status.textContent=BUSY_MESSAGE" data/home-surprise.js
          grep -Fq "clearStatusLater(status)" data/home-surprise.js
          grep -Fq "b.setAttribute('aria-disabled',on?'true':'false')" data/home-surprise.js
          grep -Fq "b.setAttribute('aria-busy',on?'true':'false')" data/home-surprise.js
          grep -Fq "b.setAttribute('aria-label',on?BUSY_MESSAGE:READY_LABEL)" data/home-surprise.js
          grep -Fq "if(busy)return" data/home-surprise.js
          grep -Fq "setBusy(false)" data/home-surprise.js

      - name: Check visible focus and reduced-motion contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "style.id='kinaraideeAccessibilityStyles'" data/home-surprise.js
          grep -Fq 'button:focus-visible' data/home-surprise.js
          grep -Fq '@media (prefers-reduced-motion: reduce)' data/home-surprise.js
          grep -Fq 'outline:3px solid #0b6bcb' data/home-surprise.js
          grep -Fq 'button:focus-visible' feedback.html
          grep -Fq 'prefers-reduced-motion:reduce' feedback.html
          grep -Fq 'button:focus-visible' partner.html
          grep -Fq 'prefers-reduced-motion:reduce' partner.html
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test -n "$marker" || { echo 'Unable to derive current Service Worker cache marker'; exit 1; }
          grep -Fq "PWA cache marker: \`$marker\`" CURRENT-RUNTIME.md || { echo "CURRENT-RUNTIME.md does not match $marker"; exit 1; }
          echo "Accessibility source contracts preserved on $marker"

      - name: Verify scoped physical NF-09 evidence remains recorded
        shell: bash
        run: |
          set -euo pipefail
          matrix='BETA-DEVICE-MATRIX.md'
          tests='BETA-NEW-FLOW-TESTS.md'
          grep -Fq 'iPhone NF-09 VoiceOver = **PASS on deployed PR #201/v16 on 2026-08-26 for iPhone #1**' "$matrix"
          grep -Fq 'Issue #57 closed completed' "$matrix"
          grep -Fq 'Android TalkBack #1 ยังคง INCONCLUSIVE' "$matrix"
          grep -Fq 'Current physical evidence: iPhone/VoiceOver #1 on deployed PR #201 / v16 completed NF-09 on 2026-08-26.' "$tests"
          grep -Fq 'This PASS does not establish Android TalkBack or other-device acceptance.' "$tests"
          echo 'Scoped physical VoiceOver NF-09 evidence boundary preserved'

      - name: Explain evidence boundary
        run: |
          echo 'Static accessibility regression guard passed.'
          echo 'The live region is required to remain outside hidden .screen containers during loading.'
          echo 'Visible-focus and reduced-motion source contracts are guarded for the main app and public forms.'
          echo 'Physical NF-09 PASS is separately recorded only for the tested iPhone/VoiceOver session on PR #201/v16.'
          echo 'Android TalkBack, keyboard interaction, reduced-motion behavior, second-device coverage and full Public Beta acceptance remain separate evidence gates.'
