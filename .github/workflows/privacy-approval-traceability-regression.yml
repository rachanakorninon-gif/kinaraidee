name: Privacy Approval Traceability Regression

on:
  pull_request:
    paths:
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - '.github/workflows/privacy-approval-traceability-regression.yml'
  push:
    branches: ['main']
    paths:
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - '.github/workflows/privacy-approval-traceability-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate approved Privacy Legal traceability fields
        shell: bash
        run: |
          set -euo pipefail
          file='PRODUCTION-PRIVACY-LEGAL-DECISION.md'
          test -s "$file"

          # Current NOT APPROVED state must remain policy-neutral and must not fabricate future evidence.
          if grep -q '^Status: \*\*NOT APPROVED\*\*$' "$file"; then
            grep -Fq 'Service/controller legal identity: **UNSET**' "$file"
            grep -Fq 'Production contact channel: **UNSET**' "$file"
            grep -Fq 'Privacy Policy URL/version: **UNSET**' "$file"
            grep -Fq 'Terms of Service URL/version: **UNSET**' "$file"
            grep -Fq 'PDPA/legal reviewer or approver: **UNSET**' "$file"
            grep -Fq 'Approved retention decision reference: **UNSET**' "$file"
            grep -Fq 'Approved at: **UNSET**' "$file"
            exit 0
          fi

          grep -q '^Status: \*\*APPROVED\*\*$' "$file" || {
            echo 'Privacy/Legal status must be NOT APPROVED or APPROVED.'
            exit 1
          }

          field_value() {
            local label="$1"
            sed -n "s/^- ${label}: \\*\\*\\(.*\\)\\*\\*$/\\1/p" "$file" | head -n1
          }

          controller_value="$(field_value 'Service/controller legal identity')"
          contact_value="$(field_value 'Production contact channel')"
          privacy_value="$(field_value 'Privacy Policy URL/version')"
          terms_value="$(field_value 'Terms of Service URL/version')"
          reviewer_value="$(field_value 'PDPA/legal reviewer or approver')"
          retention_value="$(field_value 'Approved retention decision reference')"
          approved_value="$(field_value 'Approved at')"

          for pair in \
            "controller:$controller_value" \
            "contact:$contact_value" \
            "reviewer:$reviewer_value" \
            "retention:$retention_value"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ] || [ "$value" = 'UNSET' ]; then
              echo "APPROVED Privacy/Legal decision requires a traceable $name value."
              exit 1
            fi
          done

          [[ "$privacy_value" =~ ^https://[^[:space:]]+ ]] || {
            echo 'APPROVED Privacy Policy reference must begin with a traceable HTTPS URL.'
            exit 1
          }
          [[ "$terms_value" =~ ^https://[^[:space:]]+ ]] || {
            echo 'APPROVED Terms reference must begin with a traceable HTTPS URL.'
            exit 1
          }

          # The retention reference may be a traceable HTTPS record or a repository Markdown evidence/decision file.
          if [[ "$retention_value" =~ ^https://[^[:space:]]+ ]]; then
            :
          else
            retention_path="${retention_value%%[[:space:]#]*}"
            retention_path="${retention_path//\`/}"
            [[ "$retention_path" == *.md ]] && test -s "$retention_path" || {
              echo 'APPROVED retention reference must be an HTTPS URL or an existing repository Markdown file.'
              exit 1
            }
          fi

          node - "$approved_value" <<'NODE'
          const value = process.argv[2];
          const parsed = Date.parse(value);
          if (!value || Number.isNaN(parsed)) {
            console.error('APPROVED timestamp must be a parseable date/time value.');
            process.exit(1);
          }
          const now = Date.now();
          if (parsed > now + 5 * 60 * 1000) {
            console.error('APPROVED timestamp must not be materially in the future.');
            process.exit(1);
          }
          NODE

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Privacy approval traceability regression'
            echo
            echo '- NOT APPROVED keeps controller/contact, Privacy/Terms, legal reviewer, retention reference and approval timestamp fields UNSET.'
            echo '- A future APPROVED state requires traceable controller/contact/reviewer values, HTTPS Privacy/Terms references, a traceable retention decision reference and a parseable non-future approval timestamp.'
            echo '- This guard validates evidence shape only; it does not review legal substance, publish policies, approve PDPA compliance, execute retention cleanup, or create Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
