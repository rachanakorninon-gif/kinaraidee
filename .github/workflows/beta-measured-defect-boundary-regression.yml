name: Beta Measured Defect Boundary Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require measured defect evidence language
        shell: bash
        run: |
          set -euo pipefail
          files=(BETA-METRICS.md BETA-CHECKLIST.md BETA-DAY-1-RUNBOOK.md BETA-TESTER-GUIDE.md BETA-RECRUITMENT.md BETA-RESULTS-TEMPLATE.md BETA-30-DAY-PLAN.md PRODUCTION-READINESS.md LAUNCH-PLAN-30-DAYS.md RELEASE-CHECKLIST.md)
          for file in "${files[@]}"; do
            test -s "$file" || exit 1
            grep -Fq 'release-scoped defect evidence' "$file" || exit 1
          done

      - name: Guard all Markdown zero-defect claims
        shell: bash
        run: |
          set -euo pipefail
          zero_defect_pattern='\b(Blocker|Blockers|Critical|Criticals)([[:space:]]*/[[:space:]]*(Blocker|Blockers|Critical|Criticals))?[[:space:]]*[:=][[:space:]]*0\b'
          while IFS= read -r file; do
            if grep -Eiq "$zero_defect_pattern" "$file"; then
              if ! grep -Fq 'release-scoped defect evidence' "$file"; then
                echo "Zero-defect claim without measured evidence boundary: $file" >&2
                exit 1
              fi
            fi
          done < <(find . -type f -name '*.md' -not -path './.git/*' -print)
