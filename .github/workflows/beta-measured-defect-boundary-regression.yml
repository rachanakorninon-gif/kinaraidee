name: Beta Measured Defect Boundary Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require measured defect evidence language
        shell: bash
        run: |
          set -euo pipefail
          files=(BETA-CHECKLIST.md BETA-READY.md BETA-DAY-1-RUNBOOK.md BETA-TESTER-GUIDE.md BETA-TESTER-RECRUITMENT.md BETA-RECRUITMENT.md BETA-RESULTS-TEMPLATE.md BETA-30-DAY-PLAN.md PRODUCTION-READINESS.md LAUNCH-PLAN-30-DAYS.md RELEASE-CHECKLIST.md)
          for file in "${files[@]}"; do
            test -s "$file" || exit 1
            grep -Fq 'release-scoped defect evidence' "$file" || exit 1
          done
