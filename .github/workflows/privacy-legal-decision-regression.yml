name: Privacy Legal Decision Regression

on:
  pull_request:
    paths:
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - 'RELEASE-CHECKLIST.md'
      - 'DATA-GOVERNANCE-DRAFT.md'
      - 'DATA-RETENTION-DECISION-INDEX.md'
      - '.github/workflows/privacy-legal-decision-regression.yml'
  push:
    branches: ['main']
    paths:
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - 'RELEASE-CHECKLIST.md'
      - 'DATA-GOVERNANCE-DRAFT.md'
      - 'DATA-RETENTION-DECISION-INDEX.md'
      - '.github/workflows/privacy-legal-decision-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Production Privacy Legal decision state
        shell: bash
        run: |
          set -euo pipefail
          file='PRODUCTION-PRIVACY-LEGAL-DECISION.md'
          test -s "$file"

          grep -Eq '^Status: \*\*(NOT APPROVED|APPROVED)\*\*$' "$file"
          required_fields=(
            'Service/controller legal identity:'
            'Production contact channel:'
            'Privacy Policy URL/version:'
            'Terms of Service URL/version:'
            'PDPA/legal reviewer or approver:'
            'Processing-purpose/legal-basis review:'
            'Approved retention decision reference:'
            'Data-rights procedure owner:'
            'Supabase/vendor disclosure review:'
            'Maps/location disclosure review:'
            'Payment-provider disclosure review:'
            'Partner-tracking disclosure/agreement review:'
            'Approved at:'
          )
          for marker in "${required_fields[@]}"; do
            grep -Fq -- "$marker" "$file" || { echo "Missing Privacy/Legal decision field: $marker"; exit 1; }
          done
          grep -Fq 'They do not prove Production Privacy Policy publication' "$file"

          if grep -q '^Status: \*\*NOT APPROVED\*\*$' "$file"; then
            required_unset=(
              'Service/controller legal identity: **UNSET**'
              'Production contact channel: **UNSET**'
              'Privacy Policy URL/version: **UNSET**'
              'Terms of Service URL/version: **UNSET**'
              'PDPA/legal reviewer or approver: **UNSET**'
              'Processing-purpose/legal-basis review: **UNSET**'
              'Approved retention decision reference: **UNSET**'
              'Data-rights procedure owner: **UNSET**'
              'Supabase/vendor disclosure review: **UNSET**'
              'Maps/location disclosure review: **UNSET**'
              'Payment-provider disclosure review: **UNSET**'
              'Partner-tracking disclosure/agreement review: **UNSET**'
              'Approved at: **UNSET**'
            )
            for marker in "${required_unset[@]}"; do
              grep -Fq -- "$marker" "$file" || { echo "NOT APPROVED Privacy/Legal decision contains inferred/fabricated value or missing UNSET marker: $marker"; exit 1; }
            done
          fi

          if grep -q '^Status: \*\*APPROVED\*\*$' "$file"; then
            if grep -q '\*\*UNSET\*\*' "$file"; then
              echo 'APPROVED Privacy/Legal decision still contains UNSET fields.'
              exit 1
            fi
            grep -Fq 'Do not change Status to **APPROVED** until every applicable field above contains a real reviewed value' "$file"
            grep -Fq 'If a field is genuinely not applicable, record the reviewed rationale explicitly' "$file"
          fi

      - name: Verify Commercial checklist respects Privacy Legal decision boundary
        shell: bash
        run: |
          set -euo pipefail
          decision='PRODUCTION-PRIVACY-LEGAL-DECISION.md'
          checklist='RELEASE-CHECKLIST.md'
          test -s "$checklist"

          open_items=(
            '- [ ] Privacy Policy ฉบับ Production เผยแพร่จริง'
            '- [ ] Terms of Service เผยแพร่จริง'
            '- [ ] ช่องทางติดต่อเจ้าของบริการจริง'
            '- [ ] กำหนด retention/deletion ของข้อมูลและขั้นตอนคำขอของผู้ใช้'
          )
          checked_items=(
            '- [x] Privacy Policy ฉบับ Production เผยแพร่จริง'
            '- [x] Terms of Service เผยแพร่จริง'
            '- [x] ช่องทางติดต่อเจ้าของบริการจริง'
            '- [x] กำหนด retention/deletion ของข้อมูลและขั้นตอนคำขอของผู้ใช้'
          )

          if grep -q '^Status: \*\*NOT APPROVED\*\*$' "$decision"; then
            for item in "${open_items[@]}"; do
              grep -Fq -- "$item" "$checklist" || { echo "Commercial Privacy/Legal checklist gate must remain open while decision is NOT APPROVED: $item"; exit 1; }
            done
            for item in "${checked_items[@]}"; do
              if grep -Fq -- "$item" "$checklist"; then
                echo "Commercial Privacy/Legal checklist item is marked complete while canonical decision is NOT APPROVED: $item"
                exit 1
              fi
            done
          else
            # Approval makes checklist completion eligible for evidence review; it does not auto-check anything.
            grep -Fq 'Privacy Policy ฉบับ Production' "$checklist"
            grep -Fq 'Terms of Service' "$checklist"
            grep -Fq 'ช่องทางติดต่อเจ้าของบริการจริง' "$checklist"
            grep -Fq 'retention/deletion' "$checklist"
          fi

      - name: Verify retention approval is not inferred
        shell: bash
        run: |
          set -euo pipefail
          decision='PRODUCTION-PRIVACY-LEGAL-DECISION.md'
          retention='DATA-RETENTION-DECISION-INDEX.md'
          test -s "$retention"

          if grep -q '^Status: \*\*NOT APPROVED\*\*$' "$decision"; then
            grep -Fq 'NOT APPROVED' "$retention"
            grep -Fq 'NOT VERIFIED' "$retention"
          else
            # Production Privacy/Legal approval requires real approved retention decisions for applicable data classes.
            # Cleanup/anonymization execution remains a separate evidence gate and may still be NOT VERIFIED.
            if grep -Fq 'DECISIONS INCOMPLETE' "$retention"; then
              echo 'Privacy/Legal is APPROVED while the canonical retention index still says DECISIONS INCOMPLETE.'
              exit 1
            fi
            if grep -Eq '\| \*\*NOT APPROVED([^*]|\*[^*])*\*\* \|' "$retention"; then
              echo 'Privacy/Legal is APPROVED while a retention decision row is still NOT APPROVED.'
              exit 1
            fi
            if grep -Fq 'No approved per-class decision record yet' "$retention"; then
              echo 'Privacy/Legal is APPROVED while an applicable data class still lacks an approved retention decision record.'
              exit 1
            fi
          fi

          # Even after Privacy/Legal approval, retention execution remains a separate evidence gate.
          grep -Fq 'cleanup' "$retention"

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Privacy / Legal decision regression'
            echo
            echo '- Supports both NOT APPROVED and future APPROVED decision states without weakening evidence requirements.'
            echo '- NOT APPROVED requires canonical decision fields to remain UNSET and Commercial Privacy/Terms/contact/retention checklist gates to remain open.'
            echo '- APPROVED is rejected while any UNSET decision field remains; approval only makes checklist completion eligible for separate evidence review.'
            echo '- APPROVED is also rejected while the canonical retention index still has incomplete or unapproved retention decisions; cleanup execution remains a separate gate.'
            echo '- Retention cleanup/execution remains a separate evidence gate and is not inferred from Privacy/Legal approval.'
            echo '- Static CI success is not Production Privacy Policy publication, Terms acceptance, legal/PDPA approval, approved retention execution, Public Beta PASS, or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
