name: Privacy Legal Decision Regression

on:
  pull_request:
    paths:
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - 'RELEASE-CHECKLIST.md'
      - 'DATA-GOVERNANCE-DRAFT.md'
      - 'DATA-RETENTION-DECISION-INDEX.md'
      - '.github/workflows/privacy-legal-decision-regression.yml'
  push:
    branches: ['main']
    paths:
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - 'RELEASE-CHECKLIST.md'
      - 'DATA-GOVERNANCE-DRAFT.md'
      - 'DATA-RETENTION-DECISION-INDEX.md'
      - '.github/workflows/privacy-legal-decision-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify Production Privacy Legal decision remains unapproved
        shell: bash
        run: |
          set -euo pipefail
          file='PRODUCTION-PRIVACY-LEGAL-DECISION.md'
          test -s "$file"
          grep -Fq 'Status: **NOT APPROVED**' "$file"
          grep -Fq 'Service/controller legal identity: **UNSET**' "$file"
          grep -Fq 'Production contact channel: **UNSET**' "$file"
          grep -Fq 'Privacy Policy URL/version: **UNSET**' "$file"
          grep -Fq 'Terms of Service URL/version: **UNSET**' "$file"
          grep -Fq 'PDPA/legal reviewer or approver: **UNSET**' "$file"
          grep -Fq 'Approved retention decision reference: **UNSET**' "$file"
          grep -Fq 'Payment-provider disclosure review: **UNSET**' "$file"
          grep -Fq 'Partner-tracking disclosure/agreement review: **UNSET**' "$file"
          grep -Fq 'They do not prove Production Privacy Policy publication' "$file"

          if grep -Eqi '^Status:[[:space:]]*\*\*APPROVED\*\*' "$file"; then
            echo 'Production Privacy/Legal must not be marked APPROVED without reviewed real evidence.'
            exit 1
          fi

      - name: Verify Commercial checklist keeps Privacy Legal gates open
        shell: bash
        run: |
          set -euo pipefail
          file='RELEASE-CHECKLIST.md'
          test -s "$file"
          grep -Fq -- '- [ ] Privacy Policy ฉบับ Production เผยแพร่จริง' "$file"
          grep -Fq -- '- [ ] Terms of Service เผยแพร่จริง' "$file"
          grep -Fq -- '- [ ] ช่องทางติดต่อเจ้าของบริการจริง' "$file"
          grep -Fq -- '- [ ] กำหนด retention/deletion ของข้อมูลและขั้นตอนคำขอของผู้ใช้' "$file"

          for item in \
            '- [x] Privacy Policy ฉบับ Production เผยแพร่จริง' \
            '- [x] Terms of Service เผยแพร่จริง' \
            '- [x] ช่องทางติดต่อเจ้าของบริการจริง' \
            '- [x] กำหนด retention/deletion ของข้อมูลและขั้นตอนคำขอของผู้ใช้'; do
            if grep -Fq -- "$item" "$file"; then
              echo "Commercial Privacy/Legal checklist item is marked complete while canonical decision is NOT APPROVED: $item"
              exit 1
            fi
          done

      - name: Verify retention approval is not inferred
        shell: bash
        run: |
          set -euo pipefail
          test -s 'DATA-RETENTION-DECISION-INDEX.md'
          grep -Fq 'NOT APPROVED' 'DATA-RETENTION-DECISION-INDEX.md'
          grep -Fq 'NOT VERIFIED' 'DATA-RETENTION-DECISION-INDEX.md'

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Privacy / Legal decision regression'
            echo
            echo '- Keeps Production Privacy/Legal status NOT APPROVED until real reviewed identities, documents and decisions exist.'
            echo '- Keeps Commercial checklist Privacy/Terms/contact/retention gates open while approval is absent.'
            echo '- Re-checks retention is not promoted from policy-neutral planning or dry-run evidence.'
            echo '- Static CI success is not Production Privacy Policy publication, Terms acceptance, legal/PDPA approval, approved retention, Public Beta PASS, or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
