name: Beta Checklist Scoped Evidence Regression

on:
  push:
    branches: ["main"]
    paths:
      - "BETA-CHECKLIST.md"
      - "CURRENT-RELEASE.md"
      - "AUTH-INTERACTION-PHYSICAL-EVIDENCE.md"
      - "PUBLIC-FORM-PHYSICAL-EVIDENCE.md"
      - "REAL-PLATFORM-UX-EVIDENCE.md"
      - "PWA-UPGRADE-PHYSICAL-EVIDENCE.md"
      - "PRODUCT-EVENT-PHYSICAL-EVIDENCE.md"
      - ".github/workflows/beta-checklist-scoped-evidence-regression.yml"
  pull_request:
    paths:
      - "BETA-CHECKLIST.md"
      - "CURRENT-RELEASE.md"
      - "AUTH-INTERACTION-PHYSICAL-EVIDENCE.md"
      - "PUBLIC-FORM-PHYSICAL-EVIDENCE.md"
      - "REAL-PLATFORM-UX-EVIDENCE.md"
      - "PWA-UPGRADE-PHYSICAL-EVIDENCE.md"
      - "PRODUCT-EVENT-PHYSICAL-EVIDENCE.md"
      - ".github/workflows/beta-checklist-scoped-evidence-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-checklist-scoped-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve scoped physical evidence and open gates
        shell: bash
        run: |
          set -euo pipefail
          checklist='BETA-CHECKLIST.md'
          release='CURRENT-RELEASE.md'
          auth='AUTH-INTERACTION-PHYSICAL-EVIDENCE.md'
          forms='PUBLIC-FORM-PHYSICAL-EVIDENCE.md'
          ux='REAL-PLATFORM-UX-EVIDENCE.md'
          nf07='PWA-UPGRADE-PHYSICAL-EVIDENCE.md'
          product='PRODUCT-EVENT-PHYSICAL-EVIDENCE.md'

          for file in "$checklist" "$release" "$auth" "$forms" "$ux" "$nf07" "$product"; do
            test -s "$file" || { echo "Missing $file"; exit 1; }
          done

          # Canonical evidence must still support every scoped checkbox promoted here.
          grep -Fq 'TC-11 Feedback and TC-12 Partner application physical acceptance are **PASS for the scoped OPPO Reno13 5G / Android 16 / Chrome 152.0.7977.64 session**' "$release"
          grep -Fq 'Status: **PASS**' "$forms"
          grep -Fq 'Status: **PARTIAL PASS — RECOVERY REQUEST/MAIL-SEND/VERIFY-LINK + PASSWORD UPDATE + SIGN-IN + NEW SIGNUP + EMAIL CONFIRMATION VERIFIED / LEAKED-PASSWORD REJECTION NOT VERIFIED**' "$auth"
          grep -Fq 'Reduced-motion result: **PASS**' "$ux"

          grep -Fq -- '- [x] real Feedback submission/failure-recovery interaction สำหรับ PR #201 changed path พร้อม backend acceptance — scoped PASS บน OPPO Reno13 5G / Android 16 / Chrome 152.0.7977.64' "$checklist"
          grep -Fq -- '- [x] real Partner application submission/failure-recovery interaction สำหรับ PR #201 changed path พร้อม backend/privacy acceptance — scoped PASS บน OPPO Reno13 5G / Android 16 / Chrome 152.0.7977.64' "$checklist"
          grep -Fq -- '- [x] Auth recovery/password-update/sign-in/new-signup/email-confirmation ผ่าน real deployed browser/device interaction — scoped OPPO Reno13 5G / Android 16 / Chrome 152.0.7977.64' "$checklist"
          grep -Fq -- '- [x] reduced-motion behavior ผ่านบน real platform/browser ที่เปิด reduced-motion preference — scoped PASS: OPPO Reno13 5G / Android 16 / Chrome 152.0.7977.64' "$checklist"

          # Keyboard Focus may be promoted only when its independent canonical physical result is PASS.
          if grep -Fq 'Keyboard focus result: **PASS**' "$ux"; then
            grep -Fq 'Keyboard device / model: Built-in Lenovo notebook keyboard / Lenovo system model 83DV' "$ux"
            grep -Fq 'Keyboard browser or installed-PWA context / version: Google Chrome 152.0.7977.82, normal browser tab' "$ux"
            grep -Fq -- '- [x] visible keyboard focus/navigation ผ่าน real interaction บน deployed pages — scoped PASS: Lenovo system model 83DV / Windows 11 Version 25H2 (OS Build 26200.9168) / Chrome 152.0.7977.82' "$checklist"
          else
            grep -Fq -- '- [ ] visible keyboard focus/navigation ผ่าน real interaction บน deployed pages' "$checklist"
          fi

          # NF-07 is now a scoped physical PASS only because the qualifying old-cache→current physical trace exists.
          grep -Fq 'Status: **SCOPED PHYSICAL PASS — NF-07 v15 → v16**' "$nf07"
          grep -Fq 'Device: OPPO Reno13 5G (CPH2689)' "$nf07"
          grep -Fq 'Historical cache marker: `kinaraidee-beta-v15`' "$nf07"
          grep -Fq 'Actual reopen count before current behavior appeared: **1**' "$nf07"
          grep -Fq 'No manual site/app-data clear occurred' "$nf07"
          grep -Fq 'legacy `kinaraidee-beta-v15` cache: absent' "$nf07"
          grep -Fq 'site-data persistence marker: survived' "$nf07"
          grep -Fq 'Home + Surprise usability check' "$nf07"
          grep -Fq -- '- [x] NF-07 upgrade จาก verifiable older-cache baseline ไป `kinaraidee-beta-v16` โดยไม่ต้องล้างข้อมูลเอง — scoped PASS: OPPO Reno13 5G / Android 16 / Chrome 152.0.7977.64' "$checklist"

          # Product Event may be promoted only from the isolated physical QA run plus backend corroboration and cleanup.
          grep -Fq 'Status: **SCOPED PHYSICAL PASS — OPPO ANDROID CHROME / QA TELEMETRY CLEANED**' "$product"
          grep -Fq 'distinguishable browser sessions: **2**' "$product"
          grep -Fq 'maximum rows for any `(session,event)` pair: **1**' "$product"
          grep -Fq 'Matching QA rows remaining after cleanup: **0**' "$product"
          grep -Fq -- '- [x] OPPO Reno13 5G / Android 16 / Chrome 152.0.7977.64: Product Event scoped physical QA PASS on 2026-09-05' "$checklist"

          # Independent open gates must remain open despite these scoped physical passes.
          grep -Fq -- '- [ ] Auth weak/leaked-password rejection/protection ผ่านบน production Auth service; current server-side protection ยัง **BLOCKED BY VERIFIED FREE PLAN / CONFIGURATION — NOT PASS**' "$checklist"
          grep -Fq -- '- [ ] Android Chrome อย่างน้อย 3 device models' "$checklist"
          grep -Fq -- '- [ ] iPhone Safari อย่างน้อย 2 device models' "$checklist"
          grep -Fq 'Public Beta is still **NOT COMPLETE**.' "$release"
          grep -Fq 'Commercial launch remains **NO-GO**' "$release"

          echo 'Beta checklist matches scoped physical evidence for forms/Auth/accessibility/NF-07/Product Event while leaked-password and distinct-device gates remain open.'
