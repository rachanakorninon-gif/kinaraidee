name: Marketing Claims Boundary Regression

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketing-claims-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate marketing preparation boundaries
        shell: bash
        run: |
          set -euo pipefail

          readiness='MARKETING-ACQUISITION-READINESS.md'
          attribution='MARKETING-ATTRIBUTION-CONTRACT.md'
          creative='MARKETING-CREATIVE-PRODUCTION-MATRIX.md'
          scripts='MARKETING-CREATIVE-SCRIPTS-TH.md'
          testplan='MARKETING-FIRST-PAID-TEST-PLAN.md'
          social='SOCIAL-CHANNEL-LAUNCH-PACK-TH.md'
          calendar='SOCIAL-ORGANIC-CONTENT-CALENDAR-14D.md'
          community='SOCIAL-COMMUNITY-REPLY-MACROS-TH.md'
          tracker='SOCIAL-PUBLISHING-EVIDENCE-TRACKER.md'
          approvedcopy='marketing/core-product-copy-th.json'

          for f in "$readiness" "$attribution" "$creative" "$scripts" "$testplan" "$social" "$calendar" "$community" "$tracker" "$approvedcopy"; do
            test -s "$f" || { echo "Missing marketing readiness file: $f"; exit 1; }
          done

          grep -Fq 'Status: **PREPARED / PAID ACQUISITION NOT YET LAUNCHED**' "$readiness" || {
            echo 'Acquisition readiness must remain pre-launch until a separate paid-media GO exists'; exit 1;
          }
          grep -Fq 'Status: **DESIGN ONLY / MEASUREMENT NOT IMPLEMENTED BY THIS DOCUMENT**' "$attribution" || {
            echo 'Attribution contract must not imply production measurement is implemented'; exit 1;
          }
          grep -Fq 'Status: **PRE-LAUNCH / PRODUCTION PREP ONLY**' "$creative" || {
            echo 'Creative matrix must remain pre-launch preparation'; exit 1;
          }
          grep -Fq 'Status: **PRODUCTION SCRIPT PREP / NOT TRAFFICKED**' "$scripts" || {
            echo 'Creative scripts must remain not-trafficked preparation'; exit 1;
          }
          grep -Fq 'Status: **TEST DESIGN ONLY / BUDGET UNSET / NO SPEND AUTHORIZED**' "$testplan" || {
            echo 'Paid-test plan must keep budget/spend authorization unset'; exit 1;
          }
          grep -Fq 'Status: **PREPARED / CHANNEL CREATION & PUBLISHING NOT VERIFIED**' "$social" || {
            echo 'Social launch pack must not imply channels were created/published'; exit 1;
          }
          grep -Fq 'Status: **CONTENT PREP / NOT PUBLISHED**' "$calendar" || {
            echo 'Organic content calendar must remain not-published preparation'; exit 1;
          }
          grep -Fq 'Status: **PREPARED / NOT PUBLISHED**' "$community" || {
            echo 'Community reply macros must remain not-published preparation'; exit 1;
          }
          grep -Fq 'Status: **TEMPLATE / NO CHANNEL OR POST EVIDENCE RECORDED**' "$tracker" || {
            echo 'Publishing tracker must not imply channel/post evidence exists'; exit 1;
          }
          grep -Fq '"status": "PRE_LAUNCH_CORE_ONLY"' "$approvedcopy" || {
            echo 'Machine-readable approved copy must remain PRE_LAUNCH_CORE_ONLY'; exit 1;
          }

          grep -Fq 'https://rachanakorninon-gif.github.io/kinaraidee/' "$attribution" || {
            echo 'Missing canonical public root acquisition destination'; exit 1;
          }
          grep -Fq 'https://rachanakorninon-gif.github.io/kinaraidee/' "$social" || {
            echo 'Social launch pack must preserve canonical root destination'; exit 1;
          }
          grep -Fq 'https://rachanakorninon-gif.github.io/kinaraidee/' "$approvedcopy" || {
            echo 'Approved-copy source must preserve canonical root destination'; exit 1;
          }

          grep -Fq '**NO APP STORE BADGES. NO GOOGLE PLAY BADGES. NO LIVE PRIZE CLAIMS.**' "$creative" || {
            echo 'Creative truth boundary is missing'; exit 1;
          }
          grep -Fq 'Current CTA: `ลองใช้เลย` / `เปิดกินอะไรดี`' "$creative" || {
            echo 'Current Web/PWA CTA boundary is missing'; exit 1;
          }
          grep -Fq 'Paid Premium is not approved/active.' "$readiness" || {
            echo 'Premium pre-launch boundary is missing'; exit 1;
          }
          grep -Fq 'Prize entries are not open and public eligible count remains 0.' "$readiness" || {
            echo 'Prize-entry pre-launch boundary is missing'; exit 1;
          }
          grep -Fq 'Budget: **UNSET**' "$testplan" || {
            echo 'Marketing test budget must remain UNSET until separately approved'; exit 1;
          }
          grep -Fq 'Paid acquisition status: **NOT LAUNCHED**' "$testplan" || {
            echo 'Paid acquisition test must remain NOT LAUNCHED'; exit 1;
          }
          grep -Fq 'Do not use `ดาวน์โหลดเลย` as the default current CTA' "$scripts" || {
            echo 'Script CTA truth boundary is missing'; exit 1;
          }
          grep -Fq 'Do not claim App Store or Google Play availability until actual listings are verified.' "$social" || {
            echo 'Social channel store-availability boundary is missing'; exit 1;
          }
          grep -Fq 'No prize-entry wording while campaign status remains PRE-LAUNCH.' "$calendar" || {
            echo 'Organic calendar prize pre-launch boundary is missing'; exit 1;
          }
          grep -Fq 'Do not reply “แก้แล้ว” until the exact fix/deployment is verified.' "$community" || {
            echo 'Community reply verification boundary is missing'; exit 1;
          }
          grep -Fq '`0` means a real query/read showed zero.' "$tracker" || {
            echo 'Publishing tracker zero-vs-unmeasured boundary is missing'; exit 1;
          }
          grep -Fq '`NOT MEASURED` means unavailable/not collected.' "$tracker" || {
            echo 'Publishing tracker NOT MEASURED boundary is missing'; exit 1;
          }

          if grep -Eq '^Status: \*\*LIVE' "$readiness" "$attribution" "$creative" "$scripts" "$testplan" "$social" "$calendar" "$community" "$tracker"; then
            echo 'Marketing preparation docs must not self-promote to LIVE'; exit 1;
          fi

          echo 'Marketing preparation boundaries verified.'

      - name: Record evidence boundary
        shell: bash
        run: |
          {
            echo '## Marketing claims boundary'
            echo
            echo '- Confirms readiness, attribution, scripts, test design, social content, community replies and publishing evidence remain pre-launch/prepared only.'
            echo '- Requires current Web/PWA CTA and no-store-badge/no-live-prize claims.'
            echo '- Requires social channel creation/publishing to remain unverified until real platform evidence exists.'
            echo '- Requires observed zero to remain distinct from NOT MEASURED in social evidence.'
            echo '- Requires paid-test budget to remain UNSET and paid acquisition NOT LAUNCHED.'
            echo '- Does not authorize ad spend, billing, analytics collection, social publishing, Premium sales, prize entries or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
