name: Temporary Reconcile 635 Canonical Docs

on:
  push:
    branches:
      - docs/reconcile-635-deployment-20260914

permissions:
  contents: write

jobs:
  patch-canonical-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-635-deployment-20260914
      - name: Patch only current runtime/deployment references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          candidate = '91cdf79d221c68ca54e5f874aebe421846264821'
          deployed = 'ff975076a643d123081da8ab3e3baf399fdc5f6d'
          pages = '34854825324'
          live = '34854891192'
          auth = '34854891245'
          campaign = '34854891441'
          toast = '34854891055'
          premium = '34854891061'

          def replace_prefixed_line(path, prefix, replacement, expected=1):
              p = Path(path)
              lines = p.read_text(encoding='utf-8').splitlines()
              hits = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(hits) != expected:
                  raise SystemExit(f'{path}: expected {expected} line(s) starting {prefix!r}, found {len(hits)}')
              for i in hits:
                  lines[i] = replacement
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          matrix = 'BETA-DEVICE-MATRIX.md'
          replace_prefixed_line(
              matrix,
              '- Current browser/PWA runtime candidate:',
              f'- Current browser/PWA runtime candidate: Issue #635 / `{candidate}` — `kinaraidee-beta-v16`; deployment status is **PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE**; Runtime merge/deployed SHA is `{deployed}`.'
          )
          replace_prefixed_line(
              matrix,
              '- Verified current deployment evidence:',
              f'- Verified current deployment evidence: **PASS** for exact deployed descendant `{deployed}`; Pages `{pages}`, main Live Smoke `{live}`, Auth Password Security Live Smoke `{auth}`, Campaign 3000 Premium Live Smoke `{campaign}`, Toast Accessibility Live Smoke `{toast}`, and Premium Research Preview Live Smoke `{premium}` completed successfully. The Pages predeploy guard verified the declared Issue #635 runtime candidate is an ancestor of the deployment head with no guarded browser/PWA drift after the candidate, and live `release-meta.json` matched the exact deployed SHA and `kinaraidee-beta-v16`. This is deployment evidence only and does not establish VoiceOver/TalkBack/keyboard Physical PASS for Issue #635. Issues #592/#593, #551, #552/TC-03 and TC-08 retain only their separately recorded scoped Physical evidence. Issues #524/#545 remain physically PENDING for their affected iPhone scopes. Public Beta remains incomplete.'
          )

          p = Path(matrix)
          lines = p.read_text(encoding='utf-8').splitlines()
          old_current = '0968f7cf7f1559f48837172e9a1b3a28b9877b5a'
          hits = [i for i, line in enumerate(lines) if line.startswith('- Current candidate ') and old_current in line]
          if len(hits) > 1:
              raise SystemExit(f'{matrix}: ambiguous old current-candidate lines: {len(hits)}')
          if hits:
              lines[hits[0]] = f'- Current candidate `{candidate}` is verified through exact deployed descendant `{deployed}` with Pages `{pages}` and main Live Smoke `{live}` successful. This current Deployment PASS remains deployment/live-source evidence only; physical-device and assistive-technology acceptance stay governed by their separately recorded evidence, and Issues #524/#545 remain PENDING for affected iPhone scopes.'
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          beta = 'BETA-CHECKLIST.md'
          replace_prefixed_line(
              beta,
              '- [x] Current browser/PWA runtime candidate:',
              f'- [x] Current browser/PWA runtime candidate: Issue #635 / `{candidate}` — deployed through exact descendant `{deployed}`; Pages `{pages}`, main Live Smoke `{live}`, Auth Password Security Live Smoke `{auth}`, Campaign 3000 Premium Live Smoke `{campaign}`, Toast Accessibility Live Smoke `{toast}`, and Premium Research Preview Live Smoke `{premium}` = SUCCESS. This is Deployment PASS only and does not create VoiceOver/TalkBack/keyboard Physical PASS, another-device PASS, Public Beta completion, or Commercial GO.'
          )

          # Ensure the patch did not promote Beta or Commercial state.
          for path in (matrix, beta):
              text = Path(path).read_text(encoding='utf-8')
              if candidate not in text or deployed not in text:
                  raise SystemExit(f'{path}: new runtime trace missing after patch')
          if 'Public Beta' not in Path(beta).read_text(encoding='utf-8'):
              raise SystemExit('BETA-CHECKLIST.md lost Public Beta boundary text')
          PY
      - name: Commit canonical-doc synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BETA-DEVICE-MATRIX.md BETA-CHECKLIST.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No canonical-doc changes required.'
            exit 0
          fi
          git commit -m 'docs(release): sync #635 beta runtime references'
          git push origin HEAD:docs/reconcile-635-deployment-20260914
