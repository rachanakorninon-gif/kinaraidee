name: Kinaraidee Release Consistency

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical PWA release marker
        shell: bash
        run: |
          set -euo pipefail
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test -n "$marker" || { echo 'Unable to derive canonical release marker from sw.js'; exit 1; }
          test "$(printf '%s\n' "$marker" | wc -l)" -eq 1 || { echo 'Multiple canonical markers found in sw.js'; exit 1; }
          test -s CURRENT-RUNTIME.md || { echo 'Missing CURRENT-RUNTIME.md'; exit 1; }
          grep -Fq "PWA cache marker: \`$marker\`" CURRENT-RUNTIME.md || { echo "CURRENT-RUNTIME.md does not declare $marker"; exit 1; }
          grep -Fq 'Public Beta is still **NOT COMPLETE**' CURRENT-RUNTIME.md || { echo 'Current runtime declaration must preserve incomplete Public Beta gate'; exit 1; }
          if grep -Eq 'PWA cache marker: `kinaraidee-beta-v[0-9]+`' CURRENT-RUNTIME.md; then
            declared="$(sed -n 's/^- PWA cache marker: `\(kinaraidee-beta-v[0-9][0-9]*\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
            test "$declared" = "$marker" || { echo "Runtime declaration marker $declared differs from sw.js $marker"; exit 1; }
          fi
          test -s README.md || { echo 'Missing README.md'; exit 1; }
          grep -Fq "Browser/PWA runtime ปัจจุบันใช้ cache generation \`$marker\`" README.md || { echo "README.md does not declare current browser/PWA marker $marker"; exit 1; }
          version="${marker##*v}"
          grep -Fq "ตรวจ PWA update จาก cache รุ่นเก่ามา v$version" README.md || { echo "README.md old-cache upgrade gate does not target v$version"; exit 1; }
          echo "Canonical browser/PWA marker: $marker"

      - name: Validate declared browser runtime candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          test -n "$candidate" || { echo 'Unable to parse browser/PWA runtime candidate SHA from CURRENT-RUNTIME.md'; exit 1; }
          git cat-file -e "$candidate^{commit}" || { echo "Runtime candidate SHA is not present in repository history: $candidate"; exit 1; }
          git merge-base --is-ancestor "$candidate" HEAD || { echo "Runtime candidate SHA is not an ancestor of HEAD: $candidate"; exit 1; }
          changed="$(git diff --name-only "$candidate"..HEAD -- index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml data || true)"
          if [ -n "$changed" ]; then
            echo 'Browser/PWA runtime files changed after the declared candidate; CURRENT-RUNTIME.md must advance before release:'
            printf '%s\n' "$changed"
            exit 1
          fi
          status="$(sed -n 's/^- Deployment status: \*\*\(.*\)\*\*.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          case "$status" in
            'PENDING FOR CURRENT RUNTIME DEPLOYMENT'|'PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE') ;;
            *) echo "Unexpected runtime deployment status: $status"; exit 1;;
          esac
          if [ "$status" = 'PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE' ]; then
            deployed="$(sed -n 's/^- Runtime merge\/deployed SHA: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
            test -n "$deployed" || { echo 'Unable to parse deployed runtime SHA from CURRENT-RUNTIME.md'; exit 1; }
            git cat-file -e "$deployed^{commit}" || { echo "Deployed runtime SHA is not present in repository history: $deployed"; exit 1; }
            git merge-base --is-ancestor "$candidate" "$deployed" || { echo "Deployed runtime SHA $deployed is not a descendant of candidate $candidate"; exit 1; }
            git merge-base --is-ancestor "$deployed" HEAD || { echo "Deployed runtime SHA is not an ancestor of HEAD: $deployed"; exit 1; }
          else
            deployed="$(sed -n 's/^- Runtime merge\/deployed SHA: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
            test -z "$deployed" || { echo 'Pending runtime must not claim a current deployed SHA'; exit 1; }
            grep -Fq 'Current runtime deployment evidence is pending' CURRENT-RUNTIME.md || { echo 'Pending runtime evidence boundary missing'; exit 1; }
          fi
          echo "Declared runtime candidate $candidate is clean; deployment status is $status"

      - name: Validate current release/runtime declaration relationship
        shell: bash
        run: |
          set -euo pipefail
          runtime_candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          release_candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RELEASE.md | head -n1)"
          runtime_deployed="$(sed -n 's/^- Runtime merge\/deployed SHA: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          release_deployed="$(sed -n 's/^- Runtime merge\/deployed SHA: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RELEASE.md | head -n1)"
          last_verified="$(sed -n 's/^- Last verified deployed browser\/PWA descendant: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          runtime_cache="$(sed -n 's/^- PWA cache marker: `\([^`]*\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          release_cache="$(sed -n 's/^- PWA cache marker: `\([^`]*\)`.*/\1/p' CURRENT-RELEASE.md | head -n1)"
          runtime_status="$(sed -n 's/^- Deployment status: \*\*\(.*\)\*\*.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          release_status="$(sed -n 's/^- Current runtime deployment status: \*\*\(.*\)\*\*.*/\1/p' CURRENT-RELEASE.md | head -n1)"
          test -n "$runtime_candidate" && test -n "$release_candidate" || { echo 'Unable to parse runtime candidate from canonical declarations'; exit 1; }
          test -n "$runtime_cache" && test -n "$release_cache" || { echo 'Unable to parse PWA cache marker from canonical declarations'; exit 1; }
          test -n "$runtime_status" && test -n "$release_status" || { echo 'Unable to parse deployment status from canonical declarations'; exit 1; }
          test "$runtime_cache" = "$release_cache" || { echo "PWA cache marker drift: CURRENT-RUNTIME=$runtime_cache CURRENT-RELEASE=$release_cache"; exit 1; }
          case "$runtime_status" in
            'PENDING FOR CURRENT RUNTIME DEPLOYMENT')
              test -z "$runtime_deployed" || { echo 'Pending runtime must not claim a current deployed SHA'; exit 1; }
              test -n "$last_verified" || { echo 'Pending runtime must identify last verified deployed descendant'; exit 1; }
              test -n "$release_deployed" || { echo 'CURRENT-RELEASE must retain the last verified deployed SHA while runtime is pending'; exit 1; }
              test "$last_verified" = "$release_deployed" || { echo "Last verified deployment drift: CURRENT-RUNTIME=$last_verified CURRENT-RELEASE=$release_deployed"; exit 1; }
              test "$release_status" = 'PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE' || { echo 'CURRENT-RELEASE must remain on the last verified deployment while new runtime is pending'; exit 1; }
              ;;
            'PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE')
              test -n "$runtime_deployed" && test -n "$release_deployed" || { echo 'PASS runtime/release must provide deployed SHA'; exit 1; }
              test "$runtime_candidate" = "$release_candidate" || { echo "Runtime candidate drift: CURRENT-RUNTIME=$runtime_candidate CURRENT-RELEASE=$release_candidate"; exit 1; }
              test "$runtime_deployed" = "$release_deployed" || { echo "Deployed runtime drift: CURRENT-RUNTIME=$runtime_deployed CURRENT-RELEASE=$release_deployed"; exit 1; }
              test "$runtime_status" = "$release_status" || { echo "Deployment status drift: CURRENT-RUNTIME=$runtime_status CURRENT-RELEASE=$release_status"; exit 1; }
              ;;
            *) echo "Unexpected runtime deployment status: $runtime_status"; exit 1;;
          esac
          echo "CURRENT-RUNTIME.md and CURRENT-RELEASE.md preserve the correct pending/deployed evidence relationship"

      - name: Validate Beta readiness summary boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s BETA-READY.md || { echo 'Missing BETA-READY.md'; exit 1; }
          grep -Fq 'สถานะปัจจุบัน: **TECHNICAL BETA BUILD AVAILABLE / PUBLIC BETA NOT COMPLETE**' BETA-READY.md || { echo 'BETA-READY.md must preserve the incomplete Public Beta status'; exit 1; }
          grep -Fq 'Public Beta remains **NOT COMPLETE**.' CURRENT-RELEASE.md || { echo 'CURRENT-RELEASE.md must preserve the incomplete Public Beta gate'; exit 1; }
          grep -Fq 'Commercial launch remains **NO-GO**' CURRENT-RELEASE.md || { echo 'CURRENT-RELEASE.md must preserve Commercial NO-GO until evidence advances'; exit 1; }
          grep -Fq 'Repository governance (`main` protection + required checks enforcement) มีหลักฐาน **ENFORCED** แล้ว' BETA-READY.md || { echo 'BETA-READY.md governance summary drifted from canonical release evidence'; exit 1; }
          grep -Fq 'Status: **ENFORCED FOR `main` THROUGH THE `Protect main` RULESET**.' CURRENT-RELEASE.md || { echo 'CURRENT-RELEASE.md governance status is missing or changed'; exit 1; }
          grep -Fq 'ห้ามกรอก PASS จาก CI, static review, source contract หรือผลจากอุปกรณ์คนละเครื่องแทนหลักฐานจริง' BETA-READY.md || { echo 'BETA-READY.md real-evidence boundary is missing'; exit 1; }
          echo 'Beta readiness summary preserves canonical Public Beta, Commercial, governance, and evidence boundaries'

      - name: Validate declared Group API source candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(sed -n 's/^- Current Group API source candidate: PR #[0-9][0-9]* \/ `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RELEASE.md | head -n1)"
          test -n "$candidate" || { echo 'Unable to parse Group API source candidate SHA from CURRENT-RELEASE.md'; exit 1; }
          git cat-file -e "$candidate^{commit}" || { echo "Group API candidate SHA is not present in repository history: $candidate"; exit 1; }
          git merge-base --is-ancestor "$candidate" HEAD || { echo "Group API candidate SHA is not an ancestor of HEAD: $candidate"; exit 1; }
          changed="$(git diff --name-only "$candidate"..HEAD -- supabase/functions/group-api || true)"
          if [ -n "$changed" ]; then
            echo 'Group API source changed after the declared candidate; release evidence must advance before release:'
            printf '%s\n' "$changed"
            exit 1
          fi
          echo "Declared Group API candidate $candidate remains clean"

      - name: Validate declared Partner API source candidate lineage and live rejection evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence='PARTNER-API-HARDENING-EVIDENCE.md'
          test -s "$evidence" || { echo "Missing Partner API evidence file: $evidence"; exit 1; }
          candidate="$(sed -n 's/^- PR #[0-9][0-9]* merged as `\([0-9a-f]\{40\}\)`.*/\1/p' "$evidence" | head -n1)"
          test -n "$candidate" || { echo 'Unable to parse Partner API source candidate SHA from evidence'; exit 1; }
          git cat-file -e "$candidate^{commit}" || { echo "Partner API candidate SHA is not present in repository history: $candidate"; exit 1; }
          git merge-base --is-ancestor "$candidate" HEAD || { echo "Partner API candidate SHA is not an ancestor of HEAD: $candidate"; exit 1; }
          changed="$(git diff --name-only "$candidate"..HEAD -- supabase/functions/partner-api || true)"
          if [ -n "$changed" ]; then
            echo 'Partner API source changed after documented candidate; evidence must advance before release:'
            printf '%s\n' "$changed"
            exit 1
          fi
          grep -Fq 'Status: **SOURCE/DEPLOYMENT HARDENING + LIVE REJECTION CONTRACT VERIFIED**' "$evidence" || {
            echo 'Partner API evidence must preserve the verified live-rejection status'; exit 1;
          }
          grep -Fq '32675596758' "$evidence" || { echo 'Missing canonical Partner API main live-probe run ID'; exit 1; }
          grep -Fq '5ca280f4832e0d0fc1aa7057bb68f4df001d4067' "$evidence" || { echo 'Missing canonical Partner API main live-probe SHA'; exit 1; }
          grep -Fq '32675626819' "$evidence" || { echo 'Missing read-only Partner API run diagnostic evidence'; exit 1; }
          grep -Fq 'VERIFIED PASS — REJECTION BEHAVIOR ONLY' "$evidence" || { echo 'Partner API live evidence boundary is missing'; exit 1; }
          grep -Fq 'does not prove successful product-action requests' "$evidence" || { echo 'Partner API overclaim boundary is missing'; exit 1; }
          echo "Declared Partner API candidate $candidate remains clean with scoped live rejection evidence"

      - name: Validate atomic app-shell strategy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'cache.addAll(SHELL)' sw.js || { echo 'Atomic app-shell install is missing'; exit 1; }
          if grep -Fq 'Promise.allSettled' sw.js; then
            echo 'Partial app-shell install strategy detected'
            exit 1
          fi
          echo 'Atomic app-shell strategy verified'
