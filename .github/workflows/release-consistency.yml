name: Kinaraidee Release Consistency

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical PWA release marker
        shell: bash
        run: |
          set -euo pipefail
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test -n "$marker" || { echo 'Unable to derive canonical release marker from sw.js'; exit 1; }
          test "$(printf '%s\n' "$marker" | wc -l)" -eq 1 || { echo 'Multiple canonical markers found in sw.js'; exit 1; }
          test -s CURRENT-RUNTIME.md || { echo 'Missing CURRENT-RUNTIME.md'; exit 1; }
          grep -Fq "PWA cache marker: \`$marker\`" CURRENT-RUNTIME.md || { echo "CURRENT-RUNTIME.md does not declare $marker"; exit 1; }
          grep -Fq 'Public Beta is still **NOT COMPLETE**' CURRENT-RUNTIME.md || { echo 'Current runtime declaration must preserve incomplete Public Beta gate'; exit 1; }
          if grep -Eq 'PWA cache marker: `kinaraidee-beta-v[0-9]+`' CURRENT-RUNTIME.md; then
            declared="$(sed -n 's/^- PWA cache marker: `\(kinaraidee-beta-v[0-9][0-9]*\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
            test "$declared" = "$marker" || { echo "Runtime declaration marker $declared differs from sw.js $marker"; exit 1; }
          fi
          test -s README.md || { echo 'Missing README.md'; exit 1; }
          grep -Fq "Browser/PWA runtime ปัจจุบันใช้ cache generation \`$marker\`" README.md || { echo "README.md does not declare current browser/PWA marker $marker"; exit 1; }
          version="${marker##*v}"
          grep -Fq "ตรวจ PWA update จาก cache รุ่นเก่ามา v$version" README.md || { echo "README.md old-cache upgrade gate does not target v$version"; exit 1; }
          echo "Canonical browser/PWA marker: $marker"

      - name: Validate declared browser runtime candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          test -n "$candidate" || { echo 'Unable to parse browser/PWA runtime candidate SHA from CURRENT-RUNTIME.md'; exit 1; }
          git cat-file -e "$candidate^{commit}" || { echo "Runtime candidate SHA is not present in repository history: $candidate"; exit 1; }
          git merge-base --is-ancestor "$candidate" HEAD || { echo "Runtime candidate SHA is not an ancestor of HEAD: $candidate"; exit 1; }
          changed="$(git diff --name-only "$candidate"..HEAD -- index.html 404.html privacy.html feedback.html partner.html member.html reset-password.html manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml data || true)"
          if [ -n "$changed" ]; then
            echo 'Browser/PWA runtime files changed after the declared candidate; CURRENT-RUNTIME.md must advance before release:'
            printf '%s\n' "$changed"
            exit 1
          fi
          status="$(sed -n 's/^- Deployment status: \*\*\(.*\)\*\*.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          case "$status" in
            'PENDING FOR CURRENT RUNTIME DEPLOYMENT'|'PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE') ;;
            *) echo "Unexpected runtime deployment status: $status"; exit 1;;
          esac
          echo "Declared runtime candidate $candidate is clean; deployment status is $status"

      - name: Validate declared Group API source candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(sed -n 's/^- Current Group API source candidate: PR #[0-9][0-9]* \/ `\([0-9a-f]\{40\}\)`.*/\1/p' CURRENT-RELEASE.md | head -n1)"
          test -n "$candidate" || { echo 'Unable to parse Group API source candidate SHA from CURRENT-RELEASE.md'; exit 1; }
          git cat-file -e "$candidate^{commit}" || { echo "Group API candidate SHA is not present in repository history: $candidate"; exit 1; }
          git merge-base --is-ancestor "$candidate" HEAD || { echo "Group API candidate SHA is not an ancestor of HEAD: $candidate"; exit 1; }
          changed="$(git diff --name-only "$candidate"..HEAD -- supabase/functions/group-api || true)"
          if [ -n "$changed" ]; then
            echo 'Group API source changed after the declared candidate; release evidence must advance before release:'
            printf '%s\n' "$changed"
            exit 1
          fi
          echo "Declared Group API candidate $candidate remains clean"

      - name: Validate declared Partner API source candidate lineage and live rejection evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence='PARTNER-API-HARDENING-EVIDENCE.md'
          test -s "$evidence" || { echo "Missing Partner API evidence file: $evidence"; exit 1; }
          candidate="$(sed -n 's/^- PR #[0-9][0-9]* merged as `\([0-9a-f]\{40\}\)`.*/\1/p' "$evidence" | head -n1)"
          test -n "$candidate" || { echo 'Unable to parse Partner API source candidate SHA from evidence'; exit 1; }
          git cat-file -e "$candidate^{commit}" || { echo "Partner API candidate SHA is not present in repository history: $candidate"; exit 1; }
          git merge-base --is-ancestor "$candidate" HEAD || { echo "Partner API candidate SHA is not an ancestor of HEAD: $candidate"; exit 1; }
          changed="$(git diff --name-only "$candidate"..HEAD -- supabase/functions/partner-api || true)"
          if [ -n "$changed" ]; then
            echo 'Partner API source changed after documented candidate; evidence must advance before release:'
            printf '%s\n' "$changed"
            exit 1
          fi
          grep -Fq 'Status: **SOURCE/DEPLOYMENT HARDENING + LIVE REJECTION CONTRACT VERIFIED**' "$evidence" || {
            echo 'Partner API evidence must preserve the verified live-rejection status'; exit 1;
          }
          grep -Fq '32675596758' "$evidence" || { echo 'Missing canonical Partner API main live-probe run ID'; exit 1; }
          grep -Fq '5ca280f4832e0d0fc1aa7057bb68f4df001d4067' "$evidence" || { echo 'Missing canonical Partner API main live-probe SHA'; exit 1; }
          grep -Fq '32675626819' "$evidence" || { echo 'Missing read-only Partner API run diagnostic evidence'; exit 1; }
          grep -Fq 'VERIFIED PASS — REJECTION BEHAVIOR ONLY' "$evidence" || { echo 'Partner API live evidence boundary is missing'; exit 1; }
          grep -Fq 'does not prove successful product-action requests' "$evidence" || { echo 'Partner API overclaim boundary is missing'; exit 1; }
          echo "Declared Partner API candidate $candidate remains clean with scoped live rejection evidence"

      - name: Validate atomic app-shell strategy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'cache.addAll(SHELL)' sw.js || { echo 'Atomic app-shell install is missing'; exit 1; }
          if grep -Fq 'Promise.allSettled' sw.js; then
            echo 'Partial app-shell install strategy detected'
            exit 1
          fi
          echo 'Atomic app-shell strategy verified'
