name: Real Platform UX Evidence Regression

on:
  push:
    branches: ["main"]
    paths:
      - "REAL-PLATFORM-UX-EVIDENCE.md"
      - "CURRENT-RELEASE.md"
      - ".github/workflows/real-platform-ux-evidence-regression.yml"
  pull_request:
    paths:
      - "REAL-PLATFORM-UX-EVIDENCE.md"
      - "CURRENT-RELEASE.md"
      - ".github/workflows/real-platform-ux-evidence-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-evidence-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify real-platform UX evidence contract
        shell: bash
        run: |
          set -euo pipefail
          evidence='REAL-PLATFORM-UX-EVIDENCE.md'
          release='CURRENT-RELEASE.md'

          test -f "$evidence"
          test -f "$release"

          grep -Fq 'Keyboard focus result:' "$evidence"
          grep -Fq 'Reduced-motion result:' "$evidence"
          grep -Fq 'Keyboard device / model:' "$evidence"
          grep -Fq 'Keyboard tester / session reference:' "$evidence"
          grep -Fq 'Keyboard evidence location:' "$evidence"
          grep -Fq 'Keyboard verified deployed runtime / release marker:' "$evidence"
          grep -Fq 'Reduced-motion device / model:' "$evidence"
          grep -Fq 'Reduced-motion tester / session reference:' "$evidence"
          grep -Fq 'Reduced-motion evidence location:' "$evidence"
          grep -Fq 'Reduced-motion verified deployed runtime / release marker:' "$evidence"
          grep -Fq 'Each result therefore keeps its own trace metadata' "$evidence"
          grep -Fq 'real hardware keyboard or equivalent platform keyboard navigation path' "$evidence"
          grep -Fq 'Platform/browser reduced-motion preference was enabled' "$evidence"
          grep -Fq 'Static CSS inspection or automated focus-style regression does not establish this result.' "$evidence"
          grep -Fq 'browser emulation, or CI do not establish this result.' "$evidence"
          grep -Fq 'A PASS for keyboard focus does not imply reduced-motion PASS' "$evidence"

          grep -Fq 'visible keyboard focus must be verified with real keyboard/focus navigation on deployed pages.' "$release"
          grep -Fq 'reduced-motion behavior must be verified on a real platform with reduced-motion preference enabled.' "$release"

          keyboard=$(sed -n 's/^Keyboard focus result: \*\*\(.*\)\*\*$/\1/p' "$evidence" | head -n1)
          motion=$(sed -n 's/^Reduced-motion result: \*\*\(.*\)\*\*$/\1/p' "$evidence" | head -n1)

          if [ -z "$keyboard" ] || [ -z "$motion" ]; then
            echo 'Could not parse keyboard/reduced-motion results' >&2
            exit 1
          fi

          require_keyboard_trace_metadata() {
            if grep -Eq '^Keyboard (device / model|OS / version|browser or installed-PWA context / version|tester / session reference|evidence location|test date/time|verified deployed runtime / release marker): (NOT CAPTURED|NOT VERIFIED|UNSET)$' "$evidence"; then
              echo 'Keyboard PASS is not traceable: required keyboard physical-platform metadata is missing' >&2
              exit 1
            fi
          }

          require_motion_trace_metadata() {
            if grep -Eq '^Reduced-motion (device / model|OS / version|browser or installed-PWA context / version|tester / session reference|evidence location|test date/time|verified deployed runtime / release marker): (NOT CAPTURED|NOT VERIFIED|UNSET)$' "$evidence"; then
              echo 'Reduced-motion PASS is not traceable: required reduced-motion physical-platform metadata is missing' >&2
              exit 1
            fi
          }

          if [ "$keyboard" = 'PASS' ]; then
            require_keyboard_trace_metadata
            if grep -Eq '^(Keyboard navigation was performed with a real hardware keyboard or equivalent platform keyboard navigation path|Interactive controls can be reached in a logical sequence without pointer/touch-only interaction|A visible focus indicator is present on focused actionable controls|Focus is not visually lost during the tested core flow|Activation with keyboard controls works for the tested actionable elements): NOT VERIFIED$' "$evidence"; then
              echo 'Keyboard focus PASS conflicts with unverified required physical interaction checks' >&2
              exit 1
            fi
          fi

          if [ "$motion" = 'PASS' ]; then
            require_motion_trace_metadata
            if grep -Eq '^(Platform/browser reduced-motion preference was enabled before the tested interaction|The active page/session was confirmed to receive the reduced-motion preference|The tested core interaction remains usable with reduced motion enabled|Non-essential animation/motion covered by the current implementation is reduced or removed as intended|No new blocking, unreadable, or timing-dependent behavior appears under reduced motion): NOT VERIFIED$' "$evidence"; then
              echo 'Reduced-motion PASS conflicts with unverified required real-platform checks' >&2
              exit 1
            fi
          fi

      - name: Explain evidence boundary
        run: |
          echo 'Keyboard/reduced-motion evidence contract is internally consistent with independent trace metadata.'
          echo 'This static guard does not create a physical-platform result, full accessibility PASS, Public Beta completion, or Commercial GO.'
