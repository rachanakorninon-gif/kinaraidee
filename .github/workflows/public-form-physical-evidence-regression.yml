name: Public Form Physical Evidence Regression

on:
  push:
    branches: ["main"]
    paths:
      - 'PUBLIC-FORM-PHYSICAL-EVIDENCE.md'
      - 'BETA-TEST-CASES.md'
      - 'CURRENT-RELEASE.md'
      - 'RELEASE-CHECKLIST.md'
      - '.github/workflows/public-form-physical-evidence-regression.yml'
  pull_request:
    paths:
      - 'PUBLIC-FORM-PHYSICAL-EVIDENCE.md'
      - 'BETA-TEST-CASES.md'
      - 'CURRENT-RELEASE.md'
      - 'RELEASE-CHECKLIST.md'
      - '.github/workflows/public-form-physical-evidence-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify TC-11/TC-12 physical evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          evidence='PUBLIC-FORM-PHYSICAL-EVIDENCE.md'
          tests='BETA-TEST-CASES.md'
          release='CURRENT-RELEASE.md'
          checklist='RELEASE-CHECKLIST.md'

          require_text(){
            file="$1"
            text="$2"
            grep -Fq -- "$text" "$file" || { echo "Missing required text in $file: $text"; exit 1; }
          }

          require_count(){
            file="$1"
            text="$2"
            expected="$3"
            actual="$(grep -Fc -- "$text" "$file" || true)"
            [ "$actual" -eq "$expected" ] || { echo "Expected $expected occurrences in $file: $text (found $actual)"; exit 1; }
          }

          status="$(sed -n 's/^Status: \*\*\([^*]*\)\*\*$/\1/p' "$evidence" | head -n1)"
          case "$status" in
            'NOT VERIFIED'|'PASS') ;;
            *) echo "Unsupported physical-form evidence status: $status"; exit 1 ;;
          esac

          require_text "$evidence" 'TC-11 Feedback physical acceptance'
          require_text "$evidence" 'TC-12 Partner application physical acceptance'
          require_text "$evidence" 'Partner test records used for Beta QA must not be counted as real commercial partner, conversion, commission, payment, or revenue evidence.'
          require_text "$evidence" 'A PASS requires the tested device/OS/browser-or-PWA context, tester/session reference, and evidence location to be captured for both TC-11 and TC-12; missing trace metadata must remain `NOT CAPTURED`, not inferred from CI or deployment records.'
          require_text "$evidence" 'TC-11/TC-12 PASS does not imply full device-matrix completion, Public Beta completion, or Commercial GO.'

          require_text "$tests" 'ห้ามทำเครื่องหมาย Pass โดยไม่ได้ทดสอบบนอุปกรณ์จริง'
          require_text "$checklist" 'Feedback'
          require_text "$checklist" 'Partner'
          require_text "$release" 'Public Beta is still **NOT COMPLETE**.'

          if [ "$status" = 'NOT VERIFIED' ]; then
            require_count "$evidence" 'Duplicate-submit protection observed: **NOT VERIFIED**' 2
            require_count "$evidence" 'Reproducible network/SDK failure exercised: **NOT VERIFIED**' 2
            require_count "$evidence" 'Submit control re-enabled after failure: **NOT VERIFIED**' 2
            require_count "$evidence" '`aria-busy` cleared after failure: **NOT VERIFIED**' 2
            require_count "$evidence" '- Result: **NOT VERIFIED**' 2
            require_text "$release" 'Real Feedback and Partner application submission behavior for PR #201 remains open'
            require_text "$release" 'real Feedback/Partner form interaction for the changed PR #201 paths'
            echo 'Public form physical evidence remains explicitly unverified and separated from CI/deployment evidence'
            exit 0
          fi

          # PASS is permitted only when both TC-11 and TC-12 carry traceable observed evidence.
          require_count "$evidence" 'Intended authorized Beta test submission completed: **PASS**' 2
          require_count "$evidence" 'Duplicate-submit protection observed: **PASS**' 2
          require_count "$evidence" 'Reproducible network/SDK failure exercised: **PASS**' 2
          require_count "$evidence" 'Submit control re-enabled after failure: **PASS**' 2
          require_count "$evidence" '`aria-busy` cleared after failure: **PASS**' 2
          require_count "$evidence" 'Success evidence kept separate from failure-recovery evidence: **PASS**' 2
          require_count "$evidence" '- Result: **PASS**' 2
          require_count "$evidence" '- Device / OS / browser or installed-PWA context: **NOT CAPTURED**' 0
          require_count "$evidence" '- Tester/session reference: **NOT CAPTURED**' 0
          require_count "$evidence" '- Evidence location: **NOT CAPTURED**' 0
          require_text "$evidence" 'Privacy notice version recorded as expected: **PASS**'
          require_text "$evidence" 'Privacy acknowledgement timestamp recorded as expected: **PASS**'

          if grep -Fq -- '**NOT VERIFIED**' "$evidence"; then
            echo 'PASS status cannot coexist with NOT VERIFIED acceptance fields.'
            exit 1
          fi
          if grep -Fq -- '**NOT CAPTURED**' "$evidence"; then
            echo 'PASS status cannot coexist with missing device/session/evidence trace metadata.'
            exit 1
          fi
          if grep -Fq -- 'Real Feedback and Partner application submission behavior for PR #201 remains open' "$release"; then
            echo 'Physical PASS cannot coexist with the stale release-summary marker that TC-11/TC-12 remain open.'
            exit 1
          fi
          if grep -Fq -- 'real Feedback/Partner form interaction for the changed PR #201 paths' "$release"; then
            echo 'Physical PASS cannot coexist with the stale release-summary blocker for PR #201 form interaction.'
            exit 1
          fi

          echo 'Public form physical evidence PASS is internally complete, traceable, synchronized with the release-summary boundary, and remains separate from broader Beta/Commercial gates'
