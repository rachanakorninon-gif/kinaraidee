name: Fix runtime historical wording

on:
  push:
    branches:
      - docs/fix-runtime-historical-wording-20260912
    paths:
      - .github/workflows/fix-runtime-historical-wording.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-runtime-historical-wording-20260912
          fetch-depth: 0
      - run: python .github/scripts/fix-runtime-historical-wording.py
      - run: |
          grep -Fq 'That trace remains historical verified deployment evidence superseded by the current Issue #585 offline-shell deployment trace.' CURRENT-RUNTIME.md
          rm .github/scripts/fix-runtime-historical-wording.py
          rm .github/workflows/fix-runtime-historical-wording.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(release): fix stale Issue 585 historical wording"
          git push origin HEAD:docs/fix-runtime-historical-wording-20260912
