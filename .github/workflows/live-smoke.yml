name: Kinaraidee Live Smoke Test

on:
  workflow_run:
    workflows: ["Deploy Kinaraidee to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime declaration
        uses: actions/checkout@v4

      - name: Wait for Pages propagation
        run: sleep 20

      - name: Check live public pages and assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          paths=('/' '/index.html' '/404.html' '/privacy.html' '/feedback.html' '/partner.html' '/member.html' '/reset-password.html' '/deployment-check.html' '/manifest.webmanifest' '/sw.js' '/icon.svg' '/robots.txt' '/sitemap.xml' '/release-meta.json' '/data/foods-expanded.js' '/data/choice-rules.js' '/data/nearby-restaurants.js' '/data/group-mode.js' '/data/group-sync.js' '/data/group-remote.js' '/data/member-sync.js' '/data/pwa-install.js' '/data/home-surprise.js')
          for path in "${paths[@]}"; do
            url="$base$path"
            echo "Checking $url"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$url" >/dev/null
          done

      - name: Check current live runtime contract
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          expected_cache="$(sed -n 's/^- PWA cache marker: `\(kinaraidee-beta-v[0-9][0-9]*\)`.*/\1/p' CURRENT-RUNTIME.md | head -n1)"
          test -n "$expected_cache" || { echo 'Unable to derive expected cache marker'; exit 1; }
          html="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/")"
          probe="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/deployment-check.html")"
          sw="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/sw.js")"
          nearby="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/nearby-restaurants.js")"
          group_mode="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/group-mode.js")"
          group_remote="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/group-remote.js")"
          release_meta="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/release-meta.json")"
          surprise="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/home-surprise.js")"
          pwa="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/pwa-install.js")"
          feedback="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/feedback.html")"
          partner="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/partner.html")"
          member="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/member.html")"
          reset="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/reset-password.html")"
          robots="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/robots.txt")"
          sitemap="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/sitemap.xml")"

          grep -q 'กินอะไรดี' <<<"$html"
          grep -q 'manifest.webmanifest' <<<"$html"
          grep -q 'serviceWorker' <<<"$html"
          grep -q 'home-surprise.js' <<<"$html"
          grep -Fq "s.src='data/pwa-install.js'" <<<"$surprise"
          grep -Fq 'ensurePwaInstallHelper();' <<<"$surprise"
          grep -Fq '2026-08-23-group-result-bridge' <<<"$probe"
          grep -Fq 'surprise-a11y-v2' <<<"$probe"
          grep -Fq 'focus-motion-v14' <<<"$probe"
          grep -Fq 'pages-actions-source-v1' <<<"$probe"
          grep -Fq 'showRemoteResult:useRemoteVotes' <<<"$probe"
          grep -Fq 'remoteShowResult.onclick=showOnlineResult' <<<"$probe"
          grep -Fq 'homeSurpriseStatus' <<<"$probe"

          live_cache="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" <<<"$sw")"
          test "$live_cache" = "$expected_cache" || { echo "Live cache $live_cache does not match expected $expected_cache"; exit 1; }
          grep -q 'cache.addAll(SHELL)' <<<"$sw"
          grep -q 'home-surprise.js' <<<"$sw"
          grep -q 'pwa-install.js' <<<"$sw"
          if grep -q 'Promise.allSettled' <<<"$sw"; then echo 'Live Service Worker unexpectedly uses non-atomic shell install'; exit 1; fi

          deployed_sha="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));if(!/^[0-9a-f]{40}$/.test(String(m.sha||'')))process.exit(2);process.stdout.write(String(m.sha));" <<<"$release_meta")"
          meta_cache="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(String(m.pwa_cache||''));" <<<"$release_meta")"
          test "$meta_cache" = "$expected_cache" || { echo "Unexpected release-meta cache: $meta_cache expected $expected_cache"; exit 1; }
          test "$live_cache" = "$meta_cache" || { echo "Live sw.js cache marker $live_cache does not match release-meta $meta_cache"; exit 1; }

          grep -Fq 'function useRemoteVotes(votes,setup)' <<<"$group_mode"
          grep -Fq 'window.KINARAIDEE_GROUP_MODE={showRemoteResult:useRemoteVotes}' <<<"$group_mode"
          grep -Fq 'window.KINARAIDEE_GROUP_MODE?.showRemoteResult' <<<"$group_remote"
          grep -Fq 'remoteShowResult.onclick=showOnlineResult' <<<"$group_remote"
          grep -q 'box.replaceChildren()' <<<"$nearby"
          grep -q "name.textContent=String(r.name" <<<"$nearby"

          grep -Fq 'kinaraideeAccessibilityStyles' <<<"$surprise"
          grep -Fq 'button:focus-visible' <<<"$surprise"
          grep -Fq 'prefers-reduced-motion' <<<"$surprise"
          grep -Fq 'button:focus-visible' <<<"$feedback"
          grep -Fq 'prefers-reduced-motion:reduce' <<<"$feedback"
          grep -Fq 'button:focus-visible' <<<"$partner"
          grep -Fq 'prefers-reduced-motion:reduce' <<<"$partner"

          # PR #201 public-form recovery contract must be present in the deployed artifact.
          # These checks are non-mutating: they inspect public source only and do not submit forms.
          grep -Fq 'if(sendBtn.disabled)return' <<<"$feedback"
          grep -Fq 'catch(error)' <<<"$feedback"
          grep -Fq 'finally{' <<<"$feedback"
          grep -Fq 'sendBtn.disabled=false' <<<"$feedback"
          grep -Fq "sendBtn.removeAttribute('aria-busy')" <<<"$feedback"
          grep -Fq 'กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง' <<<"$feedback"
          grep -Fq 'if(b.disabled)return' <<<"$partner"
          grep -Fq 'catch(error)' <<<"$partner"
          grep -Fq 'finally{' <<<"$partner"
          grep -Fq 'b.disabled=false' <<<"$partner"
          grep -Fq "b.removeAttribute('aria-busy')" <<<"$partner"
          grep -Fq 'กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง' <<<"$partner"

          grep -Fq "status.setAttribute('aria-live','assertive')" <<<"$surprise"
          grep -Fq "document.body.appendChild(status)" <<<"$surprise"
          grep -Fq "b.setAttribute('aria-busy',on?'true':'false')" <<<"$surprise"
          grep -q 'pageshow' <<<"$surprise"
          grep -q 'online' <<<"$surprise"
          grep -q 'เข้าใจแล้ว' <<<"$pwa"
          grep -q 'MacIntel' <<<"$pwa"
          grep -q "PRIVACY_NOTICE_VERSION='2026-08-21'" <<<"$partner"
          grep -q 'privacy_acknowledged_at:new Date().toISOString()' <<<"$partner"

          grep -Fq 'minlength="8"' <<<"$member"
          grep -Fq 'p.length<8' <<<"$member"
          grep -Fq 'minlength="8"' <<<"$reset"
          grep -Fq 'p.length<8' <<<"$reset"
          grep -Fq "location.href='member.html'" <<<"$reset"
          if grep -q 'error\.message' <<<"$member"; then echo 'Live member page exposes raw backend error.message'; exit 1; fi
          if grep -q 'error\.message' <<<"$reset"; then echo 'Live reset page exposes raw backend error.message'; exit 1; fi
          if grep -q "location.href='admin.html'" <<<"$reset"; then echo 'Live member reset incorrectly redirects to private admin page'; exit 1; fi

          grep -q 'sitemap.xml' <<<"$robots"
          grep -q '<urlset' <<<"$sitemap"
          grep -q 'privacy.html' <<<"$sitemap"
          grep -q 'feedback.html' <<<"$sitemap"
          grep -q 'partner.html' <<<"$sitemap"
          echo "Live smoke passed for current runtime $expected_cache; deployed SHA $deployed_sha"

      - name: Verify development files are not published
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          private_paths=('/README.md' '/SECURITY.md' '/BETA-DAILY-LOG.md' '/RELEASE-CHECKLIST.md' '/CURRENT-RUNTIME.md' '/.github/workflows/pages.yml' '/supabase/config.toml' '/admin.html' '/partner-manage.html' '/conversion-manage.html' '/reports.html')
          for path in "${private_paths[@]}"; do
            url="$base$path"
            code="$(curl --silent --location --output /dev/null --write-out '%{http_code}' --max-time 30 "$url")"
            echo "$path -> HTTP $code"
            if [ "$code" = '200' ]; then echo "Development-only path is unexpectedly public: $path"; exit 1; fi
          done

      - name: Record traceable automated evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          release_meta="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/release-meta.json")"
          sw="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/sw.js")"
          deployed_sha="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));if(!/^[0-9a-f]{40}$/.test(String(m.sha||'')))process.exit(2);process.stdout.write(String(m.sha));" <<<"$release_meta")"
          meta_cache="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(String(m.pwa_cache||''));" <<<"$release_meta")"
          live_cache="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" <<<"$sw")"
          test -n "$deployed_sha"
          test "$meta_cache" = "$live_cache"
          if [ "$EVENT_NAME" = 'workflow_run' ] && [ -n "${DEPLOY_HEAD_SHA:-}" ]; then
            verified_sha="$DEPLOY_HEAD_SHA"
            source_run="$SERVER_URL/$REPOSITORY/actions/runs/$DEPLOY_RUN_ID"
            trigger='successful Pages workflow_run'
            test "$deployed_sha" = "$DEPLOY_HEAD_SHA" || { echo "Live release-meta SHA $deployed_sha does not match Pages head SHA $DEPLOY_HEAD_SHA"; exit 1; }
          else
            verified_sha="$deployed_sha"
            source_run='manual workflow_dispatch'
            trigger='manual workflow_dispatch against currently deployed artifact'
          fi
          {
            echo '## Kinaraidee automated live evidence'
            echo
            echo "- Release commit checked: \`$verified_sha\`"
            echo "- Public release-meta SHA: \`$deployed_sha\`"
            echo "- Trigger: $trigger"
            echo "- Source deployment run: $source_run"
            echo '- Public URL: https://rachanakorninon-gif.github.io/kinaraidee/'
            echo "- Service Worker cache marker: \`$live_cache\`"
            echo '- Visible focus + reduced-motion source contract: checked on deployed assets'
            echo '- Surprise persistent live-region contract: checked'
            echo '- Completed live-group result bridge: checked'
            echo '- Public Feedback/Partner failure-recovery source contract: checked on deployed assets (non-mutating)'
            echo '- Partner renderer/privacy wiring: checked'
            echo '- Member auth/reset minimum-length + error-hygiene contract: checked'
            echo '- Development-only exposure check: completed'
            echo
            echo '> Automated live evidence does not replace real Feedback/Partner submission, keyboard/device interaction, TalkBack/VoiceOver, NF-05/NF-07/NF-09, full real-device matrix, or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
