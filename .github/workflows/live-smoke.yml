name: Kinaraidee Live Smoke Test

on:
  workflow_run:
    workflows: ["Deploy Kinaraidee to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages propagation
        run: sleep 20

      - name: Check live public pages and assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          paths=('/' '/index.html' '/404.html' '/privacy.html' '/feedback.html' '/partner.html' '/manifest.webmanifest' '/sw.js' '/icon.svg' '/robots.txt' '/sitemap.xml' '/release-meta.json' '/data/foods-expanded.js' '/data/choice-rules.js' '/data/nearby-restaurants.js' '/data/group-mode.js' '/data/group-sync.js' '/data/group-remote.js' '/data/member-sync.js' '/data/pwa-install.js' '/data/home-surprise.js')
          for path in "${paths[@]}"; do url="$base$path"; echo "Checking $url"; curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$url" >/dev/null; done

      - name: Check latest live app markers, group bridge, and PWA v13
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          html="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/")"
          sw="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/sw.js")"
          nearby="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/nearby-restaurants.js")"
          group_mode="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/group-mode.js")"
          group_remote="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/group-remote.js")"
          release_meta="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/release-meta.json")"
          surprise="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/home-surprise.js")"
          pwa="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/pwa-install.js")"
          partner="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/partner.html")"
          robots="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/robots.txt")"
          sitemap="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/sitemap.xml")"
          grep -q 'กินอะไรดี' <<<"$html"
          grep -q 'manifest.webmanifest' <<<"$html"
          grep -q 'serviceWorker' <<<"$html"
          grep -q 'home-surprise.js' <<<"$html"
          grep -q 'pwa-install.js' <<<"$html"
          grep -q 'kinaraidee-beta-v13' <<<"$sw"
          grep -q 'cache.addAll(SHELL)' <<<"$sw"
          grep -q 'home-surprise.js' <<<"$sw"
          grep -q 'pwa-install.js' <<<"$sw"
          if grep -q 'Promise.allSettled' <<<"$sw"; then echo 'Live Service Worker unexpectedly uses non-atomic shell install'; exit 1; fi
          grep -Fq 'function useRemoteVotes(votes,setup)' <<<"$group_mode"
          grep -Fq 'window.KINARAIDEE_GROUP_MODE={showRemoteResult:useRemoteVotes}' <<<"$group_mode"
          grep -Fq "await load('data/group-sync.js')" <<<"$group_mode"
          grep -Fq "await load('data/group-remote.js')" <<<"$group_mode"
          grep -Fq 'window.KINARAIDEE_GROUP_MODE?.showRemoteResult' <<<"$group_remote"
          grep -Fq 'remoteShowResult.onclick=showOnlineResult' <<<"$group_remote"
          grep -Fq 'renderGroupResult();return true' <<<"$group_mode"
          deployed_sha="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));if(!/^[0-9a-f]{40}$/.test(String(m.sha||'')))process.exit(2);process.stdout.write(String(m.sha));" <<<"$release_meta")"
          meta_cache="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(String(m.pwa_cache||''));" <<<"$release_meta")"
          live_cache="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" <<<"$sw")"
          test -n "$deployed_sha" || { echo 'release-meta.json has no valid deployed SHA'; exit 1; }
          test "$meta_cache" = 'kinaraidee-beta-v13' || { echo "Unexpected release-meta PWA cache: $meta_cache"; exit 1; }
          test "$live_cache" = "$meta_cache" || { echo "Live sw.js cache marker $live_cache does not match release-meta $meta_cache"; exit 1; }
          grep -q 'box.replaceChildren()' <<<"$nearby"
          grep -q "name.textContent=String(r.name" <<<"$nearby"
          grep -q 'aria-busy' <<<"$surprise"
          grep -q 'กำลังเลือกให้' <<<"$surprise"
          grep -q 'pageshow' <<<"$surprise"
          grep -q 'online' <<<"$surprise"
          grep -q 'เข้าใจแล้ว' <<<"$pwa"
          grep -q 'MacIntel' <<<"$pwa"
          grep -q "PRIVACY_NOTICE_VERSION='2026-08-21'" <<<"$partner"
          grep -q 'privacy_notice_version:PRIVACY_NOTICE_VERSION' <<<"$partner"
          grep -q 'privacy_acknowledged_at:new Date().toISOString()' <<<"$partner"
          grep -q 'sitemap.xml' <<<"$robots"
          grep -q '<urlset' <<<"$sitemap"
          grep -q 'privacy.html' <<<"$sitemap"
          grep -q 'feedback.html' <<<"$sitemap"
          grep -q 'partner.html' <<<"$sitemap"
          echo 'Live smoke test passed for PWA v13 with completed group-result bridge and release metadata'

      - name: Verify development files are not published
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          private_paths=('/README.md' '/SECURITY.md' '/BETA-DAILY-LOG.md' '/RELEASE-CHECKLIST.md' '/.github/workflows/pages.yml' '/supabase/config.toml')
          for path in "${private_paths[@]}"; do url="$base$path"; code="$(curl --silent --location --output /dev/null --write-out '%{http_code}' --max-time 30 "$url")"; echo "$path -> HTTP $code"; if [ "$code" = '200' ]; then echo "Development-only path is unexpectedly public: $path"; exit 1; fi; done

      - name: Record traceable automated evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          release_meta="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/release-meta.json")"
          sw="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/sw.js")"
          deployed_sha="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));if(!/^[0-9a-f]{40}$/.test(String(m.sha||'')))process.exit(2);process.stdout.write(String(m.sha));" <<<"$release_meta")"
          meta_cache="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(String(m.pwa_cache||''));" <<<"$release_meta")"
          live_cache="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" <<<"$sw")"
          test -n "$deployed_sha" || { echo 'Unable to derive deployed SHA from release-meta.json'; exit 1; }
          test "$meta_cache" = "$live_cache" || { echo "release-meta cache $meta_cache does not match live sw.js cache $live_cache"; exit 1; }
          if [ "$EVENT_NAME" = 'workflow_run' ] && [ -n "${DEPLOY_HEAD_SHA:-}" ]; then
            verified_sha="$DEPLOY_HEAD_SHA"
            source_run="$SERVER_URL/$REPOSITORY/actions/runs/$DEPLOY_RUN_ID"
            trigger='successful Pages workflow_run'
            test "$deployed_sha" = "$DEPLOY_HEAD_SHA" || { echo "Live release-meta SHA $deployed_sha does not match Pages head SHA $DEPLOY_HEAD_SHA"; exit 1; }
          else
            verified_sha="$deployed_sha"
            source_run='manual workflow_dispatch'
            trigger='manual workflow_dispatch against currently deployed artifact'
          fi
          {
            echo '## Kinaraidee automated live evidence'
            echo
            echo "- Release commit checked: \`$verified_sha\`"
            echo "- Public release-meta SHA: \`$deployed_sha\`"
            echo "- Trigger: $trigger"
            echo "- Source deployment run: $source_run"
            echo '- Public URL: https://rachanakorninon-gif.github.io/kinaraidee/'
            echo "- Service Worker cache marker: \`$live_cache\` (matches release-meta.json)"
            echo '- Completed live-group result bridge: checked on deployed assets'
            echo '- Partner renderer safety markers: checked'
            echo '- Partner privacy acknowledgement wiring: checked'
            echo '- App shell strategy checked: `cache.addAll(SHELL)`'
            echo '- Development-only exposure check: completed'
            echo
            echo '> This summary is automated live-asset evidence only. It does not replace real-device TC/NF interaction testing or Commercial GO approval.'
          } >> "$GITHUB_STEP_SUMMARY"
