name: Kinaraidee Live Smoke Test

on:
  workflow_run:
    workflows: ["Deploy Kinaraidee to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages propagation
        run: sleep 20

      - name: Check live public pages and assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          paths=(
            '/'
            '/index.html'
            '/404.html'
            '/privacy.html'
            '/feedback.html'
            '/partner.html'
            '/manifest.webmanifest'
            '/sw.js'
            '/icon.svg'
            '/robots.txt'
            '/sitemap.xml'
            '/data/foods-expanded.js'
            '/data/choice-rules.js'
            '/data/nearby-restaurants.js'
            '/data/group-mode.js'
            '/data/group-sync.js'
            '/data/group-remote.js'
            '/data/member-sync.js'
            '/data/pwa-install.js'
            '/data/home-surprise.js'
          )
          for path in "${paths[@]}"; do
            url="$base$path"
            echo "Checking $url"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$url" >/dev/null
          done

      - name: Check latest live app markers and PWA v11
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          html="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/")"
          sw="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/sw.js")"
          surprise="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/home-surprise.js")"
          pwa="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/data/pwa-install.js")"
          robots="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/robots.txt")"
          sitemap="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$base/sitemap.xml")"

          grep -q 'กินอะไรดี' <<<"$html"
          grep -q 'manifest.webmanifest' <<<"$html"
          grep -q 'serviceWorker' <<<"$html"
          grep -q 'home-surprise.js' <<<"$html"
          grep -q 'pwa-install.js' <<<"$html"

          grep -q "kinaraidee-beta-v11" <<<"$sw"
          grep -q "cache.addAll(SHELL)" <<<"$sw"
          grep -q "home-surprise.js" <<<"$sw"
          grep -q "pwa-install.js" <<<"$sw"
          if grep -q 'Promise.allSettled' <<<"$sw"; then
            echo 'Live Service Worker unexpectedly uses non-atomic shell install'
            exit 1
          fi

          grep -q "aria-busy" <<<"$surprise"
          grep -q "กำลังเลือกให้" <<<"$surprise"
          grep -q "pageshow" <<<"$surprise"
          grep -q "online" <<<"$surprise"

          grep -q "เข้าใจแล้ว" <<<"$pwa"
          grep -q "MacIntel" <<<"$pwa"

          grep -q 'sitemap.xml' <<<"$robots"
          grep -q '<urlset' <<<"$sitemap"
          grep -q 'privacy.html' <<<"$sitemap"
          grep -q 'feedback.html' <<<"$sitemap"
          grep -q 'partner.html' <<<"$sitemap"
          echo 'Live smoke test passed for PWA v11 flow'

      - name: Verify development files are not published
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          private_paths=(
            '/README.md'
            '/SECURITY.md'
            '/BETA-DAILY-LOG.md'
            '/RELEASE-CHECKLIST.md'
            '/.github/workflows/pages.yml'
            '/supabase/config.toml'
          )
          for path in "${private_paths[@]}"; do
            url="$base$path"
            code="$(curl --silent --location --output /dev/null --write-out '%{http_code}' --max-time 30 "$url")"
            echo "$path -> HTTP $code"
            if [ "$code" = '200' ]; then
              echo "Development-only path is unexpectedly public: $path"
              exit 1
            fi
          done
          echo 'Development-only files are not exposed by Pages artifact'
