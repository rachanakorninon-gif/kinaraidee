name: Commercial Release Checklist Consistency

on:
  push:
    branches: ['main']
    paths:
      - 'RELEASE-CHECKLIST.md'
      - 'CURRENT-RELEASE.md'
      - 'CURRENT-RUNTIME.md'
      - 'GROUP-API-DEPLOYMENT-EVIDENCE.md'
      - 'PARTNER-API-HARDENING-EVIDENCE.md'
      - 'supabase/functions/group-api/**'
      - 'supabase/group-api-event-observability-v1.sql'
      - 'supabase/group-api-event-observability-v1-rollback.sql'
      - '.github/workflows/release-checklist-consistency.yml'
  pull_request:
    paths:
      - 'RELEASE-CHECKLIST.md'
      - 'CURRENT-RELEASE.md'
      - 'CURRENT-RUNTIME.md'
      - 'GROUP-API-DEPLOYMENT-EVIDENCE.md'
      - 'PARTNER-API-HARDENING-EVIDENCE.md'
      - 'supabase/functions/group-api/**'
      - 'supabase/group-api-event-observability-v1.sql'
      - 'supabase/group-api-event-observability-v1-rollback.sql'
      - '.github/workflows/release-checklist-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-release-checklist-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate checklist matches canonical runtime state
        shell: bash
        run: |
          set -euo pipefail
          runtime='CURRENT-RUNTIME.md'
          release='CURRENT-RELEASE.md'
          checklist='RELEASE-CHECKLIST.md'
          group='GROUP-API-DEPLOYMENT-EVIDENCE.md'
          partner='PARTNER-API-HARDENING-EVIDENCE.md'

          for f in "$runtime" "$release" "$checklist" "$group" "$partner"; do
            test -s "$f" || { echo "Missing required release-state file: $f"; exit 1; }
          done

          runtime_candidate="$(sed -n 's/^- Current browser\/PWA runtime candidate: `\([0-9a-f]\{40\}\)`.*/\1/p' "$runtime" | head -n1)"
          runtime_status="$(sed -n 's/^- Deployment status: \*\*\(.*\)\*\*.*/\1/p' "$runtime" | head -n1)"
          deployed_sha="$(sed -n 's/^- Runtime merge\/deployed SHA: `\([0-9a-f]\{40\}\)`.*/\1/p' "$runtime" | head -n1)"
          marker="$(sed -n 's/^- PWA cache marker: `\(kinaraidee-beta-v[0-9][0-9]*\)`.*/\1/p' "$runtime" | head -n1)"
          sw_marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js | head -n1)"
          release_marker="$(sed -n 's/^- PWA cache marker: `\(kinaraidee-beta-v[0-9][0-9]*\)`.*/\1/p' "$release" | head -n1)"
          checklist_marker="$(sed -n 's/^- Expected Service Worker cache: `\(kinaraidee-beta-v[0-9][0-9]*\)`.*/\1/p' "$checklist" | head -n1)"
          group_candidate="$(sed -n 's/^- Current Group API source candidate: PR #[0-9][0-9]* \/ `\([0-9a-f]\{40\}\)`.*/\1/p' "$release" | head -n1)"
          group_evidence_candidate="$(sed -n 's/^PR #[0-9][0-9]* merged to `main` at `\([0-9a-f]\{40\}\)` and is the current Group API source candidate.*/\1/p' "$group" | head -n1)"
          group_version="$(sed -n 's/^- Observed deployed version at inspection time: `\([0-9][0-9]*\)`.*/\1/p' "$group" | head -n1)"
          partner_candidate="$(sed -n 's/^- PR #[0-9][0-9]* merged as `\([0-9a-f]\{40\}\)`.*/\1/p' "$partner" | head -n1)"
          partner_version="$(sed -n 's/^- Connected Supabase inspection after PR #[0-9][0-9]* verified `partner-api` ACTIVE version \([0-9][0-9]*\).*/\1/p' "$partner" | head -n1)"
          partner_probe_run="$(sed -n 's/^- Partner API Live Rejection Probe run `\([0-9][0-9]*\)` completed \*\*success\*\*.*/\1/p' "$partner" | head -n1)"

          test -n "$runtime_candidate" || { echo 'Unable to parse runtime candidate from CURRENT-RUNTIME.md'; exit 1; }
          test -n "$runtime_status" || { echo 'Unable to parse deployment status from CURRENT-RUNTIME.md'; exit 1; }
          test -n "$marker" || { echo 'Unable to parse cache marker from CURRENT-RUNTIME.md'; exit 1; }
          test -n "$sw_marker" || { echo 'Unable to parse cache marker from sw.js'; exit 1; }
          test "$marker" = "$sw_marker" || { echo "CURRENT-RUNTIME.md marker $marker differs from sw.js $sw_marker"; exit 1; }
          test -n "$release_marker" || { echo 'Unable to parse last canonical release cache marker'; exit 1; }
          test -n "$checklist_marker" || { echo 'Unable to parse checklist cache marker'; exit 1; }
          test -n "$group_candidate" || { echo 'Unable to parse Group API candidate from CURRENT-RELEASE.md'; exit 1; }
          test -n "$group_evidence_candidate" || { echo 'Unable to parse last verified Group API candidate from GROUP-API-DEPLOYMENT-EVIDENCE.md'; exit 1; }
          test -n "$group_version" || { echo 'Unable to parse Group API deployed version from GROUP-API-DEPLOYMENT-EVIDENCE.md'; exit 1; }
          test -n "$partner_candidate" || { echo 'Unable to parse Partner API candidate from PARTNER-API-HARDENING-EVIDENCE.md'; exit 1; }
          test -n "$partner_version" || { echo 'Unable to parse Partner API deployed version from PARTNER-API-HARDENING-EVIDENCE.md'; exit 1; }
          test -n "$partner_probe_run" || { echo 'Unable to parse Partner API live rejection run from PARTNER-API-HARDENING-EVIDENCE.md'; exit 1; }

          case "$runtime_status" in
            'PENDING FOR CURRENT RUNTIME DEPLOYMENT')
              test -z "$deployed_sha" || { echo 'Pending runtime must not claim a current deployed SHA'; exit 1; }
              grep -Fq 'Current runtime deployment evidence is pending' "$runtime" || { echo 'Pending runtime evidence boundary missing'; exit 1; }
              grep -Fq 'Prior verified deployment evidence remains historical and is not reused as current PASS' "$runtime" || { echo 'Pending runtime must preserve prior-evidence boundary'; exit 1; }
              test "$release_marker" = "$checklist_marker" || { echo "Last verified release/checklist marker drift while runtime is pending: $release_marker vs $checklist_marker"; exit 1; }
              ;;
            'PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE')
              test -n "$deployed_sha" || { echo 'PASS runtime must provide deployed SHA'; exit 1; }
              grep -Fq "Current browser/PWA runtime candidate: \`$runtime_candidate\`" "$release" || { echo 'CURRENT-RELEASE.md runtime candidate drift'; exit 1; }
              grep -Fq "Runtime merge/deployed SHA: \`$deployed_sha\`" "$release" || { echo 'CURRENT-RELEASE.md deployed SHA drift'; exit 1; }
              grep -Fq "Current browser/PWA runtime candidate: \`$runtime_candidate\`" "$checklist" || { echo 'RELEASE-CHECKLIST.md runtime candidate drift'; exit 1; }
              grep -Fq "Runtime merge/deployed SHA: \`$deployed_sha\`" "$checklist" || { echo 'RELEASE-CHECKLIST.md deployed SHA drift'; exit 1; }
              test "$release_marker" = "$marker" || { echo 'CURRENT-RELEASE.md cache marker drift'; exit 1; }
              test "$checklist_marker" = "$marker" || { echo 'RELEASE-CHECKLIST.md cache marker drift'; exit 1; }
              ;;
            *)
              echo "Unexpected runtime deployment status: $runtime_status"
              exit 1
              ;;
          esac

          git cat-file -e "${group_candidate}^{commit}" || { echo 'Declared Group API source candidate commit missing from repository history'; exit 1; }
          git merge-base --is-ancestor "$group_candidate" HEAD || { echo 'Declared Group API source candidate is not an ancestor of HEAD'; exit 1; }
          group_paths=(
            supabase/functions/group-api
            supabase/group-api-event-observability-v1.sql
            supabase/group-api-event-observability-v1-rollback.sql
          )
          test -z "$(git diff --name-only "$group_candidate"..HEAD -- "${group_paths[@]}" || true)" || { echo 'Group API/source-observability files changed after declared source candidate'; exit 1; }

          if grep -Eq '^- Current Group API source candidate: .*\*\*PENDING DEPLOYMENT\*\*' "$release"; then
            test "$group_candidate" != "$group_evidence_candidate" || { echo 'Pending Group candidate must remain distinct from last verified deployed evidence until deployment is verified'; exit 1; }
            grep -Fq "Current Group API source candidate: \`$group_evidence_candidate\`" "$checklist" || { echo 'While Group deployment is pending, RELEASE-CHECKLIST.md must remain on the last verified deployed Group candidate'; exit 1; }
            grep -Fq "last verified production Group API remains ACTIVE version $group_version" "$release" || { echo 'Pending Group candidate must explicitly preserve the last verified deployed version'; exit 1; }
            grep -Fq "deployment/source parity for inspected v$group_version payload: **VERIFIED**" "$group" || { echo 'Last verified Group deployment/source evidence boundary changed or missing'; exit 1; }
            group_state="pending-source-$group_candidate / last-deployed-$group_evidence_candidate-v$group_version"
          else
            grep -Fq "Current Group API source candidate: \`$group_candidate\`" "$checklist" || { echo 'RELEASE-CHECKLIST.md Group API candidate drift'; exit 1; }
            test "$group_candidate" = "$group_evidence_candidate" || { echo 'Deployed Group candidate drift between CURRENT-RELEASE.md and deployment evidence'; exit 1; }
            grep -Fq "ACTIVE version $group_version" "$release" || grep -Fq "ACTIVE v$group_version" "$release" || { echo 'CURRENT-RELEASE.md Group API deployed-version drift'; exit 1; }
            grep -Fq "deployment/source parity for inspected v$group_version payload: **VERIFIED**" "$group" || { echo 'Group API deployment/source evidence boundary changed or missing'; exit 1; }
            group_state="deployed-$group_candidate-v$group_version"
          fi

          git cat-file -e "${partner_candidate}^{commit}" || { echo 'Partner API candidate commit missing from repository history'; exit 1; }
          git merge-base --is-ancestor "$partner_candidate" HEAD || { echo 'Partner API candidate is not an ancestor of HEAD'; exit 1; }
          test -z "$(git diff --name-only "$partner_candidate"..HEAD -- supabase/functions/partner-api)" || { echo 'Partner API source changed after recorded candidate; refresh deployment evidence'; exit 1; }
          grep -Fq "ACTIVE v$partner_version" "$release" || grep -Fq "ACTIVE version $partner_version" "$release" || { echo 'CURRENT-RELEASE.md Partner API deployed-version drift'; exit 1; }
          grep -Fq "run \`$partner_probe_run\`" "$release" || { echo 'CURRENT-RELEASE.md Partner API live-probe evidence drift'; exit 1; }
          grep -Fq 'VERIFIED PASS — REJECTION BEHAVIOR ONLY' "$partner" || { echo 'Partner API evidence boundary changed or missing'; exit 1; }

          grep -Fq 'Public Beta remains **NOT COMPLETE**' "$release" || { echo 'Canonical release must preserve incomplete Public Beta gate'; exit 1; }
          grep -Fq 'Commercial launch remains **NO-GO**' "$release" || { echo 'Canonical release must preserve Commercial NO-GO gate'; exit 1; }
          grep -Fq 'ห้ามเปิดรับเงินจริง' "$checklist" || { echo 'Commercial checklist must preserve no-real-money gate'; exit 1; }

          echo "Commercial release checklist preserves runtime $runtime_candidate / $runtime_status / Group $group_state / Partner $partner_candidate v$partner_version probe $partner_probe_run"

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Commercial release checklist consistency'
            echo
            echo "- Repository SHA: \`${GITHUB_SHA}\`"
            echo '- Scope: cross-document release-state consistency only'
            echo '- Browser PENDING and PASS states retain their existing exact lineage/deployment rules.'
            echo '- A pending Group API source candidate must be fully lineage-declared while the commercial checklist and deployment evidence remain pinned to the last verified deployed Group source/version.'
            echo '- A deployed Group API state requires current source candidate, checklist and deployment evidence to converge again.'
            echo '- Partner API source/deployment/live-rejection evidence and incomplete/NO-GO safety language remain required.'
            echo '- This does not create device, user, conversion, payment, partner agreement, legal or Commercial readiness evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
