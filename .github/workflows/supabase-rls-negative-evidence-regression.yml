name: Supabase RLS Negative Evidence Regression

on:
  pull_request:
    paths:
      - 'SUPABASE-RLS-NEGATIVE-EVIDENCE.md'
      - 'SUPABASE-RLS-AUTHORIZATION-EVIDENCE.md'
      - 'CURRENT-RELEASE.md'
      - 'supabase/beta-feedback-admin-rls-contract.sql'
      - '.github/workflows/supabase-rls-negative-evidence-regression.yml'
  push:
    branches: ['main']
    paths:
      - 'SUPABASE-RLS-NEGATIVE-EVIDENCE.md'
      - 'SUPABASE-RLS-AUTHORIZATION-EVIDENCE.md'
      - 'CURRENT-RELEASE.md'
      - 'supabase/beta-feedback-admin-rls-contract.sql'
      - '.github/workflows/supabase-rls-negative-evidence-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify authenticated RLS negative-evidence scope
        shell: bash
        run: |
          set -euo pipefail
          evidence='SUPABASE-RLS-NEGATIVE-EVIDENCE.md'
          auth='SUPABASE-RLS-AUTHORIZATION-EVIDENCE.md'
          release='CURRENT-RELEASE.md'
          contract='supabase/beta-feedback-admin-rls-contract.sql'

          test -s "$evidence"
          test -s "$auth"
          test -s "$release"
          test -s "$contract"

          grep -Fq 'READ + CROSS-USER MUTATION NEGATIVE EVIDENCE' "$evidence"
          grep -Fq '`member_profiles` UPDATE' "$evidence"
          grep -Fq '`member_food_history` DELETE' "$evidence"
          grep -Fq '`user_food_history` DELETE' "$evidence"
          grep -Fq 'could not update/delete another user' "$evidence"

          # Keep the newly verified cross-user INSERT denials explicit and scoped.
          grep -Fq 'Cross-user INSERT negative probe' "$evidence"
          grep -Fq '`member_profiles` INSERT with another member' "$evidence"
          grep -Fq '`member_food_history` INSERT with another member' "$evidence"
          grep -Fq '`user_food_history` INSERT with another member' "$evidence"
          grep -Fq '`beta_feedback` INSERT with another member' "$evidence"
          test "$(grep -Fc '| `42501` | **YES** |' "$evidence")" -eq 4
          grep -Fq 'all four exercised cross-user INSERT attempts were rejected' "$evidence"
          grep -Fq 'No probe row was intentionally retained' "$evidence"

          # Preserve explicit limits: SQL-session negative probes are not a blanket
          # Auth/RLS, external session lifecycle, Public Beta or Commercial PASS.
          grep -Fq 'every INSERT payload/mutation shape' "$evidence"
          grep -Fq 'real browser/mobile authenticated-session lifecycle' "$evidence"
          grep -Fq 'privileged-backend/service-role authorization behavior' "$evidence"
          grep -Fq 'leaked-password protection' "$evidence"
          grep -Fq 'real-device behavior, Public Beta completion, or Commercial GO' "$evidence"

          # Keep the canonical release summary aligned with the same open boundaries.
          grep -Fq 'does not prove every authenticated per-user JWT/RLS path' "$release"
          grep -Fq 'Supabase leaked-password protection gate (focused follow-up **Issue #372**; historical security tracker **Issue #11**)' "$release"
          grep -Fq 'Public Beta is still **NOT COMPLETE**' "$release"
          grep -Fq 'Commercial launch remains **NO-GO**' "$release"

          # Keep beta_feedback evidence tied to the hardened private admin helper.
          grep -Fq 'private.is_admin_dashboard_owner()' "$auth"
          grep -Fq 'create or replace function private.is_admin_dashboard_owner()' "$contract"
          grep -Fq "set search_path = ''" "$contract"
          grep -Fq 'revoke execute on function private.is_admin_dashboard_owner() from anon;' "$contract"

          echo 'Authenticated RLS negative-evidence contract is internally consistent.'

      - name: Reject evidence overclaiming
        shell: bash
        run: |
          set -euo pipefail
          evidence='SUPABASE-RLS-NEGATIVE-EVIDENCE.md'

          if grep -Ei '(^|[^A-Za-z])(full|complete|blanket)[[:space:]]+(auth|rls|security)[[:space:]]+pass' "$evidence"; then
            echo 'Over-broad Auth/RLS/Security PASS wording detected in scoped RLS evidence.'
            exit 1
          fi
          if grep -Ei 'commercial[[:space:]]+(go|pass)[[:space:]]*[:=-]?[[:space:]]*(yes|pass|approved|ready)' "$evidence"; then
            echo 'Commercial readiness overclaim detected in scoped RLS evidence.'
            exit 1
          fi

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Supabase authenticated RLS negative evidence'
            echo
            echo '- Guards authenticated cross-user read isolation plus selected INSERT/UPDATE/DELETE negative paths.'
            echo '- Keeps CURRENT-RELEASE.md aligned with the scoped RLS/Auth evidence boundary and canonical focused/historical issue routing.'
            echo '- Keeps beta_feedback evidence tied to the current private admin-helper contract.'
            echo '- This workflow validates documentation/source consistency only. It does not re-run live SQL probes, prove every mutation/JWT/session/service-role path, enable leaked-password protection, or establish Public Beta/Commercial PASS.'
          } >> "$GITHUB_STEP_SUMMARY"
