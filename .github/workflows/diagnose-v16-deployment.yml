name: Diagnose v16 Deployment

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_SHA: 1d21613c3c7d3e62ed8f7e5c3f00700606129c58
      BASE_URL: https://rachanakorninon-gif.github.io/kinaraidee
    steps:
      - name: Verify merged-main deployment evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100"
          pages_id=''
          pages_conclusion=''
          smoke_id=''
          smoke_conclusion=''

          for attempt in $(seq 1 24); do
            json="$(curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            parsed="$(printf '%s' "$json" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const j=JSON.parse(s), runs=j.workflow_runs||[];
                const pages=runs.find(r=>r.name==="Deploy Kinaraidee to GitHub Pages" && r.event==="push");
                const smoke=runs.find(r=>r.name==="Kinaraidee Live Smoke Test" && r.event==="workflow_run");
                console.log([pages?.id||"",pages?.conclusion||pages?.status||"",smoke?.id||"",smoke?.conclusion||smoke?.status||""].join("\t"));
              });
            ')"
            IFS=$'\t' read -r pages_id pages_conclusion smoke_id smoke_conclusion <<< "$parsed"
            echo "poll=${attempt} pages=${pages_id:-none}/${pages_conclusion:-none} smoke=${smoke_id:-none}/${smoke_conclusion:-none}"
            if [ -n "$pages_id" ] && [ "$pages_conclusion" = success ] && [ -n "$smoke_id" ] && [ "$smoke_conclusion" = success ]; then
              break
            fi
            sleep 10
          done

          test -n "$pages_id" || { echo 'No exact Pages push run found for target SHA'; exit 1; }
          test "$pages_conclusion" = success || { echo "Pages run $pages_id is not success: $pages_conclusion"; exit 1; }
          test -n "$smoke_id" || { echo 'No exact Live Smoke workflow_run found for target SHA'; exit 1; }
          test "$smoke_conclusion" = success || { echo "Live Smoke run $smoke_id is not success: $smoke_conclusion"; exit 1; }

          meta=''
          for attempt in $(seq 1 18); do
            meta="$(curl --fail --silent --show-error --location --retry 2 --retry-delay 2 "${BASE_URL}/release-meta.json" || true)"
            if printf '%s' "$meta" | grep -Fq "$TARGET_SHA" && printf '%s' "$meta" | grep -Fq 'kinaraidee-beta-v16'; then
              break
            fi
            echo "public-meta-poll=${attempt} value=${meta:-unavailable}"
            sleep 10
          done
          printf '%s\n' "$meta" | grep -Fq "$TARGET_SHA" || { echo 'Public release-meta SHA does not match target'; exit 1; }
          printf '%s\n' "$meta" | grep -Fq 'kinaraidee-beta-v16' || { echo 'Public release-meta cache is not v16'; exit 1; }

          sw="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "${BASE_URL}/sw.js")"
          printf '%s\n' "$sw" | grep -Fq "const CACHE='kinaraidee-beta-v16';" || { echo 'Live Service Worker is not v16'; exit 1; }
          printf '%s\n' "$sw" | grep -Fq "'./data/member-sync.js'" || { echo 'Live shell is missing member-sync.js'; exit 1; }
          printf '%s\n' "$sw" | grep -Fq "'./data/home-surprise.js'" || { echo 'Live shell is missing home-surprise.js'; exit 1; }

          member="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "${BASE_URL}/data/member-sync.js")"
          printf '%s\n' "$member" | grep -Fq "const OUTBOX_KEY='kinaraideeMemberHistoryOutboxV1';" || { echo 'Live member sync lacks durable outbox'; exit 1; }
          printf '%s\n' "$member" | grep -Fq 'outboxForCurrentUser().length>0' || { echo 'Live member sync lacks outbox snapshot guard'; exit 1; }
          printf '%s\n' "$member" | grep -Fq "window.addEventListener('online'" || { echo 'Live member sync lacks online retry'; exit 1; }

          home="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "${BASE_URL}/data/home-surprise.js")"
          printf '%s\n' "$home" | grep -Fq 'function ensureMemberSync()' || { echo 'Live home helper lacks early member sync'; exit 1; }
          printf '%s\n' "$home" | grep -Fq "s.src='data/member-sync.js';" || { echo 'Live home helper does not load member sync'; exit 1; }

          echo "EVIDENCE pages_run=${pages_id} pages=${pages_conclusion} live_smoke_run=${smoke_id} smoke=${smoke_conclusion} target_sha=${TARGET_SHA} cache=kinaraidee-beta-v16"
          echo "PUBLIC release_meta=${meta}"
          echo 'LIVE_ASSETS member-history-outbox=PASS early-member-sync=PASS sw-v16=PASS'
