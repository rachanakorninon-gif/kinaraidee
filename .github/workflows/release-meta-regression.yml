name: Kinaraidee Release Metadata Regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-meta-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Pages derives release metadata from canonical source
        shell: bash
        run: |
          set -euo pipefail
          pages='.github/workflows/pages.yml'
          grep -Fq "marker=\"\$(sed -n \"s/^const CACHE='\\(kinaraidee-beta-v[0-9][0-9]*\\)';$/\\1/p\" sw.js)\"" "$pages"
          grep -Fq "printf '{\"sha\":\"%s\",\"pwa_cache\":\"%s\"}\\n' \"\$GITHUB_SHA\" \"\$marker\" > _site/release-meta.json" "$pages"
          grep -Fq 'test -s _site/release-meta.json' "$pages"
          grep -Fq 'grep -Fq "$GITHUB_SHA" _site/release-meta.json' "$pages"
          grep -Fq 'grep -Fq "$marker" _site/release-meta.json' "$pages"

      - name: Verify Live Smoke parses and cross-checks deployed metadata
        shell: bash
        run: |
          set -euo pipefail
          smoke='.github/workflows/live-smoke.yml'
          grep -Fq "release_meta=\"\$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \"\$base/release-meta.json\")\"" "$smoke"
          grep -Fq "JSON.parse(fs.readFileSync(0,'utf8'))" "$smoke"
          grep -Fq "^[0-9a-f]{40}$" "$smoke"
          grep -Fq 'test "$live_cache" = "$meta_cache"' "$smoke"
          grep -Fq 'test "$deployed_sha" = "$DEPLOY_HEAD_SHA"' "$smoke"
          grep -Fq 'Completed live-group result bridge: checked' "$smoke"
          grep -Fq 'Visible focus + reduced-motion source contract: checked on deployed assets' "$smoke"
          grep -Fq 'Member auth/reset minimum-length + error-hygiene contract: checked' "$smoke"

      - name: Verify current runtime deployment status is evidence-gated and scoped
        shell: bash
        run: |
          set -euo pipefail
          file='CURRENT-RUNTIME.md'
          status="$(sed -n 's/^- Deployment status: \*\*\(.*\)\*\*.*/\1/p' "$file" | head -n1)"
          case "$status" in
            'PENDING FOR CURRENT RUNTIME DEPLOYMENT')
              grep -Fq 'Current runtime deployment evidence is pending' "$file" || { echo 'Pending runtime must explicitly state that deployment evidence is pending'; exit 1; }
              ;;
            'PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE')
              deployed="$(sed -n 's/^- Runtime merge\/deployed SHA: `\([0-9a-f]\{40\}\)`.*/\1/p' "$file" | head -n1)"
              test -n "$deployed" || { echo 'Missing deployed SHA evidence'; exit 1; }
              grep -Eq 'Pages run `?[0-9]+`? completed \*\*success\*\*|Pages `?[0-9]+`?.*= SUCCESS|Pages run `?[0-9]+`? = success' "$file" || { echo 'Missing current successful Pages run evidence'; exit 1; }
              grep -Eq 'main Live Smoke run `?[0-9]+`? completed \*\*success\*\*|main Live Smoke `?[0-9]+`?.*= SUCCESS|Live Smoke run `?[0-9]+`? = success' "$file" || { echo 'Missing current successful Live Smoke evidence'; exit 1; }
              grep -Fq 'Current deployment PASS is scoped to the browser/PWA static deployment trace and live source markers only.' "$file" || { echo 'Current deployment PASS scope boundary is missing'; exit 1; }
              ;;
            *)
              echo "Unexpected runtime deployment status: $status"
              exit 1
              ;;
          esac
          grep -Fq 'Historical prior runtime source candidate:' "$file"
          grep -Fq 'Public Beta is still **NOT COMPLETE**' "$file"
          grep -Eq 'does( \*\*not\*\*| not) (imply|prove|enable)' "$file"
          grep -Fq 'Commercial GO' "$file"