name: Patch Issue 585 runtime PASS scope guard

on:
  push:
    branches:
      - docs/reconcile-585-offline-deploy-20260912
    paths:
      - .github/workflows/patch-585-runtime-pass-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-585-offline-deploy-20260912
          fetch-depth: 0
      - run: python .github/scripts/patch-585-runtime-pass-scope.py
      - run: |
          grep -Fq 'Current deployment PASS is scoped to the browser/PWA static deployment trace and live source markers only.' CURRENT-RUNTIME.md
          rm .github/scripts/patch-585-runtime-pass-scope.py
          rm .github/workflows/patch-585-runtime-pass-scope.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(release): restore runtime PASS scope guard"
          git push origin HEAD:docs/reconcile-585-offline-deploy-20260912
