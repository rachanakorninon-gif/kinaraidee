name: Auth Password Security Live Smoke

on:
  workflow_run:
    workflows: ["Deploy Kinaraidee to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-password-live-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages propagation
        run: sleep 20
      - name: Verify public member/reset password-security UX markers
        shell: bash
        run: |
          set -euo pipefail
          base='https://rachanakorninon-gif.github.io/kinaraidee'
          member="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$base/member.html")"
          reset="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$base/reset-password.html")"

          grep -Fq "code==='weak_password'" <<<"$member"
          grep -Fq "message.includes('pwned')" <<<"$member"
          grep -Fq 'อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือไม่สามารถเข้าสู่ระบบได้ในขณะนี้' <<<"$member"
          grep -Fq 'กด “ลืมรหัสผ่าน?” เพื่อตั้งรหัสผ่านใหม่' <<<"$member"
          grep -Fq "m==='signup'?'new-password':'current-password'" <<<"$member"

          grep -Fq "code==='weak_password'" <<<"$reset"
          grep -Fq "message.includes('pwned')" <<<"$reset"
          grep -Fq 'รหัสผ่านใหม่นี้ไม่ผ่านมาตรฐานความปลอดภัย' <<<"$reset"
          grep -Fq "location.href='member.html'" <<<"$reset"

          if grep -Fq 'ไม่พบบัญชีอีเมลนี้' <<<"$member"; then
            echo 'Potential account-enumeration wording detected on public member page.'
            exit 1
          fi
          if grep -Fq "location.href='admin.html'" <<<"$reset"; then
            echo 'Public member reset unexpectedly points to private admin page.'
            exit 1
          fi

          echo 'Auth password-security public static UX markers passed.'
      - name: Record scoped evidence
        shell: bash
        run: |
          {
            echo '## Auth password-security live smoke'
            echo
            echo '- Public member page: weak-password guidance + generic login failure boundary checked'
            echo '- Public reset page: weak-password replacement guidance checked'
            echo '- Member reset remains separate from private admin flow'
            echo
            echo '> This proves only that the deployed static browser UX contains the intended security/error-handling markers. It does not prove Supabase leaked-password protection is enabled, does not submit credentials, and does not create an Auth configuration PASS.'
          } >> "$GITHUB_STEP_SUMMARY"
