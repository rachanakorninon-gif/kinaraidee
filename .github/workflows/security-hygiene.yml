name: Kinaraidee Security Hygiene

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-security-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for high-risk credential patterns
        shell: bash
        run: |
          set -euo pipefail
          # Split sentinel text so repository-wide scanners do not flag this scanner's own regex source.
          pattern='(sb_''secret_[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]{16,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN (RSA |EC |OPENSSH )?PRIV''ATE KEY-----)'
          if grep -RInE \
            --exclude-dir=.git \
            --exclude='security-hygiene.yml' \
            "$pattern" .; then
            echo 'Potential private credential or token pattern found in repository.'
            exit 1
          fi
          echo 'No high-risk credential patterns found.'

      - name: Reject dangerous workflow permission shortcuts
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.yml' --include='*.yaml' '^[[:space:]]*permissions:[[:space:]]*write-all[[:space:]]*$' .github/workflows; then
            echo 'Workflow uses permissions: write-all.'
            exit 1
          fi
          if grep -RInE --include='*.yml' --include='*.yaml' '^[[:space:]]*pull_request_target:[[:space:]]*$' .github/workflows; then
            echo 'pull_request_target requires explicit security review and is not allowed by the current beta policy.'
            exit 1
          fi

      - name: Verify workflows declare permissions
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r file; do
            if ! grep -q '^permissions:' "$file"; then
              echo "Workflow lacks explicit top-level permissions: $file"
              missing=1
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          test "$missing" -eq 0

      - name: Record scope
        if: always()
        shell: bash
        run: |
          {
            echo '## Repository security hygiene'
            echo
            echo '- Scans common private credential/token formats with payload-length checks to avoid documentation false positives.'
            echo '- Rejects write-all and pull_request_target under the current beta policy.'
            echo '- Requires explicit top-level workflow permissions.'
            echo '- This is defense-in-depth and does not replace GitHub secret scanning, branch protection, Supabase Auth hardening, or manual security review.'
          } >> "$GITHUB_STEP_SUMMARY"
