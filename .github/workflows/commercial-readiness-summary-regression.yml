name: Commercial Readiness Summary Regression

on:
  pull_request:
    paths:
      - 'PRODUCTION-READINESS.md'
      - 'CURRENT-RELEASE.md'
      - 'COMMERCIAL-EXECUTION-EVIDENCE.md'
      - 'PAYMENT-PREMIUM-DECISION.md'
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - 'PARTNER-COMMERCIAL-DECISION.md'
      - 'PRODUCTION-ACCESS-DECISION.md'
      - '.github/workflows/commercial-readiness-summary-regression.yml'
  push:
    branches: [main]
    paths:
      - 'PRODUCTION-READINESS.md'
      - 'CURRENT-RELEASE.md'
      - 'COMMERCIAL-EXECUTION-EVIDENCE.md'
      - 'PAYMENT-PREMIUM-DECISION.md'
      - 'PRODUCTION-PRIVACY-LEGAL-DECISION.md'
      - 'PARTNER-COMMERCIAL-DECISION.md'
      - 'PRODUCTION-ACCESS-DECISION.md'
      - '.github/workflows/commercial-readiness-summary-regression.yml'

permissions:
  contents: read

jobs:
  guard-commercial-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Commercial summary evidence boundary
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          board = Path('PRODUCTION-READINESS.md').read_text(encoding='utf-8')
          release = Path('CURRENT-RELEASE.md').read_text(encoding='utf-8')
          execution = Path('COMMERCIAL-EXECUTION-EVIDENCE.md').read_text(encoding='utf-8')
          decision_files = [
              'PAYMENT-PREMIUM-DECISION.md',
              'PRODUCTION-PRIVACY-LEGAL-DECISION.md',
              'PARTNER-COMMERCIAL-DECISION.md',
              'PRODUCTION-ACCESS-DECISION.md',
          ]

          board_match = re.search(
              r'## Current Commercial status\s+\*\*(NO-GO|LIMITED GO|GO)\*\*',
              board,
          )
          if not board_match:
              sys.exit('PRODUCTION-READINESS.md must contain a machine-readable Current Commercial status')
          board_status = board_match.group(1)

          public_beta_matches = re.findall(
              r'Public Beta (?:remains|is still) \*\*(NOT COMPLETE|COMPLETE)\*\*',
              release,
          )
          public_beta_states = set(public_beta_matches)
          if not public_beta_states:
              sys.exit('CURRENT-RELEASE.md must declare Public Beta as NOT COMPLETE or COMPLETE')
          if len(public_beta_states) != 1:
              sys.exit('CURRENT-RELEASE.md contains conflicting Public Beta completion states')
          public_beta_status = next(iter(public_beta_states))

          execution_match = re.search(r'^Status:\s+\*\*(NOT VERIFIED|VERIFIED)\*\*', execution, re.M)
          if not execution_match:
              sys.exit('COMMERCIAL-EXECUTION-EVIDENCE.md must declare Status as NOT VERIFIED or VERIFIED')
          execution_status = execution_match.group(1)

          statuses = {}
          for path in decision_files:
              text = Path(path).read_text(encoding='utf-8')
              match = re.search(r'^Status:\s+\*\*(NOT APPROVED|APPROVED)\*\*', text, re.M)
              if not match:
                  sys.exit(f'{path} must declare Status as NOT APPROVED or APPROVED')
              statuses[path] = match.group(1)

          blockers = [path for path, status in statuses.items() if status == 'NOT APPROVED']
          if blockers and board_status != 'NO-GO':
              sys.exit(
                  'Commercial summary cannot advance beyond NO-GO while required decision records are NOT APPROVED: '
                  + ', '.join(blockers)
              )

          if public_beta_status == 'NOT COMPLETE' and board_status != 'NO-GO':
              sys.exit('Commercial summary cannot advance beyond NO-GO while Public Beta is NOT COMPLETE')

          if execution_status == 'NOT VERIFIED' and board_status != 'NO-GO':
              sys.exit('Commercial summary cannot advance beyond NO-GO while execution evidence is NOT VERIFIED')

          if execution_status == 'VERIFIED':
              required_trace_fields = [
                  'Commercial scope / revenue model',
                  'Release candidate commit',
                  'Production deployment/runtime reference',
                  'Public Beta completion evidence',
                  'Payment/Premium execution evidence',
                  'Privacy/Legal publication evidence',
                  'Partner-commercial execution evidence',
                  'Production access/monitoring/recovery evidence',
                  'Reviewed scope exclusions',
                  'Reviewer/approver reference',
                  'Evidence location(s)',
                  'Verified at',
              ]
              for field in required_trace_fields:
                  if re.search(rf'^- {re.escape(field)}:\s+\*\*NOT CAPTURED\*\*', execution, re.M):
                      sys.exit(f'Commercial execution VERIFIED requires trace field or reviewed out-of-scope disposition: {field}')

          if board_status == 'NO-GO' and '**NO-GO**' not in board:
              sys.exit('Commercial NO-GO marker must remain explicit in PRODUCTION-READINESS.md')

          print('Commercial readiness summary boundary is consistent.')
          print('Board status:', board_status)
          print('Public Beta status:', public_beta_status)
          print('Commercial execution evidence:', execution_status)
          for path, status in statuses.items():
              print(f'{path}: {status}')
          print('This regression validates governance consistency only; it does not create Public Beta completion, Commercial GO or execution evidence.')
