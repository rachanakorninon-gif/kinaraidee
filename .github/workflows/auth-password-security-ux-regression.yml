name: Auth Password Security UX Regression

on:
  pull_request:
    paths:
      - 'member.html'
      - 'reset-password.html'
      - '.github/workflows/auth-password-security-ux-regression.yml'
  push:
    branches: [main]
    paths:
      - 'member.html'
      - 'reset-password.html'
      - '.github/workflows/auth-password-security-ux-regression.yml'

permissions:
  contents: read

jobs:
  auth-password-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify weak-password readiness without account enumeration
        shell: python
        run: |
          from pathlib import Path
          import sys

          member = Path('member.html').read_text(encoding='utf-8')
          reset = Path('reset-password.html').read_text(encoding='utf-8')

          required_member = [
              "code==='weak_password'",
              "message.includes('pwned')",
              "message.includes('leaked password')",
              "authErrorMessage(r.error,authMode)",
              "m==='signup'?'new-password':'current-password'",
              'อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือไม่สามารถเข้าสู่ระบบได้ในขณะนี้',
              'กด “ลืมรหัสผ่าน?” เพื่อตั้งรหัสผ่านใหม่'
          ]
          for marker in required_member:
              if marker not in member:
                  sys.exit(f'member.html password-security marker missing: {marker}')

          required_reset = [
              "code==='weak_password'",
              "message.includes('pwned')",
              "message.includes('leaked password')",
              'passwordUpdateErrorMessage(error)',
              'รหัสผ่านใหม่นี้ไม่ผ่านมาตรฐานความปลอดภัย'
          ]
          for marker in required_reset:
              if marker not in reset:
                  sys.exit(f'reset-password.html password-security marker missing: {marker}')

          forbidden = [
              'ไม่พบบัญชีอีเมลนี้',
              'บัญชีนี้ไม่มีอยู่',
              'อีเมลนี้ลงทะเบียนแล้วหรือยัง'
          ]
          for marker in forbidden:
              if marker in member:
                  sys.exit(f'Potential account-enumeration message introduced: {marker}')

          print('Weak-password UX is prepared while preserving generic login failure messaging.')
          print('This regression does not enable leaked-password protection or alter Supabase Auth configuration.')
