name: Real Device Contract Regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify real-device evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          tc='BETA-TEST-CASES.md'
          nf='BETA-NEW-FLOW-TESTS.md'
          release='RELEASE-CHECKLIST.md'

          require_text(){
            file="$1"
            text="$2"
            grep -Fq "$text" "$file" || { echo "Missing required contract text in $file: $text"; exit 1; }
          }

          # TC-08 must prove the permission-allow path, not infer it from Maps/coordinates.
          require_text "$tc" 'site/app ยังไม่ได้รับ Location'
          require_text "$tc" 'allow-location path'
          require_text "$tc" 'Maps เปิดได้'
          require_text "$tc" 'พิกัดเพียงอย่างเดียวไม่เพียงพอ'

          # NF-04/NF-07 must start from a verifiable pre-current-release baseline.
          marker="$(sed -n "s/^const CACHE='\(kinaraidee-beta-v[0-9][0-9]*\)';$/\1/p" sw.js)"
          test -n "$marker" || { echo 'Unable to derive current PWA cache marker'; exit 1; }
          require_text "$nf" "$marker"
          require_text "$nf" 'ถ้าไม่สามารถยืนยันว่าอุปกรณ์เริ่มจาก build ก่อนหน้า ให้เว้นผลไว้'
          require_text "$nf" 'ยืนยันได้ว่าเคยโหลด cache generation ก่อน'
          require_text "$nf" 'Synthetic/cache regression CI เป็นหลักฐาน implementation เท่านั้น'

          # NF-09 must validate the assistive-tech environment and allow INCONCLUSIVE.
          require_text "$nf" 'control มาตรฐานนอกแอป'
          require_text "$nf" 'action เกิดจริง'
          require_text "$nf" 'INCONCLUSIVE / TEST ENVIRONMENT'
          require_text "$nf" 'Source/static/synthetic accessibility checks'

          # The commercial release checklist may record the verified iPhone/VoiceOver session,
          # but it must preserve the narrower evidence boundary and the unresolved Android/full-matrix scope.
          require_text "$release" 'NF-09 Surprise busy-state accessibility มี physical iPhone/VoiceOver PASS บน deployed PR #201/v16 สำหรับ tested session'
          require_text "$release" 'Android TalkBack เดิมยัง INCONCLUSIVE / TEST ENVIRONMENT'
          require_text "$release" 'ข้อนี้ไม่แทน second-device/full-matrix accessibility PASS'
          require_text "$release" 'NF-09 มี scoped iPhone/VoiceOver PASS แล้ว แต่ Android TalkBack/second-device/full-matrix accessibility ยังเปิดอยู่'
          require_text "$release" 'Visible keyboard focus ถูกตรวจด้วย real keyboard/focus navigation บน deployed pages'
          require_text "$release" 'Reduced-motion behavior ถูกตรวจบน real platform ที่เปิด reduced-motion preference'
          require_text "$release" 'NF-07 ถูก retest จาก verifiable older-cache baseline ไป `kinaraidee-beta-v16`'

          # Global anti-fabrication boundaries must remain explicit.
          require_text "$tc" 'not captured'
          require_text "$tc" 'ห้ามทำเครื่องหมาย Pass โดยไม่ได้ทดสอบบนอุปกรณ์จริง'
          require_text "$nf" 'ห้ามทำเครื่องหมาย Pass จาก static review'

          echo 'Real-device acceptance contracts preserved'
