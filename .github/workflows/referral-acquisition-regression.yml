name: Referral acquisition regression

on:
  pull_request:
    paths:
      - 'data/acquisition.js'
      - 'data/home-surprise.js'
      - 'member.html'
      - 'privacy.html'
      - 'supabase/referral-acquisition-v1.sql'
      - 'supabase/referral-code-privacy-fix-20260904.sql'
      - 'supabase/referral-acquisition-v1-rollback.sql'
      - 'supabase/referral-summary-edge-cutover-20260904.sql'
      - 'REFERRAL-SUMMARY-PHYSICAL-EVIDENCE.md'
      - '.github/workflows/referral-acquisition-regression.yml'
  push:
    branches: [main]
    paths:
      - 'data/acquisition.js'
      - 'data/home-surprise.js'
      - 'member.html'
      - 'privacy.html'
      - 'supabase/referral-acquisition-v1.sql'
      - 'supabase/referral-code-privacy-fix-20260904.sql'
      - 'supabase/referral-acquisition-v1-rollback.sql'
      - 'supabase/referral-summary-edge-cutover-20260904.sql'
      - 'REFERRAL-SUMMARY-PHYSICAL-EVIDENCE.md'
      - '.github/workflows/referral-acquisition-regression.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check data/acquisition.js
          node --check data/home-surprise.js
      - name: Referral and attribution contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const acquisition=fs.readFileSync('data/acquisition.js','utf8');
          const home=fs.readFileSync('data/home-surprise.js','utf8');
          const member=fs.readFileSync('member.html','utf8');
          const privacy=fs.readFileSync('privacy.html','utf8');
          const sql=fs.readFileSync('supabase/referral-acquisition-v1.sql','utf8');
          const privacyFix=fs.readFileSync('supabase/referral-code-privacy-fix-20260904.sql','utf8');
          const rollback=fs.readFileSync('supabase/referral-acquisition-v1-rollback.sql','utf8');
          const cutover=fs.readFileSync('supabase/referral-summary-edge-cutover-20260904.sql','utf8');
          const physical=fs.readFileSync('REFERRAL-SUMMARY-PHYSICAL-EVIDENCE.md','utf8');

          must(acquisition.includes('kinaraideeAcquisitionV1'),'missing acquisition storage key');
          must(acquisition.includes('kinaraidee_referral_code'),'missing referral signup metadata');
          must(acquisition.includes("['utm_source','utm_medium','utm_campaign','utm_content']"),'UTM allowlist changed unexpectedly');
          must(acquisition.includes("/^[a-z0-9_-]+$/"),'UTM values must remain slug-only');
          must(home.includes('ensureAcquisition()'),'home must capture acquisition before signup navigation');
          must(member.includes('data/acquisition.js'),'member page must load acquisition capture');
          must(member.includes("sb.functions.invoke('member-referral-api',{body:{}})"),'member page must use authenticated Edge referral summary');
          must(!member.includes("sb.rpc('get_my_referral_summary')"),'member page must not restore the old RPC fallback after physical EDGE acceptance');
          must(member.includes('ยังไม่ใช่สิทธิ์เข้าร่วมแคมเปญรางวัล'),'member UI must preserve prize non-eligibility boundary');
          must(privacy.includes('การวัดการชวนเพื่อนและแหล่งที่มา'),'privacy notice must disclose referral measurement');

          for(const table of ['member_referral_codes','member_referrals','member_acquisition_attribution']){
            must(sql.includes(`alter table public.${table} enable row level security`),`${table} must have RLS enabled`);
            must(sql.includes(`revoke all on public.${table} from anon, authenticated`),`${table} must not expose raw rows to clients`);
          }
          must(sql.includes("where rc.user_id=(select auth.uid())"),'historical referral summary RPC definition must remain caller-scoped for provenance/rollback review');
          must(sql.includes('revoke all on function public.get_my_referral_summary() from public, anon'),'historical RPC must not be callable by public/anon');
          must(cutover.includes('revoke execute on function public.get_my_referral_summary() from public, anon, authenticated;'),'post-acceptance cutover must revoke the old RPC from browser/public roles after Edge-only deployment');
          must(sql.includes("not prize/campaign eligibility truth"),'schema must preserve prize eligibility boundary');
          must(physical.includes('QA source label shown: **`EDGE`**'),'browser RPC removal must remain backed by canonical physical EDGE evidence');
          must(physical.includes('Status: **PASS — PHYSICAL SIGNED-IN EDGE ACCEPTED / POST-CUTOVER SECURITY FOLLOW-UP PENDING**'),'physical EDGE acceptance must remain explicit while ordered live security follow-up is pending');

          const randomCode="'K' || upper(substr(replace(gen_random_uuid()::text,'-',''),1,20))";
          must(sql.includes(randomCode),'fresh-install schema must generate random referral codes');
          must(privacyFix.includes(randomCode),'privacy-fix migration must preserve random referral generation');
          must(privacyFix.includes("code !~ '^K[0-9A-F]{20}$'"),'privacy-fix migration must identify legacy code format without reading account identifiers');
          must(privacyFix.includes('Referral-code rotation blocked because referral/acquisition usage already exists'),'privacy-fix migration must fail closed once referral/acquisition usage exists');
          must(!sql.includes("replace(id::text,'-','')"),'fresh-install backfill must not derive referral code from auth user UUID');
          must(!sql.includes("replace(new.id::text,'-','')"),'signup trigger must not derive referral code from auth user UUID');
          must(!privacyFix.includes("replace(new.id::text,'-','')"),'privacy-fix trigger must not derive referral code from auth user UUID');
          must(privacyFix.includes('20260903221043 / referral_code_privacy_fix_20260904'),'migration trace marker missing');

          must(rollback.includes('drop table if exists public.member_referrals'),'rollback must remove referral table');
          NODE
