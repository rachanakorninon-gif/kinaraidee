name: Recurring Probe History Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/recurring-probe-history-diagnostic.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read recent scheduled probe runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for workflow in group-api-live-observability-probe.yml partner-api-live-probe.yml; do
            tmp="$(mktemp)"
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=schedule&per_page=10" > "$tmp"
            WORKFLOW="$workflow" RUNS_FILE="$tmp" node <<'NODE'
          const fs=require('fs');
          const workflow=process.env.WORKFLOW;
          const data=JSON.parse(fs.readFileSync(process.env.RUNS_FILE,'utf8'));
          const runs=(data.workflow_runs||[]).map(r=>({id:r.id,event:r.event,status:r.status,conclusion:r.conclusion,head_sha:r.head_sha,created_at:r.created_at,updated_at:r.updated_at,html_url:r.html_url}));
          console.log(JSON.stringify({workflow,total_count:data.total_count,scheduled_runs:runs},null,2));
          NODE
            rm -f "$tmp"
          done

      - name: Evidence boundary
        shell: bash
        run: |
          {
            echo '## Recurring probe history diagnostic'
            echo
            echo '- Reads GitHub Actions metadata only.'
            echo '- Does not invoke Group API or Partner API and does not mutate production data.'
            echo '- Scheduled-run success is synthetic rejection-monitor evidence only; it is not monitoring SLA, alert delivery, production traffic baseline, retention approval, or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
