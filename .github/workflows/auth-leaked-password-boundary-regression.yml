name: Auth Leaked Password Boundary Regression

on:
  pull_request:
    paths:
      - 'SUPABASE-AUTH-LEAKED-PASSWORD-RUNBOOK.md'
      - 'AUTH-PASSWORD-SECURITY-DEPLOYMENT-EVIDENCE.md'
      - '.github/workflows/auth-leaked-password-boundary-regression.yml'
  push:
    branches: [main]
    paths:
      - 'SUPABASE-AUTH-LEAKED-PASSWORD-RUNBOOK.md'
      - 'AUTH-PASSWORD-SECURITY-DEPLOYMENT-EVIDENCE.md'
      - '.github/workflows/auth-leaked-password-boundary-regression.yml'

permissions:
  contents: read

jobs:
  preserve-not-executed-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject static/deployment evidence being promoted to Auth configuration PASS
        shell: python
        run: |
          from pathlib import Path
          import sys

          runbook = Path('SUPABASE-AUTH-LEAKED-PASSWORD-RUNBOOK.md')
          deployed = Path('AUTH-PASSWORD-SECURITY-DEPLOYMENT-EVIDENCE.md')
          for p in (runbook, deployed):
              if not p.exists():
                  sys.exit(f'Missing Auth security evidence artifact: {p}')

          r = runbook.read_text(encoding='utf-8')
          d = deployed.read_text(encoding='utf-8')

          required_runbook = [
              'Status: **PREPARED / NOT EXECUTED**',
              'does **not** authorize or prove the setting has been enabled',
              'actual leaked-password setting is verified',
              'controlled interaction tests are recorded',
              'Security Advisor is re-run'
          ]
          for marker in required_runbook:
              if marker not in r:
                  sys.exit(f'Runbook lost required non-execution boundary: {marker}')

          required_deployed = [
              'Status: **DEPLOYED STATIC UX VERIFIED / AUTH CONFIGURATION NOT VERIFIED**',
              'does **not** claim that Supabase leaked-password protection is enabled',
              'does not claim a real weak/leaked password was rejected',
              'Issue #372 remains the authority'
          ]
          for marker in required_deployed:
              if marker not in d:
                  sys.exit(f'Deployment evidence lost Auth configuration boundary: {marker}')

          forbidden_pass_markers = [
              'LEAKED PASSWORD PROTECTION: **PASS**',
              'AUTH CONFIGURATION VERIFIED: **PASS**',
              'leaked-password protection is **ENABLED AND VERIFIED**'
          ]
          combined = r + '\n' + d
          for marker in forbidden_pass_markers:
              if marker in combined:
                  sys.exit(f'Static/prepared evidence cannot claim Auth configuration PASS: {marker}')

          print('Auth leaked-password boundary remains PREPARED/NOT EXECUTED.')
          print('Static deployed UX evidence is not promoted to provider configuration evidence.')
