name: Result menu focus regression

on:
  pull_request:
    paths:
      - 'data/toast-accessibility.js'
      - 'data/home-surprise.js'
      - 'index.html'
      - '.github/workflows/result-menu-focus-regression.yml'
  push:
    branches: [main]
    paths:
      - 'data/toast-accessibility.js'
      - 'data/home-surprise.js'
      - 'index.html'
      - '.github/workflows/result-menu-focus-regression.yml'

permissions:
  contents: read

jobs:
  result-menu-focus-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Result announcement uses existing focus path once
        run: |
          set -euo pipefail
          grep -Fq "result:'.topbar b'" data/home-surprise.js
          grep -Fq "if(id==='loading')return;" data/home-surprise.js
          grep -Fq "target.focus({preventScroll:true})" data/home-surprise.js
          grep -Fq "const menu=document.getElementById('foodName');" data/toast-accessibility.js
          grep -Fq "previous.removeAttribute('data-screen-focus')" data/toast-accessibility.js
          grep -Fq "menu.dataset.screenFocus='1'" data/toast-accessibility.js
          grep -Fq "menu.setAttribute('tabindex','-1')" data/toast-accessibility.js
          grep -Fq "menu.setAttribute('role','heading')" data/toast-accessibility.js
          grep -Fq "menu.setAttribute('aria-level','1')" data/toast-accessibility.js
          grep -Fq "menu.removeAttribute('aria-live')" data/toast-accessibility.js
          grep -Fq "renderResult();show('result')" index.html
          ! grep -Eq 'id="foodName"[^>]*aria-live' index.html
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');
          const source=fs.readFileSync('data/toast-accessibility.js','utf8');

          function fakeElement(initial={}){
            const attrs=new Map(Object.entries(initial));
            return {
              dataset:{},
              attrs,
              setAttribute(k,v){attrs.set(k,String(v))},
              removeAttribute(k){attrs.delete(k)},
              getAttribute(k){return attrs.has(k)?attrs.get(k):null}
            };
          }
          const previous=fakeElement({'data-screen-focus':'1','tabindex':'-1','role':'heading','aria-level':'1'});
          const menu=fakeElement({'aria-live':'polite'});
          const screen={querySelector(sel){assert.strictEqual(sel,'[data-screen-focus="1"]');return previous}};
          const document={
            readyState:'complete',
            head:{appendChild(){}},
            getElementById(id){if(id==='toast')return null;if(id==='result')return screen;if(id==='foodName')return menu;return null},
            querySelector(){return null},
            createElement(){return fakeElement()}
          };
          const context={document,window:{},setTimeout(fn){fn();return 1},clearTimeout(){},requestAnimationFrame:null,cancelAnimationFrame:null,console};
          vm.createContext(context);
          vm.runInContext(source,context);
          assert.strictEqual(menu.dataset.screenFocus,'1');
          assert.strictEqual(menu.getAttribute('tabindex'),'-1');
          assert.strictEqual(menu.getAttribute('role'),'heading');
          assert.strictEqual(menu.getAttribute('aria-level'),'1');
          assert.strictEqual(menu.getAttribute('aria-live'),null,'Result menu must not become a live region');
          assert.strictEqual(previous.getAttribute('data-screen-focus'),null);
          assert.strictEqual(previous.getAttribute('tabindex'),null);
          console.log('Result menu focus target replaces generic heading without a duplicate live announcement');
          NODE
