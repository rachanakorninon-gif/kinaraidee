name: Public Beta Monitor Run Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/public-beta-monitor-run-diagnostic.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect-public-beta-monitor-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List recent Public Beta monitor runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/public-beta-monitor.yml/runs?branch=main&per_page=10" \
            | jq -c '.workflow_runs[] | {id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url}'

      - name: Evidence boundary
        run: |
          echo 'Read-only workflow-run metadata diagnostic.'
          echo 'A successful historical monitor run is synthetic/browser evidence only and does not replace real-device, accessibility, payment, legal, partner, or Commercial acceptance.'
          echo 'This PR is intended to be closed without merge after evidence capture.'
