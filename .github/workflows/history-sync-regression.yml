name: Kinaraidee History Sync Regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-sync-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check member sync JavaScript syntax
        run: |
          node --check data/member-sync.js
          node --check data/home-surprise.js

      - name: Verify cloud history maps to local history schema
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const parsedAt=Date.parse(r.created_at);" data/member-sync.js
          grep -Fq "const liked=r.action==='liked';" data/member-sync.js
          grep -Fq "const accepted=r.action==='picked';" data/member-sync.js
          grep -Fq "at:Number.isFinite(parsedAt)?parsedAt:Date.now()" data/member-sync.js
          grep -Fq "liked," data/member-sync.js
          grep -Fq "accepted," data/member-sync.js
          if grep -Fq "date:new Date(r.created_at).toLocaleString('th-TH')" data/member-sync.js && ! grep -Fq "at:Number.isFinite(parsedAt)?parsedAt:Date.now()" data/member-sync.js; then
            echo 'Cloud history exposes display date but not local timestamp field.'
            exit 1
          fi

      - name: Verify durable writes survive restart boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const OUTBOX_KEY='kinaraideeMemberHistoryOutboxV1';" data/member-sync.js
          grep -Fq "rows.push(op);" data/member-sync.js
          grep -Fq "writeOutbox(rows);" data/member-sync.js
          grep -Fq "pendingWrites++;" data/member-sync.js
          grep -Fq "writeGeneration++;" data/member-sync.js
          grep -Fq "if(!client||!user||loading||flushing||pendingWrites>0||outboxForCurrentUser().length>0)return false;" data/member-sync.js
          grep -Fq "if(pendingWrites>0||writeGeneration!==generationAtStart||outboxForCurrentUser().length>0)return false;" data/member-sync.js
          grep -Fq "rowMatchesOp(r,op)" data/member-sync.js
          grep -Fq "window.addEventListener('online',()=>{if(user)settleAuthenticatedHistory()})" data/member-sync.js
          grep -Fq "function ensureMemberSync()" data/home-surprise.js
          grep -Fq "s.src='data/member-sync.js';" data/home-surprise.js
          grep -Fq "ensureMemberSync();" data/home-surprise.js

      - name: Verify durability fix remains in the deployed PWA release boundary
        shell: bash
        run: |
          set -euo pipefail
          marker="$(grep -oE 'kinaraidee-beta-v[0-9]+' sw.js | head -1)"
          test -n "$marker" || { echo 'Cannot derive canonical PWA marker from sw.js'; exit 1; }
          grep -Fq "'./data/member-sync.js'" sw.js
          grep -Fq "$marker" CURRENT-RUNTIME.md
          grep -Fq "$marker" CURRENT-RELEASE.md
          grep -Fq 'Issue #177 is closed **completed**' CURRENT-RUNTIME.md
          grep -Fq 'Issue #177 is closed completed' CURRENT-RELEASE.md
          grep -Fq 'Historical v15 restart FAIL remains recorded' BETA-DEVICE-MATRIX.md
          grep -Fq 'TC-06 เมนูโปรด | PASS (v16 restart)' BETA-DEVICE-MATRIX.md
          grep -Fq 'fully closed the installed PWA from Recent Apps' CURRENT-RUNTIME.md
          echo "History durability release boundary aligned to $marker with physical v16 PASS"

      - name: Verify renderer still consumes local timestamp
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "new Date(h.at).toLocaleString('th-TH')" index.html

      - name: Record scope
        if: always()
        shell: bash
        run: |
          {
            echo '## Member history sync regression'
            echo
            echo '- Protects the cloud-to-local history schema used by the main history renderer.'
            echo '- Prevents the Android real-device Invalid Date regression caused by a missing `at` field.'
            echo '- Verifies liked/picked actions map back to local liked/accepted booleans.'
            echo '- Guards a durable local outbox so an installed-PWA restart cannot erase a newly acknowledged member favorite before cloud reconciliation finishes.'
            echo '- Prevents a cloud snapshot from replacing local history while durable or in-flight writes remain.'
            echo '- Verifies the durability helper stays in the current Service Worker app shell and canonical evidence records the historical v15 failure separately from the physical v16 restart PASS.'
            echo '- Physical-device PASS remains scoped to the tested Android installed-PWA session; CI does not create additional device PASS evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
