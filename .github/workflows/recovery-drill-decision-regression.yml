name: Recovery Drill Decision Regression

on:
  pull_request:
    paths:
      - 'RECOVERY-DRILL-DECISION.md'
      - 'RELEASE-CHECKLIST.md'
      - 'ROLLBACK-RUNBOOK.md'
      - 'GROUP-API-DEPLOYMENT-EVIDENCE.md'
      - 'PARTNER-API-HARDENING-EVIDENCE.md'
      - 'PARTNER-API-ROLLBACK-REFERENCE.md'
      - 'supabase/recovery-integrity-check.sql'
      - '.github/workflows/recovery-drill-decision-regression.yml'
  push:
    branches: ['main']
    paths:
      - 'RECOVERY-DRILL-DECISION.md'
      - 'RELEASE-CHECKLIST.md'
      - 'ROLLBACK-RUNBOOK.md'
      - 'GROUP-API-DEPLOYMENT-EVIDENCE.md'
      - 'PARTNER-API-HARDENING-EVIDENCE.md'
      - 'PARTNER-API-ROLLBACK-REFERENCE.md'
      - 'supabase/recovery-integrity-check.sql'
      - '.github/workflows/recovery-drill-decision-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify recovery drill remains unapproved without real decisions
        shell: bash
        run: |
          set -euo pipefail
          file='RECOVERY-DRILL-DECISION.md'
          test -s "$file"
          grep -Fq 'Status: **NOT APPROVED**' "$file"
          grep -Fq 'Approved RPO target: **UNSET**' "$file"
          grep -Fq 'Approved RTO target: **UNSET**' "$file"
          grep -Fq 'Decision owner: **UNSET**' "$file"
          grep -Fq 'Operations approver: **UNSET**' "$file"
          grep -Fq 'does not execute a backup, restore or rollback' "$file"
          grep -Fq 'does not prove backup availability, restore integrity, measured RPO/RTO' "$file"

          if grep -Eqi '^Status:[[:space:]]*\*\*APPROVED\*\*' "$file"; then
            echo 'Recovery drill must not be marked APPROVED without reviewed decision evidence.'
            exit 1
          fi

          if grep -Eqi 'Approved RP[OT] target:[[:space:]]*\*\*[0-9]+' "$file"; then
            echo 'Numeric RPO/RTO target detected while decision is NOT APPROVED.'
            exit 1
          fi

      - name: Verify Commercial Release Checklist keeps recovery gates open
        shell: bash
        run: |
          set -euo pipefail
          file='RELEASE-CHECKLIST.md'
          test -s "$file"
          grep -Fq -- '- [ ] Backup/recovery plan สำหรับข้อมูลสำคัญและมีผู้รับผิดชอบ' "$file"
          grep -Fq -- '- [ ] Rollback procedure ถูกทดลองอย่างน้อยหนึ่งครั้งใน environment ที่ปลอดภัยและมี Evidence Record จริง' "$file"
          grep -Fq 'ไม่ถือว่า Production operations/rollback readiness ผ่าน' "$file"

          if grep -Fq -- '- [x] Backup/recovery plan สำหรับข้อมูลสำคัญและมีผู้รับผิดชอบ' "$file"; then
            echo 'Commercial checklist must not mark backup/recovery readiness complete while the recovery decision is NOT APPROVED.'
            exit 1
          fi

          if grep -Fq -- '- [x] Rollback procedure ถูกทดลองอย่างน้อยหนึ่งครั้งใน environment ที่ปลอดภัยและมี Evidence Record จริง' "$file"; then
            echo 'Commercial checklist must not mark the recovery drill complete without executed evidence.'
            exit 1
          fi

      - name: Verify Group API rollback anchors match canonical deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence='GROUP-API-DEPLOYMENT-EVIDENCE.md'
          runbook='ROLLBACK-RUNBOOK.md'
          test -s "$evidence"
          test -s "$runbook"

          candidate_pr="$(sed -nE 's/^PR #([0-9]+) merged to .*current Group API source candidate.*/\1/p' "$evidence" | head -n1)"
          candidate_sha="$(sed -nE 's/^PR #[0-9]+ merged to `main` at `([0-9a-f]{40})` and is the current Group API source candidate.*/\1/p' "$evidence" | head -n1)"
          deployed_version="$(sed -nE 's/^- Observed deployed version at inspection time: `([0-9]+)`.*/\1/p' "$evidence" | head -n1)"
          source_blob="$(sed -nE 's/.*repository blob `([0-9a-f]{40})`.*/\1/p' "$evidence" | head -n1)"
          bundle_sha="$(sed -nE 's/^- Supabase-reported deployed bundle SHA-256 at inspection time: `([0-9a-f]{64})`.*/\1/p' "$evidence" | head -n1)"
          probe_run="$(sed -nE 's/^Canonical `Group API Live Observability Probe` run `([0-9]+)`.*/\1/p' "$evidence" | head -n1)"

          for value in "$candidate_pr" "$candidate_sha" "$deployed_version" "$source_blob" "$bundle_sha" "$probe_run"; do
            test -n "$value"
          done

          grep -Fq "PR #$candidate_pr / \`$candidate_sha\`" "$runbook"
          grep -Fq "current inspected source blob: \`$source_blob\`" "$runbook"
          grep -Fq "ACTIVE version $deployed_version" "$runbook"
          grep -Fq "current inspected bundle SHA-256: \`$bundle_sha\`" "$runbook"
          grep -Fq "run \`$probe_run\`" "$runbook"
          grep -Fq 'GROUP-API-DEPLOYMENT-EVIDENCE.md' "$runbook"
          grep -Fq 'PROCEDURE WRITTEN / NOT YET DRILL-VERIFIED' "$runbook"

      - name: Verify Partner API rollback anchors match canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence='PARTNER-API-HARDENING-EVIDENCE.md'
          reference='PARTNER-API-ROLLBACK-REFERENCE.md'
          test -s "$evidence"
          test -s "$reference"

          candidate_sha="$(sed -nE 's/^- PR #126 merged as `([0-9a-f]{40})`.*/\1/p' "$evidence" | head -n1)"
          deployed_version="$(sed -nE 's/.*`partner-api` ACTIVE version ([0-9]+).*/\1/p' "$evidence" | head -n1)"
          bundle_sha="$(sed -nE 's/.*bundle SHA-256 `([0-9a-f]{64})`.*/\1/p' "$evidence" | head -n1)"
          probe_run="$(sed -nE 's/^- Partner API Live Rejection Probe run `([0-9]+)`.*/\1/p' "$evidence" | head -n1)"
          source_blob="$(git rev-parse HEAD:supabase/functions/partner-api/index.ts)"

          for value in "$candidate_sha" "$deployed_version" "$bundle_sha" "$probe_run" "$source_blob"; do
            test -n "$value"
          done

          grep -Fq "PR #126 / \`$candidate_sha\`" "$reference"
          grep -Fq "current repository source blob: \`$source_blob\`" "$reference"
          grep -Fq "ACTIVE version $deployed_version" "$reference"
          grep -Fq "current inspected bundle SHA-256: \`$bundle_sha\`" "$reference"
          grep -Fq "run \`$probe_run\`" "$reference"
          grep -Fq 'PARTNER-API-HARDENING-EVIDENCE.md' "$reference"
          grep -Fq 'REFERENCE WRITTEN / NOT DRILL-VERIFIED' "$reference"
          grep -Fq 'Partner API rollback เป็น **NOT VERIFIED**' "$reference"

      - name: Verify linked integrity check remains read-only
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/recovery-integrity-check.sql'
          code="$(mktemp)"
          trap 'rm -f "$code"' EXIT
          test -s "$file"
          sed -E 's/--.*$//' "$file" > "$code"
          if grep -Eqi '^[[:space:]]*(insert|update|delete|truncate|alter|drop|create|grant|revoke)\b' "$code"; then
            echo 'Mutation or DDL statement detected in recovery integrity SQL.'
            exit 1
          fi

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Recovery drill decision regression'
            echo
            echo '- Guards recovery/rollback governance fields from fabricated approval or RPO/RTO values.'
            echo '- Keeps Commercial Release Checklist recovery/drill gates open while the canonical decision is NOT APPROVED.'
            echo '- Derives current Group API deployment anchors from canonical evidence and requires the rollback runbook to match them.'
            echo '- Derives current Partner API source/deployment/live-rejection anchors and requires the rollback reference to match them.'
            echo '- Re-checks the linked post-restore integrity SQL stays read-only.'
            echo '- Static CI success is not backup availability, restore/rollback execution, measured RPO/RTO, operations drill PASS, Public Beta PASS, or Commercial GO.'
          } >> "$GITHUB_STEP_SUMMARY"
