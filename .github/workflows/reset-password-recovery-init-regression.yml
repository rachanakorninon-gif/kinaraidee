name: Reset Password Recovery Init Regression

on:
  push:
    paths:
      - 'reset-password.html'
      - '.github/workflows/reset-password-recovery-init-regression.yml'
  pull_request:
    paths:
      - 'reset-password.html'
      - '.github/workflows/reset-password-recovery-init-regression.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovery initialization is awaited before session check
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('reset-password.html').read_text(encoding='utf-8')
          init = 'const recoveryPromise=recoverFromUrl();'
          await_then_session = "await recoveryPromise;const {data:{session}}=await sb.auth.getSession()"

          if init not in text:
              raise SystemExit('missing recovery initialization promise')
          if await_then_session not in text:
              raise SystemExit('save must await recovery initialization before reading session')
          if text.count('recoverFromUrl()') != 2:
              raise SystemExit('unexpected standalone recovery invocation; keep one function declaration and one promise initialization')

          print('reset-password recovery initialization ordering is guarded')
          PY
