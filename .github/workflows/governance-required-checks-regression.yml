name: Governance Required Checks Regression

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-required-checks-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify required-check workflows stay universal and stable
        shell: bash
        run: |
          set -euo pipefail

          check_workflow(){
            file="$1"
            workflow_name="$2"
            job_id="$3"

            test -s "$file" || { echo "Missing governance required workflow: $file"; exit 1; }
            grep -Fqx "name: $workflow_name" "$file" || {
              echo "Governance required workflow name drifted: $file"
              exit 1
            }
            grep -Eq "^  ${job_id}:[[:space:]]*$" "$file" || {
              echo "Governance required job id drifted: $file expected $job_id"
              exit 1
            }
            grep -Eq '^  pull_request:[[:space:]]*$' "$file" || {
              echo "Governance required workflow no longer has a pull_request trigger: $file"
              exit 1
            }

            nested="$(awk '
              /^  pull_request:[[:space:]]*$/ { inside=1; next }
              inside && /^  [A-Za-z0-9_-]+:[[:space:]]*/ { exit }
              inside { print }
            ' "$file" | sed '/^[[:space:]]*$/d')"
            if [ -n "$nested" ]; then
              echo "Governance required pull_request trigger is no longer universal/unfiltered: $file"
              printf '%s\n' "$nested"
              exit 1
            fi
          }

          check_workflow '.github/workflows/release-consistency.yml' 'Kinaraidee Release Consistency' 'release-consistency'
          check_workflow '.github/workflows/beta-check.yml' 'Beta integrity checks' 'validate'
          check_workflow '.github/workflows/qa.yml' 'Kinaraidee Beta QA' 'static-qa'
          check_workflow '.github/workflows/security-hygiene.yml' 'Kinaraidee Security Hygiene' 'repository-security-hygiene'

          echo 'Required-check workflow contract is stable and universal across pull requests.'

      - name: Verify governance docs preserve verified enforcement state
        shell: bash
        run: |
          set -euo pipefail

          runbook='GOVERNANCE-RUNBOOK.md'
          evidence='GOVERNANCE-EVIDENCE.md'
          test -s "$runbook"
          test -s "$evidence"

          grep -Fq 'Status: **ENFORCED / VERIFIED FOR REPOSITORY GOVERNANCE**' "$runbook"
          grep -Fq 'repository ruleset `Protect main`' "$runbook"
          grep -Fq '`release-consistency`' "$runbook"
          grep -Fq '`static-qa`' "$runbook"
          grep -Fq '`validate`' "$runbook"
          grep -Fq '`repository-security-hygiene`' "$runbook"
          grep -Fq 'PR #160' "$runbook"
          grep -Fq 'failing selected required check blocks merge' "$runbook"

          grep -Fq 'Status: **PASS FOR REPOSITORY GOVERNANCE ENFORCEMENT**' "$evidence"
          grep -Fq 'Issue #35 is closed as **COMPLETED / GOVERNANCE ENFORCEMENT VERIFIED**' "$evidence"
          grep -Fq 'required status check `release-consistency` was failing' "$evidence"

          if grep -Fq 'Status: **PREPARED / NOT YET ENFORCED**' "$runbook"; then
            echo 'Governance runbook regressed to stale pre-enforcement status.'
            exit 1
          fi
          if grep -Fq 'Issue #35 remains an open Commercial Governance blocker.' "$runbook"; then
            echo 'Governance runbook regressed to stale open-blocker wording.'
            exit 1
          fi

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Governance required-check contract'
            echo
            echo '- Verifies the four enforced required checks retain stable workflow/job identities and universal pull-request triggers.'
            echo '- Verifies repository governance docs retain the already-verified Protect main enforcement and negative merge-blocking evidence.'
            echo '- Does not independently read or modify GitHub ruleset settings during CI and does not create deployment, device, user, payment, partner, revenue, Public Beta or Commercial evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
