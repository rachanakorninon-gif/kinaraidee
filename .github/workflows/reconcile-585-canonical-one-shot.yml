name: Reconcile 585 canonical companions one-shot

on:
  pull_request:
    paths:
      - '.github/workflows/reconcile-585-canonical-one-shot.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.pull_request.head.ref == 'docs/reconcile-585-deployment-20260911' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-585-deployment-20260911
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize Issue 585 deployment across canonical companion docs
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          candidate_old='bde1bfed79696f6982852ca67d3ee4c8120c0c54'
          candidate_new='f9b5f137375e9d30d1053d9cad814d636cb88821'
          deployed_old='2896748584a1058e9ba1bbc939f49f3b6faf4baf'
          deployed_new='11c27167965c63ba60218d6ec216e503b334b4ca'

          def replace_exact(path, pairs):
              p=Path(path)
              text=p.read_text()
              for old,new in pairs:
                  if old not in text:
                      raise SystemExit(f'{path}: missing expected text: {old[:120]}')
                  text=text.replace(old,new,1)
              p.write_text(text)

          replace_exact('CURRENT-RELEASE.md', [
            (f'- Current browser/PWA runtime candidate: `{candidate_old}` (Issue #584 SPA focus-management accessibility remediation merged through PR #614).',
             f'- Current browser/PWA runtime candidate: `{candidate_new}` (Issue #585 ordinary-toast live-region accessibility remediation merged through PR #623).'),
            (f'- Runtime merge/deployed SHA: `{deployed_old}`.', f'- Runtime merge/deployed SHA: `{deployed_new}`.'),
            (f'The current Issue #584 accessibility runtime candidate `{candidate_old}` is verified through exact deployed descendant `{deployed_old}`; GitHub Pages run `34560369925`, Kinaraidee Live Smoke `34560396807`, Auth Password Security Live Smoke `34560396831`, and Campaign 3000 Premium Live Smoke `34560396804` completed successfully for that deployment trace while preserving `kinaraidee-beta-v16`. This establishes source/deployment evidence for deterministic destination focus management across the core SPA screens only. It does not establish VoiceOver/TalkBack/keyboard Physical PASS, another-device PASS, full accessibility conformance, Public Beta completion or Commercial GO. The prior Issue #583 selected-state deployment remains historical verified evidence in its recorded scope.',
             f'The current Issue #585 accessibility runtime candidate `{candidate_new}` is verified through exact deployed descendant `{deployed_new}`; GitHub Pages run `34571331729`, Kinaraidee Live Smoke `34571373301`, Auth Password Security Live Smoke `34571373282`, and Campaign 3000 Premium Live Smoke `34571373303` completed successfully for that deployment trace while preserving `kinaraidee-beta-v16`. This establishes source/deployment evidence for ordinary toast feedback as a polite atomic status live region with reliable repeated-message re-announcement only. It does not establish VoiceOver/TalkBack/keyboard Physical PASS, another-device PASS, full accessibility conformance, Public Beta completion or Commercial GO. The prior Issue #584 focus-management deployment remains historical verified evidence in its recorded scope.'),
            (f'- Current source runtime candidate is `{candidate_old}`.', f'- Current source runtime candidate is `{candidate_new}`.'),
            (f'- It is verified through exact deployed descendant `{deployed_old}`.', f'- It is verified through exact deployed descendant `{deployed_new}`.'),
            (f'- GitHub Pages run `34560369925` completed **success** for exact deployed SHA `{deployed_old}`.', f'- GitHub Pages run `34571331729` completed **success** for exact deployed SHA `{deployed_new}`.'),
            ('- Kinaraidee Live Smoke run `34560396807`, Auth Password Security Live Smoke `34560396831`, and Campaign 3000 Premium Live Smoke `34560396804` completed **success** for the same deployed SHA/trace.', '- Kinaraidee Live Smoke run `34571373301`, Auth Password Security Live Smoke `34571373282`, and Campaign 3000 Premium Live Smoke `34571373303` completed **success** for the same deployed SHA/trace.'),
            ('- The Service Worker cache marker remains `kinaraidee-beta-v16`; Issue #584 does not create a new cache generation.', '- The Service Worker cache marker remains `kinaraidee-beta-v16`; Issue #585 does not create a new cache generation.'),
            ('- Current deployment PASS is scoped to the browser/PWA static deployment trace and live source markers only. It does **not by itself** establish VoiceOver/TalkBack Physical PASS, another-device PASS, full accessibility conformance, Issues #524/#545, Public Beta completion, Production policy/legal approval or Commercial GO.', '- Current deployment PASS is scoped to the browser/PWA static deployment trace and live source markers only. It does **not by itself** establish VoiceOver/TalkBack/keyboard Physical PASS, another-device PASS, full accessibility conformance, Issues #524/#545, Public Beta completion, Production policy/legal approval or Commercial GO.'),
            ('- Historical PR #607 / descendant `f119537219d3eb885e64783a1775486798cd813c` is CI/release-guard wording alignment and does not supersede the current Issue #584 browser runtime candidate, deployed runtime SHA, cache generation, or physical evidence scope.', '- Historical PR #607 / descendant `f119537219d3eb885e64783a1775486798cd813c` is CI/release-guard wording alignment and does not supersede the current Issue #585 browser runtime candidate, deployed runtime SHA, cache generation, or physical evidence scope.'),
          ])

          replace_exact('BETA-CHECKLIST.md', [
            (f'- [x] Current browser/PWA runtime candidate: `{candidate_old}` (Issue #584 SPA focus-management accessibility remediation merged through PR #614); deployment status is **PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE**. Runtime merge/deployed SHA = `{deployed_old}`; GitHub Pages `34560369925`, main Live Smoke `34560396807`, Auth Password Security Live Smoke `34560396831`, and Campaign 3000 Premium Live Smoke `34560396804` completed successfully for the exact deployed SHA. The PWA cache marker remains `kinaraidee-beta-v16`. This deployment PASS is scoped to browser/PWA source/deployment lineage and live markers only; it does not by itself establish VoiceOver/TalkBack/keyboard Physical PASS, another-device PASS, full accessibility conformance, Public Beta completion, conversion improvement, Privacy/Legal approval or Commercial GO.',
             f'- [x] Current browser/PWA runtime candidate: `{candidate_new}` (Issue #585 ordinary-toast live-region accessibility remediation merged through PR #623); deployment status is **PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE**. Runtime merge/deployed SHA = `{deployed_new}`; GitHub Pages `34571331729`, main Live Smoke `34571373301`, Auth Password Security Live Smoke `34571373282`, and Campaign 3000 Premium Live Smoke `34571373303` completed successfully for the exact deployed SHA. The PWA cache marker remains `kinaraidee-beta-v16`. This deployment PASS is scoped to browser/PWA source/deployment lineage and live markers only; it does not by itself establish VoiceOver/TalkBack/keyboard Physical PASS, another-device PASS, full accessibility conformance, Public Beta completion, conversion improvement, Privacy/Legal approval or Commercial GO.'),
            ('this historical deployment does not replace current Issue #584 assistive-technology acceptance.', 'this historical deployment does not replace current Issue #585 assistive-technology acceptance.'),
            ('does not replace current Issue #584.', 'does not replace current Issue #585.'),
            ('does not replace current Issue #584 and does not prove referral conversion', 'does not replace current Issue #585 and does not prove referral conversion'),
            ('## Verified browser/PWA deployment evidence — historical scope before current Issue #584 candidate', '## Verified browser/PWA deployment evidence — historical scope before current Issue #585 candidate'),
            ('does not replace current Issue #584.', 'does not replace current Issue #585.'),
          ])

          replace_exact('BETA-DEVICE-MATRIX.md', [
            (f'- Current browser/PWA runtime candidate: PR #614 / `{candidate_old}` — `kinaraidee-beta-v16`; deployment status is **PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE**; Runtime merge/deployed SHA is `{deployed_old}`.', f'- Current browser/PWA runtime candidate: PR #623 / `{candidate_new}` — `kinaraidee-beta-v16`; deployment status is **PASS FOR CURRENT BROWSER/PWA DEPLOYMENT TRACE**; Runtime merge/deployed SHA is `{deployed_new}`.'),
            (f'- Verified current deployment evidence: **PASS** for exact deployed descendant `{deployed_old}`; Pages `34560369925`, main Live Smoke `34560396807`, Auth Password Security Live Smoke `34560396831`, and Campaign 3000 Premium Live Smoke `34560396804` completed successfully. This is deployment evidence only and does not establish VoiceOver/TalkBack/keyboard Physical PASS for Issue #584.', f'- Verified current deployment evidence: **PASS** for exact deployed descendant `{deployed_new}`; Pages `34571331729`, main Live Smoke `34571373301`, Auth Password Security Live Smoke `34571373282`, and Campaign 3000 Premium Live Smoke `34571373303` completed successfully. This is deployment evidence only and does not establish VoiceOver/TalkBack/keyboard Physical PASS for Issue #585.'),
            ('this historical deployment does not establish Issue #584 assistive-technology acceptance.', 'this historical deployment does not establish Issue #585 assistive-technology acceptance.'),
            ('This trace remains historical and is superseded by the current PR #614 deployment.', 'This trace remains historical and is superseded by the current PR #623 deployment.'),
          ])

          replace_exact('RELEASE-CHECKLIST.md', [
            (f'- Current browser/PWA runtime candidate: `{candidate_old}` (Issue #584 SPA focus-management accessibility remediation merged through PR #614)', f'- Current browser/PWA runtime candidate: `{candidate_new}` (Issue #585 ordinary-toast live-region accessibility remediation merged through PR #623)'),
            (f'- Runtime merge/deployed SHA: `{deployed_old}`.', f'- Runtime merge/deployed SHA: `{deployed_new}`.'),
            (f'- Last verified deployed browser/PWA descendant: `{deployed_old}`.', f'- Last verified deployed browser/PWA descendant: `{deployed_new}`.'),
            (f'- Current browser/PWA deployment evidence is **PASS for the deployment trace only**: Issue #584 runtime candidate `{candidate_old}` is verified through exact deployed descendant `{deployed_old}`; Pages run `34560369925`, Kinaraidee Live Smoke `34560396807`, Auth Password Security Live Smoke `34560396831`, and Campaign 3000 Premium Live Smoke `34560396804` completed successfully for the PR #614 trace.', f'- Current browser/PWA deployment evidence is **PASS for the deployment trace only**: Issue #585 runtime candidate `{candidate_new}` is verified through exact deployed descendant `{deployed_new}`; Pages run `34571331729`, Kinaraidee Live Smoke `34571373301`, Auth Password Security Live Smoke `34571373282`, and Campaign 3000 Premium Live Smoke `34571373303` completed successfully for the PR #623 trace.'),
            ('does not replace current PR #614 runtime.', 'does not replace current PR #623 runtime.'),
            ('does not replace current PR #614 runtime.', 'does not replace current PR #623 runtime.'),
          ])
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reconcile-585-canonical-one-shot.yml
          git add CURRENT-RELEASE.md BETA-CHECKLIST.md BETA-DEVICE-MATRIX.md RELEASE-CHECKLIST.md
          git commit -m 'docs(release): sync Issue 585 canonical companions'
          git push origin HEAD:docs/reconcile-585-deployment-20260911
