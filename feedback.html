<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8a00"><title>ความคิดเห็น | กินอะไรดี</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#fffaf0;color:#2f241c}.app{max-width:560px;margin:auto;min-height:100vh;padding:24px 18px}.top{display:flex;align-items:center;gap:14px}.back{border:0;background:#fff;width:46px;height:46px;border-radius:15px;font-size:25px}.brand{font-size:30px;font-weight:950}.orange{color:#ff7a00}.card{background:#fff;border:1px solid #eee1cf;border-radius:28px;padding:22px;margin-top:22px}.muted{color:#75685d;font-size:14px;line-height:1.55}.stars{display:flex;gap:8px;margin:14px 0 20px}.star{border:0;background:#fff3df;border-radius:14px;font-size:30px;padding:9px 11px;opacity:.45}.star.on{opacity:1;background:#ffe2a8}.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}.type{border:1px solid #e5dac9;background:#fff;border-radius:14px;padding:13px;font-weight:850}.type.on{border:2px solid #ff8a00;background:#fff1dc;color:#a94d00}label{display:block;font-weight:850;margin:18px 0 7px}textarea{width:100%;min-height:150px;resize:vertical;padding:14px;border:1px solid #ddd1c0;border-radius:14px;font:inherit}.primary{width:100%;border:0;border-radius:17px;padding:16px;background:#ff8500;color:#fff;font-size:18px;font-weight:900;margin-top:18px}.secondary{width:100%;border:1px solid #e5dac9;border-radius:17px;padding:14px;background:#fff;font-weight:850;margin-top:10px}.msg{margin-top:16px;padding:13px;border-radius:14px;display:none}.ok{display:block;background:#eaf9f5;color:#087a70}.err{display:block;background:#fff0ed;color:#a72b20}.privacy{margin-top:14px;font-size:13px;color:#75685d;line-height:1.55}.privacy a{color:#9a4b00;font-weight:800}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #0b6bcb;outline-offset:3px}@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()" aria-label="กลับหน้าก่อนหน้า">‹</button><div class="brand">กิน<span class="orange">อะไรดี?</span></div></div><div class="card"><h1>💬 ความคิดเห็น / แจ้งปัญหา</h1><p class="muted">ช่วยบอกเราว่าการใช้งานเป็นอย่างไร เพื่อปรับปรุง “กินอะไรดี?” ให้ดีขึ้น</p><div id="ratingLabel" role="heading" aria-level="2" style="font-weight:850;margin:18px 0 7px">ให้คะแนน</div><div id="stars" class="stars" role="radiogroup" aria-labelledby="ratingLabel"><button class="star" type="button" data-v="1" role="radio" aria-checked="false" aria-label="1 ดาว">★</button><button class="star" type="button" data-v="2" role="radio" aria-checked="false" aria-label="2 ดาว">★</button><button class="star" type="button" data-v="3" role="radio" aria-checked="false" aria-label="3 ดาว">★</button><button class="star" type="button" data-v="4" role="radio" aria-checked="false" aria-label="4 ดาว">★</button><button class="star" type="button" data-v="5" role="radio" aria-checked="false" aria-label="5 ดาว">★</button></div><div id="typeLabel" role="heading" aria-level="2" style="font-weight:850;margin:18px 0 7px">ประเภท</div><div class="types" role="group" aria-labelledby="typeLabel"><button id="feedbackBtn" type="button" class="type on" aria-pressed="true" onclick="setType('feedback')">💡 ความคิดเห็น</button><button id="bugBtn" type="button" class="type" aria-pressed="false" onclick="setType('bug')">🐞 แจ้งปัญหา</button></div><label for="message">รายละเอียด</label><textarea id="message" maxlength="2000" aria-describedby="feedbackPrivacy" placeholder="พิมพ์ความคิดเห็นหรืออธิบายปัญหาที่พบ..."></textarea><button id="sendBtn" type="button" class="primary" onclick="sendFeedback()">ส่งความคิดเห็น</button><button type="button" class="secondary" onclick="location.href='./'">กลับหน้าแรก</button><div id="msg" class="msg" role="status" aria-live="polite"></div><p id="feedbackPrivacy" class="privacy">เมื่อส่งความคิดเห็น ระบบจะเก็บคะแนน ข้อความ หน้าที่ใช้งาน และข้อมูลเบราว์เซอร์เพื่อช่วยวิเคราะห์ปัญหา ดูรายละเอียดได้ใน <a href="privacy.html" target="_blank" rel="noopener">นโยบายความเป็นส่วนตัว</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://cuspfvfzprlgtvtdyilh.supabase.co','sb_publishable_PGmPJ6_8tNIWm7zfF6qEng_0emmWchx');let rating=0,feedbackType='feedback';function renderRating(){document.querySelectorAll('.star').forEach(x=>{const selected=+x.dataset.v===rating;x.classList.toggle('on',+x.dataset.v<=rating);x.setAttribute('aria-checked',String(selected))})}document.querySelectorAll('.star').forEach(b=>b.onclick=()=>{rating=+b.dataset.v;renderRating()});function setType(t){feedbackType=t;const isFeedback=t==='feedback';feedbackBtn.classList.toggle('on',isFeedback);bugBtn.classList.toggle('on',!isFeedback);feedbackBtn.setAttribute('aria-pressed',String(isFeedback));bugBtn.setAttribute('aria-pressed',String(!isFeedback));sendBtn.textContent=isFeedback?'ส่งความคิดเห็น':'ส่งรายงานปัญหา'}function setMsg(t,ok=false){msg.textContent=t;msg.className='msg'+(t?(ok?' ok':' err'):'')}async function sendFeedback(){const text=message.value.trim();if(!rating)return setMsg('กรุณาให้คะแนน 1–5 ดาวก่อนครับ');if(!text)return setMsg('กรุณาเขียนรายละเอียดก่อนครับ');if(sendBtn.disabled)return;sendBtn.disabled=true;sendBtn.setAttribute('aria-busy','true');setMsg('กำลังส่ง...',true);let sent=false;try{const {data}=await sb.auth.getUser();const u=data.user||null;const row={user_id:u?.id||null,rating,feedback_type:feedbackType,message:text,page_url:location.href,user_agent:navigator.userAgent};const {error}=await sb.from('beta_feedback').insert(row);if(error){console.error('Feedback submission failed',error);return setMsg('ส่งความคิดเห็นไม่สำเร็จ กรุณาลองใหม่อีกครั้ง')}message.value='';rating=0;renderRating();sent=true;setMsg('ขอบคุณครับ เราได้รับความคิดเห็นของคุณแล้ว ✅',true)}catch(error){console.error('Feedback submission failed',error);setMsg('ส่งความคิดเห็นไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง')}finally{sendBtn.disabled=false;sendBtn.removeAttribute('aria-busy');if(!sent)sendBtn.textContent=feedbackType==='feedback'?'ส่งความคิดเห็น':'ส่งรายงานปัญหา'}}</script></body></html>
