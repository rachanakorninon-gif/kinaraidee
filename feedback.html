<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8a00"><title>ความคิดเห็น | กินอะไรดี</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#fffaf0;color:#2f241c}.app{max-width:560px;margin:auto;min-height:100vh;padding:24px 18px}.top{display:flex;align-items:center;gap:14px}.back{border:0;background:#fff;width:46px;height:46px;border-radius:15px;font-size:25px}.brand{font-size:30px;font-weight:950}.orange{color:#ff7a00}.card{background:#fff;border:1px solid #eee1cf;border-radius:28px;padding:22px;margin-top:22px}.muted{color:#75685d;font-size:14px;line-height:1.55}.stars{display:flex;gap:8px;margin:14px 0 20px}.star{border:0;background:#fff3df;border-radius:14px;font-size:30px;padding:9px 11px;opacity:.45}.star.on{opacity:1;background:#ffe2a8}.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}.type{border:1px solid #e5dac9;background:#fff;border-radius:14px;padding:13px;font-weight:850}.type.on{border:2px solid #ff8a00;background:#fff1dc;color:#a94d00}label{display:block;font-weight:850;margin:18px 0 7px}textarea{width:100%;min-height:150px;resize:vertical;padding:14px;border:1px solid #ddd1c0;border-radius:14px;font:inherit}.primary{width:100%;border:0;border-radius:17px;padding:16px;background:#ff8500;color:#fff;font-size:18px;font-weight:900;margin-top:18px}.secondary{width:100%;border:1px solid #e5dac9;border-radius:17px;padding:14px;background:#fff;font-weight:850;margin-top:10px}.msg{margin-top:16px;padding:13px;border-radius:14px;display:none}.ok{display:block;background:#eaf9f5;color:#087a70}.err{display:block;background:#fff0ed;color:#a72b20}.privacy{margin-top:14px;font-size:13px;color:#75685d;line-height:1.55}.privacy a{color:#9a4b00;font-weight:800}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">‹</button><div class="brand">กิน<span class="orange">อะไรดี?</span></div></div><div class="card"><h1>💬 ความคิดเห็น / แจ้งปัญหา</h1><p class="muted">ช่วยบอกเราว่าการใช้งานเป็นอย่างไร เพื่อปรับปรุง “กินอะไรดี?” ให้ดีขึ้น</p><label>ให้คะแนน</label><div id="stars" class="stars"><button class="star" data-v="1">★</button><button class="star" data-v="2">★</button><button class="star" data-v="3">★</button><button class="star" data-v="4">★</button><button class="star" data-v="5">★</button></div><label>ประเภท</label><div class="types"><button id="feedbackBtn" class="type on" onclick="setType('feedback')">💡 ความคิดเห็น</button><button id="bugBtn" class="type" onclick="setType('bug')">🐞 แจ้งปัญหา</button></div><label>รายละเอียด</label><textarea id="message" maxlength="2000" placeholder="พิมพ์ความคิดเห็นหรืออธิบายปัญหาที่พบ..."></textarea><button id="sendBtn" class="primary" onclick="sendFeedback()">ส่งความคิดเห็น</button><button class="secondary" onclick="location.href='./'">กลับหน้าแรก</button><div id="msg" class="msg"></div><p class="privacy">เมื่อส่งความคิดเห็น ระบบจะเก็บคะแนน ข้อความ หน้าที่ใช้งาน และข้อมูลเบราว์เซอร์เพื่อช่วยวิเคราะห์ปัญหา ดูรายละเอียดได้ใน <a href="privacy.html" target="_blank" rel="noopener">นโยบายความเป็นส่วนตัว</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://cuspfvfzprlgtvtdyilh.supabase.co','sb_publishable_PGmPJ6_8tNIWm7zfF6qEng_0emmWchx');let rating=0,feedbackType='feedback';document.querySelectorAll('.star').forEach(b=>b.onclick=()=>{rating=+b.dataset.v;document.querySelectorAll('.star').forEach(x=>x.classList.toggle('on',+x.dataset.v<=rating))});function setType(t){feedbackType=t;feedbackBtn.classList.toggle('on',t==='feedback');bugBtn.classList.toggle('on',t==='bug');sendBtn.textContent=t==='bug'?'ส่งรายงานปัญหา':'ส่งความคิดเห็น'}function setMsg(t,ok=false){msg.textContent=t;msg.className='msg'+(t?(ok?' ok':' err'):'')}async function sendFeedback(){const text=message.value.trim();if(!rating)return setMsg('กรุณาให้คะแนน 1–5 ดาวก่อนครับ');if(!text)return setMsg('กรุณาเขียนรายละเอียดก่อนครับ');sendBtn.disabled=true;setMsg('กำลังส่ง...',true);const {data}=await sb.auth.getUser();const u=data.user||null;const row={user_id:u?.id||null,rating,feedback_type:feedbackType,message:text,page_url:location.href,user_agent:navigator.userAgent};const {error}=await sb.from('beta_feedback').insert(row);sendBtn.disabled=false;if(error){console.error('Feedback submission failed',error);return setMsg('ส่งความคิดเห็นไม่สำเร็จ กรุณาลองใหม่อีกครั้ง')}message.value='';rating=0;document.querySelectorAll('.star').forEach(x=>x.classList.remove('on'));setMsg('ขอบคุณครับ เราได้รับความคิดเห็นของคุณแล้ว ✅',true)}</script></body></html>
