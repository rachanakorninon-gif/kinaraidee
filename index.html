<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>กินอะไรดี</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff7ec;color:#28231f}.app{max-width:520px;min-height:100vh;margin:auto;padding:28px 18px}.brand{font-size:34px;font-weight:900;margin:16px 0 6px}.sub{color:#74685d;margin-bottom:24px}.panel{background:#fff;border-radius:28px;padding:24px;box-shadow:0 14px 35px #0000000f}h1{font-size:30px;margin:0 0 18px}.surprise{width:100%;border:0;border-radius:22px;padding:22px;background:#ff7900;color:#fff;font-size:29px;font-weight:900}.hint{font-size:13px;color:#80746a}.food{text-align:center;font-size:92px}.name{text-align:center;font-size:30px;font-weight:900}.badges{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:16px}.badge{background:#fff0dc;border-radius:99px;padding:8px 11px}.actions{display:grid;gap:10px}.btn{border-radius:16px;padding:15px;border:1px solid #eadfce;background:#fff;font-weight:800;font-size:16px}.primary{background:#ff7900;color:#fff;border:0}.hidden{display:none}</style></head><body><main class="app"><div class="brand">🍽️ กินอะไรดี</div><div class="sub">ช่วยตัดสินใจเรื่องกินให้จบในไม่กี่วินาที</div><section id="home"><div class="panel"><h1>มื้อนี้กินอะไรดี?</h1><button class="surprise" onclick="pick()">ไม่รู้เลย</button><p class="hint">กดครั้งเดียว ระบบจะสุ่มเมนูให้ทันที</p></div></section><section id="result" class="hidden"><div class="panel"><div id="emoji" class="food"></div><div class="name">มื้อนี้ลอง<br><span id="foodName"></span> ไหม?</div><div class="badges"><span id="price" class="badge"></span><span id="spicy" class="badge"></span><span id="meal" class="badge"></span></div><div class="actions"><button class="btn primary" onclick="alert('เลือกเมนูนี้แล้ว 🎉')">เอาเมนูนี้</button><button class="btn" onclick="pick()">สุ่มใหม่</button><button class="btn" onclick="nearby()">หาร้านใกล้ฉัน</button><button class="btn" onclick="goHome()">กลับหน้าแรก</button></div></div></section></main><script>const foods=[['กะเพราไก่ไข่ดาว','🍳','💸 ประหยัด','🌶️ เผ็ดกลาง','🕒 ทุกมื้อ'],['ข้าวมันไก่','🍗','💸 ประหยัด','🌶️ ไม่เผ็ด','🕒 กลางวัน'],['ผัดไทย','🍜','💸 กลาง','🌶️ ไม่เผ็ด','🕒 ทุกมื้อ'],['ก๋วยเตี๋ยวเรือ','🍜','💸 ประหยัด','🌶️ เผ็ดน้อย','🕒 ทุกมื้อ'],['ส้มตำไก่ย่าง','🥗','💸 กลาง','🌶️ เผ็ด','🕒 กลางวัน'],['ข้าวผัด','🍚','💸 ประหยัด','🌶️ ไม่เผ็ด','🕒 ทุกมื้อ'],['สุกี้น้ำ','🥘','💸 กลาง','🌶️ ไม่เผ็ด','🕒 เย็น'],['ต้มยำกุ้ง','🍲','💸 พิเศษ','🌶️ เผ็ด','🕒 เย็น'],['หมูกระทะ','🥓','💸 พิเศษ','🌶️ ไม่เผ็ด','🕒 เย็น']];let current=-1;function pick(){let n;do{n=Math.floor(Math.random()*foods.length)}while(n===current);current=n;let f=foods[n];foodName.textContent=f[0];emoji.textContent=f[1];price.textContent=f[2];spicy.textContent=f[3];meal.textContent=f[4];home.classList.add('hidden');result.classList.remove('hidden')}function goHome(){result.classList.add('hidden');home.classList.remove('hidden')}function nearby(){location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(foods[current][0]+' ใกล้ฉัน')}</script></body></html>
