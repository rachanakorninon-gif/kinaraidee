<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff7900"><title>กินอะไรดี</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff7ec;color:#2d261f}.app{max-width:560px;margin:auto;min-height:100vh;padding:20px 16px 140px}.brand{font-size:32px;font-weight:950}.sub,.muted,.small{color:#7d6e62}.card{background:#fff;border:1px solid #f0e3d5;border-radius:22px;padding:18px;margin:12px 0}.hero{background:#fff0dc;border:2px solid #ff8a22}.screen{display:none}.screen.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chip,.primary,.secondary,.danger{border-radius:16px;padding:14px 10px;font-weight:800;font-size:16px}.chip{border:1px solid #eadbc9;background:#fff;min-height:56px}.chip.on{border-color:#ff7900;background:#fff0dc;color:#c65300}.surprise,.primary{width:100%;border:0;background:#ff7900;color:#fff;font-weight:950}.surprise{font-size:28px;padding:20px;border-radius:20px}.primary,.secondary,.danger{width:100%;margin-top:10px}.secondary{background:#fff;border:1px solid #eadbc9}.danger{background:#fff8f6;border:1px solid #f2c9c1;color:#a53f2d}.foodMedia{height:210px;border-radius:18px;background:#ffe7c8;display:flex;align-items:center;justify-content:center;overflow:hidden}.foodMedia img{width:100%;height:100%;object-fit:cover;display:none}.food{font-size:80px}.result{text-align:center}.dish{font-size:30px;font-weight:950}.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px}.badge{background:#fff7ec;border-radius:99px;padding:7px 10px;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #eadfce;z-index:10}.nav button{border:0;background:transparent;padding:12px;font-weight:800}.nav b{display:block;font-size:20px}.history{padding:10px 0;border-bottom:1px solid #eee}.history.latest{margin:4px -8px 12px;padding:14px 12px;border:2px solid #ff7900;border-radius:16px;background:#fff0dc;box-shadow:0 6px 18px #ff790026}.latestTag{display:inline-block;margin-bottom:6px;padding:5px 9px;border-radius:99px;background:#ff7900;color:#fff;font-size:12px;font-weight:900}.history.latest b{font-size:20px;color:#a94300}.thanks{display:none;text-align:center;margin:0 0 14px;padding:14px 12px;border-radius:16px;background:#fff0dc;border:1px solid #ffc37c;color:#8e3d00;font-size:18px;font-weight:900}.thanks.show{display:block}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{text-align:center;background:#fff7ec;padding:14px;border-radius:15px}.stat b{display:block;font-size:24px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:99px;opacity:0}.toast.show{opacity:1}</style></head><body><main class="app"><div class="brand">🍽️ กินอะไรดี</div><p class="sub">ไม่ต้องคิดเยอะ เดี๋ยวเราเลือกให้</p><section id="home" class="screen active"><div class="card hero"><h1>มื้อนี้กินอะไรดี?</h1><button class="surprise" onclick="startFresh()">🤷 ไม่รู้เลย!</button></div><div class="card"><h2>เลือกมื้อก่อน</h2><div class="grid"><button class="chip" onclick="startMeal('เช้า')">🌅 มื้อเช้า</button><button class="chip" onclick="startMeal('กลางวัน')">☀️ กลางวัน</button><button class="chip" onclick="startMeal('เย็น')">🌇 มื้อเย็น</button><button class="chip" onclick="startMeal('ดึก')">🌙 มื้อดึก</button></div></div><div class="card"><h2>สถิติของฉัน</h2><div class="stats"><div class="stat"><b id="pickedCount">0</b>เลือกกิน</div><div class="stat"><b id="likedCount">0</b>ชอบ</div></div></div></section><section id="input" class="screen"><div class="card"><h1>ช่วยบอกนิดเดียว</h1><h2>มื้อ</h2><div id="mealChips" class="grid"><button class="chip" data-v="เช้า">🌅 เช้า</button><button class="chip" data-v="กลางวัน">☀️ กลางวัน</button><button class="chip" data-v="เย็น">🌇 เย็น</button><button class="chip" data-v="ดึก">🌙 ดึก</button></div><h2>จำนวนคน</h2><div id="peopleChips" class="grid"><button class="chip" data-v="1">👤 1 คน</button><button class="chip" data-v="2">👥 2 คน</button><button class="chip" data-v="3">👥 3 คน</button><button class="chip" data-v="4">👥 4 คนขึ้นไป</button></div><h2>งบต่อคน</h2><div id="budgetChips" class="grid"><button class="chip" data-v="50">≤ 50 บาท</button><button class="chip" data-v="100">≤ 100 บาท</button><button class="chip" data-v="150">≤ 150 บาท</button><button class="chip" data-v="999">ไม่จำกัด</button></div><h2>อยากกินแบบไหน</h2><div id="typeChips" class="grid"><button class="chip" data-v="เผ็ด">🌶️ เผ็ด</button><button class="chip" data-v="เส้น">🍜 เส้น</button><button class="chip" data-v="ข้าว">🍚 ข้าว</button><button class="chip" data-v="ของทอด">🍟 ของทอด</button><button class="chip" data-v="ของหวาน">🍰 ของหวาน</button><button class="chip" data-v="หนัก">🥘 มื้อหนัก</button></div><button class="primary" onclick="recommend()">✨ เลือกให้ฉัน</button><button class="secondary" onclick="resetPrefs()">ล้างตัวเลือก</button><button class="secondary" onclick="goHome()">กลับหน้าแรก</button></div></section><section id="result" class="screen"><div class="card result"><div class="foodMedia"><img id="foodPhoto"><div id="emoji" class="food">🍳</div></div><div id="foodName" class="dish"></div><div class="badges"><span id="price" class="badge"></span><span id="people" class="badge"></span><span id="spicy" class="badge"></span><span id="meal" class="badge"></span></div><div id="reason"></div><div id="credit" class="small"></div></div><div class="actions"><button class="secondary" onclick="saveLike()">❤️ ชอบ</button><button class="secondary" onclick="recommend()">🔄 เลือกใหม่</button></div><button class="primary" onclick="acceptFood()">✅ กินอันนี้</button><button class="secondary" onclick="nearby()">📍 ร้านไหนมี?</button><button class="secondary" onclick="shareFood()">📤 แชร์เมนูนี้</button><button class="secondary" onclick="goHome()">กลับหน้าแรก</button></section><section id="history" class="screen"><div class="card"><h1>ประวัติของฉัน</h1><div id="thanks" class="thanks">💛 ขอบคุณที่ให้เราเลือกให้นะคะ ทานให้อร่อยค่ะ!</div><div id="historyList"></div><button class="danger" onclick="clearHistory()">ล้างประวัติทั้งหมด</button></div></section></main><nav class="nav"><button onclick="goHome()"><b>🏠</b>หน้าแรก</button><button onclick="startFresh()"><b>🎯</b>เลือกเมนู</button><button onclick="renderHistory();show('history')"><b>❤️</b>ประวัติ</button></nav><div id="toast" class="toast"></div><script>const photos={'ข้าวมันไก่':'https://commons.wikimedia.org/wiki/Special:FilePath/Khao%20man%20gai.jpg?width=1000','ผัดไทย':'https://commons.wikimedia.org/wiki/Special:FilePath/Pad%20thai.jpg?width=1000','ส้มตำไก่ย่าง':'https://commons.wikimedia.org/wiki/Special:FilePath/Som%20tam.jpg?width=1000','ต้มยำกุ้ง':'https://commons.wikimedia.org/wiki/Special:FilePath/Tom%20yum%20goong-01.jpg?width=1000'};const foods=[['กะเพราไก่ไข่ดาว','🍳',70,'เผ็ดกลาง','กลางวัน,เย็น,ดึก','ข้าว,เผ็ด'],['ข้าวมันไก่','🍗',60,'ไม่เผ็ด','เช้า,กลางวัน,เย็น','ข้าว'],['ผัดไทย','🍜',80,'ไม่เผ็ด','กลางวัน,เย็น','เส้น'],['ก๋วยเตี๋ยวเรือ','🍜',60,'เผ็ดน้อย','กลางวัน,เย็น,ดึก','เส้น,เผ็ด'],['ส้มตำไก่ย่าง','🥗',100,'เผ็ด','กลางวัน,เย็น','เผ็ด'],['ข้าวผัด','🍚',70,'ไม่เผ็ด','เช้า,กลางวัน,เย็น,ดึก','ข้าว'],['สุกี้น้ำ','🥘',90,'ไม่เผ็ด','กลางวัน,เย็น',''],['หมูกระทะ','🥓',199,'ไม่เผ็ด','เย็น,ดึก','หนัก'],['ไก่ทอดข้าวเหนียว','🍗',65,'ไม่เผ็ด','เช้า,กลางวัน,เย็น','ของทอด'],['โจ๊กหมูใส่ไข่','🥣',50,'ไม่เผ็ด','เช้า,ดึก',''],['ไข่กระทะ','🍳',60,'ไม่เผ็ด','เช้า','ของทอด'],['ข้าวหมูแดง','🍛',65,'ไม่เผ็ด','กลางวัน,เย็น','ข้าว'],['ข้าวขาหมู','🍖',70,'ไม่เผ็ด','กลางวัน,เย็น','ข้าว,หนัก'],['ราดหน้าหมู','🍜',65,'ไม่เผ็ด','กลางวัน,เย็น','เส้น'],['ผัดซีอิ๊ว','🍜',65,'ไม่เผ็ด','กลางวัน,เย็น,ดึก','เส้น'],['ข้าวไข่เจียวหมูสับ','🍳',55,'ไม่เผ็ด','เช้า,กลางวัน,เย็น,ดึก','ข้าว,ของทอด'],['ต้มยำกุ้ง','🍲',120,'เผ็ด','กลางวัน,เย็น','เผ็ด'],['ลาบหมู','🥗',80,'เผ็ด','กลางวัน,เย็น','เผ็ด'],['พิซซ่า','🍕',149,'ไม่เผ็ด','กลางวัน,เย็น,ดึก','หนัก'],['เบอร์เกอร์','🍔',129,'ไม่เผ็ด','กลางวัน,เย็น,ดึก','หนัก'],['ปอเปี๊ยะทอด','🥟',60,'ไม่เผ็ด','กลางวัน,เย็น,ดึก','หนัก'],['โรตี','🥞',50,'ไม่เผ็ด','ดึก','ของหวาน'],['บัวลอย','🍡',45,'ไม่เผ็ด','เย็น,ดึก','ของหวาน'],['ไอศกรีม','🍨',60,'ไม่เผ็ด','กลางวัน,เย็น,ดึก','ของหวาน']].map(x=>({n:x[0],e:x[1],p:x[2],s:x[3],m:x[4].split(','),tags:x[5]?x[5].split(','):[]}));let prefs={meal:'',people:1,budget:999,types:[]},current=null,history=JSON.parse(localStorage.getItem('kinaraideeHistory')||'[]'),highlightLatest=false;function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='home')stats();scrollTo(0,0)}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}function clearUI(){document.querySelectorAll('.chip.on').forEach(x=>x.classList.remove('on'))}function resetPrefs(){prefs={meal:'',people:1,budget:999,types:[]};current=null;clearUI()}function goHome(){resetPrefs();show('home')}function startFresh(){resetPrefs();show('input')}function startMeal(v){resetPrefs();prefs.meal=v;let b=[...document.querySelectorAll('#mealChips .chip')].find(x=>x.dataset.v===v);if(b)b.classList.add('on');show('input')}function single(id,key,num=false){document.querySelectorAll('#'+id+' .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');prefs[key]=num?Number(b.dataset.v):b.dataset.v})}single('mealChips','meal');single('peopleChips','people',true);single('budgetChips','budget',true);document.querySelectorAll('#typeChips .chip').forEach(b=>b.onclick=()=>{b.classList.toggle('on');prefs.types=[...document.querySelectorAll('#typeChips .chip.on')].map(x=>x.dataset.v)});function match(f){return !prefs.types.length||prefs.types.some(t=>f.tags.includes(t))}function pool(){let p=foods.filter(f=>(!prefs.meal||f.m.includes(prefs.meal))&&f.p<=prefs.budget&&match(f));if(p.length)return p;if(prefs.types.length){p=foods.filter(f=>match(f));if(p.length)return p}return foods}function media(f){let img=document.getElementById('foodPhoto'),em=document.getElementById('emoji');em.textContent=f.e;if(photos[f.n]){img.onload=()=>{img.style.display='block';em.style.display='none'};img.onerror=()=>{img.style.display='none';em.style.display='block'};img.src=photos[f.n]}else{img.removeAttribute('src');img.style.display='none';em.style.display='block'}}function recommend(){let p=pool();current=p[Math.floor(Math.random()*p.length)];media(current);document.getElementById('foodName').textContent=current.n;document.getElementById('price').textContent='💸 '+current.p+' บาท/คน'+(prefs.people>1?' • รวม ~'+current.p*prefs.people+' บาท':'');document.getElementById('people').textContent='👥 '+prefs.people+(prefs.people>=4?' คนขึ้นไป':' คน');document.getElementById('spicy').textContent='🌶️ '+current.s;document.getElementById('meal').textContent='🕒 '+(prefs.meal||'ทุกมื้อ');document.getElementById('reason').textContent='เลือกตามมื้อ จำนวนคน งบ และประเภทอาหารที่คุณกำหนด';show('result')}function persist(){history=history.slice(0,60);localStorage.setItem('kinaraideeHistory',JSON.stringify(history));stats()}function save(type){if(!current)return;history.unshift({name:current.n,emoji:current.e,type,date:new Date().toLocaleString('th-TH')});persist()}function saveLike(){save('ชอบ');toast('บันทึกแล้ว ❤️')}function sayThanks(){let msg='ขอบคุณที่ให้เราเลือกให้นะคะ ทานให้อร่อยค่ะ';try{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(msg);u.lang='th-TH';u.rate=.95;u.pitch=1.05;speechSynthesis.speak(u)}}catch(e){}}function acceptFood(){save('เลือกกิน');highlightLatest=true;renderHistory();show('history');document.getElementById('thanks').classList.add('show');sayThanks()}function nearby(){if(current)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(current.n+' ใกล้ฉัน'),'_blank')}async function shareFood(){if(!current)return;let t='🍽️ มื้อนี้ฉันเลือกกิน: '+current.n+'\n👥 '+prefs.people+(prefs.people>=4?' คนขึ้นไป':' คน')+'\n💸 '+current.p+' บาท/คน'+(prefs.people>1?' (รวมประมาณ '+current.p*prefs.people+' บาท)':'')+'\n🌶️ '+current.s+'\n\nลองแอป กินอะไรดี\n'+location.href;try{navigator.share?await navigator.share({title:'มื้อนี้กิน '+current.n,text:t}):await navigator.clipboard.writeText(t)}catch(e){}}function renderHistory(){let l=document.getElementById('historyList');l.innerHTML=history.length?history.map((h,i)=>'<div class="history '+(highlightLatest&&i===0&&h.type==='เลือกกิน'?'latest':'')+'">'+(highlightLatest&&i===0&&h.type==='เลือกกิน'?'<span class="latestTag">✨ เมนูที่เลือกล่าสุด</span><br>':'')+'<b>'+h.emoji+' '+h.name+'</b><div class="muted">'+h.type+' • '+h.date+'</div></div>').join(''):'<p class="muted">ยังไม่มีเมนูที่บันทึก</p>';highlightLatest=false}function clearHistory(){if(confirm('ล้างประวัติทั้งหมดหรือไม่?')){history=[];persist();renderHistory()}}function stats(){document.getElementById('pickedCount').textContent=history.filter(x=>x.type==='เลือกกิน').length;document.getElementById('likedCount').textContent=history.filter(x=>x.type==='ชอบ').length}stats();</script></body></html>
