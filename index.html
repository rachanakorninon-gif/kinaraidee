<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>กินอะไรดี</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff7ec;color:#2d261f}.app{max-width:520px;min-height:100vh;margin:auto;padding:20px 16px 90px}.brand{font-size:32px;font-weight:950;margin:8px 0 2px}.sub{color:#76695f;margin:0 0 18px}.card{background:#fff;border:1px solid #f0e3d5;border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 10px 28px #6e4d2b0d}h1{font-size:28px;line-height:1.2;margin:0 0 10px}h2{font-size:20px;margin:0 0 10px}.hero{background:linear-gradient(135deg,#fff4df,#ffe2bd);border:2px solid #ff8a22}.surprise{width:100%;border:0;border-radius:20px;padding:20px;background:#ff7900;color:#fff;font-size:28px;font-weight:950}.screen{display:none}.screen.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chip{border:1px solid #eadbc9;background:#fff;border-radius:16px;padding:14px 10px;font-weight:800}.chip.on{border-color:#ff7900;background:#fff0dc;color:#c65300}.primary,.secondary{width:100%;border-radius:17px;padding:15px;font-size:16px;font-weight:900;margin-top:10px}.primary{border:0;background:#ff7900;color:#fff}.secondary{border:1px solid #eadbc9;background:#fff}.result{text-align:center;background:#fff0dc;border:2px solid #ff7900}.food{font-size:72px}.dish{font-size:29px;font-weight:950}.badges{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:12px}.badge{background:#fff;border-radius:999px;padding:7px 10px;font-size:13px}.reason{background:#fff9f1;border-radius:14px;padding:12px;color:#665b51}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.history{padding:10px 0;border-bottom:1px solid #eee3d8}.muted{color:#85766a;font-size:13px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fffdf9ee;backdrop-filter:blur(10px);border-top:1px solid #eadfce}.nav button{border:0;background:transparent;padding:12px 4px;font-weight:800;color:#62564d}.nav button b{display:block;font-size:20px}.row{display:flex;gap:8px}.row>*{flex:1}</style></head><body><main class="app"><div class="brand">🍽️ กินอะไรดี</div><p class="sub">ไม่ต้องคิดเยอะ เดี๋ยวเราเลือกให้</p><section id="home" class="screen active"><div class="card hero"><h1>มื้อนี้กินอะไรดี?</h1><p>กดปุ่มเดียว แล้วให้แอปช่วยตัดสินใจ</p><button class="surprise" onclick="show('input')">🤷 ไม่รู้เลย!</button></div><div class="card"><h2>เลือกแบบเร็ว</h2><div class="grid"><button class="chip" onclick="quick('เช้า')">🌅 มื้อเช้า</button><button class="chip" onclick="quick('กลางวัน')">☀️ กลางวัน</button><button class="chip" onclick="quick('เย็น')">🌇 มื้อเย็น</button><button class="chip" onclick="quick('ดึก')">🌙 มื้อดึก</button></div></div></section><section id="input" class="screen"><div class="card"><h1>ช่วยบอกนิดเดียว</h1><p class="muted">ข้ามได้ทุกข้อ</p><h2>มื้อ</h2><div id="mealChips" class="grid"><button class="chip" data-v="เช้า">เช้า</button><button class="chip" data-v="กลางวัน">กลางวัน</button><button class="chip" data-v="เย็น">เย็น</button><button class="chip" data-v="ดึก">ดึก</button></div><h2 style="margin-top:18px">งบต่อคน</h2><div id="budgetChips" class="grid"><button class="chip" data-v="50">≤ 50 บาท</button><button class="chip" data-v="100">51–100</button><button class="chip" data-v="150">101–150</button><button class="chip" data-v="999">ไม่จำกัด</button></div><h2 style="margin-top:18px">วันนี้ไม่อยากกิน</h2><div id="avoidChips" class="grid"><button class="chip" data-v="เผ็ด">🌶️ เผ็ด</button><button class="chip" data-v="เส้น">🍜 เส้น</button><button class="chip" data-v="ข้าว">🍚 ข้าว</button><button class="chip" data-v="ของทอด">🍟 ของทอด</button></div><button class="primary" onclick="recommend()">✨ เลือกให้ฉัน</button><button class="secondary" onclick="show('home')">กลับ</button></div></section><section id="result" class="screen"><div class="card result"><div id="emoji" class="food">🍳</div><div class="muted">เราเลือกให้แล้ว</div><div id="foodName" class="dish">กะเพราไก่ไข่ดาว</div><div class="badges"><span id="price" class="badge"></span><span id="spicy" class="badge"></span><span id="meal" class="badge"></span></div><div id="reason" class="reason"></div></div><div class="actions"><button class="secondary" onclick="saveLike()">❤️ ชอบ</button><button class="secondary" onclick="recommend()">🔄 เลือกใหม่</button></div><button class="primary" onclick="acceptFood()">✅ กินอันนี้</button><button class="secondary" onclick="nearby()">📍 ร้านไหนมี?</button><button class="secondary" onclick="show('home')">กลับหน้าแรก</button></section><section id="history" class="screen"><div class="card"><h1>ประวัติของฉัน</h1><div id="historyList"><p class="muted">ยังไม่มีเมนูที่บันทึก</p></div></div></section></main><nav class="nav"><button onclick="show('home')"><b>🏠</b>หน้าแรก</button><button onclick="show('input')"><b>🎯</b>เลือกเมนู</button><button onclick="renderHistory();show('history')"><b>❤️</b>ประวัติ</button></nav><script>const foods=[{n:'กะเพราไก่ไข่ดาว',e:'🍳',p:70,s:'เผ็ดกลาง',m:['กลางวัน','เย็น','ดึก'],tags:['ข้าว','เผ็ด']},{n:'ข้าวมันไก่',e:'🍗',p:60,s:'ไม่เผ็ด',m:['เช้า','กลางวัน','เย็น'],tags:['ข้าว']},{n:'ผัดไทย',e:'🍜',p:80,s:'ไม่เผ็ด',m:['กลางวัน','เย็น'],tags:['เส้น']},{n:'ก๋วยเตี๋ยวเรือ',e:'🍜',p:60,s:'เผ็ดน้อย',m:['กลางวัน','เย็น','ดึก'],tags:['เส้น','เผ็ด']},{n:'ส้มตำไก่ย่าง',e:'🥗',p:100,s:'เผ็ด',m:['กลางวัน','เย็น'],tags:['เผ็ด']},{n:'ข้าวผัด',e:'🍚',p:70,s:'ไม่เผ็ด',m:['เช้า','กลางวัน','เย็น','ดึก'],tags:['ข้าว']},{n:'สุกี้น้ำ',e:'🥘',p:90,s:'ไม่เผ็ด',m:['กลางวัน','เย็น'],tags:[]},{n:'หมูกระทะ',e:'🥓',p:199,s:'ไม่เผ็ด',m:['เย็น','ดึก'],tags:[]},{n:'ไก่ทอดข้าวเหนียว',e:'🍗',p:65,s:'ไม่เผ็ด',m:['เช้า','กลางวัน','เย็น'],tags:['ของทอด']}];let prefs={meal:'',budget:999,avoid:[]},current=null,history=JSON.parse(localStorage.getItem('kinaraideeHistory')||'[]');function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}document.querySelectorAll('#mealChips .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#mealChips .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');prefs.meal=b.dataset.v});document.querySelectorAll('#budgetChips .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#budgetChips .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');prefs.budget=Number(b.dataset.v)});document.querySelectorAll('#avoidChips .chip').forEach(b=>b.onclick=()=>{b.classList.toggle('on');prefs.avoid=[...document.querySelectorAll('#avoidChips .chip.on')].map(x=>x.dataset.v)});function quick(meal){prefs.meal=meal;prefs.budget=999;prefs.avoid=[];recommend()}function recommend(){let pool=foods.filter(f=>(!prefs.meal||f.m.includes(prefs.meal))&&f.p<=prefs.budget&&!prefs.avoid.some(a=>f.tags.includes(a)));if(!pool.length)pool=foods.filter(f=>f.p<=prefs.budget);if(!pool.length)pool=foods;let next=pool[Math.floor(Math.random()*pool.length)];if(pool.length>1&&current&&next.n===current.n)next=pool[(pool.indexOf(next)+1)%pool.length];current=next;emoji.textContent=next.e;foodName.textContent=next.n;price.textContent='💸 ประมาณ '+next.p+' บาท';spicy.textContent='🌶️ '+next.s;meal.textContent='🕒 '+(prefs.meal||'ทุกมื้อ');reason.textContent='เหมาะเพราะอยู่ในงบ'+(prefs.meal?' และเข้ากับมื้อ'+prefs.meal:'')+(prefs.avoid.length?' พร้อมหลีกเลี่ยงสิ่งที่คุณไม่อยากกิน':'')+' • หาซื้อง่ายและตัดสินใจได้เร็ว';show('result')}function saveEntry(type){if(!current)return;history.unshift({name:current.n,emoji:current.e,type,date:new Date().toLocaleString('th-TH')});history=history.slice(0,30);localStorage.setItem('kinaraideeHistory',JSON.stringify(history))}function saveLike(){saveEntry('ชอบ');alert('จำเมนูนี้ไว้แล้ว ❤️')}function acceptFood(){saveEntry('เลือกกิน');alert('บันทึกแล้ว 🎉')}function nearby(){if(!current)return;location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(current.n+' ใกล้ฉัน')}function renderHistory(){historyList.innerHTML=history.length?history.map(h=>'<div class="history"><b>'+h.emoji+' '+h.name+'</b><div class="muted">'+h.type+' • '+h.date+'</div></div>').join(''):'<p class="muted">ยังไม่มีเมนูที่บันทึก</p>'}</script></body></html>
