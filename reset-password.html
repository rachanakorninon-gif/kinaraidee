<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8a00"><title>ตั้งรหัสผ่านใหม่ | กินอะไรดี</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#fffaf0;color:#2f241c}.app{max-width:520px;margin:auto;min-height:100vh;padding:28px 18px}.brand{font-size:30px;font-weight:950}.orange{color:#ff7a00}.card{background:#fff;border:1px solid #eee1cf;border-radius:28px;padding:22px;margin-top:24px}label{display:block;font-weight:800;margin:14px 0 6px}input{width:100%;padding:15px;border:1px solid #ddd1c0;border-radius:14px;font-size:16px}.primary,.secondary{width:100%;border-radius:17px;padding:15px;font-size:17px;font-weight:900;margin-top:12px}.primary{border:0;background:#ff8500;color:#fff}.secondary{border:1px solid #e5dac9;background:#fff;color:#4d4036}.msg{margin-top:16px;padding:13px;border-radius:14px;display:none;line-height:1.5}.ok{display:block;background:#eaf9f5;color:#087a70}.err{display:block;background:#fff0ed;color:#a72b20}.muted{color:#75685d;line-height:1.55}</style></head><body><main class="app"><div class="brand">กิน<span class="orange">อะไรดี?</span></div><div class="card"><h1>🔐 ตั้งรหัสผ่านใหม่</h1><p class="muted">เปิดหน้านี้จากลิงก์ Reset Password ในอีเมล แล้วตั้งรหัสผ่านใหม่ของคุณ</p><label>รหัสผ่านใหม่</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="อย่างน้อย 8 ตัวอักษร"><label>ยืนยันรหัสผ่านใหม่</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="พิมพ์รหัสผ่านอีกครั้ง"><button id="saveBtn" class="primary">บันทึกรหัสผ่านใหม่</button><button class="secondary" onclick="location.href='admin.html'">กลับหน้า Owner Login</button><div id="msg" class="msg"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://cuspfvfzprlgtvtdyilh.supabase.co','sb_publishable_PGmPJ6_8tNIWm7zfF6qEng_0emmWchx');const $=id=>document.getElementById(id);function showMsg(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}async function recoverFromUrl(){const u=new URL(location.href),code=u.searchParams.get('code');if(code){const {error}=await sb.auth.exchangeCodeForSession(code);if(error)showMsg('ลิงก์กู้รหัสผ่านไม่ถูกต้องหรือหมดอายุ กรุณาขอลิงก์ใหม่');return}if(location.hash){const p=new URLSearchParams(location.hash.slice(1)),access_token=p.get('access_token'),refresh_token=p.get('refresh_token');if(access_token&&refresh_token){const {error}=await sb.auth.setSession({access_token,refresh_token});if(error)showMsg('เปิดเซสชันกู้รหัสผ่านไม่สำเร็จ กรุณาขอลิงก์ใหม่')}}}async function save(){const p=$('password').value,c=$('confirmPassword').value;if(p.length<8)return showMsg('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');if(p!==c)return showMsg('รหัสผ่านทั้งสองช่องไม่ตรงกัน');$('saveBtn').disabled=true;const {data:{session}}=await sb.auth.getSession();if(!session){$('saveBtn').disabled=false;return showMsg('ไม่พบสิทธิ์กู้รหัสผ่าน กรุณาเปิดลิงก์ Reset Password จากอีเมลอีกครั้ง')}const {error}=await sb.auth.updateUser({password:p});$('saveBtn').disabled=false;if(error)return showMsg('ตั้งรหัสผ่านไม่สำเร็จ กรุณาตรวจรูปแบบรหัสผ่านแล้วลองอีกครั้ง');showMsg('ตั้งรหัสผ่านใหม่สำเร็จแล้ว กำลังไปหน้า Owner Login…',true);setTimeout(()=>location.href='admin.html',1400)}$('saveBtn').onclick=save;$('confirmPassword').addEventListener('keydown',e=>{if(e.key==='Enter')save()});recoverFromUrl();</script></body></html>
